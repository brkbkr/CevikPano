name: test
on:
  push:
    branches-ignore: [production]
  pull_request:

jobs:
  api:
    name: API testleri
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pano_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pano_test

  e2e:
    name: Tarayıcı testleri
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pano_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pano_e2e
      ADMIN_PASSWORD: admin12345
      DEFAULT_USER_PASSWORD: Baslangic123
      PORT: "3100"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Playwright
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Sunucuyu başlat ve demo veriyi yükle
        run: |
          nohup node server/index.js > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:3100/healthz && break; sleep 1; done
          node scripts/seed-demo.mjs http://localhost:3100 test/fixtures/demo.json
          # Demo verisi eski biçimde (Müşteri özel alanı): 005 dönüşümünü yeniden uygula (canlıdaki geçişle aynı hâl).
          node scripts/apply-sql.mjs server/migrations/005_musteri_cari.sql
      - name: Regresyon testi
        run: node test/e2e/regresyon.cjs
      - name: Kullanıcı yönetimi testi
        run: node test/e2e/kullanicilar.cjs
      - name: Pano kartı ve öncelik testi
        run: node test/e2e/kart.cjs
      - name: Benim işlerim testi
        run: node test/e2e/benim-islerim.cjs
      - name: Çalışma alanları testi
        run: node test/e2e/calisma-alanlari.cjs
      - name: Cariler testi
        run: node test/e2e/cariler.cjs
      - name: Proje türü ve kolonlar testi
        run: node test/e2e/proje-turu.cjs
      - name: Gezinme testi (proje sekmeleri, hesap menüsü)
        run: node test/e2e/gezinme.cjs
      - name: İş detayı, yeni iş ve alt pencereler testi
        run: node test/e2e/kart-detay.cjs
      - name: İş geçmişi testi (tam geçmiş)
        run: node test/e2e/gecmis.cjs
      - name: Şablon galerisiyle yeni proje testi
        run: node test/e2e/proje-sablonu.cjs
      - name: Genel raporlar testi (pivot, faturalanabilir saat, Excel, performans)
        run: node test/e2e/genel-raporlar.cjs
      - name: Talep eden ve talep havuzu testi
        run: node test/e2e/talep.cjs
      - name: Müşteri atamaları cariden testi (iş carisi, birleştirme, raporlar)
        run: node test/e2e/musteri-cari.cjs
      - name: Posta kutuları testi (yapılandırılmamış ve bağlı kutu listesi, kart içinden e-postayla yanıt)
        run: node test/e2e/posta.cjs
      - name: Pano iyileştirmeleri testi (hızlı kart ekleme, alt işler panoda, sprint yetkisi ve süresi)
        run: node test/e2e/pano-iyilestirme.cjs
      - name: Alan yöneticileri ve proje rolleri testi (alan penceresi ve sayfası, kullanıcı penceresinden proje rolü, canlı yenileme)
        run: node test/e2e/alan-rolleri.cjs
      - name: Okuma süzmesi testi (erişimi olmayan alanın verisi gelmez, üyelikte canlı yenileme)
        run: node test/e2e/okuma-suzme.cjs
      - name: Küçük düzeltmeler testi (sunucu meşgulde yeniden gönderim, komut paleti, cari e-postası ve mailto kodlama, cari özeti)
        run: node test/e2e/kucuk-duzeltmeler.cjs
      - name: Genel tur düzeltmeleri testi (alan üyelerine atama, üye çipleri, alandan çıkarılınca açık pencere, taşıma menüsü)
        run: node test/e2e/genel-tur.cjs
      - name: Sprint performansı ve komut paleti testi (plan anlık görüntüsü, planlanan / gerçekleşen, palet girişleri)
        run: node test/e2e/sprint-performans.cjs
      - name: Cariler CSV testi (içe aktarma önizlemesi, ; , sekme, BOM / ANSI, tekillik, güncelle / atla, dışa aktarma formül kaçışı)
        run: node test/e2e/cari-csv.cjs
      - name: Varsayılan menü testi (yönetici herkes için kenar çubuğu, kişisel düzen, yetkiye bağlı öğeler, yoklama)
        run: node test/e2e/varsayilan-menu.cjs
      - name: Parametrik proje alanları testi (Alanlar sekmesi ve yetki, hazır alan aç/kapat, kartta değer ve rozet, raporda alan boyutu ve hazır şablonlar, XSS)
        run: node test/e2e/parametrik-alanlar.cjs
      - name: Proje yetkileri testi (Yetkiler sekmesi, kişi ve rol, yetki tablosu, yeni proje kişileri, varsayılan yetkiler, kullanıcı penceresi, mobil, XSS)
        run: node test/e2e/yetkiler.cjs
      - name: Kayıtlı raporlar testi (kapsam seçici, ölçü ve grafik, kaydet / aç / düzenle / kopyala / sil, paylaşım görünürlüğü, hazır rapordan kopya, proje sekmesinde kilitli kapsam, XSS)
        run: node test/e2e/kayitli-raporlar.cjs
      - name: Cariler modülü testi (Sistem → Modüller aç/kapat, kapalıyken menü/seçici/rapor/hazır alan/talep eden yok ve sunucu reddi, cari alanları form/liste/kart/CSV, VKN)
        run: node test/e2e/cariler-modul.cjs
      - name: Sürümler testi (sekme, oluştur / düzenle / yayınla / arşivle / sil, işte birden çok sürüm, yeni iş ve toplu düzenleme, sorgu ve rapor boyutu, ilerleme ve gecikme, yetki, XSS, dar ekran)
        run: node test/e2e/surumler.cjs
      - name: Sunucu günlüğü
        if: failure()
        run: cat server.log
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ekran-goruntuleri
          path: /tmp/pano_*.png
          if-no-files-found: ignore
