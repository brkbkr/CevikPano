<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pano — Çevik Proje Yönetimi</title>
<style>
:root{
  --ink:#14161A; --ink2:#4A4F58; --ink3:#858B95;
  --paper:#F5F5F1; --surface:#FFFFFF; --surface2:#FAFAF7;
  --line:#E3E3DC; --line2:#D2D2C9;
  --accent:#1F6F5C; --accent-d:#14503F; --accent-soft:#E4F0EC;
  --todo:#767E8B; --prog:#B45309; --done:#15803D; --risk:#B4291F;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r:6px; --shadow:0 1px 2px rgba(20,22,26,.06),0 4px 12px rgba(20,22,26,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- signature: keys, numbers, durations are data → mono ---------- */
.k{font-family:var(--mono);font-size:11.5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:212px 1fr;height:100vh;overflow:hidden}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{padding:16px 16px 12px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.brand b{font-size:16px;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.projsel{padding:12px 12px 8px}
.projsel select{width:100%;padding:7px 8px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface2)}
.navgroup{padding:8px 8px 4px;font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink3);margin-top:6px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 12px;margin:1px 8px;border-radius:var(--r);
  color:var(--ink2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-d);font-weight:600}
.nav a .g{width:16px;text-align:center;font-size:13px;opacity:.85}
.filebar{margin-top:auto;padding:10px 10px 6px;border-top:1px solid var(--line);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filebar .btn{display:flex;align-items:center;gap:6px;justify-content:center}
.fstate{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:#8FBFAE}
.fstate.dirty{background:#F0B429;box-shadow:0 0 0 3px rgba(240,180,41,.25)}
.fnote{width:100%;font-size:10.5px;color:var(--ink3);line-height:1.3}
.rail-foot{margin-top:0;padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.rail-foot button{font-size:11px;color:var(--ink3);padding:4px 6px;border-radius:4px}
.rail-foot button:hover{background:var(--surface2);color:var(--ink)}

.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px 0;flex-shrink:0}
.topbar h1{margin:0;font-size:19px;letter-spacing:-.025em;font-weight:650}
.crumb{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.toolrow{display:flex;align-items:center;gap:10px;padding:11px 0 10px;flex-wrap:wrap}
.vtabs{display:none;gap:2px;margin:10px -20px 0;padding:0 20px;overflow-x:auto;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtabs button{white-space:nowrap;padding:8px 12px;font-size:12.5px;color:var(--ink3);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.vtabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.content{flex:1;overflow:auto;padding:16px 20px 40px}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line2);background:var(--surface);padding:6px 11px;border-radius:var(--r);font-weight:500}
.btn:hover{background:var(--surface2);border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--risk);border-color:#E8C9C6}
.btn.danger:hover{background:#FDF2F1}
.inp{border:1px solid var(--line2);background:var(--surface);padding:6px 9px;border-radius:var(--r);width:100%}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{padding:6px 6px}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search .inp{padding-left:26px}
.search::before{content:"⌕";position:absolute;left:8px;top:5px;color:var(--ink3);font-size:14px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.spacer{flex:1}
label.field{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink3);margin:0 0 4px}

/* ---------- avatars & chips ---------- */
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;
  font-weight:700;color:#fff;flex-shrink:0;font-family:var(--mono);letter-spacing:-.03em}
.av.lg{width:30px;height:30px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:3px;
  font-size:10.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.cat-todo{background:#EEF0F2;color:var(--todo);border-color:#DFE3E7}
.cat-inprogress{background:#FDF3E3;color:var(--prog);border-color:#F2E0C0}
.cat-done{background:#E7F5EC;color:var(--done);border-color:#C9E7D4}
.lbl{background:var(--surface2);border-color:var(--line);color:var(--ink2);font-weight:500}
.pt{background:#EEF0F2;color:var(--ink2);border-color:#DFE3E7;font-family:var(--mono);font-size:10.5px}

/* type & priority glyphs */
.ti{width:15px;height:15px;border-radius:3px;display:inline-grid;place-items:center;font-size:9.5px;
  color:#fff;font-weight:800;flex-shrink:0}
.ti.epic{background:#6B4FBB} .ti.story{background:#3B8A5A} .ti.task{background:#3E7BC4}
.ti.bug{background:#C0392B} .ti.sub{background:#7B8794}
.pr{font-weight:800;font-size:11px;flex-shrink:0}
.pr.p1{color:#B4291F} .pr.p2{color:#D06B14} .pr.p3{color:#8A8F98} .pr.p4{color:#5C8AC4} .pr.p5{color:#8FA3B8}

/* ---------- board ---------- */
.board{display:flex;gap:10px;align-items:flex-start;min-height:100%}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:8px;width:284px;flex-shrink:0;
  display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col.wip-over{border-color:var(--risk)}
.col-h{padding:9px 11px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.col-h .nm{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink2);font-weight:600}
.col-h .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.col-h .ct.bad{color:var(--risk);font-weight:700}
.col-b{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:70px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;
  cursor:grab;box-shadow:0 1px 1px rgba(20,22,26,.04)}
.card:hover{border-color:var(--ink3)}
.card.drag{opacity:.35}
.card .sum{margin:0 0 8px;font-size:13px;line-height:1.35}
.card .meta{display:flex;align-items:center;gap:7px}
.card .meta .k{color:var(--ink3)}
.card .c-plan{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-family:var(--mono);font-size:10.5px;
  color:var(--ink2);padding:3px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.card .c-plan.late{background:#FDF2F1;border-color:#E8C9C6;color:var(--risk)}
.card .c-plan.done{background:#E7F5EC;border-color:#C9E7D4;color:var(--done)}
.card .c-plan.future{color:var(--ink3)}
.card .c-dates{flex:1}
.card .c-days{color:var(--ink3);font-weight:600}
.card .c-plan.late .c-days{color:var(--risk)}
.card .c-late{font-weight:700}
.card .c-soon{color:var(--prog);font-weight:700}
.card .c-est{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10.5px;color:var(--ink3);margin-bottom:3px}
.card .c-est-l b{color:var(--ink2);font-size:11px}
.card .c-est-r.bad{color:var(--risk);font-weight:600}
.card .bar{height:3px;background:#EDEDE7;border-radius:2px;margin:0;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
.epic-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600;
  color:#fff;background:#6B4FBB;margin-bottom:6px}
.qa-btn{width:20px;height:20px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2);
  font-size:14px;line-height:1;display:grid;place-items:center;background:var(--surface)}
.qa-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.qadd{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:8px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.qadd .inp{padding:5px 7px;font-size:12px}
.qa-row{display:flex;gap:5px;align-items:center}
.qa-row .inp{flex:1;min-width:0}
.qa-hint{flex:1;font-size:10px;color:var(--ink3);line-height:1.2}
.cbox{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;flex-shrink:0;
  display:grid;place-items:center;font-size:10px;color:#fff;background:var(--surface)}
.cbox:hover{border-color:var(--done);background:#E7F5EC}
.cbox.on{background:var(--done);border-color:var(--done)}
.card.is-done .sum{text-decoration:line-through;color:var(--ink3)}
.card.is-done{opacity:.75}
.donehead{width:100%;text-align:left;padding:6px 8px;margin-top:4px;border-radius:var(--r);
  background:var(--surface);border:1px dashed var(--line2);color:var(--ink2);font-size:11.5px;
  display:flex;align-items:center;gap:6px}
.donehead:hover{border-color:var(--ink3)}
.donehead b{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.c-subs{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink3);margin-bottom:5px;cursor:pointer}
.c-subbar{flex:1;height:4px;background:#EDEDE7;border-radius:2px;overflow:hidden}
.c-subbar i{display:block;height:100%;background:var(--done)}
.subsum{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:6px 0}
.subsum b{color:var(--ink2);font-size:12px}
.sublist{max-height:260px;overflow:auto}
.bladd{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--accent-soft);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.bladd .inp{flex:1;min-width:150px;padding:5px 8px}
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.untimed{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;margin-bottom:8px;
  background:var(--surface2);border:1px solid var(--line);border-radius:6px}
.untimed .chip{cursor:pointer}
.daygrid{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dg-corner{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:38px}
.dg-head{display:flex;align-items:center;gap:5px;padding:0 8px;height:38px;font-size:12px;
  border-bottom:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden}
.dg-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dg-head em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.dg-head b{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.dg-head.dim,.dg-col.dim{background:var(--surface2)}
.dg-col.dim .dg-slot{border-color:var(--line)}
.dg-hours{border-right:1px solid var(--line)}
.dg-h{height:34px;font-family:var(--mono);font-size:10px;color:var(--ink3);
  text-align:right;padding-right:6px;border-bottom:1px solid var(--line)}
.dg-col{position:relative;border-right:1px solid var(--line)}
.dg-slot{height:34px;border-bottom:1px solid var(--line)}
.hblk{position:absolute;left:3px;right:3px;border-radius:4px;color:#fff;font-size:10px;
  padding:2px 5px;overflow:hidden;cursor:pointer;line-height:1.25}
.hblk b{font-family:var(--mono)}
.hblk span{opacity:.85;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts.rp td[contenteditable]{padding:5px 7px;font-size:12px;border-right:1px solid var(--line);
  outline:none;vertical-align:top;text-align:left}
.ts.rp td[contenteditable]:focus{background:var(--accent-soft)}
.ts.rp th{text-align:left;padding-left:7px}
.ts.sm th{text-align:left;padding:6px}
.ts.sm td{padding:5px 6px;font-size:12px;text-align:right}
.ts.sm td.who{text-align:left}
.swim{margin-bottom:14px}
.swim-h{display:flex;align-items:center;gap:8px;padding:6px 2px;margin-bottom:6px;border-bottom:1px solid var(--line2)}
.swim-h b{font-size:12.5px}
.swim-h .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

/* ---------- backlog ---------- */
.sprintbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.sprintbox.over{border-color:var(--accent)}
.sprintbox.active{border-color:var(--accent);border-left:3px solid var(--accent)}
.sb-h{padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sb-h b{font-size:13.5px}
.sb-h .goal{color:var(--ink3);font-size:12px;font-style:italic}
.sb-h .dates{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.pill{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:10px;background:#EEF0F2;color:var(--ink2)}
.pill.todo{background:#EEF0F2;color:var(--todo)} .pill.prog{background:#FDF3E3;color:var(--prog)}
.pill.done{background:#E7F5EC;color:var(--done)}
.row{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:grab}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface2)}
.row .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.drag{opacity:.35}
.empty{padding:16px 12px;color:var(--ink3);font-size:12px;text-align:center}

/* ---------- roadmap ---------- */
.rmwrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto}
.rm{border-collapse:collapse;width:100%;min-width:760px}
.rm th{position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line2);
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.06em;padding:8px 6px;text-align:center}
.rm th.lead{text-align:left;padding-left:12px;min-width:230px;border-right:1px solid var(--line)}
.rm td{border-bottom:1px solid var(--line);height:38px;padding:0}
.rm td.lead{padding:0 12px;border-right:1px solid var(--line)}
.rm.pl td{height:34px}
.rm.pl th.lead:nth-child(2),.rm.pl td.pl-dates{min-width:112px;text-align:center;color:var(--ink3);
  border-right:1px solid var(--line);font-size:11px}
.pl-track{position:relative;height:34px}
.pl-bar{position:absolute;top:8px;height:18px;border-radius:4px;color:#fff;font-size:10.5px;
  display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;min-width:6px}
.pl-bar i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.3)}
.pl-bar span{position:relative;overflow:hidden;text-overflow:ellipsis}
.pl-dim{position:absolute;top:0;bottom:0;background:var(--surface2);z-index:0}
.pl-none{position:absolute;left:6px;top:10px;font-size:10.5px;color:var(--ink3);font-style:italic}
.pl-group td{background:var(--surface2);height:30px!important}
.rm .track{position:relative;height:38px}
.gantt{position:absolute;top:9px;height:20px;border-radius:4px;background:#6B4FBB;color:#fff;
  font-size:10.5px;display:flex;align-items:center;padding:0 7px;overflow:hidden;white-space:nowrap}
.gantt i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28)}
.today{position:absolute;top:0;bottom:0;width:1px;background:var(--risk);z-index:1}

/* ---------- timesheet ---------- */
.tswrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto}
.ts{border-collapse:collapse;width:100%;min-width:820px}
.ts th{background:var(--surface);border-bottom:1px solid var(--line2);padding:8px 6px;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.06em}
.ts th.who{text-align:left;padding-left:12px;min-width:170px;border-right:1px solid var(--line)}
.ts th.wknd{background:var(--surface2)}
.ts td{border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.ts td.who{text-align:left;padding:8px 12px;border-right:1px solid var(--line)}
.ts td.wknd{background:var(--surface2)}
.cell{width:100%;height:46px;display:grid;place-items:center;font-family:var(--mono);
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2);border-radius:3px}
.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.cell.z{color:#C9C9C2}
.ts tfoot td{background:var(--surface2);font-family:var(--mono);font-size:12px;font-weight:700;
  padding:8px 4px;border-top:1px solid var(--line2)}
.ts .tot{background:var(--surface2);font-weight:700}
.wl-list{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.wl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:none}

/* ---------- reports ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h3{margin:0 0 2px;font-size:13.5px}
.panel .sub{color:var(--ink3);font-size:11.5px;margin-bottom:12px}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.stat div b{display:block;font-family:var(--mono);font-size:21px;letter-spacing:-.03em;line-height:1.1}
.stat div span{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,22,26,.42);display:none;z-index:50;
  padding:28px 20px;overflow:auto}
.scrim.on{display:block}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);max-width:960px;margin:0 auto;
  border:1px solid var(--line2);overflow:hidden}
.modal.narrow{max-width:520px}
.m-h{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
.m-h .x{margin-left:auto;font-size:20px;color:var(--ink3);line-height:1;padding:0 4px}
.m-h .x:hover{color:var(--ink)}
.m-b{display:grid;grid-template-columns:1fr 268px;gap:0}
.m-l{padding:16px 18px;min-width:0}
.m-r{padding:16px;background:var(--surface2);border-left:1px solid var(--line)}

<script>
/* ============================================================
   Bölüm 15: DOSYAYA KAYDETME
   Veri, HTML'in içindeki <script id="pano-data"> bloğuna gömülür.
   Tarayıcı bir sayfanın kendi dosyasına sessizce yazmasına izin
   vermez; bu yüzden kaydetme her zaman kullanıcının bir eylemiyle
   olur. Destekleyen tarayıcılarda (Chrome/Edge, http(s) üzerinden)
   dosya tutamacı alınıp aynı dosyanın üzerine yazılır; aksi halde
   yeni bir kopya indirilir ve eskisiyle değiştirilir.
   ============================================================ */

let FILE_HANDLE = null;   // File System Access API tutamacı
let FS_STATE = 'none';    // none | ready | prompt | blocked
let DIRTY = false;        // dosyaya yazılmamış değişiklik var mı
let AUTOSAVE = true;
let autoT = null;

/* Sayfa açıldığında, hiçbir şey çizilmeden önce alınan temiz şablon. */
const TEMPLATE = document.documentElement.outerHTML;

/* ---- tutamağı IndexedDB'de sakla: sayfayı yenileyince dosya bağlı kalsın ---- */
const idbOpen = () => new Promise((res, rej) => {
  const r = indexedDB.open('pano-fs', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('h');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function idbGet(k) {
  try { const db = await idbOpen(); return await new Promise(r => {
    const q = db.transaction('h').objectStore('h').get(k);
    q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); }
  catch (e) { return null; }
}
async function idbSet(k, v) {
  try { const db = await idbOpen(); await new Promise(r => {
    const q = db.transaction('h', 'readwrite').objectStore('h').put(v, k);
    q.onsuccess = () => r(1); q.onerror = () => r(0); }); } catch (e) { }
}

function embeddedData() {
  const el = document.getElementById('pano-data');
  if (!el) return null;
  const t = el.textContent.trim();
  if (!t || t === 'null') return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}

function buildHtml() {
  DB.savedAt = Date.now();
  DB.savedBy = CU()?.name || '';
  const json = JSON.stringify(DB).replace(/</g, '\\u003c');
  const body = TEMPLATE.replace(
    /(<script id="pano-data"[^>]*>)[\s\S]*?(<\/script>)/,
    (_, a, b) => a + json + b);
  return '<!DOCTYPE html>\n' + body;
}

/* Açılışta önceki tutamağı geri yükle. */
async function initFileHandle() {
  if (!window.showSaveFilePicker) { FS_STATE = 'blocked'; return renderFileBar(); }
  const h = await idbGet('handle');
  if (!h) { FS_STATE = 'none'; return renderFileBar(); }
  FILE_HANDLE = h;
  try {
    const p = await h.queryPermission({ mode: 'readwrite' });
    FS_STATE = p === 'granted' ? 'ready' : 'prompt';
  } catch (e) { FS_STATE = 'prompt'; }
  renderFileBar();
}

async function ensurePermission() {
  if (!FILE_HANDLE) return false;
  try {
    if (await FILE_HANDLE.queryPermission({ mode: 'readwrite' }) === 'granted') { FS_STATE = 'ready'; return true; }
    if (await FILE_HANDLE.requestPermission({ mode: 'readwrite' }) === 'granted') { FS_STATE = 'ready'; return true; }
  } catch (e) { }
  FS_STATE = 'prompt'; return false;
}

async function writeHandle() {
  const wr = await FILE_HANDLE.createWritable();
  await wr.write(buildHtml());
  await wr.close();
  markClean();
}

async function pickFile() {
  try {
    FILE_HANDLE = await window.showSaveFilePicker({
      suggestedName: 'Kanbanpano.html',
      types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }],
    });
    await idbSet('handle', FILE_HANDLE);
    FS_STATE = 'ready';
    await writeHandle();
    toast('Dosya bağlandı — değişiklikler artık buraya kaydedilir');
    return true;
  } catch (e) {
    if (e && e.name === 'AbortError') return false;   // kullanıcı vazgeçti
    FILE_HANDLE = null; FS_STATE = 'blocked';
    renderFileBar();
    return false;
  }
}

/* Yazılamadığında ne olduğunu açıkla; indirme ancak kullanıcı isterse. */
function cannotWriteDialog() {
  const isFile = location.protocol === 'file:';
  openModal(`<div class="m-h"><b>Dosyaya doğrudan yazılamıyor</b><button class="x" data-close>×</button></div>
    <div style="padding:16px 18px">
      <p style="margin:0 0 10px;color:var(--ink2)">
        ${isFile
          ? 'Sayfa <code>file://</code> ile açıldığı için tarayıcı dosyaya yazma iznini kapatıyor. Bu bir güvenlik kısıtı, uygulamayla ilgili değil.'
          : 'Bu tarayıcı dosyaya doğrudan yazmayı desteklemiyor (Chrome ve Edge destekler).'}
      </p>
      <div class="sec">Ne yapabilirsin</div>
      <div style="font-size:12.5px;color:var(--ink2);line-height:1.7">
        ${isFile ? `<b>1.</b> Sayfayı küçük bir yerel sunucu üzerinden aç — klasörde
          <code>python -m http.server</code> çalıştırıp <code>localhost:8000</code> adresinden gir.
          Sonra “Dosya seç” bir kez yapılır, bundan sonrası otomatik kaydeder.<br>
          <b>2.</b> Ya da veriyi tarayıcıda tut, ara ara JSON yedeği al.`
          : '<b>1.</b> Chrome veya Edge ile açarsan dosyaya doğrudan kaydedebilirsin.<br><b>2.</b> Ya da JSON yedeği al.'}
      </div>
      <div style="margin-top:12px;padding:9px 11px;background:var(--surface2);border:1px solid var(--line);
        border-radius:6px;font-size:11.5px;color:var(--ink3)">
        Verin kaybolmuyor: her değişiklik bu tarayıcının deposuna anında yazılıyor.
        Dosyaya kaydetmek yalnızca taşımak ve yedeklemek için gerekli.
      </div>
    </div>
    <div class="m-f"><button class="btn" data-close>Kapat</button>
      <button class="btn" id="cw_json">JSON yedeği al</button>
      <button class="btn" id="cw_html">Yine de HTML indir</button></div>`, 'narrow');
  $('#cw_json').onclick = () => { closeModal(); $('#btnExport').click(); };
  $('#cw_html').onclick = () => {
    download(new Blob([buildHtml()], { type: 'text/html' }), 'Kanbanpano.html');
    markClean(); closeModal();
  };
}

async function saveToFile(pickNew) {
  if (pickNew) return void (await pickFile());
  if (FILE_HANDLE) {
    if (await ensurePermission()) {
      try { await writeHandle(); return toast('Kaydedildi'); }
      catch (e) { FILE_HANDLE = null; FS_STATE = 'none'; }
    } else { renderFileBar(); return toast('Dosya izni verilmedi'); }
  }
  if (window.showSaveFilePicker) { await pickFile(); return; }
  cannotWriteDialog();
}

/* Dosya bağlıyken sessiz otomatik kayıt. */
function scheduleAuto() {
  if (!AUTOSAVE || FS_STATE !== 'ready' || !FILE_HANDLE) return;
  clearTimeout(autoT);
  autoT = setTimeout(async () => {
    try { await writeHandle(); } catch (e) { FS_STATE = 'prompt'; renderFileBar(); }
  }, 2500);
}

function markDirty() {
  if (!DIRTY) {
    DIRTY = true;
    const el = document.getElementById('fileState');
    if (el) el.className = 'fstate dirty';
  }
  scheduleAuto();
}
function markClean() {
  DIRTY = false;
  renderFileBar();
}

/* Sol menüdeki kaydetme çubuğu */
function renderFileBar() {
  const el = document.getElementById('fileBar');
  if (!el) return;
  const t = DB.savedAt ? fmtDT(DB.savedAt) : null;

  if (FS_STATE === 'ready') {
    el.innerHTML = `
      <button class="btn sm pri" id="btnSaveFile" style="flex:1">
        <span id="fileState" class="fstate ${DIRTY ? 'dirty' : 'ok'}"></span>
        ${DIRTY ? 'Kaydet' : 'Kaydedildi'}</button>
      <button class="btn sm" id="btnSaveAs" title="Başka dosyaya kaydet">…</button>
      <label class="fnote" style="display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="autoSave" ${AUTOSAVE ? 'checked' : ''}>
        Otomatik kaydet${t ? ' · son ' + t : ''}</label>`;
  } else if (FS_STATE === 'prompt') {
    el.innerHTML = `<button class="btn sm pri" id="btnReconnect" style="flex:1">Dosyaya bağlan</button>
      <div class="fnote">Sayfa yenilendi; izni bir kez onaylaman gerekiyor.</div>`;
  } else if (FS_STATE === 'none') {
    el.innerHTML = `<button class="btn sm pri" id="btnSaveFile" style="flex:1">
        <span id="fileState" class="fstate ${DIRTY ? 'dirty' : 'ok'}"></span>Dosya seç</button>
      <div class="fnote">Bir kez seç, sonrası otomatik kaydedilsin.</div>`;
  } else {
    el.innerHTML = `<button class="btn sm" id="btnSaveFile" style="flex:1">
        <span id="fileState" class="fstate ${DIRTY ? 'dirty' : 'ok'}"></span>Dosyaya kaydet</button>
      <div class="fnote">${DIRTY ? 'Kaydedilmemiş değişiklik var · ' : ''}Bu tarayıcıda doğrudan yazılamıyor</div>`;
  }
  const b = document.getElementById('btnSaveFile');
  if (b) b.onclick = () => saveToFile(false);
  const b2 = document.getElementById('btnSaveAs');
  if (b2) b2.onclick = () => saveToFile(true);
  const b3 = document.getElementById('btnReconnect');
  if (b3) b3.onclick = async () => { if (await ensurePermission()) { await writeHandle(); toast('Dosya bağlandı'); } renderFileBar(); };
  const cb = document.getElementById('autoSave');
  if (cb) cb.onchange = () => { AUTOSAVE = cb.checked; if (AUTOSAVE) scheduleAuto(); };
}


/* Dosyada gömülü veri, tarayıcıdakinden yeniyse kullanıcıya sor. */
function offerEmbedded(emb) {
  openModal(`<div class="m-h"><b>Dosyadaki veri daha yeni</b><button class="x" data-close>×</button></div>
    <div style="padding:16px 18px">
      <p style="margin:0 0 12px;color:var(--ink2)">Bu HTML dosyasının içinde kayıtlı bir veri var ve
      tarayıcıdakinden daha yeni görünüyor.</p>
      <div class="kv">
        <span class="lb">Dosyadaki</span><span>${fmtDT(emb.savedAt)}${emb.savedBy ? ' · ' + esc(emb.savedBy) : ''}
          · ${emb.issues?.length || 0} iş, ${emb.worklogs?.length || 0} süre kaydı</span>
        <span class="lb">Tarayıcıda</span><span>${DB.savedAt ? fmtDT(DB.savedAt) : 'tarih yok'}
          · ${DB.issues?.length || 0} iş, ${DB.worklogs?.length || 0} süre kaydı</span>
      </div>
      <p style="margin:12px 0 0;font-size:12px;color:var(--ink3)">
        Dosyadakini yüklersen tarayıcıdaki veri onunla değiştirilir. Emin değilsen önce
        “Tarayıcıdakini koru” deyip Veri menüsünden yedek al.</p>
    </div>
    <div class="m-f"><button class="btn" data-close>Tarayıcıdakini koru</button>
      <button class="btn pri" id="useEmb">Dosyadakini yükle</button></div>`, 'narrow');
  $('#useEmb').onclick = () => { DB = emb; save(); closeModal(); boot(); toast('Dosyadaki veri yüklendi'); };
}


/* ============================================================
   PANO — çevik proje yönetimi (tek dosya, bağımlılıksız)
   Bölüm 1: veri modeli, kalıcılık, yardımcılar
   ============================================================ */
const KEY = 'pano-db-v2';
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---- tarih yardımcıları (hepsi yerel, ISO 'YYYY-MM-DD') ---- */
const iso  = d => { const t = new Date(d); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0, 10); };
const addD = (d, n) => { const t = new Date(d); t.setDate(t.getDate() + n); return t; };
const TODAY = iso(new Date());
const monday = d => { const t = new Date(d); const w = (t.getDay() + 6) % 7; return addD(t, -w); };
const fmtD = s => { if (!s) return '—'; const [y, m, dd] = s.split('-'); return `${dd}.${m}`; };
const fmtDT = ts => new Date(ts).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const DAYS = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];

/* ---- süre: Jira ile aynı gramer → 3w 2d 4h 30m ---- */
let H_PER_DAY = 8, D_PER_WEEK = 5;
function parseDur(str) {
  if (str == null || str === '') return 0;
  if (typeof str === 'number') return str;
  let h = 0, hit = false;
  String(str).toLowerCase().replace(/(\d+(?:[.,]\d+)?)\s*([wdhm])/g, (_, n, u) => {
    n = parseFloat(n.replace(',', '.')); hit = true;
    h += n * ({ w: H_PER_DAY * D_PER_WEEK, d: H_PER_DAY, h: 1, m: 1 / 60 }[u]);
    return '';
  });
  if (!hit) { const n = parseFloat(String(str).replace(',', '.')); return isNaN(n) ? 0 : n; }
  return h;
}
function fmtDur(h) {
  if (!h) return '0h';
  const w = Math.floor(h / (H_PER_DAY * D_PER_WEEK)); h -= w * H_PER_DAY * D_PER_WEEK;
  const d = Math.floor(h / H_PER_DAY); h -= d * H_PER_DAY;
  const hh = Math.floor(h); const m = Math.round((h - hh) * 60);
  return [w && w + 'w', d && d + 'd', hh && hh + 'h', m && m + 'm'].filter(Boolean).join(' ') || '0h';
}

/* ---- sıralama anahtarı: kesirli indeksleme (LexoRank'in sade hâli) ---- */
function rankBetween(a, b) {
  if (a == null && b == null) return 1000;
  if (a == null) return b - 1;
  if (b == null) return a + 1;
  return (a + b) / 2;
}

/* ---- ortak sürükle-bırak: hedefteki sıraya göre rank hesabı ---- */
let DRAG = null;
function dropIndexRank(container, y, sel) {
  const rows = [...container.querySelectorAll(sel)].filter(el => el.dataset.id !== DRAG);
  let before = null;
  for (const el of rows) {
    const r = el.getBoundingClientRect();
    if (y < r.top + r.height / 2) { before = el; break; }
  }
  const list = rows.map(el => issue(el.dataset.id).rank);
  if (!rows.length) return 1000;
  if (!before) return list[list.length - 1] + 100;
  const idx = rows.indexOf(before);
  return rankBetween(idx === 0 ? null : list[idx - 1], list[idx]);
}

      ${canEdit() ? (stat(i.statusId).cat === 'done'
        ? `<button class="cbox on" data-reopen="${i.id}" title="Yeniden aç">✓</button>`

function renderBoard() {
  const list = boardIssues();
  if (MOD('sprint') && !activeSprint() && DB.board.scope !== 'all')
    return `<div class="panel"><h3>Aktif sprint yok</h3>

      <a class="btn pri" href="#backlog" style="text-decoration:none;display:inline-block">Backlog'a git</a></div>`;

function blRow(i) {
  const s = stat(i.statusId), ep = MOD('epic') && i.epicId && issue(i.epicId);
  return `<div class="row" draggable="${canEdit()}" data-id="${i.id}">
    ${canEdit() ? (s.cat === 'done'
      ? `<button class="cbox on" data-reopen="${i.id}" title="Yeniden aç">✓</button>`

    ${tIcon(i.type)}<span class="k" style="color:var(--ink3);width:64px">${i.key}</span>

function sumOf(items) {
  const p = items.reduce((a, i) => a + (i.points || 0), 0);
  const c = { todo: 0, inprogress: 0, done: 0 };
  items.forEach(i => c[stat(i.statusId).cat] += (i.points || 0));
  return { p, c };
}

function renderBacklog() {
  const list = issuesOf().filter(i => i.type !== 'epic' && matches(i)).sort((a, b) => a.rank - b.rank);

  /* Sprint modülü kapalıyken backlog, öncelik sırası verilen tek bir iş listesidir. */
  if (!MOD('sprint')) {
    const open = list.filter(i => stat(i.statusId).cat !== 'done');
    const done = list.filter(i => stat(i.statusId).cat === 'done');
    return `<section class="sprintbox" data-drop="sprint" data-sprint="">
        <div class="sb-h"><b>İş listesi</b>
          <span class="ct k" style="color:var(--ink3)">${open.length} açık iş</span>
          <span class="pill">${fmtDur(open.reduce((a, i) => a + remaining(i), 0))} kalan</span>
          <span class="spacer"></span>${canEdit() ? '<button class="btn sm" id="blAdd">+ İş ekle</button>' : ''}</div>
        ${DB.ui.blAdd ? blAddRow() : ''}
        ${open.map(blRow).join('') || '<div class="empty">Açık iş yok</div>'}
      </section>
      ${done.length ? `<section class="sprintbox">
        <div class="sb-h"><b>Tamamlananlar</b><span class="ct k" style="color:var(--ink3)">${done.length}</span></div>
        ${done.map(blRow).join('')}</section>` : ''}
      <p style="color:var(--ink3);font-size:11.5px;margin-top:8px">
        Sıralama sürükleyerek değişir ve panodaki kart sırasını belirler.</p>`;
  }

  const boxes = sprintsOf().filter(s => s.state !== 'closed').map(s => {
    const items = list.filter(i => i.sprintId === s.id);
    const { c } = sumOf(items);
    const act = s.state === 'active';
    return `<section class="sprintbox ${act ? 'active' : ''}" data-drop="sprint" data-sprint="${s.id}">
      <div class="sb-h">
        <b>${esc(s.name)}</b>
        ${s.start ? `<span class="dates">${fmtD(s.start)} → ${fmtD(s.end)}</span>` : '<span class="dates">tarih yok</span>'}
        <span class="ct k" style="color:var(--ink3)">${items.length} iş</span>
        <span class="pill todo">${c.todo}</span><span class="pill prog">${c.inprogress}</span><span class="pill done">${c.done}</span>
        ${s.goal ? `<span class="goal">“${esc(s.goal)}”</span>` : ''}
        <span class="spacer"></span>
        ${act ? `<button class="btn sm" data-spcomplete="${s.id}">Sprint'i tamamla</button>`
               : `<button class="btn sm" data-start="${s.id}" ${items.length ? '' : 'disabled'}>Sprint'i başlat</button>`}
        <button class="btn sm" data-editsprint="${s.id}">Düzenle</button>
      </div>
      ${items.map(blRow).join('') || '<div class="empty">Buraya iş sürükleyin</div>'}
    </section>`;
  }).join('');

  const bl = list.filter(i => !i.sprintId);
  const { p } = sumOf(bl);
  return boxes + `<section class="sprintbox" data-drop="sprint" data-sprint="">
    <div class="sb-h"><b>Backlog</b>
      <span class="ct k" style="color:var(--ink3)">${bl.length} iş</span>
      <span class="pill">${p} puan</span>
      <span class="spacer"></span>${canEdit() ? '<button class="btn sm" id="blAdd">+ İş ekle</button>' : ''}</div>
    ${DB.ui.blAdd ? blAddRow() : ''}
    ${bl.map(blRow).join('') || '<div class="empty">Backlog boş</div>'}
  </section>`;
}

/* Backlog'a hızlı iş ekleme — tarih verilmez, plana düşmez. */
function blAddRow() {

function wireBacklogAdd() {
  const b = $('#blAdd'); if (b) b.onclick = () => { DB.ui.blAdd = !DB.ui.blAdd; render(); $('#bl_s')?.focus(); };
  const box = $('.bladd'); if (!box) return;
  const add = () => {
    const s = $('#bl_s').value.trim(); if (!s) return $('#bl_s').focus();
    const pr = P(), est = parseDur($('#bl_e').value);
    const it = { id: uid('i'), key: `${pr.code || pr.key}-${++pr.counter}`, projectId: pr.id,
      type: $('#bl_t').value, summary: s, description: '', statusId: stats()[0].id,
      assignee: $('#bl_a').value || null, reporter: CU().id, priority: 3, points: null,
      estimate: est, remainingEst: est, spent: 0, labels: [], cf: {}, sprintId: null, epicId: null,
      parentId: null, start: '', due: '', created: Date.now(), updatedAt: Date.now(),
      billable: BILLABLE[0], billType: BILLTYPE[0],
      rank: Math.max(0, ...DB.issues.map(x => x.rank)) + 100 };
    DB.issues.push(it); runRules(it, 'created');
    DB.ui.qa.type = it.type; DB.ui.qa.assignee = it.assignee || '';
    save(); render(); $('#bl_s')?.focus(); toast(it.key + ' backlog\'a eklendi');

  $('#bl_ok').onclick = add;

  $('#bl_s').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); }
    if (e.key === 'Escape') { DB.ui.blAdd = false; render(); } };

}

/* ---- sprint yaşam döngüsü (Jira ile aynı kurallar) ---- */
function startSprint(id) {
  const s = sprint(id);
  if (activeSprint()) return toast('Zaten aktif bir sprint var. Önce onu tamamlayın.');
  s.state = 'active';
  if (!s.start) { s.start = TODAY; s.end = iso(addD(new Date(), 13)); }
  save(); render(); toast(s.name + ' başlatıldı');
}
function completeSprint(id) {
  const s = sprint(id);
  const items = issuesOf().filter(i => i.sprintId === id);
  const open = items.filter(i => stat(i.statusId).cat !== 'done');
  const next = sprintsOf().find(x => x.state === 'future');
  openModal(`
    <div class="m-h"><b>Sprint'i tamamla</b><button class="x" data-close>×</button></div>
    <div style="padding:18px">
      <p style="margin:0 0 12px">
        <b>${esc(s.name)}</b> kapatılıyor.<br>
        <span class="num">${items.length - open.length}</span> iş tamamlandı,
        <span class="num">${open.length}</span> iş açık kaldı.</p>
      <label class="field">Açık işler nereye taşınsın?</label>
      <select class="inp" id="moveTo">
        ${next ? `<option value="${next.id}">${esc(next.name)}</option>` : ''}
        <option value="">Backlog</option>
      </select>
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button>
      <button class="btn pri" id="doComplete">Tamamla</button></div>`, 'narrow');
  $('#doComplete').onclick = () => {
    const to = $('#moveTo').value || null;
    open.forEach(i => { i.sprintId = to; logHist(i, 'Sprint', s.name, to ? sprint(to).name : 'Backlog'); });
    s.state = 'closed'; s.end = TODAY;
    closeModal(); save(); render(); toast('Sprint tamamlandı');
  };
}

/* ============================ YOL HARİTASI ============================ */
function epicRange(e) {
  const kids = issuesOf().filter(i => i.epicId === e.id);
  const sps = kids.map(k => k.sprintId && sprint(k.sprintId)).filter(s => s && s.start);
  const start = e.start || (sps.length ? sps.map(s => s.start).sort()[0] : iso(addD(new Date(), -7)));
  const end = e.due || (sps.length ? sps.map(s => s.end).sort().pop() : iso(addD(new Date(), 21)));
  const done = kids.filter(k => stat(k.statusId).cat === 'done').length;
  return { start, end, kids, pct: kids.length ? Math.round(done / kids.length * 100) : 0 };
}

function renderRoadmap() {
  const w0 = monday(addD(new Date(), -21)), N = 14;
  const weeks = Array.from({ length: N }, (_, k) => addD(w0, k * 7));
  const colW = 100 / N;
  const dayPos = d => {
    const diff = (new Date(d) - w0) / 86400000 / 7;
    return Math.max(0, Math.min(N, diff)) * colW;
  };
  const eps = epicsOf();
  if (!eps.length) return '<div class="panel"><div class="empty">Bu projede epik yok. Backlog\'da “+ İş oluştur” ile tip olarak Epik seçin.</div></div>';

  return `<div class="rmwrap"><table class="rm">
    <thead><tr><th class="lead">Epik</th>
      ${weeks.map(d => `<th>${fmtD(iso(d))}</th>`).join('')}</tr></thead>
    <tbody>${eps.map(e => {
      const r = epicRange(e);
      const L = dayPos(r.start), R = dayPos(addD(new Date(r.end), 1));
      const late = r.end < TODAY && r.pct < 100;
      return `<tr data-open="${e.id}" style="cursor:pointer">
        <td class="lead">
          <div style="display:flex;align-items:center;gap:8px">
            ${tIcon('epic')}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.summary)}</span>
            <span class="k" style="color:var(--ink3)">${r.pct}%</span>${avat(e.assignee)}
          </div>
        </td>
        <td colspan="${N}"><div class="track">
          <div class="today" style="left:${dayPos(TODAY)}%"></div>
          <div class="gantt" style="left:${L}%;width:${Math.max(R - L, 3)}%;background:${e.color || '#6B4FBB'};${late ? 'box-shadow:inset 0 0 0 2px var(--risk)' : ''}">
            <i style="width:${r.pct}%"></i>
            <span style="position:relative">${r.kids.length} iş · ${fmtD(r.end)}</span>
          </div>
        </div></td></tr>`;
    }).join('')}</tbody></table></div>
    <p style="color:var(--ink3);font-size:11.5px;margin-top:8px">
      Kırmızı dikey çizgi bugünü, çubuk içindeki açık alan tamamlanma oranını gösterir.
      Epik tarihleri, alt işlerin sprintlerinden türetilir; epiği açıp elle de verebilirsiniz.</p>`;
}

function heat(h) {
  if (!h) return '';
  const a = Math.min(.85, .12 + h / 10);
  return `background:rgba(31,111,92,${a.toFixed(2)});color:${h >= 5 ? '#fff' : 'var(--ink)'};font-weight:600`;
}

function renderTimesheet() {
  if (DB.ui.tsMode === 'day') return renderDayGrid();
  const days = weekDays();
  const wl = DB.worklogs.filter(w => days.includes(w.date) && tsScopeOk(w));
  const byUser = DB.ui.tsMode === 'user';
  const rows = byUser
    ? tsUsers().map(u => ({ id: u.id, label: `${avat(u.id)}<span style="margin-left:8px">${esc(u.name)}</span>`, pick: w => w.userId === u.id }))
    : [...new Set(wl.map(w => w.issueId))].map(id => { const i = issue(id); return {
        id, open: id,

      });

  const cellH = (r, d) => wl.filter(w => r.pick(w) && w.date === d).reduce((a, w) => a + w.hours, 0);
  const colTot = days.map(d => wl.filter(w => w.date === d).reduce((a, w) => a + w.hours, 0));

  const table = `<div class="tswrap"><table class="ts">
    <thead><tr><th class="who">${byUser ? 'Kişi' : 'İş'}</th>

      const cells = days.map(d => cellH(r, d));
      const t = cells.reduce((a, b) => a + b, 0);
      return `<tr ${r.open ? `data-open="${r.open}"` : ''}>
        <td class="who">${r.label}</td>
        ${cells.map((h, k) => `<td class="${k > 4 ? 'wknd' : ''}">
          <button class="cell ${h ? '' : 'z'}" style="${heat(h)}" data-cell="${r.id}" data-date="${days[k]}"
            title="${h ? fmtDur(h) : 'Süre kaydet'}">${h ? h.toFixed(1).replace('.0', '') : '·'}</button></td>`).join('')}
        <td class="tot"><span class="num">${t ? fmtDur(t) : '—'}</span></td></tr>`;
    }).join('')}</tbody>
    <tfoot>
    ${byUser ? `<tr><td class="who" style="font-family:var(--mono);font-size:11px">KAPASİTE KULLANIMI</td>
      <td colspan="8" style="padding:6px 10px;text-align:left">
        ${tsUsers().map(u => { const h = wl.filter(w => w.userId === u.id).reduce((a, w) => a + w.hours, 0);
          const r = capOf(u) ? h / capOf(u) : 0;
          return `<span class="chip" style="margin-right:6px;background:${r > 1.05 ? '#FDF2F1' : r < .6 ? '#EEF0F2' : '#E7F5EC'};
            color:${r > 1.05 ? 'var(--risk)' : r < .6 ? 'var(--todo)' : 'var(--done)'}">
            ${u.ini} ${h.toFixed(0)}/${capOf(u)}h</span>`; }).join('')}
      </td></tr>` : ''}
    <tr><td class="who" style="font-family:var(--mono);font-size:11px">GÜN TOPLAMI</td>
      ${colTot.map((t, k) => `<td class="${k > 4 ? 'wknd' : ''}">${t ? t.toFixed(1).replace('.0', '') : '—'}</td>`).join('')}
      <td class="tot">${fmtDur(grand)}</td></tr></tfoot>
  </table></div>`;

  const recent = wl.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 12);
  const list = `<div class="wl-list">
    <div class="wl" style="background:var(--surface2)"><b style="font-size:12px">Bu haftanın kayıtları</b>
      <span class="spacer"></span><span class="k" style="color:var(--ink3)">${wl.length} kayıt</span></div>
    ${recent.map(w => { const i = issue(w.issueId); return `<div class="wl">
      ${avat(w.userId)}<span class="k" style="color:var(--ink3);width:64px">${i.key}</span>
      ${tsAllMode() ? `<span class="chip lbl">${esc(projName(i.projectId))}</span>` : ''}
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" data-open="${i.id}">${esc(i.summary)}</span>
      <span class="k">${fmtD(w.date)}</span><b class="num">${fmtDur(w.hours)}</b>
      <button class="btn sm danger" data-delwl="${w.id}">Sil</button></div>`; }).join('') || '<div class="empty">Bu hafta kayıt yok</div>'}
  </div>`;

  return table + list;
}

/* ============================ RAPORLAR ============================ */
function svgLine(w, h, pts, color, dash) {
  return `<polyline fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="5 4"' : ''}
    points="${pts.map(p => p.join(',')).join(' ')}"/>`;
}
function doneDate(i) {
  if (i.doneAt) return i.doneAt;
  const h = DB.history.filter(x => x.issueId === i.id && x.field === 'Durum').pop();
  return h ? iso(new Date(h.at)) : null;
}

function burndown(s) {
  const W = 460, H = 180, PL = 34, PB = 22;
  const items = DB.issues.filter(i => i.sprintId === s.id);
  const total = items.reduce((a, i) => a + (i.points || 0), 0) || 1;
  const n = Math.max(1, Math.round((new Date(s.end) - new Date(s.start)) / 86400000));
  const days = Array.from({ length: n + 1 }, (_, k) => iso(addD(new Date(s.start), k)));
  const x = k => PL + k * (W - PL - 8) / n;
  const y = v => 8 + (1 - v / total) * (H - PB - 8);

  let left = total; const real = [];
  days.forEach((d, k) => {
    if (d > TODAY) return;
    items.forEach(i => { if (stat(i.statusId).cat === 'done' && doneDate(i) === d) left -= (i.points || 0); });
    real.push([x(k), y(left)]);
  });
  const ideal = [[x(0), y(total)], [x(n), y(0)]];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sprint burndown">
    ${[0, .5, 1].map(f => `<line x1="${PL}" x2="${W - 8}" y1="${y(total * f)}" y2="${y(total * f)}" stroke="var(--line)"/>
      <text x="4" y="${y(total * f) + 4}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${Math.round(total * f)}</text>`).join('')}
    ${svgLine(W, H, ideal, '#C7CBD1', true)}
    ${svgLine(W, H, real, 'var(--accent)')}
    ${real.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join('')}
    <text x="${PL}" y="${H - 6}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(s.start)}</text>
    <text x="${W - 8}" y="${H - 6}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(s.end)}</text>
  </svg>`;
}

function velocity() {
  const done = sprintsOf().filter(s => s.state !== 'future').slice(-6);
  if (!done.length) return '<div class="empty">Henüz kapanmış sprint yok</div>';
  const data = done.map(s => {
    const it = DB.issues.filter(i => i.sprintId === s.id);
    return { s, c: it.reduce((a, i) => a + (i.points || 0), 0),
             d: it.filter(i => stat(i.statusId).cat === 'done').reduce((a, i) => a + (i.points || 0), 0) };
  });
  const max = Math.max(...data.map(d => d.c), 1), W = 460, H = 170, bw = (W - 20) / data.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sprint hızı">
    ${data.map((d, k) => {
      const x = 10 + k * bw, ch = (d.c / max) * (H - 40), dh = (d.d / max) * (H - 40);
      return `<rect x="${x + 6}" y="${H - 26 - ch}" width="${bw * .36}" height="${ch}" fill="#C7CBD1" rx="2"/>
        <rect x="${x + 6 + bw * .40}" y="${H - 26 - dh}" width="${bw * .36}" height="${dh}" fill="var(--accent)" rx="2"/>
        <text x="${x + bw / 2}" y="${H - 12}" text-anchor="middle" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${esc(d.s.name.replace(/^\S+\s/, ''))}</text>
        <text x="${x + bw / 2}" y="${H - 32 - Math.max(ch, dh)}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--ink2)">${d.d}/${d.c}</text>`;
    }).join('')}</svg>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--ink3);margin-top:4px">
      <span>▬ <span style="color:var(--ink2)">Taahhüt</span></span>
      <span style="color:var(--accent)">▬ <span style="color:var(--ink2)">Tamamlanan</span></span></div>`;
}

function renderReports() {
  const act = MOD('sprint') ? activeSprint() : null;

  const wl = DB.worklogs.filter(w => days.includes(w.date) && issue(w.issueId)?.projectId === DB.ui.project);
  const perUser = DB.users.map(u => ({ u, h: wl.filter(w => w.userId === u.id).reduce((a, w) => a + w.hours, 0) }))
    .sort((a, b) => b.h - a.h);
  const maxH = Math.max(...perUser.map(p => p.h), 1);
  const est = items.reduce((a, i) => a + (i.estimate || 0), 0);
  const spent = items.reduce((a, i) => a + (i.spent || 0), 0);

  const byStatus = stats().map(s => ({ s, n: items.filter(i => i.statusId === s.id).length }));
  const tot = items.length || 1;

  return `<div class="grid2">
    ${MOD('sprint') ? `<section class="panel">
      <h3>Sprint burndown</h3>
      <div class="sub">${act ? esc(act.name) + ' · kalan story point' : 'Aktif sprint yok'}</div>
      ${act ? `<div class="stat">
        <div><b>${items.length - dn.length}</b><span>açık iş</span></div>
        <div><b>${items.reduce((a, i) => a + (i.points || 0), 0) - dn.reduce((a, i) => a + (i.points || 0), 0)}</b><span>kalan puan</span></div>
        <div><b>${Math.max(0, Math.ceil((new Date(act.end) - new Date()) / 86400000))}</b><span>gün kaldı</span></div>
      </div>${burndown(act)}` : '<div class="empty">Backlog\'dan bir sprint başlatın</div>'}
    </section>

    <section class="panel">
      <h3>Sprint hızı</h3><div class="sub">Taahhüt edilen ve tamamlanan puan</div>
      ${velocity()}
    </section>` : ''}

    <section class="panel">
      <h3>Kişi bazlı harcanan süre</h3>
      <div class="sub">${fmtD(days[0])} – ${fmtD(days[6])} haftası</div>
      ${perUser.map(p => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
        ${avat(p.u.id)}<span style="width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.u.name)}</span>
        <span style="flex:1;height:9px;background:#EDEDE7;border-radius:5px;overflow:hidden">
          <i style="display:block;height:100%;width:${p.h / maxH * 100}%;background:${p.u.color}"></i></span>
        <b class="num" style="width:52px;text-align:right;font-size:12px">${fmtDur(p.h)}</b></div>`).join('')}
      <div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;justify-content:space-between">
        <span class="k" style="color:var(--ink3)">HAFTA TOPLAMI</span>
        <b class="num">${fmtDur(wl.reduce((a, w) => a + w.hours, 0))}</b></div>
    </section>

    <section class="panel">
      <h3>Kapasite planı</h3><div class="sub">${MOD('sprint') ? 'Aktif sprint' : 'Açık işler'} · kalan iş yükü / kişi kapasitesi</div>
      ${capacityPanel()}
    </section>

    <section class="panel">
      <h3>Kümülatif akış</h3><div class="sub">Son 30 gün · durum bazında iş sayısı</div>
      ${cfd(30)}
    </section>

    <section class="panel">
      <h3>Döngü süresi</h3><div class="sub">Başlangıçtan bitişe geçen gün</div>
      ${cycleReport()}
    </section>

    <section class="panel">
      <h3>Haftalık üretim</h3><div class="sub">Tamamlanan iş sayısı</div>
      ${throughput(8)}
    </section>

    <section class="panel">
      <h3>Tahmin doğruluğu</h3><div class="sub">${MOD('sprint') ? 'Aktif sprint' : 'Tüm işler'} · tahmin vs harcanan</div>
      <div class="stat">
        <div><b>${fmtDur(est)}</b><span>tahmin</span></div>
        <div><b>${fmtDur(spent)}</b><span>harcanan</span></div>
        <div><b style="${spent > est ? 'color:var(--risk)' : ''}">${est ? Math.round(spent / est * 100) : 0}%</b><span>kullanım</span></div>
      </div>
      <div class="sec" style="margin-top:6px">DURUM DAĞILIMI</div>
      ${byStatus.map(b => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <span style="width:104px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.s.name)}</span>
        <span style="flex:1;height:9px;background:#EDEDE7;border-radius:5px;overflow:hidden">
          <i style="display:block;height:100%;width:${b.n / tot * 100}%;background:var(--${b.s.cat === 'done' ? 'done' : b.s.cat === 'todo' ? 'todo' : 'prog'})"></i></span>
        <b class="num" style="width:26px;text-align:right;font-size:12px">${b.n}</b></div>`).join('')}

  </div>`;
}

function openModal(html, cls = '') {
  const s = $('#scrim');
  s.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  s.classList.add('on');
  const f = s.querySelector('input,textarea,select'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('#scrim').classList.remove('on'); $('#scrim').innerHTML = ''; }

/* ---- durum değişimi tek kapıdan ---- */
function setStatus(i, sid) {
  if (i.statusId === sid) return;
  const from = stat(i.statusId), to = stat(sid);
  logHist(i, 'Durum', from.name, to.name);
  i.statusId = sid;
  if (to.cat === 'done') i.doneAt = TODAY; else delete i.doneAt;
  i.updatedAt = Date.now();
  recordTransition(i, from.id, sid);
  runRules(i, 'status');
}

/* ============================ İŞ DETAYI ============================ */

          <button data-t="hist" class="${TAB === 'hist' ? 'on' : ''}">Geçmiş</button>
        </div>
        <div id="tabbody">${
          TAB === 'comments' ? (cm.map(c => `<div class="cmt">${avat(c.userId)}
              <div class="bd"><div class="hd"><b>${esc(user(c.userId)?.name || '—')}</b> · ${fmtDT(c.at)}
                ${c.edited ? '<span style="color:var(--ink3)">· düzenlendi</span>' : ''}
                ${(c.userId === CU().id || isAdmin()) && canEdit() ? `<span style="float:right;display:flex;gap:6px">
                  <button class="btn sm" data-cedit="${c.id}">Düzenle</button>

                     <div style="display:flex;gap:6px;margin-top:6px">
                       <button class="btn sm pri" data-csave="${c.id}">Kaydet</button>
                       <button class="btn sm" data-ccancel>Vazgeç</button></div>`
                  : esc(c.body)}</div></div>`).join('')
              || '<div class="empty">Henüz yorum yok</div>') +
            `<div style="margin-top:10px"><textarea class="inp" id="newCmt" rows="2" placeholder="Yorum yazın…"></textarea>
             <button class="btn sm pri" id="addCmt" style="margin-top:6px">Yorumu ekle</button></div>`
          : TAB === 'work' ? (wl.map(w => `<div class="wl" style="padding:8px 0">${avat(w.userId)}
              <span style="flex:1"><b>${esc(user(w.userId)?.name || '—')}</b>
              <span style="color:var(--ink3)">${esc(w.comment) || 'çalıştı'}</span></span>
              <span class="k">${fmtD(w.date)}${w.time ? ' ' + w.time : ''}</span><b class="num">${fmtDur(w.hours)}</b>
              ${(w.userId === CU().id || isAdmin()) && canEdit()
                ? `<button class="btn sm" data-editwl="${w.id}">Düzenle</button>` : ''}</div>`).join('')
              || '<div class="empty">Süre kaydı yok</div>')
          : (hs.map(h => `<div class="hist"><span class="w">${fmtDT(h.at)}</span> —
              <b>${esc(user(h.userId)?.name || '—')}</b> <i>${esc(h.field)}</i> alanını
              <span class="chip lbl">${esc(h.from)}</span> → <span class="chip lbl">${esc(h.to)}</span> yaptı</div>`).join('')
              || '<div class="empty">Değişiklik kaydı yok</div>')

          ${MOD('reporter') ? `<span class="lb">Raporlayan</span><select class="inp" data-f="reporter">${opt(DB.users, i.reporter)}</select>` : ''}
          <span class="lb">Öncelik</span><select class="inp" data-f="priority">${opt([1, 2, 3, 4, 5], i.priority, p => [p, PRI[p][1]])}</select>
          <span class="lb">Tip</span><select class="inp" data-f="type">${opt(ISSUE_TYPES(), i.type, t => [t, TYPE[t][2]])}</select>
          ${MOD('points') ? `<span class="lb">Puan</span><input class="inp" data-f="points" value="${i.points ?? ''}" placeholder="—">` : ''}

          ${MOD('epic') ? `<span class="lb">Epik</span><select class="inp" data-f="epicId"><option value="">Yok</option>${opt(epicsOf().filter(e => e.id !== i.id), i.epicId, e => [e.id, e.summary])}</select>` : ''}
          ${planRow(i)}
          <span class="lb">Faturalama</span><select class="inp" data-f="billable">${opt(BILLABLE, billOf(i), x => [x, x])}</select>
          <span class="lb">Fatura türü</span><select class="inp" data-f="billType">${opt(BILLTYPE, btypeOf(i), x => [x, x])}</select>
        </div>

        ${cfPanel(i)}
        ${labelEditor(i)}

        <div class="sec">Zaman takibi</div>
        <div class="timebar">
          <i class="sp" style="width:${(i.spent / tot * 100).toFixed(1)}%"></i>
          <i class="rm" style="width:${(rem / tot * 100).toFixed(1)}%"></i>
        </div>
        <div class="tlegend"><span>${fmtDur(i.spent)} harcandı</span><span>${fmtDur(rem)} kaldı</span></div>
        ${i.spent + rem > i.estimate && i.estimate ? `<div class="chip" style="background:#FDF2F1;color:var(--risk);margin-top:6px">Tahmin aşımı: +${fmtDur(i.spent + rem - i.estimate)}</div>` : ''}

  if (!canEdit()) {
    $$('.m-b input,.m-b select,.m-b textarea,.m-b button.btn', S).forEach(el => el.disabled = true);
    $$('[contenteditable]', S).forEach(el => el.contentEditable = 'false');
    const lh = $('#logHere'); if (lh) lh.disabled = true;
    const dl = S.querySelector('[data-del]'); if (dl) dl.remove();
  }
  $$('[data-f]', S).forEach(el => el.onchange = () => {
    const f = el.dataset.f; let v = el.value;
    const label = { statusId: 'Durum', assignee: 'Atanan', reporter: 'Raporlayan', priority: 'Öncelik',
      type: 'Tip', points: 'Puan', sprintId: 'Sprint', epicId: 'Epik', due: 'Bitiş', start: 'Başlangıç',
      estimate: 'Tahmin', remainingEst: 'Kalan tahmin', billable: 'Faturalama', billType: 'Fatura türü' }[f];
    const isDur = f === 'estimate' || f === 'remainingEst';
    if (f === 'statusId') { setStatus(i, v); }
    else {
      const before = isDur ? fmtDur(f === 'estimate' ? i.estimate : remaining(i)) : (i[f] ?? '—');
      if (f === 'points') v = v === '' ? null : parseFloat(v.replace(',', '.'));
      else if (f === 'priority') v = +v;
      else if (isDur) v = parseDur(v);
      else if (f === 'sprintId' || f === 'epicId' || f === 'assignee') v = v || null;
      i[f] = v;
      /* Henüz süre kaydı yoksa tahmin değişince kalan da onunla eşitlenir. */
      if (f === 'estimate' && !i.spent) i.remainingEst = v;
      /* Tarih sırası korunur: bitiş başlangıçtan önce olamaz. */
      if (f === 'start' && v && i.due && v > i.due) i.due = v;
      if (f === 'due' && v && i.start && v < i.start) i.start = v;
      logHist(i, label, before, isDur ? fmtDur(v) : (v ?? '—'));
    }
    save(); render(); openIssue(i.id);
  });
  $('#sum').onblur = () => { const v = $('#sum').innerText.trim(); if (v && v !== i.summary) { logHist(i, 'Özet', i.summary, v); i.summary = v; save(); render(); } };
  $('#desc').onblur = () => { const v = $('#desc').innerText.trim(); if (v !== i.description) { i.description = v; save(); } };
  $('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { TAB = b.dataset.t; openIssue(i.id); } };
  $$('[data-cedit]').forEach(b => b.onclick = () => { DB.ui.editCmt = b.dataset.cedit; openIssue(i.id); });
  $$('[data-ccancel]').forEach(b => b.onclick = () => { DB.ui.editCmt = null; openIssue(i.id); });
  $$('[data-csave]').forEach(b => b.onclick = () => {
    const c = DB.comments.find(x => x.id === b.dataset.csave);
    const v = $('#ce_' + c.id).value.trim(); if (!v) return;
    if (v !== c.body) { c.body = v; c.edited = Date.now(); }
    DB.ui.editCmt = null; save(); openIssue(i.id);
  });
  $$('[data-cdel]').forEach(b => b.onclick = () => {
    DB.comments = DB.comments.filter(x => x.id !== b.dataset.cdel); save(); openIssue(i.id); });
  const ac = $('#addCmt'); if (ac) ac.onclick = () => {
    const v = $('#newCmt').value.trim(); if (!v) return;
    DB.comments.push({ id: uid('c'), issueId: i.id, userId: CU().id, at: Date.now(), body: v });
    save(); openIssue(i.id);
  };
  $('#logHere').onclick = () => logWorkForm(i.id);
  wireIssueExtras(i);
}

/* Kalan tahminin süre kaydından sonraki değeri */
function nextRemaining(i, hours, mode, value) {
  const cur = remaining(i);
  if (mode === 'leave') return cur;
  if (mode === 'set') return Math.max(0, value || 0);
  if (mode === 'reduce') return Math.max(0, cur - (value || 0));
  return Math.max(0, cur - hours);          // auto
}

/* ============================ OLAYLAR ============================ */
function wire() {
  $('#projSel').onchange = e => { DB.ui.project = e.target.value; DB.board.q = ''; save(); render(); };
  addEventListener('hashchange', () => {
    const v = location.hash.slice(1); if (VIEWS[v]) { DB.ui.view = v; save(); render(); }
  });

  document.addEventListener('click', e => {
    const t = e.target;

    /* --- gezinme: hash'e bağlı değil, doğrudan tıklama --- */
    const nv = t.closest('[data-v]');
    if (nv) {
      e.preventDefault();
      const v = nv.dataset.v;
      if (v === '__proj') return projectMenu();
      if (v === '__data') return dataMenu();
      if (VIEWS[v]) { DB.ui.view = v; try { history.replaceState(null, '', '#' + v); } catch (_) {} save(); render(); }
      return;
    }

    if (t.closest('[data-close]') || t === $('#scrim')) return closeModal();
    const pj = t.closest('[data-proj]');
    if (pj) { DB.ui.project = pj.dataset.proj; DB.board.q = ''; $('#projSel').value = pj.dataset.proj;
      closeModal(); save(); render(); return; }
    const ac2 = t.closest('[data-act]');
    if (ac2) { closeModal();
      if (ac2.dataset.act === 'savefile') return saveToFile(false);
      if (ac2.dataset.act === 'merge') return $('#mergeIn').click();
      const b2 = $({ export: '#btnExport', import: '#btnImport' }[ac2.dataset.act]);
      if (b2) b2.click(); return; }
    const cp2 = t.closest('[data-complete]');
    if (cp2 && cp2.dataset.complete) { e.stopPropagation(); return completeIssue(cp2.dataset.complete); }
    const ro = t.closest('[data-reopen]');
    if (ro) { e.stopPropagation(); return reopenIssue(ro.dataset.reopen); }
    const dt = t.closest('[data-donetgl]');
    if (dt) { DB.ui.doneOpen ||= {}; DB.ui.doneOpen[dt.dataset.donetgl] = !DB.ui.doneOpen[dt.dataset.donetgl]; save(); return render(); }
    const ew = t.closest('[data-editwl]');
    if (ew) { e.stopPropagation(); return worklogForm({ edit: ew.dataset.editwl }); }
    const cell = t.closest('[data-cell]');
    if (cell) {
      const id = cell.dataset.cell, date = cell.dataset.date, byUser = DB.ui.tsMode === 'user';
      const logs = DB.worklogs.filter(w => w.date === date && tsScopeOk(w)
        && (byUser ? w.userId === id : w.issueId === id));
      if (!logs.length) return canEdit()
        ? (byUser ? logWorkForm(null, id, date) : logWorkForm(id, null, date))
        : toast('Bu güne kayıt girilmemiş');
      const who = byUser ? user(id)?.name : issue(id)?.key + ' — ' + issue(id)?.summary;
      return showLogs(who, fmtD(date), logs,
        { userId: byUser ? id : null, issueId: byUser ? null : id, date });
    }
    const del = t.closest('[data-delwl]');
    if (del) { const w = DB.worklogs.find(x => x.id === del.dataset.delwl); const i = issue(w.issueId);
      i.spent = Math.max(0, (i.spent || 0) - w.hours);
      if (!w.adj || w.adj === 'auto') i.remainingEst = remaining(i) + w.hours;
      DB.worklogs = DB.worklogs.filter(x => x.id !== w.id);
      save(); render(); if ($('#scrim').classList.contains('on')) openIssue(i.id); return; }
    const di = t.closest('[data-del]');
    if (di) { if (!confirm('Bu iş ve tüm kayıtları silinsin mi?')) return;
      const id = di.dataset.del;
      DB.issues = DB.issues.filter(x => x.id !== id);
      DB.worklogs = DB.worklogs.filter(x => x.issueId !== id);
      DB.comments = DB.comments.filter(x => x.issueId !== id);
      closeModal(); save(); render(); return; }
    const ds = t.closest('[data-delsprint]');
    if (ds) { const id = ds.dataset.delsprint;
      DB.issues.forEach(i => { if (i.sprintId === id) i.sprintId = null; });
      DB.sprints = DB.sprints.filter(s => s.id !== id);
      closeModal(); save(); render(); return; }
    const st = t.closest('[data-start]');   if (st) return startSprint(st.dataset.start);
    const cp = t.closest('[data-spcomplete]'); if (cp) return completeSprint(cp.dataset.spcomplete);
    const es = t.closest('[data-editsprint]'); if (es) return sprintForm(es.dataset.editsprint);
    if (t.closest('.btn') || t.closest('select') || t.closest('input')) return;
    const op = t.closest('[data-open]'); if (op) return openIssue(op.dataset.open);
    const cd = t.closest('.card,.row');   if (cd && cd.dataset.id) return openIssue(cd.dataset.id);
  });

  addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'c' && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.target.isContentEditable
        && !$('#scrim').classList.contains('on')) { e.preventDefault(); newIssueForm(); }
  });
  wireKeys();

  /* ---- sürükle-bırak ---- */
  const view = $('#view');
  view.addEventListener('dragstart', e => {
    if (!canEdit()) { e.preventDefault(); return; }
    const el = e.target.closest('.card,.row'); if (!el) return;
    DRAG = el.dataset.id; el.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG);
  });
  view.addEventListener('dragend', e => { DRAG = null;
    $$('.drag').forEach(x => x.classList.remove('drag')); $$('.over').forEach(x => x.classList.remove('over')); });
  view.addEventListener('dragover', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !DRAG) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    $$('.over').forEach(x => x.classList.remove('over'));
    (z.closest('.col') || z).classList.add('over');
  });
  view.addEventListener('drop', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !DRAG) return;
    e.preventDefault();
    const i = issue(DRAG); if (!i) return;
    if (z.dataset.drop === 'status') {
      i.rank = dropIndexRank(z, e.clientY, '.card');
      setStatus(i, z.dataset.status);
      const act = activeSprint();
      if (act && !i.sprintId && DB.board.scope !== 'all') i.sprintId = act.id;
    } else {
      const to = z.dataset.sprint || null;
      if (i.sprintId !== to) logHist(i, 'Sprint', i.sprintId ? sprint(i.sprintId).name : 'Backlog', to ? sprint(to).name : 'Backlog');
      i.sprintId = to;
      i.rank = dropIndexRank(z, e.clientY, '.row');
    }
    DRAG = null; save(); render();
  });

  /* ---- veri taşıma ---- */
  $('#btnExport').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }));
    a.download = `pano-${TODAY}.json`; a.click(); URL.revokeObjectURL(a.href);
    toast('Veri dışa aktarıldı');
  };
  $('#btnKeys').onclick = () => palette();
  $('#btnMerge').onclick = () => $('#mergeIn').click();
  $('#mergeIn').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const inc = extractData(String(r.result));
      if (!inc || !inc.issues) return toast('Dosya okunamadı — Pano JSON’u ya da kayıtlı HTML seçin');
      mergeDialog(inc, f.name);
    };
    r.readAsText(f);
  };
  $('#btnImport').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { DB = JSON.parse(r.result); save(); boot(); toast('Veri içe aktarıldı'); }
      catch (err) { toast('Dosya okunamadı — geçerli bir Pano JSON’u seçin'); } };
    r.readAsText(f);
  };

}

  e.preventDefault(); e.returnValue = '';
});

function boot() {
  ensureSchema();
  ensureAccounts();
  if (location.hash.slice(1) in VIEWS) DB.ui.view = location.hash.slice(1);
  if (DB.cfg) { H_PER_DAY = DB.cfg.h || 8; D_PER_WEEK = DB.cfg.d || 5; }
  DB.issues.forEach(i => { if (i.remainingEst == null) i.remainingEst = Math.max(0, (i.estimate || 0) - (i.spent || 0)); });
  $('#projSel').innerHTML = DB.projects.map(p =>
    `<option value="${p.id}" ${p.id === DB.ui.project ? 'selected' : ''}>${p.key} — ${esc(p.name)}</option>`).join('');
  if (location.hash.slice(1) in VIEWS) DB.ui.view = location.hash.slice(1);
  render();
}

/* ============================================================
   1) SORGU DİLİ  —  PQL
   örn:  durum != Bitti AND atanan = "Elif Demir" ORDER BY oncelik ASC
   ============================================================ */
const QF = {
  key:        { g: i => i.key },
  ozet:       { g: i => i.summary },
  aciklama:   { g: i => i.description },
  metin:      { g: i => i.summary + ' ' + i.description },
  tip:        { g: i => TYPE[i.type][2], alt: i => i.type },
  durum:      { g: i => stat(i.statusId).name },
  kategori:   { g: i => ({ todo: 'Yapılacak', inprogress: 'Devam', done: 'Bitti' })[stat(i.statusId).cat], alt: i => stat(i.statusId).cat },
  atanan:     { g: i => user(i.assignee)?.name || '', empty: i => !i.assignee },
  raporlayan: { g: i => user(i.reporter)?.name || '' },
  oncelik:    { g: i => i.priority, t: 'num', map: v => { const n = +v; if (!isNaN(n)) return n;
                  const k = Object.keys(PRI).find(k => PRI[k][1].toLowerCase() === String(v).toLowerCase()); return k ? +k : v; } },
  puan:       { g: i => i.points, t: 'num', empty: i => i.points == null },
  tahmin:     { g: i => i.estimate, t: 'dur' },
  harcanan:   { g: i => i.spent, t: 'dur' },
  kalan:      { g: i => remaining(i), t: 'dur' },
  sprint:     { g: i => i.sprintId ? sprint(i.sprintId).name : '', empty: i => !i.sprintId },
  epik:       { g: i => i.epicId ? issue(i.epicId).summary : '', empty: i => !i.epicId },
  etiket:     { g: i => i.labels || [], t: 'list', empty: i => !(i.labels || []).length },
  bitis:      { g: i => i.due, t: 'date', empty: i => !i.due },
  baslangic:  { g: i => i.start, t: 'date', empty: i => !i.start },
  plangun:    { g: i => planDays(i), t: 'num' },
  proje:      { g: i => DB.projects.find(p => p.id === i.projectId).key },
  fatura:     { g: i => billOf(i) },
  faturaturu: { g: i => btypeOf(i) },
};
const qfield = name => {
  const k = name.toLowerCase().replace(/[ıİ]/g, 'i').replace(/[şŞ]/g, 's').replace(/[çÇ]/g, 'c').replace(/[ğĞ]/g, 'g').replace(/[üÜ]/g, 'u').replace(/[öÖ]/g, 'o');
  if (QF[k]) return QF[k];
  const f = DB.fields.find(f => f.key.toLowerCase() === k);
  if (f) return { g: i => i.cf?.[f.id] ?? '', t: f.type === 'number' ? 'num' : f.type === 'date' ? 'date' : 'str',
                  empty: i => i.cf?.[f.id] === '' || i.cf?.[f.id] == null };
  return null;
};

function tokenize(q) {
  const re = /\s*(?:("(?:[^"\\]|\\.)*")|(\()|(\))|(>=|<=|!=|!~|=|~|>|<)|(\d+(?:[.,]\d+)?\s*[wdhm](?:\s*\d+(?:[.,]\d+)?\s*[wdhm])*)\b|([A-Za-zÇĞİÖŞÜçğıöşü_][\w\-ÇĞİÖŞÜçğıöşü]*(?:\(\))?)|(-?\d+(?:[.,]\d+)?)|(,))/gy;
  const out = [];
  while (re.lastIndex < q.length) {
    const at = re.lastIndex;              // sticky regex başarısız olunca lastIndex sıfırlanır
    const m = re.exec(q);
    if (!m) {
      if (q.slice(at).trim() === '') break;
      throw new Error('Anlaşılmayan ifade: ' + q.slice(at, at + 16));
    }
    if (m[1]) out.push({ t: 'val', v: m[1].slice(1, -1).replace(/\\"/g, '"'), q: true });
    else if (m[2]) out.push({ t: '(' });
    else if (m[3]) out.push({ t: ')' });
    else if (m[4]) out.push({ t: 'op', v: m[4] });
    else if (m[5]) out.push({ t: 'val', v: parseDur(m[5]), num: true, dur: true });
    else if (m[6]) { const w = m[6].toUpperCase();
      out.push(['AND', 'VE', 'OR', 'VEYA', 'NOT', 'DEGIL', 'IN', 'IS', 'EMPTY', 'BOS'].includes(w) ? { t: 'kw', v: m[6].toUpperCase() } : { t: 'val', v: m[6] }); }
    else if (m[7]) out.push({ t: 'val', v: m[7].replace(',', '.'), num: true });
    else if (m[8]) out.push({ t: ',' });
  }
  return out;
}

function parseQuery(q) {
  let order = null;
  q = q.replace(/\border\s+by\s+(\S+)(\s+(asc|desc))?\s*$/i, (_, f, __, d) => { order = { f, dir: (d || 'asc').toLowerCase() }; return ''; });
  const T = tokenize(q); let p = 0;
  const peek = () => T[p], eat = () => T[p++];
  const isKw = v => peek()?.t === 'kw' && peek().v === v;

  function valueTok() {
    const t = eat();
    if (!t || (t.t !== 'val')) throw new Error('Değer bekleniyordu');
    if (typeof t.v === 'string' && /^currentuser\(\)$/i.test(t.v)) return { v: CU().name, q: true };
    return { v: t.num ? parseFloat(t.v) : t.v, q: t.q, dur: t.dur };
  }
  const value = () => valueTok().v;
  function cond() {
    const nameTok = eat();
    if (!nameTok || nameTok.t !== 'val') throw new Error('Alan adı bekleniyordu');
    const F = qfield(nameTok.v);
    if (!F) throw new Error(`Bilinmeyen alan: ${nameTok.v}`);
    if (isKw('IS')) { eat();
      let neg = false; if (isKw('NOT') || isKw('DEGIL')) { eat(); neg = true; }
      if (!(isKw('EMPTY') || isKw('BOS'))) throw new Error('EMPTY bekleniyordu');
      eat();
      return i => { const e = F.empty ? F.empty(i) : !String(F.g(i) ?? '').length; return neg ? !e : e; };
    }
    if (isKw('IN')) { eat();
      if (peek()?.t !== '(') throw new Error('IN sonrası ( bekleniyordu'); eat();
      const vals = []; while (peek() && peek().t !== ')') { if (peek().t === ',') { eat(); continue; } vals.push(value()); }
      eat();
      return i => vals.some(v => cmp(F, i, '=', v));
    }
    const opTok = eat();
    if (!opTok || opTok.t !== 'op') throw new Error(`${nameTok.v} sonrası operatör bekleniyordu`);
    const vt = valueTok();
    /* tırnaksız bir alan adı yazıldıysa alan-alan karşılaştırması yapılır:
       harcanan > tahmin   →   her iş için kendi değerleri kıyaslanır.
       Sabit metin istiyorsanız tırnak kullanın: durum = "tahmin" */
    if (!vt.q && !vt.dur && typeof vt.v === 'string') {
      const RF = qfield(vt.v);
      if (RF) return i => cmp(F, i, opTok.v, RF.g(i));
    }
    return i => cmp(F, i, opTok.v, vt.v);
  }
  function factor() {
    if (isKw('NOT') || isKw('DEGIL')) { eat(); const f = factor(); return i => !f(i); }
    if (peek()?.t === '(') { eat(); const e = expr(); if (peek()?.t !== ')') throw new Error(') eksik'); eat(); return e; }
    return cond();
  }
  function term() { let l = factor();
    while (isKw('AND') || isKw('VE')) { eat(); const r = factor(); const p1 = l; l = i => p1(i) && r(i); } return l; }
  function expr() { let l = term();
    while (isKw('OR') || isKw('VEYA')) { eat(); const r = term(); const p1 = l; l = i => p1(i) || r(i); } return l; }

  const fn = T.length ? expr() : () => true;
  if (p < T.length) throw new Error('Beklenmeyen ifade sonu');
  return { fn, order };
}

function cmp(F, i, op, v) {
  let a = F.g(i);
  if (F.t === 'list') {
    const has = (a || []).some(x => String(x).toLowerCase() === String(v).toLowerCase());
    return op === '!=' ? !has : op === '~' ? (a || []).some(x => String(x).toLowerCase().includes(String(v).toLowerCase())) : has;
  }
  if (F.map) v = F.map(v);
  if (F.t === 'dur' && typeof v === 'string') v = parseDur(v);
  if (F.t === 'num' || F.t === 'dur') { a = +a; v = +v; }
  else if (F.t !== 'date') {
    const A = String(a ?? '').toLowerCase(), V = String(v ?? '').toLowerCase();
    const altOk = F.alt ? String(F.alt(i)).toLowerCase() === V : false;
    switch (op) {
      case '=':  return A === V || altOk;
      case '!=': return !(A === V || altOk);
      case '~':  return A.includes(V);
      case '!~': return !A.includes(V);
      default: throw new Error(`"${op}" bu alanda kullanılamaz`);
    }
  }
  switch (op) {
    case '=':  return a == v;   case '!=': return a != v;
    case '>':  return a > v;    case '<':  return a < v;
    case '>=': return a >= v;   case '<=': return a <= v;
    case '~':  return String(a).includes(String(v));
    default: throw new Error(`"${op}" desteklenmiyor`);
  }
}

function runQuery(q) {
  const { fn, order } = parseQuery(q.trim());
  let out = DB.issues.filter(fn);
  if (order) { const F = qfield(order.f);
    if (F) out.sort((a, b) => { const x = F.g(a), y = F.g(b);
      const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'tr');
      return order.dir === 'desc' ? -r : r; }); }
  return out;
}

/* ============================================================
   2) ÖZEL ALANLAR
   ============================================================ */
function cfShow(f, v) {
  if (v == null || v === '') return '—';
  if (f.type === 'checkbox') return v ? 'Evet' : 'Hayır';
  if (f.type === 'user') return user(v)?.name || '—';
  if (f.type === 'date') return fmtD(v);
  return String(v);
}
function cfInput(f, v) {
  const a = `class="inp" data-cf="${f.id}"`;
  switch (f.type) {
    case 'select':   return `<select ${a}><option value="">—</option>${(f.options || []).map(o =>
                       `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    case 'user':     return `<select ${a}><option value="">—</option>${DB.users.map(u =>
                       `<option value="${u.id}" ${u.id === v ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>`;
    case 'checkbox': return `<input type="checkbox" ${a} ${v ? 'checked' : ''} style="width:auto">`;
    case 'date':     return `<input type="date" ${a} value="${v || ''}">`;
    case 'number':   return `<input ${a} value="${v ?? ''}" inputmode="decimal" placeholder="—">`;
    default:         return `<input ${a} value="${esc(v ?? '')}" placeholder="—">`;
  }
}
const fieldsFor = () => DB.fields.filter(f => !f.projectId || f.projectId === DB.ui.project);

function cfPanel(i) {
  const fs = fieldsFor(); if (!fs.length) return '';
  return `<div class="sec">Özel alanlar</div><div class="kv">
    ${fs.map(f => `<span class="lb" title="${esc(f.key)}">${esc(f.name)}</span>${cfInput(f, i.cf?.[f.id])}`).join('')}
  </div>`;
}
