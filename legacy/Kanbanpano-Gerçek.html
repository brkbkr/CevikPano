/* ============================================================
   Bölüm 16: BİRLEŞTİRME
   Üç kişi ayrı kopyalarda çalışıp verileri birleştirebilsin diye,
   "üzerine yaz" yerine kayıt bazlı birleşme. Kurallar:
   • Süre kaydı, yorum, geçmiş, durum geçişi → yalnızca eklenir,
     asla çakışmaz (her birinin benzersiz id'si var).
   • İş, proje, kullanıcı gibi kayıtlar → id eşleşirse son
     değiştirilen kazanır (updatedAt).
   • Silmeler taşınmaz: bir tarafta silinen kayıt, diğer tarafta
     duruyorsa geri gelir. Bu bilinçli — veri kaybetmemek için.
   ============================================================ */

/* Değişiklik damgası: logHist zaten her alan değişiminde çağrılıyor. */
function stampIssue(i) { if (i) i.updatedAt = Date.now(); }

const MERGE_APPEND = ['worklogs', 'comments', 'history', 'transitions', 'links'];
const MERGE_BY_ID  = ['issues', 'projects', 'users', 'statuses', 'sprints', 'fields', 'rules', 'filters'];

function mergePreview(inc) {
  const r = { append: {}, add: {}, update: {}, skip: {}, total: 0 };
  MERGE_APPEND.forEach(k => {
    const have = new Set((DB[k] || []).map(x => x.id));
    const n = (inc[k] || []).filter(x => !have.has(x.id)).length;
    r.append[k] = n; r.total += n;
  });
  MERGE_BY_ID.forEach(k => {
    const mine = new Map((DB[k] || []).map(x => [x.id, x]));
    let add = 0, upd = 0, skip = 0;
    (inc[k] || []).forEach(x => {
      const cur = mine.get(x.id);
      if (!cur) add++;
      else if ((x.updatedAt || 0) > (cur.updatedAt || 0)) upd++;
      else skip++;
    });
    r.add[k] = add; r.update[k] = upd; r.skip[k] = skip; r.total += add + upd;
  });
  return r;
}

function applyMerge(inc) {
  MERGE_APPEND.forEach(k => {
    DB[k] ||= [];
    const have = new Set(DB[k].map(x => x.id));
    (inc[k] || []).forEach(x => { if (!have.has(x.id)) DB[k].push(x); });
  });
  MERGE_BY_ID.forEach(k => {
    DB[k] ||= [];
    const idx = new Map(DB[k].map((x, n) => [x.id, n]));
    (inc[k] || []).forEach(x => {
      const n = idx.get(x.id);
      if (n === undefined) DB[k].push(x);
      else if ((x.updatedAt || 0) > (DB[k][n].updatedAt || 0)) DB[k][n] = x;
    });
  });
  /* İş anahtarı sayaçları: iki tarafta da ilerlemiş olabilir. */
  DB.projects.forEach(p => {
    const used = DB.issues.filter(i => i.projectId === p.id)
      .map(i => parseInt(String(i.key).split('-').pop(), 10)).filter(n => !isNaN(n));
    p.counter = Math.max(p.counter || 0, ...used, 0);
  });
  /* Aynı anahtarı iki kişi birden kullanmışsa çakışanları yeniden numarala. */
  const seen = new Set();
  DB.issues.forEach(i => {
    if (!seen.has(i.key)) { seen.add(i.key); return; }
    const p = DB.projects.find(x => x.id === i.projectId);
    if (!p) return;
    i.key = `${p.code || p.key}-${++p.counter}`;
    seen.add(i.key);
  });
  /* Harcanan süreler süre kayıtlarından yeniden hesaplanır. */
  const spent = new Map();
  DB.worklogs.forEach(w => spent.set(w.issueId, (spent.get(w.issueId) || 0) + w.hours));
  DB.issues.forEach(i => { i.spent = spent.get(i.id) || 0; });
  save();
}

/* Bir dosyadan veri çıkar: .json ya da içine veri gömülmüş .html */
function extractData(text) {
  const t = text.trim();
  if (t.startsWith('{')) { try { return JSON.parse(t); } catch (e) { return null; } }
  const m = t.match(/<script id="pano-data"[^>]*>([\s\S]*?)<\/script>/);
  if (!m) return null;
  try { return JSON.parse(m[1].replace(/\\u003c/g, '<')); } catch (e) { return null; }
}

function mergeDialog(inc, name) {
  const r = mergePreview(inc);
  const line = (l, n, cls) => n ? `<div style="display:flex;gap:10px;padding:3px 0">
    <span class="chip ${cls}" style="width:64px;justify-content:center">${n}</span>
    <span style="font-size:12.5px">${l}</span></div>` : '';
  openModal(`<div class="m-h"><b>Veriyi birleştir</b>
      <span class="chip lbl">${esc(name || 'dosya')}</span>
      <button class="x" data-close>×</button></div>
    <div style="padding:16px 18px;max-height:56vh;overflow:auto">
      ${inc.savedAt ? `<div class="kv" style="margin-bottom:12px">
        <span class="lb">Kaydeden</span><span>${esc(inc.savedBy || '—')}</span>
        <span class="lb">Tarih</span><span>${fmtDT(inc.savedAt)}</span></div>` : ''}
      ${r.total ? `<div class="sec" style="margin-top:0">Eklenecek</div>
        ${line('süre kaydı', r.append.worklogs, 'cat-done')}
        ${line('yorum', r.append.comments, 'cat-done')}
        ${line('durum geçişi', r.append.transitions, 'cat-done')}
        ${line('değişiklik kaydı', r.append.history, 'cat-done')}
        ${line('bağlantı', r.append.links, 'cat-done')}
        ${line('yeni iş', r.add.issues, 'cat-done')}
        ${line('yeni proje', r.add.projects, 'cat-done')}
        ${line('yeni kullanıcı', r.add.users, 'cat-done')}
        ${line('yeni durum', r.add.statuses, 'cat-done')}
        <div class="sec">Güncellenecek</div>
        ${line('iş (karşı taraf daha yeni)', r.update.issues, 'cat-inprogress')}
        ${line('proje', r.update.projects, 'cat-inprogress')}
        ${line('kullanıcı', r.update.users, 'cat-inprogress')}
        ${line('durum', r.update.statuses, 'cat-inprogress')}
        ${r.skip.issues ? `<div class="sec">Dokunulmayacak</div>
          ${line('iş (seninki daha yeni ya da aynı)', r.skip.issues, 'lbl')}` : ''}`
      : '<div class="empty">Bu dosyada yeni bir şey yok — her şey zaten sende var.</div>'}
      <div style="margin-top:14px;padding:9px 11px;background:#FDF8EC;border:1px solid #F0E2C2;
        border-radius:6px;font-size:11.5px;color:#7A5A18;line-height:1.5">
        Birleştirme <b>hiçbir kaydı silmez</b>. Karşı tarafta silinmiş bir iş sende duruyorsa kalır.
        Aynı işi ikiniz de değiştirdiyse <b>son değiştirilen</b> kazanır.
      </div>
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button>
      ${r.total ? '<button class="btn pri" id="doMerge">Birleştir</button>' : ''}</div>`);
  const b = $('#doMerge');
  if (b) b.onclick = () => {
    applyMerge(inc);
    closeModal(); boot();
    toast(r.total + ' kayıt birleştirildi');
  };
}
