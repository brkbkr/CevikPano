# Bir ÇevikPano ortamı: uygulama + kendi veritabanı.
# Aynı sunucuda birden çok ortam (canlı, test) çalışabilir; her biri ayrı proje adıyla
# (docker compose -p <ad>) ve kendi .env dosyasıyla başlatılır, verileri birbirinden ayrıdır.
# Dışarıya (80/443) açılan tek servis ortak kapıdır: deploy/edge.yml (Caddy, otomatik HTTPS).
#
# Elle tek ortam: cp .env.example .env → düzenleyin →
#   docker network create pano-edge
#   docker compose up -d --build
#   PROD_DOMAIN=<alan> TEST_DOMAIN=test.<alan> docker compose -p pano-edge -f deploy/edge.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cevikpano
      POSTGRES_USER: cevikpano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cevikpano -d cevikpano"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cevikpano:${POSTGRES_PASSWORD}@db:5432/cevikpano
      PGSSL: disable
      PORT: "3000"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:?DEFAULT_USER_PASSWORD gerekli}
      # Ortam bilgisi (Sistem ekranında ve test şeridinde görünür)
      APP_ENV: ${APP_ENV:-production}
      APP_COMMIT: ${APP_COMMIT:-}
      APP_COMMIT_DATE: ${APP_COMMIT_DATE:-}
      APP_COMMIT_MSG: ${APP_COMMIT_MSG:-}
      PUBLIC_URL: https://${DOMAIN:-localhost}
      PEER_URL: ${PEER_URL:-}
      GITHUB_REPO: ${GITHUB_REPO:-brkbkr/CevikPano}
    networks:
      default: {}
      edge:
        aliases:
          - ${STACK:-cevikpano}-app

volumes:
  db-data:

networks:
  edge:
    name: pano-edge
    external: true
