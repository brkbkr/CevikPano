/* ---- satır içi düzenleme ---- */
function inlineEdit(f) {
  const i = curIssue(); if (!i || !canEdit()) return;
  if (ID_ED) idCommit();
  if (f === 'summary') {
    ID_ED = { part: 'title', f, start: String(i.summary || '') };
    $('#idT').innerHTML = `<div class="id-tedit"><input class="inp id-tin" id="idSumIn" maxlength="200" value="${esc(i.summary)}" aria-label="Başlık" autocomplete="off">
      <div class="id-err" id="idSumErr" role="alert"></div><div class="id-stalebox" id="idSumStale" hidden></div></div>`;
    const el = $('#idSumIn'); el.focus(); el.select();
  } else if (f === 'description') {
    ID_ED = { part: 'desc', f, start: String(i.description || '') };
    $('#idD').innerHTML = `<section class="id-sec"><div class="id-sh"><h3>${ic('backlog')}Açıklama</h3></div>
      <div class="id-box open"><textarea class="inp" id="idDescIn" rows="7" aria-label="Açıklama">${esc(i.description || '')}</textarea>
      <div class="id-stalebox" id="idDescStale" hidden></div>
      <div class="id-boxf"><span class="id-hint"><span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> kaydeder · <span class="kbd">Esc</span> vazgeçer</span>
        <button type="button" class="btn sm" id="idDescNo">Vazgeç</button><button type="button" class="btn sm pri" id="idDescOk">Kaydet</button></div></div></section>`;
    $('#idDescIn').focus();
  } else if (['points', 'estimate', 'remainingEst'].includes(f)) {
    if (f === 'remainingEst' && !canRemaining()) return;
    ID_ED = { part: 'props', f, start: String(i[f] ?? ''), val: f === 'points' ? (i.points ?? '') : f === 'estimate' ? fmtDur(i.estimate) : fmtDur(remaining(i)) };
    $('#idSide').innerHTML = issueProps(i);
    const el = $('#ie_' + f); el.focus(); el.select();
  }
}
/* Kaydet: true → kapandı; false → açık kaldı (hata ya da çakışma uyarısı). */
function idCommit(force) {
  const ed = ID_ED, i = curIssue(); if (!ed) return true;
  if (!i) { ID_ED = null; return true; }
  if (ed.f === 'summary') {
    const v = ($('#idSumIn')?.value || '').trim();
    if (!v) { const e = $('#idSumErr'); if (e) e.innerHTML = ic('alert') + 'Başlık boş olamaz. Kısa bir başlık yazın; Esc ile vazgeçin.'; $('#idSumIn')?.setAttribute('aria-invalid', 'true'); $('#idSumIn')?.focus(); return false; }
    if (String(i.summary) !== ed.start && !force && !ed.force) { idStale(i); return false; }
    ID_ED = null;
    if (v !== i.summary) { logHist(i, 'Özet', i.summary, v); i.summary = v; save(); RERENDER = true; }
    refreshIssue(['title', 'head', 'act']); return true;
  }
  if (ed.f === 'description') {
    const v = ($('#idDescIn')?.value || '').replace(/\s+$/, '');
    if (String(i.description || '') !== ed.start && !force && !ed.force) { idStale(i); return false; }
    ID_ED = null;
    if (v !== (i.description || '')) { logHist(i, 'Açıklama', i.description || '', v, { kind: 'edit' }); i.description = v; save(); RERENDER = true; }
    refreshIssue(['desc', 'act']); return true;
  }
  const v = $('#ie_' + ed.f)?.value ?? '';
  if (ed.f !== 'points' && v.trim() && !parseDur(v) && !/^0/.test(v.trim())) {
    const el = $('#ie_' + ed.f); el?.setAttribute('aria-invalid', 'true'); toast('Geçerli bir süre girin, örn. 3h 30m'); el?.focus(); return false;
  }
  ID_ED = null;
  const ch = idSet(i, ed.f, v);
  if (ch) idFlashSaved(ed.f);
  refreshIssue(ch ? ['all'] : ['props']);
  return true;
}
function idCancel() {
  const ed = ID_ED; if (!ed) return;
  ID_ED = null;
  refreshIssue([ed.part]);
  const back = ed.f === 'summary' ? '[data-ie="summary"]' : ed.f === 'description' ? '[data-ie="description"]' : `[data-ie="${ed.f}"]`;
  $('#scrim .modal.id-dlg')?.querySelector(back)?.focus({ preventScroll: true });
}
function idBlur(e) {
  const ed = ID_ED; if (!ed) return;
  const to = e.relatedTarget;
  if (ed.f === 'summary' && e.target.id === 'idSumIn') {
    if (to && to.closest('.id-tedit')) return;
    if (!($('#idSumIn').value || '').trim()) return;         // boşken dışarı: kaydetmez, hata yerinde kalır
    setTimeout(() => { if (ID_ED === ed) idCommit(); }, 0);
  } else if (ed.part === 'props' && e.target.dataset?.ief) {
    setTimeout(() => { if (ID_ED === ed) idCommit(); }, 0);
  }
}

/* ---- olaylar (kabuğa bir kez bağlanır; kayıt her seferinde issue(OPEN_ISSUE)) ---- */
function idClick(e) {
  const t = e.target, i = curIssue(); if (!i) return;
  const hit = s => t.closest(s);
  let b;
  if ((b = hit('[data-pm]'))) { e.preventDefault(); e.stopPropagation(); return propMenu(b.dataset.pm, b); }
  if ((b = hit('[data-ie]')) && !hit('input,textarea')) { e.stopPropagation(); return inlineEdit(b.dataset.ie); }
  if ((b = hit('[data-stale]'))) { e.stopPropagation(); if (b.dataset.stale === 'save') { ID_ED.force = true; idCommit(true); } else idCancel(); return; }
  if (hit('#idDescOk')) return idCommit();
  if (hit('#idDescNo')) return idCancel();
  if (hit('[data-copykey]')) return copyText(`${i.key} ${i.summary}`);
  if (hit('#logHere')) return worklogForm({ issueId: i.id });
  if ((b = hit('[data-next]'))) { if (idSet(i, 'statusId', b.dataset.next)) refreshIssue(['all']); return; }
  if ((b = hit('[data-feed]'))) { DB.ui.idFeed = b.dataset.feed; ID_MORE = 0; save(); refreshIssue(['act']); return; }
  if (hit('#idMoreFeed')) { ID_MORE++; return refreshIssue(['act']); }
  if (hit('#addSub')) return subTaskForm(i.id);
  if (hit('#addLink')) return linkForm(i.id);
  if ((b = hit('[data-subdone]'))) { e.stopPropagation(); const k = issue(b.dataset.subdone); if (!k) return;
    isDone(k) ? reopenIssue(k.id) : completeIssue(k.id); return refreshIssue(['all']); }
  if ((b = hit('[data-sublog]'))) return worklogForm({ issueId: b.dataset.sublog });
  if ((b = hit('[data-dellink]'))) { const l = DB.links.find(x => x.id === b.dataset.dellink); if (l) linkHist(l, 'remove');
    DB.links = DB.links.filter(x => x.id !== b.dataset.dellink); save(); RERENDER = true; return refreshIssue(['links', 'act']); }
  if ((b = hit('[data-dellabel]'))) { labelDel(i, b.dataset.dellabel); save(); RERENDER = true; return refreshIssue(['props', 'act']); }
  if ((b = hit('[data-cedit]'))) { ID_CEDIT = b.dataset.cedit; ID_ED = null; refreshIssue(['act']); ID_ED = { part: 'act', f: 'cmt' }; $('#ce_' + CSS.escape(ID_CEDIT))?.focus(); return; }
  if (hit('[data-ccancel]')) { ID_CEDIT = null; ID_ED = null; return refreshIssue(['act']); }
  if ((b = hit('[data-csave]'))) return idCmtSave(b.dataset.csave);
  if ((b = hit('[data-cdel]'))) return deleteComment(b.dataset.cdel);
  if (hit('#addCmt')) return idCmtAdd();
  if (hit('#cmtNo')) { ID_DRAFT.cmt = ''; ID_DRAFT.open = false; return refreshIssue(['act']); }
  if (hit('#newCmt') && !ID_DRAFT.open) { ID_DRAFT.open = true; const el = $('#newCmt'); el.rows = 3; el.closest('.id-cnew')?.classList.add('open'); }
}
function idCmtAdd() {
  const i = curIssue(), el = $('#newCmt'); if (!i || !el || !canEdit()) return;
  const v = el.value.trim(); if (!v) return el.focus();
  DB.comments.push({ id: uid('c'), issueId: i.id, userId: CU().id, at: Date.now(), body: v });

function idCmtSave(id) {

function idKey(e) {
  const t = e.target, i = curIssue(); if (!i) return;
  const ctrlEnter = e.key === 'Enter' && (e.ctrlKey || e.metaKey);
  if (t.id === 'idSumIn') {
    if (e.key === 'Enter') { e.preventDefault(); idCommit(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); idCancel(); }
    return;
  }
  if (t.id === 'idDescIn') {
    if (ctrlEnter) { e.preventDefault(); idCommit(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); idCancel(); }
    return;
  }
  if (t.dataset?.ief) {
    if (e.key === 'Enter') { e.preventDefault(); idCommit(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); idCancel(); }
    return;
  }
  if (t.id === 'newCmt') {
    if (ctrlEnter) { e.preventDefault(); idCmtAdd(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ID_DRAFT.open = false; if (!t.value) { refreshIssue(['act']); } t.blur(); $('#scrim .modal.id-dlg')?.focus({ preventScroll: true }); }
    return;
  }
  if (t.id?.startsWith('ce_')) {
    if (ctrlEnter) { e.preventDefault(); idCmtSave(t.id.slice(3)); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); ID_CEDIT = null; ID_ED = null; refreshIssue(['act']); }
    return;
  }
  if (t.id === 'subIn' || t.id === 'subEst') {
    if (e.key === 'Enter') { e.preventDefault(); subInlineAdd(i); }
    else if (e.key === 'Escape' && (t.value || $('#subIn').value)) { e.preventDefault(); e.stopPropagation(); $('#subIn').value = ''; $('#subEst').value = ''; }
    return;
  }
  if (t.id === 'newLabel' && e.key === 'Enter') {
    e.preventDefault(); const v = t.value.trim(); if (!v) return;
    labelAdd(i, v); save(); RERENDER = true; refreshIssue(['props', 'act']); $('#newLabel')?.focus();
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && t.dataset?.ie && t.getAttribute('role') === 'button') { e.preventDefault(); inlineEdit(t.dataset.ie); }
}
function idChange(e) {
  const t = e.target, i = curIssue(); if (!i) return;
  if (t.dataset?.cf) {
    const f = DB.fields.find(x => x.id === t.dataset.cf); if (!f) return;
    const v = f.type === 'checkbox' ? t.checked : f.type === 'number' ? (t.value === '' ? '' : parseFloat(t.value.replace(',', '.'))) : t.value;
    i.cf ||= {};
    logHist(i, f.name, cfShow(f, i.cf[f.id]), cfShow(f, v));

    if (msg) { ID_DERR = { f, v, msg }; refreshIssue(['props']); return; }
    ID_DERR = null;

    if (before !== v) { logHist(i, ID_LABEL[f], histName(f, before), histName(f, v)); i[f] = v; save(); RERENDER = true; idFlashSaved(f); }
    refreshIssue(['props', 'act']);

    .filter(x => x.offsetParent !== null || x === document.activeElement);

/* Kalan tahminin süre kaydından sonraki değeri */
function nextRemaining(i, hours, mode, value) {
  const cur = remaining(i);
  if (mode === 'leave') return cur;
  if (mode === 'set') return Math.max(0, value || 0);
  if (mode === 'reduce') return Math.max(0, cur - (value || 0));
  return Math.max(0, cur - hours);          // auto
}

/* ============================ TALEP EDEN + TALEP HAVUZU (görev 12, E1) ============================
   issues.data.requester = {customerId, contactId}: etkin bir carinin yetkili kişisi. 'talep' şablonlu projede zorunlu,
   cari bağlı diğer projelerde isteğe bağlı, diğerlerinde gizli. Raporlayan (kullanıcı) ayrı alandır, değişmez.
   Kural ve yetki sunucuda (store.js checkRequester, POST /api/customers/:id/contacts); burası yalnız deneyim. */
const isTalep = p => p?.template === 'talep';
const reqMode = p => (isTalep(p) ? 'req' : p?.customerId ? 'opt' : '');
const reqVal = r => (r && r.customerId && r.contactId ? `${r.customerId}|${r.contactId}` : '');
const reqParse = v => { const [customerId, contactId] = String(v || '').split('|'); return customerId && contactId ? { customerId, contactId } : null; };
const custShort = c => (c ? c.shortName || c.name || '' : '');
/* Seçilebilir kişiler: etkin carilerin yetkili kişileri; projenin carisi önce. */
function reqPeople(pr) {
  const cs = (DB.customers || []).filter(c => c && c.active !== false)
    .sort((a, b) => (b.id === pr?.customerId) - (a.id === pr?.customerId) || custShort(a).localeCompare(custShort(b), 'tr'));
  const out = [];
  for (const c of cs) for (const p of Array.isArray(c.contacts) ? c.contacts : []) if (p && p.id && p.name) out.push({ c, p });
  return out;
}
function reqInfo(r) {
  if (!r || !r.customerId) return null;
  const c = (DB.customers || []).find(x => x.id === r.customerId);
  const p = c && Array.isArray(c.contacts) ? c.contacts.find(x => x && x.id === r.contactId) : null;
  return { c, p };
}
const reqName = r => { const x = reqInfo(r); return !x ? '' : x.p ? `${x.p.name} — ${custShort(x.c)}` : 'Silinmiş kişi'; };
/* Kimden adresiyle eşleşen kişi (harf duyarsız). */
function reqByEmail(em) {
  const k = String(em || '').trim().toLowerCase(); if (!k) return null;
  const hit = reqPeople().find(({ p }) => String(p.email || '').trim().toLowerCase() === k);
  return hit ? { customerId: hit.c.id, contactId: hit.p.id } : null;
}
/* "Ad Soyad <ad@ornek.com>" ya da yalnız adres. */
function parseFrom(s) {
  s = String(s || '').trim();
  const m = /^(.*?)<\s*([^<>\s]+@[^<>\s]+)\s*>\s*$/.exec(s);
  if (m) return { name: m[1].replace(/^["'\s]+|["'\s]+$/g, ''), email: m[2] };
  const e = /[^\s<>"',;]+@[^\s<>"',;]+\.[^\s<>"',;]+/.exec(s);
  return { name: '', email: e ? e[0] : '' };
}
const reqBtnHtml = r => { const x = reqInfo(r);
  return !x ? `<span class="c-av none">${ic('userx')}</span><span class="t">Seçilmedi</span>${ic('down')}`
    : x.p ? `<span class="c-av none">${ic('building')}</span><span class="t">${esc(x.p.name)} <small>— ${esc(custShort(x.c))}</small></span>${ic('down')}`

function reqList(cur, required, pr) {

    const rows = reqPeople(pr).filter(hit).slice(0, 200).map(({ c, p }) => pmOpt(`${c.id}|${p.id}`, cur, `<span class="c-av none">${ic('building')}</span>`,

}
/* Seçici: tek kapı (yeni iş, iş detayı, e-postadan talep). */

/* Sunucunun döndürdüğü cari kaydını yerel veriye ve SNAP'e yazar (üye cariyi /api/sync ile gönderemez). */
function reqStoreCustomer(d) {
  if (!d || !d.id) return;
  const arr = (DB.customers ||= []), k = arr.findIndex(x => x && x.id === d.id);
  if (k >= 0) { const o = arr[k]; for (const key of Object.keys(o)) delete o[key]; Object.assign(o, d); } else arr.push(d);
  if (SNAP) (SNAP.rec.customers ||= new Map()).set(String(d.id), cj(d));
}

/* Proje sekmeleri, soldan sağa (docs/tasarim/gezinme). Hangisinin görüneceğine viewAllowed karar verir. */
const PROJ_TABS = ['board', 'sprint', 'backlog', 'plan', 'roadmap', 'timesheet', 'effort', 'reports', 'search', 'admin'];
const TAB_IC = { board: 'board', sprint: 'sprint', backlog: 'backlog', plan: 'plan', roadmap: 'roadmap', timesheet: 'clock', effort: 'effort',
  reports: 'reports', search: 'search', admin: 'settings' };
/* Görünürlük için tek kural: render (adres elle yazılsa da), sekmeler, sol menü ve hesap menüsü bunu kullanır.
   Yetki sunucuda; bu yalnız kullanıcı deneyimi içindir. */
function viewAllowed(v) {
  if (!VIEWS[v]) return false;
  if (v === 'roadmap') return MOD('epic');
  if (v === 'sprint') return AGILE();                             // Pano türündeki projede sekme yok
  if (v === 'pool') return poolProjects().length > 0;            // talep projesi yoksa havuz yok (görev 12)
  if (v === 'users' || v === 'system' || v === 'customers') return isAdmin();
  if (v === 'admin') return isAdmin() || (!!P() && wsRole(CU(), wsOf(P())) === 'admin');   // proje ayarları: alan yöneticisi (22b)
  if (v === 'workspace') return !!wsById(DB.ui.workspace) && !!wsRole(CU(), DB.ui.workspace);
  return true;
}

function render() {

/* Proje sekmeleri: yalnız proje ekranında ve seçili proje varken. Değişmediyse DOM'a dokunulmaz (odak, kaydırma). */
let TABS_KEY = '';
function renderTabs() {
  const bar = $('#tabbar'), tl = $('#vtabs'), pr = P();
  const cur = VIEWS[DB.ui.view] ? DB.ui.view : 'board';
  const show = VIEWS[cur].s === 'proj' && !!pr;
  bar.hidden = !show;
  const view = $('#view');
  if (!show) {
    if (TABS_KEY) { TABS_KEY = ''; tl.innerHTML = ''; }
    view.removeAttribute('role'); view.removeAttribute('aria-labelledby');
    return;
  }
  const tabs = PROJ_TABS.filter(viewAllowed);
  const key = cur + '|' + tabs.map(t => t + ':' + viewTitle(t)).join('|');
  if (key !== TABS_KEY) {
    const hadFocus = tl.contains(document.activeElement);
    TABS_KEY = key;
    tl.innerHTML = tabs.map(t => `<button type="button" class="nv-tab" role="tab" id="tab-${t}" data-v="${t}" aria-controls="view"
      aria-selected="${t === cur}" tabindex="${t === cur ? 0 : -1}">${ic(TAB_IC[t])}<span>${esc(viewTitle(t))}</span></button>`).join('');
    if (hadFocus) tl.querySelector('[aria-selected="true"]')?.focus({ preventScroll: true });
  }
  view.setAttribute('role', 'tabpanel'); view.setAttribute('aria-labelledby', 'tab-' + cur);
  tabReveal(tl.querySelector('[aria-selected="true"]'));
}
/* Dar ekranda sekme satırı yana kayar: verilen sekme görünür alana (yalnız scrollLeft; sayfa kaymaz). */
function tabReveal(t) {
  const tl = $('#vtabs'); if (!t || tl.scrollWidth <= tl.clientWidth) return;
  const l = t.offsetLeft, r = l + t.offsetWidth;
  if (l < tl.scrollLeft || r > tl.scrollLeft + tl.clientWidth) tl.scrollLeft = Math.max(0, l - (tl.clientWidth - t.offsetWidth) / 2);
}
/* Sekmelerde klavye: ←/→ (sarar), Home/End odağı taşır; Enter/Boşluk açar (elle etkinleştirme). */
function tabKeys(e) {
  const items = [...$('#vtabs').querySelectorAll('[role="tab"]')], k = items.indexOf(document.activeElement);
  if (k < 0) return;
  const to = { ArrowRight: k + 1, ArrowLeft: k - 1, Home: 0, End: items.length - 1 }[e.key];
  if (to !== undefined) {
    e.preventDefault();
    const t = items[(to + items.length) % items.length];
    items.forEach(x => x.tabIndex = x === t ? 0 : -1);
    t.focus({ preventScroll: true }); tabReveal(t);
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); items[k].click(); }
}

      if (nav) { if (VIEWS[DB.ui.view]?.s !== 'proj') DB.ui.view = 'board'; const p = P(); if (p) wsOpenSet(wsOf(p), true); navDrawer(false); }
      closeModal(); save(); render(); return; }
    const ac2 = t.closest('[data-act]');
    if (ac2) { closeModal();
      if (ac2.dataset.act === 'savefile') { closeModal(); return flushSync().then(() => toast(SYNC_STATE === 'ok' ? 'Kaydedildi' : 'Kaydedilemedi, tekrar denenecek')); }
      if (ac2.dataset.act === 'pw') { closeModal(); return changePwForm(false); }

      if (b2) b2.click(); return; }
    const cp2 = t.closest('[data-complete]');
    if (cp2 && cp2.dataset.complete) { e.stopPropagation(); return completeIssue(cp2.dataset.complete, !!cp2.closest('.hm-row')); }
    const ro = t.closest('[data-reopen]');

    if (dt) { DB.ui.doneOpen ||= {}; DB.ui.doneOpen[dt.dataset.donetgl] = !DB.ui.doneOpen[dt.dataset.donetgl]; save(); return render(); }
    const ew = t.closest('[data-editwl]');

    const cell = t.closest('[data-cell]');
    if (cell) {
      const id = cell.dataset.cell, date = cell.dataset.date, byUser = DB.ui.tsMode === 'user';
      const logs = DB.worklogs.filter(w => w.date === date && tsScopeOk(w)
        && (byUser ? w.userId === id : w.issueId === id));
      if (!logs.length) return canEdit()
        ? (byUser ? logWorkForm(null, id, date) : logWorkForm(id, null, date))
        : toast('Bu güne kayıt girilmemiş');
      const who = byUser ? user(id)?.name : issue(id)?.key + ' — ' + issue(id)?.summary;
      return showLogs(who, fmtD(date), logs,
        { userId: byUser ? id : null, issueId: byUser ? null : id, date });
    }
    const del = t.closest('[data-delwl]');
    if (del) { e.stopPropagation(); return deleteWorklog(del.dataset.delwl); }
    const di = t.closest('[data-del]');
    if (di) return issueDelete([di.dataset.del]);
    const ds = t.closest('[data-delsprint]');
    if (ds) { const id = ds.dataset.delsprint;
      DB.issues.forEach(i => { if (i.sprintId === id) histSet(i, 'sprintId', null); });
      DB.sprints = DB.sprints.filter(s => s.id !== id);
      closeModal(); save(); render(); return; }
    const st = t.closest('[data-start]');   if (st) return startSprint(st.dataset.start);
    const cp = t.closest('[data-spcomplete]'); if (cp) return completeSprint(cp.dataset.spcomplete);
    const es = t.closest('[data-editsprint]'); if (es) return sprintForm(es.dataset.editsprint);
    if (t.closest('.btn') || t.closest('select') || t.closest('input')) return;
    const op = t.closest('[data-open]'); if (op) return openIssue(op.dataset.open);
    const cd = t.closest('.card,.row');   if (cd && cd.dataset.id) return openIssue(cd.dataset.id);
  });

  addEventListener('keydown', e => {
    /* Esc önce menüyü/düzenleyiciyi kapatır (onlar olayı tüketir), sonra pencereyi. */
    if (e.key === 'Escape') {
      if (e.defaultPrevented || QM) return;
      if (ID_ED && !$('#scrim2.on')) return idCancel();
      closeModal();
    }
    if (e.key === 'c' && !e.ctrlKey && !e.metaKey && canEdit() && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.target.isContentEditable
        && !$('#scrim').classList.contains('on')) { e.preventDefault(); newIssueForm(); }
  });
  wireKeys();

  /* ---- sürükle-bırak ---- */
  const view = $('#view');
  view.addEventListener('dragstart', e => {
    if (!canEdit()) { e.preventDefault(); return; }
    const el = e.target.closest('.card,.row'); if (!el) return;
    DRAG = el.dataset.id; el.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG);
  });
  view.addEventListener('dragend', e => { DRAG = null;
    $$('.drag').forEach(x => x.classList.remove('drag')); $$('.over').forEach(x => x.classList.remove('over')); });
  view.addEventListener('dragover', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !DRAG) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    $$('.over').forEach(x => x.classList.remove('over'));
    (z.closest('.col') || z).classList.add('over');
  });
  view.addEventListener('drop', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !DRAG) return;
    e.preventDefault();
    const i = issue(DRAG); if (!i) return;
    if (z.dataset.drop === 'status') {
      i.rank = dropIndexRank(z, e.clientY, '.card');
      setStatus(i, z.dataset.status);
      const act = activeSprint();
      if (act && AGILE() && !i.sprintId && DB.board.scope !== 'all') histSet(i, 'sprintId', act.id);
    } else {
      const to = z.dataset.sprint || null;
      if (i.sprintId !== to) logHist(i, 'Sprint', i.sprintId ? sprint(i.sprintId).name : 'Backlog', to ? sprint(to).name : 'Backlog');
      i.sprintId = to;
      i.rank = dropIndexRank(z, e.clientY, '.row');
    }
    DRAG = null; save(); render();
  });

  /* ---- veri taşıma ---- */
  $('#btnExport').onclick = () => {
    if (!isAdmin()) return toast('Veri dışa aktarma yalnızca yöneticiler içindir');
    if (isAdmin()) { location.href = '/api/export'; return toast('Yedek indiriliyor'); }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }));
    a.download = `pano-${TODAY}.json`; a.click(); URL.revokeObjectURL(a.href);
    toast('Veri dışa aktarıldı');
  };
  $('#btnKeys').onclick = () => palette();
  $('#btnMerge').onclick = () => { if (!isAdmin()) return toast('Birleştirme yalnızca yöneticiler içindir'); $('#mergeIn').click(); };
  $('#mergeIn').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const inc = extractData(String(r.result));
      if (!inc || !inc.issues) return toast('Dosya okunamadı — Pano JSON’u ya da kayıtlı HTML seçin');
      mergeDialog(inc, f.name);
    };
    r.readAsText(f);
  };
  $('#btnImport').onclick = () => {
    if (!isAdmin()) return toast('İçe aktarma yalnızca yöneticiler içindir');
    if (!confirm('İçe aktarılan dosya sunucudaki TÜM verinin yerini alacak. Önce “Dışa aktar” ile yedek almanız önerilir. Devam edilsin mi?')) return;
    $('#fileIn').click();
  };
  $('#fileIn').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      const data = extractData(String(r.result));
      if (!data || !Array.isArray(data.issues)) return toast('Dosya okunamadı — geçerli bir Pano JSON’u seçin');
      toast('İçe aktarılıyor…');
      try {
        await flushAll();
        const st = await API.post('/api/import', { data });
        await reloadState();
        toast(`İçe aktarıldı: ${st.issues || 0} iş, ${st.worklogs || 0} süre kaydı, ${st.newUsers || 0} yeni kullanıcı` +
          (st.fixedKeys ? ` · ${st.fixedKeys} çift iş numarası düzeltildi` : '') + ' · önceki hâlin yedeği alındı');
      } catch (err) { toast('İçe aktarılamadı: ' + err.message); }
    };
    r.readAsText(f);
  };

}

const MODULE_DEFAULTS = { sprint: false, epic: false, points: false, reporter: false };
const MODULE_LABELS = {
  sprint:   ['Sprint & backlog planlama', 'Sprint kutuları, sprint başlat/tamamla, burndown ve hız raporu'],
  epic:     ['Epik & yol haritası', 'Epik tipi, epik etiketi ve yol haritası ekranı'],

  reporter: ['Raporlayan', 'İşi kimin açtığı bilgisi'],
};
const MOD = k => DB?.cfg?.modules?.[k] === true;
/* Proje türü (#12): 'board' (Pano: kolonlar, sprint yok) | 'agile' (backlog + sprintler). Türü olmayan
   (eski) proje genel sprint ayarından hesaplanır; kayda yazılmaz. Sunucudaki projType ile aynı. */
const PROJECT_TYPES = ['board', 'agile'];
const projType = p => PROJECT_TYPES.includes(p?.type) ? p.type : (MOD('sprint') ? 'agile' : 'board');
const AGILE = () => projType(P()) === 'agile';

/* Ekran başlığı türe göre: Pano türünde backlog "İş listesi" olur (adres aynı kalır). */

/* ============================================================
   1) SORGU DİLİ  —  PQL
   örn:  durum != Bitti AND atanan = "Elif Demir" ORDER BY oncelik ASC
   ============================================================ */
const QF = {
  key:        { g: i => i.key },
  ozet:       { g: i => i.summary },
  aciklama:   { g: i => i.description },
  metin:      { g: i => i.summary + ' ' + i.description },
  tip:        { g: i => TYPE[i.type][2], alt: i => i.type },
  durum:      { g: i => stat(i.statusId).name },
  kategori:   { g: i => ({ todo: 'Yapılacak', inprogress: 'Devam', done: 'Bitti' })[stat(i.statusId).cat], alt: i => stat(i.statusId).cat },
  atanan:     { g: i => user(i.assignee)?.name || '', empty: i => !i.assignee },
  raporlayan: { g: i => user(i.reporter)?.name || '' },
  oncelik:    { g: i => lvl(i.priority), t: 'num', map: v => { const n = +v; if (!isNaN(n)) return n;
                  const w = priKey(v), k = LVLS.find(k => priKey(PRI[k][1]) === w); return k || PRI_ALIAS[w] || v; } },
  puan:       { g: i => i.points, t: 'num', empty: i => i.points == null },
  tahmin:     { g: i => i.estimate, t: 'dur' },
  harcanan:   { g: i => i.spent, t: 'dur' },
  kalan:      { g: i => remaining(i), t: 'dur' },
  sprint:     { g: i => i.sprintId ? sprint(i.sprintId).name : '', empty: i => !i.sprintId },
  epik:       { g: i => i.epicId ? issue(i.epicId).summary : '', empty: i => !i.epicId },
  etiket:     { g: i => i.labels || [], t: 'list', empty: i => !(i.labels || []).length },
  bitis:      { g: i => i.due, t: 'date', empty: i => !i.due },
  baslangic:  { g: i => i.start, t: 'date', empty: i => !i.start },
  plangun:    { g: i => planDays(i), t: 'num' },
  proje:      { g: i => DB.projects.find(p => p.id === i.projectId).key },
  fatura:     { g: i => billOf(i) },
  faturaturu: { g: i => btypeOf(i) },
  cari:       { g: i => customerOf(i) },
};
/* Öncelik adları büyük/küçük harf ve ı/i farkı gözetmeden; eski adlar takma ad. */
const priKey = v => String(v).toLocaleLowerCase('tr').replace(/ı/g, 'i').trim();
const PRI_ALIAS = { kritik: 1, onemsiz: 4, 'önemsiz': 4, dusuk: 4, yuksek: 2 };
const qfield = name => {
  const k = name.toLowerCase().replace(/[ıİ]/g, 'i').replace(/[şŞ]/g, 's').replace(/[çÇ]/g, 'c').replace(/[ğĞ]/g, 'g').replace(/[üÜ]/g, 'u').replace(/[öÖ]/g, 'o');
  if (QF[k]) return QF[k];
  const f = liveFields().find(f => f.key.toLowerCase() === k);
  if (f) return { g: i => i.cf?.[f.id] ?? '', t: f.type === 'number' ? 'num' : f.type === 'date' ? 'date' : 'str',
                  empty: i => i.cf?.[f.id] === '' || i.cf?.[f.id] == null };
  return null;
};

function tokenize(q) {
  const re = /\s*(?:("(?:[^"\\]|\\.)*")|(\()|(\))|(>=|<=|!=|!~|=|~|>|<)|(\d+(?:[.,]\d+)?\s*[wdhm](?:\s*\d+(?:[.,]\d+)?\s*[wdhm])*)\b|([A-Za-zÇĞİÖŞÜçğıöşü_][\w\-ÇĞİÖŞÜçğıöşü]*(?:\(\))?)|(-?\d+(?:[.,]\d+)?)|(,))/gy;
  const out = [];
  while (re.lastIndex < q.length) {
    const at = re.lastIndex;              // sticky regex başarısız olunca lastIndex sıfırlanır
    const m = re.exec(q);
    if (!m) {
      if (q.slice(at).trim() === '') break;
      throw new Error('Anlaşılmayan ifade: ' + q.slice(at, at + 16));
    }
    if (m[1]) out.push({ t: 'val', v: m[1].slice(1, -1).replace(/\\"/g, '"'), q: true });
    else if (m[2]) out.push({ t: '(' });
    else if (m[3]) out.push({ t: ')' });
    else if (m[4]) out.push({ t: 'op', v: m[4] });
    else if (m[5]) out.push({ t: 'val', v: parseDur(m[5]), num: true, dur: true });
    else if (m[6]) { const w = m[6].toUpperCase();
      out.push(['AND', 'VE', 'OR', 'VEYA', 'NOT', 'DEGIL', 'IN', 'IS', 'EMPTY', 'BOS'].includes(w) ? { t: 'kw', v: m[6].toUpperCase() } : { t: 'val', v: m[6] }); }
    else if (m[7]) out.push({ t: 'val', v: m[7].replace(',', '.'), num: true });
    else if (m[8]) out.push({ t: ',' });
  }
  return out;
}

function parseQuery(q) {
  let order = null;
  q = q.replace(/\border\s+by\s+(\S+)(\s+(asc|desc))?\s*$/i, (_, f, __, d) => { order = { f, dir: (d || 'asc').toLowerCase() }; return ''; });
  const T = tokenize(q); let p = 0;
  const peek = () => T[p], eat = () => T[p++];
  const isKw = v => peek()?.t === 'kw' && peek().v === v;

  function valueTok() {
    const t = eat();
    if (!t || (t.t !== 'val')) throw new Error('Değer bekleniyordu');
    if (typeof t.v === 'string' && /^currentuser\(\)$/i.test(t.v)) return { v: CU().name, q: true };
    return { v: t.num ? parseFloat(t.v) : t.v, q: t.q, dur: t.dur };
  }
  const value = () => valueTok().v;
  function cond() {
    const nameTok = eat();
    if (!nameTok || nameTok.t !== 'val') throw new Error('Alan adı bekleniyordu');
    const F = qfield(nameTok.v);
    if (!F) throw new Error(`Bilinmeyen alan: ${nameTok.v}`);
    if (isKw('IS')) { eat();
      let neg = false; if (isKw('NOT') || isKw('DEGIL')) { eat(); neg = true; }
      if (!(isKw('EMPTY') || isKw('BOS'))) throw new Error('EMPTY bekleniyordu');
      eat();
      return i => { const e = F.empty ? F.empty(i) : !String(F.g(i) ?? '').length; return neg ? !e : e; };
    }
    if (isKw('IN')) { eat();
      if (peek()?.t !== '(') throw new Error('IN sonrası ( bekleniyordu'); eat();
      const vals = []; while (peek() && peek().t !== ')') { if (peek().t === ',') { eat(); continue; } vals.push(value()); }
      eat();
      return i => vals.some(v => cmp(F, i, '=', v));
    }
    const opTok = eat();
    if (!opTok || opTok.t !== 'op') throw new Error(`${nameTok.v} sonrası operatör bekleniyordu`);
    const vt = valueTok();
    /* tırnaksız bir alan adı yazıldıysa alan-alan karşılaştırması yapılır:
       harcanan > tahmin   →   her iş için kendi değerleri kıyaslanır.
       Sabit metin istiyorsanız tırnak kullanın: durum = "tahmin" */
    if (!vt.q && !vt.dur && typeof vt.v === 'string') {
      const RF = qfield(vt.v);
      if (RF) return i => cmp(F, i, opTok.v, RF.g(i));
    }
    return i => cmp(F, i, opTok.v, vt.v);
  }
  function factor() {
    if (isKw('NOT') || isKw('DEGIL')) { eat(); const f = factor(); return i => !f(i); }
    if (peek()?.t === '(') { eat(); const e = expr(); if (peek()?.t !== ')') throw new Error(') eksik'); eat(); return e; }
    return cond();
  }
  function term() { let l = factor();
    while (isKw('AND') || isKw('VE')) { eat(); const r = factor(); const p1 = l; l = i => p1(i) && r(i); } return l; }
  function expr() { let l = term();
    while (isKw('OR') || isKw('VEYA')) { eat(); const r = term(); const p1 = l; l = i => p1(i) || r(i); } return l; }

  const fn = T.length ? expr() : () => true;
  if (p < T.length) throw new Error('Beklenmeyen ifade sonu');
  return { fn, order };
}

function cmp(F, i, op, v) {
  let a = F.g(i);
  if (F.t === 'list') {
    const has = (a || []).some(x => String(x).toLowerCase() === String(v).toLowerCase());
    return op === '!=' ? !has : op === '~' ? (a || []).some(x => String(x).toLowerCase().includes(String(v).toLowerCase())) : has;
  }
  if (F.map) v = F.map(v);
  if (F.t === 'dur' && typeof v === 'string') v = parseDur(v);
  if (F.t === 'num' || F.t === 'dur') { a = +a; v = +v; }
  else if (F.t !== 'date') {
    const A = String(a ?? '').toLowerCase(), V = String(v ?? '').toLowerCase();
    const altOk = F.alt ? String(F.alt(i)).toLowerCase() === V : false;
    switch (op) {
      case '=':  return A === V || altOk;
      case '!=': return !(A === V || altOk);
      case '~':  return A.includes(V);
      case '!~': return !A.includes(V);
      default: throw new Error(`"${op}" bu alanda kullanılamaz`);
    }
  }
  switch (op) {
    case '=':  return a == v;   case '!=': return a != v;
    case '>':  return a > v;    case '<':  return a < v;
    case '>=': return a >= v;   case '<=': return a <= v;
    case '~':  return String(a).includes(String(v));
    default: throw new Error(`"${op}" desteklenmiyor`);
  }
}

function runQuery(q) {
  const { fn, order } = parseQuery(q.trim());
  let out = DB.issues.filter(fn);
  if (order) { const F = qfield(order.f);
    if (F) out.sort((a, b) => { const x = F.g(a), y = F.g(b);
      const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'tr');
      return order.dir === 'desc' ? -r : r; }); }
  return out;
}

/* ============================================================
   2) ÖZEL ALANLAR
   ============================================================ */
function cfShow(f, v) {
  if (v == null || v === '') return '—';
  if (f.type === 'checkbox') return v ? 'Evet' : 'Hayır';
  if (f.type === 'user') return user(v)?.name || '—';
  if (f.type === 'date') return fmtD(v);
  return String(v);
}
function cfInput(f, v) {
  const a = `class="inp" data-cf="${f.id}"`;
  switch (f.type) {
    case 'select':   return `<select ${a}><option value="">—</option>${(f.options || []).map(o =>
                       `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    case 'user':     return `<select ${a}><option value="">—</option>${DB.users.map(u =>
                       `<option value="${u.id}" ${u.id === v ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>`;
    case 'checkbox': return `<input type="checkbox" ${a} ${v ? 'checked' : ''} style="width:auto">`;
    case 'date':     return `<input type="date" ${a} value="${v || ''}">`;
    case 'number':   return `<input ${a} value="${v ?? ''}" inputmode="decimal" placeholder="—">`;
    default:         return `<input ${a} value="${esc(v ?? '')}" placeholder="—">`;
  }
}
/* Arşivlenmiş/gizli alanlar (ör. 005 geçişiyle cariye taşınan eski "Müşteri" alanı) hiçbir yerde gösterilmez;
   tanımı ve işlerdeki değerleri silinmez (eski sürüm açılırsa görür). */
const liveField = f => !!f && f.archived !== true && f.hidden !== true;
const liveFields = () => (DB.fields || []).filter(liveField);
const fieldsFor = () => liveFields().filter(f => !f.projectId || f.projectId === DB.ui.project);

/* ============================================================
   3) BAĞLANTILAR & ETİKETLER
   ============================================================ */
const LINKT = { blocks: ['engelliyor', 'engelleniyor'], relates: ['ilgili', 'ilgili'], duplicates: ['kopyası', 'kopyalanmış'] };
function linksOf(id) {
  return DB.links.filter(l => l.from === id || l.to === id).map(l => ({
    l, other: issue(l.from === id ? l.to : l.from), label: LINKT[l.type][l.from === id ? 0 : 1],
  })).filter(x => x.other);
}
/* ============================================================
   4) OTOMASYON
   ============================================================ */
const ACTS = {
  assign:   { l: 'Atananı değiştir',   pick: 'user' },
  priority: { l: 'Önceliği değiştir',  pick: 'pri' },
  label:    { l: 'Etiket ekle',        pick: 'text' },
  sprint:   { l: "Sprint'e taşı",      pick: 'sprint', mod: 'sprint' },
  status:   { l: 'Durumu değiştir',    pick: 'status' },
  comment:  { l: 'Yorum ekle',         pick: 'text' },
  due:      { l: 'Bitiş tarihi ver',   pick: 'days' },
  cf:       { l: 'Özel alanı ayarla',  pick: 'cf' },
};
const TRIGS = { created: 'İş oluşturulduğunda', status: 'Belirli bir duruma geçince', assigned: 'Atanan değişince' };

function runRules(i, trigger, ctx = {}) {
  if ((i.__d || 0) > 3) return;
  DB.rules.filter(r => r.enabled !== false && r.projectId === i.projectId && r.on === trigger).forEach(r => {
    if (r.on === 'status' && r.whenStatus && i.statusId !== r.whenStatus) return;
    const prev = RULE_CTX; RULE_CTX = r.name;   // iç içe kural (atama/durum) kendi adını yazar; sonra geri alınır
    (r.then || []).forEach(a => {
      i.__d = (i.__d || 0) + 1;
      switch (a.act) {
        case 'assign':   setAssignee(i, a.v || null); RULE_CTX = r.name; break;
        case 'priority': setPriority(i, a.v); break;
        case 'label':    labelAdd(i, a.v); break;
        case 'sprint':   if (projType(DB.projects.find(p => p.id === i.projectId)) === 'agile') histSet(i, 'sprintId', a.v || null); break;
        /* Hedef kolon bu projede yoksa (silinmiş) atlanır (#12). */
        case 'status':   if (a.v && a.v !== i.statusId && DB.statuses.some(s => s.id === a.v && s.projectId === i.projectId)) { setStatus(i, a.v); RULE_CTX = r.name; } break;
        case 'cf':       { i.cf ||= {}; const f = DB.fields.find(x => x.id === a.field);
                           if (f) logHist(i, f.name, cfShow(f, i.cf[a.field]), cfShow(f, a.v)); i.cf[a.field] = a.v; break; }
        case 'due':      { const n = parseInt(a.v, 10) || 0;
                           if (!i.start) histSet(i, 'start', TODAY); histSet(i, 'due', addWorkdays(i.start, Math.max(0, n - 1))); break; }
        case 'comment':  DB.comments.push({ id: uid('c'), issueId: i.id, userId: CU().id, at: Date.now(), body: `⚙︎ ${a.v}` });
                         logHist(i, 'Yorum', '', `⚙︎ ${a.v}`, { kind: 'add' }); break;
      }
      i.__d--;
    });
    logHist(i, 'Otomasyon', r.name, (r.then || []).map(a => ACTS[a.act]?.l || a.act).join(', '));
    RULE_CTX = prev;
  });
  if (!(i.__d > 0)) delete i.__d;   // iç içe çağrı (atama/durum kuralı) derinlik sayacını sıfırlamasın
}

function ruleValLabel(a) {
  switch (a.act) {
    case 'assign':   return user(a.v)?.name || '—';

    case 'cf':       return `${DB.fields.find(f => f.id === a.field)?.name || '?'} = ${a.v}`;
    case 'due':      return `${a.v} iş günü`;
    default:         return a.v;
  }
}

function wireAdmin() {

    const ss = stats(), i = ss.findIndex(s => s.id === b.dataset.mv), j = i + (+b.dataset.dir);

    [ss[i].ord, ss[j].ord] = [ss[j].ord, ss[i].ord]; save(); render();

  $$('[data-delst]').forEach(b => b.onclick = () => {

/* Bir projenin durum listesini verilen akışa dönüştürür.
   Mevcut durumlar sırayla yeniden adlandırılır, fazlalıktakiler
   en son duruma taşınıp silinir, eksikler eklenir. */
function applyFlow(pid, rows) {
  const cur = DB.statuses.filter(s => s.projectId === pid).sort((a, b) => a.ord - b.ord);
  rows.forEach(([name, cat], k) => {
    if (cur[k]) { cur[k].name = name; cur[k].cat = cat; cur[k].ord = k; }
    else DB.statuses.push({ id: uid('st'), projectId: pid, name, cat, wip: 0, ord: k });
  });
  const extra = cur.slice(rows.length);
  if (extra.length) {
    const keep = DB.statuses.filter(s => s.projectId === pid && !extra.includes(s)).sort((a, b) => a.ord - b.ord);
    const last = keep[keep.length - 1];
    DB.issues.forEach(i => { if (extra.some(s => s.id === i.statusId)) { logHist(i, 'Durum', stat(i.statusId).name, last.name); i.statusId = last.id; } });
    DB.statuses = DB.statuses.filter(s => !extra.includes(s));
  }
}

/* ============================================================
   Bölüm 7: Geçmiş tabanlı raporlar • Kapasite • Toplu düzenleme
             • Komut paleti
   ============================================================ */

/* ============================================================
   1) DURUM GEÇİŞ KAYDI
   Raporların doğru olması için "hangi iş, hangi gün, hangi durumdaydı"
   sorusunun cevaplanabilmesi gerekir. Bunu her geçişi kaydedip
   bugünden geriye oynatarak buluyoruz.
   ============================================================ */
function recordTransition(i, fromId, toId) {
  DB.transitions.push({ id: uid('t'), issueId: i.id, at: Date.now(), date: TODAY, from: fromId, to: toId });
}
function transIndex() {
  const m = new Map();
  DB.transitions.forEach(t => { (m.get(t.issueId) || m.set(t.issueId, []).get(t.issueId)).push(t); });
  m.forEach(list => list.sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at));
  return m;
}
/* Verilen günün sonunda işin durumu (yoksa null = henüz oluşmamış) */
function statusOn(i, date, idx) {
  if (iso(new Date(i.created)) > date) return null;
  const list = idx.get(i.id) || [];
  const after = list.find(t => t.date > date);
  return after ? after.from : i.statusId;
}
/* İlk kez "devam ediyor" kategorisine girdiği gün */
function startedOn(i, idx) {
  const t = (idx.get(i.id) || []).find(t => stat(t.to)?.cat === 'inprogress');
  return t ? t.date : null;
}
function cycleDays(i, idx) {
  const s = startedOn(i, idx), e = i.doneAt || (idx.get(i.id) || []).filter(t => stat(t.to)?.cat === 'done').pop()?.date;
  if (!s || !e) return null;
  return Math.max(0, Math.round((new Date(e) - new Date(s)) / 86400000));
}
const pct = (arr, p) => { if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };

/* ============================================================
   2) GELİŞMİŞ RAPORLAR
   ============================================================ */
function cfd(days = 30) {
  const idx = transIndex();
  const ss = stats();
  const list = issuesOf().filter(i => i.type !== 'epic');
  const D = Array.from({ length: days }, (_, k) => iso(addD(new Date(), k - days + 1)));
  const series = ss.map(s => D.map(d => list.filter(i => statusOn(i, d, idx) === s.id).length));
  const max = Math.max(1, ...D.map((_, k) => series.reduce((a, s) => a + s[k], 0)));
  const W = 460, H = 200, PL = 26, PB = 20;
  const x = k => PL + k * (W - PL - 6) / (days - 1);
  const y = v => H - PB - (v / max) * (H - PB - 8);

  let acc = D.map(() => 0);
  const bands = ss.map((s, si) => {
    const lower = [...acc];
    acc = acc.map((v, k) => v + series[si][k]);
    const up = D.map((_, k) => `${x(k)},${y(acc[k])}`).join(' ');
    const dn = D.map((_, k) => `${x(days - 1 - k)},${y(lower[days - 1 - k])}`).join(' ');
    const c = s.cat === 'done' ? '#15803D' : s.cat === 'todo' ? '#98A0AC' : '#B45309';
    const op = .30 + .16 * si;
    return `<polygon points="${up} ${dn}" fill="${c}" fill-opacity="${op}" stroke="${c}" stroke-width=".8"/>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kümülatif akış">
      ${[0, .5, 1].map(f => `<line x1="${PL}" x2="${W - 6}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line)"/>
        <text x="2" y="${y(max * f) + 4}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${Math.round(max * f)}</text>`).join('')}
      ${bands}
      <text x="${PL}" y="${H - 5}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(D[0])}</text>
      <text x="${W - 6}" y="${H - 5}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(D[days - 1])}</text>
    </svg>
    <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:6px">
      ${ss.map(s => `<span class="chip cat-${s.cat}">${esc(s.name)}</span>`).join('')}</div>
    <div style="font-size:11.5px;color:var(--ink3);margin-top:6px">
      Bir bandın kalınlaşması o durumda iş biriktiğini gösterir — darboğaz orada.</div>`;
}

function cycleReport() {
  const idx = transIndex();
  const done = issuesOf().filter(i => i.type !== 'epic' && stat(i.statusId).cat === 'done');
  const pts = done.map(i => ({ i, d: cycleDays(i, idx), end: i.doneAt || (idx.get(i.id) || []).slice(-1)[0]?.date }))
    .filter(p => p.d != null && p.end).sort((a, b) => a.end.localeCompare(b.end));
  if (pts.length < 2) return '<div class="empty">Yeterli tamamlanmış iş yok. Birkaç işi Bitti durumuna taşıyın.</div>';

  const vals = pts.map(p => p.d);
  const med = pct(vals, .5), p85 = pct(vals, .85);
  const W = 460, H = 170, PL = 26, PB = 20;
  const maxD = Math.max(...vals, 1);
  const x = k => PL + k * (W - PL - 10) / Math.max(1, pts.length - 1);
  const y = v => H - PB - (v / maxD) * (H - PB - 10);

  return `<div class="stat">
      <div><b>${med}g</b><span>medyan</span></div>
      <div><b>${p85}g</b><span>%85 dilim</span></div>
      <div><b>${pts.length}</b><span>ölçülen iş</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Döngü süresi">
      <line x1="${PL}" x2="${W - 6}" y1="${y(med)}" y2="${y(med)}" stroke="var(--accent)" stroke-dasharray="4 3"/>
      <line x1="${PL}" x2="${W - 6}" y1="${y(p85)}" y2="${y(p85)}" stroke="#B45309" stroke-dasharray="2 3"/>
      <text x="${W - 6}" y="${y(med) - 4}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--accent)">medyan ${med}g</text>
      <text x="${W - 6}" y="${y(p85) - 4}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="#B45309">%85 ${p85}g</text>
      ${pts.map((p, k) => `<circle cx="${x(k)}" cy="${y(p.d)}" r="3.4"
        fill="${p.d > p85 ? 'var(--risk)' : 'var(--accent)'}" fill-opacity=".75"><title>${esc(p.i.key)} — ${p.d} gün</title></circle>`).join('')}
      <text x="${PL}" y="${H - 5}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(pts[0].end)}</text>
      <text x="${W - 6}" y="${H - 5}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(pts.slice(-1)[0].end)}</text>
    </svg>
    <div style="font-size:11.5px;color:var(--ink3);margin-top:4px">
      İlk kez "devam ediyor" kategorisine girdiği günden bittiği güne kadar geçen takvim günü.
      Kırmızı noktalar %85 diliminin üstünde — tahmin verirken bunları örnek almayın.</div>`;
}

function throughput(weeks = 8) {
  const idx = transIndex();
  const m0 = monday(addD(new Date(), -7 * (weeks - 1)));
  const buckets = Array.from({ length: weeks }, (_, k) => ({ w: iso(addD(m0, k * 7)), n: 0, p: 0 }));
  issuesOf().filter(i => stat(i.statusId).cat === 'done').forEach(i => {
    const e = i.doneAt || (idx.get(i.id) || []).filter(t => stat(t.to)?.cat === 'done').pop()?.date;
    if (!e) return;
    const b = buckets.find(b => e >= b.w && e < iso(addD(new Date(b.w), 7)));
    if (b) { b.n++; b.p += i.points || 0; }
  });
  const max = Math.max(1, ...buckets.map(b => b.n));
  const W = 460, H = 150, bw = (W - 16) / weeks;
  const avg = (buckets.reduce((a, b) => a + b.n, 0) / weeks).toFixed(1);
  return `<div class="stat"><div><b>${avg}</b><span>hafta ort. iş</span></div>
      <div><b>${buckets.slice(-1)[0].n}</b><span>bu hafta</span></div></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Haftalık üretim">
      ${buckets.map((b, k) => { const h = (b.n / max) * (H - 36);
        return `<rect x="${8 + k * bw + bw * .18}" y="${H - 22 - h}" width="${bw * .64}" height="${h}" rx="2" fill="var(--accent)" fill-opacity=".8"/>
          <text x="${8 + k * bw + bw / 2}" y="${H - 26 - h}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--ink2)">${b.n || ''}</text>
          <text x="${8 + k * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="8.5" font-family="var(--mono)" fill="var(--ink3)">${fmtD(b.w)}</text>`; }).join('')}
    </svg>`;
}

/* ---- kapasite ---- */
const capOf = u => u.capacity ?? 30;
function capacityPanel() {
  const s = AGILE() ? activeSprint() : null;
  if (AGILE() && !s) return '<div class="empty">Aktif sprint yok</div>';
  const wk = s ? Math.max(1, Math.round((new Date(s.end) - new Date(s.start)) / 86400000 + 1) / 7) : 1;
  const rows = projUsers().map(u => {
    const mine = s
      ? DB.issues.filter(i => i.sprintId === s.id && i.assignee === u.id)
      : issuesOf().filter(i => i.assignee === u.id && stat(i.statusId).cat !== 'done' && i.type !== 'epic');
    const load = mine.reduce((a, i) => a + remaining(i), 0);
    const cap = capOf(u) * wk;
    return { u, load, cap, n: mine.length, r: cap ? load / cap : 0 };
  }).sort((a, b) => b.r - a.r);
  const maxR = Math.max(1.05, ...rows.map(r => r.r));
  return `<div class="sub" style="margin-bottom:10px">${s ? esc(s.name) + ' · ' + wk.toFixed(1) + ' hafta' : 'Bir haftalık kapasite'} ·
      toplam kapasite <b class="num">${fmtDur(rows.reduce((a, r) => a + r.cap, 0))}</b> ·
      kalan iş <b class="num">${fmtDur(rows.reduce((a, r) => a + r.load, 0))}</b></div>
    ${rows.map(r => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
      ${avat(r.u.id)}<span style="width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.u.name)}</span>
      <span style="flex:1;height:11px;background:var(--track);border-radius:6px;position:relative;overflow:hidden">
        <i style="display:block;height:100%;width:${Math.min(100, r.r / maxR * 100)}%;background:${r.r > 1 ? 'var(--risk)' : r.r > .85 ? '#B45309' : 'var(--accent)'}"></i>
        <i style="position:absolute;top:0;bottom:0;left:${Math.min(100, 1 / maxR * 100)}%;width:1px;background:var(--ink2)"></i>
      </span>
      <b class="num" style="width:96px;text-align:right;font-size:11.5px;${r.r > 1 ? 'color:var(--risk)' : ''}">
        ${fmtDur(r.load)} / ${fmtDur(r.cap)}</b>
      <span class="k" style="width:34px;text-align:right;color:var(--ink3)">${Math.round(r.r * 100)}%</span>
    </div>`).join('')}
    <div style="font-size:11.5px;color:var(--ink3);margin-top:6px">
      Dikey çizgi %100 kapasite. Kalan tahmin baz alınır; kişi kapasiteleri Proje ayarları → Kişiler'den değişir.</div>`;
}

let GKEY = false;
function wireKeys() {
  addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return palette(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); flushSync().then(() => toast(SYNC_STATE === 'ok' ? 'Kaydedildi' : 'Kaydedilemedi, tekrar denenecek')); return; }
    if (typing) return;
    const open = $('#scrim').classList.contains('on');
    if (GKEY) { GKEY = false;
      const map = { b: 'board', l: 'backlog', r: 'roadmap', t: 'timesheet', p: 'reports', a: 'search', s: 'admin', e: 'effort', h: 'home', j: 'projects', z: 'plan' };
      if (map[e.key]) { e.preventDefault(); location.hash = map[e.key]; }
      return;

    if (open) return;
    if (e.key === 'g') { GKEY = true; setTimeout(() => GKEY = false, 1200); return; }
    if (e.key === '?') { e.preventDefault(); return shortcutHelp(); }
    if (e.key === 'w' && canEdit()) { e.preventDefault(); return logWorkForm(); }

      const b = $('#q') || $('#pql');
      if (b) b.focus(); else { DB.ui.view = 'search'; save(); render(); $('#pql')?.focus(); } }
  });
}

                'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const monthName = m => `${MONTHS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;
const shiftMonth = (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };

/* seçili dönemin ilk/son günü */
function period() {
  const u = DB.ui;
  if (u.efRange === 'custom' && u.efFrom && u.efTo) return { from: u.efFrom, to: u.efTo, label: `${fmtD(u.efFrom)} – ${fmtD(u.efTo)}` };
  const m = u.efMonth || TODAY.slice(0, 7);
  const last = new Date(+m.slice(0, 4), +m.slice(5, 7), 0);
  return { from: m + '-01', to: iso(last), label: monthName(m), month: m };
}
/* dönemdeki iş günü sayısı (hafta içi) */
function workdays(from, to) {
  let n = 0;
  for (let d = new Date(from); iso(d) <= to; d.setDate(d.getDate() + 1)) {
    const w = d.getDay(); if (w !== 0 && w !== 6) n++;
  }
  return n;
}
/* Efor raporu proje sekmesidir: seçili projeye süzülü gelir. Kutudan başka seçim (ya da "Tüm projeler") yalnız
   o proje seçiliyken geçerli; proje değişince rapor yeni projeyi izler (efProjFor). */
const efProj = () => DB.ui.efProjFor === DB.ui.project ? (DB.ui.efProject || '') : (DB.ui.project || '');

  const p = period(), ep = efProj();
  return DB.worklogs.filter(w => w.date >= p.from && w.date <= p.to)

      if (ep && i.projectId !== ep) return false;

function renderEffort() {
  const p = period();
  const logs = periodLogs();
  const rowD = DIMS[DB.ui.efRow || 'user'];
  const colK = DB.ui.efCol ?? 'project';
  const colD = colK ? DIMS[colK] : null;

  /* boyut değerlerini topla — sabit listesi olanlar hep görünür */
  const vals = (D, fromData) => {
    const seen = [...new Set(fromData)];
    const base = D.all ? D.all() : [];
    const out = [...new Set([...base, ...seen])];
    return out.filter(v => v != null);
  };
  const rows = vals(rowD, logs.map(rowD.k)).filter(v => D_hasData(v, rowD, logs) || rowD.all);
  const cols = colD ? vals(colD, logs.map(colD.k)).filter(v => colD.all || logs.some(w => colD.k(w) === v)) : [];

  const cell = (r, c) => logs.filter(w => rowD.k(w) === r && (!colD || colD.k(w) === c))
    .reduce((a, w) => a + w.hours, 0);
  const rowTot = r => logs.filter(w => rowD.k(w) === r).reduce((a, w) => a + w.hours, 0);
  const colTot = c => logs.filter(w => colD.k(w) === c).reduce((a, w) => a + w.hours, 0);
  const grand = logs.reduce((a, w) => a + w.hours, 0);

  const wd = workdays(p.from, p.to);
  const isUser = (DB.ui.efRow || 'user') === 'user';
  const capOfPeriod = u => capOf(u) / 5 * wd;          // haftalık kapasite → dönem kapasitesi

  const visible = rows.filter(r => rowTot(r) > 0 || (isUser && !DB.ui.efUser));
  const maxCell = Math.max(1, ...visible.flatMap(r => cols.length ? cols.map(c => cell(r, c)) : [rowTot(r)]));

  const head = `<tr>
      <th class="who">${rowD.l}</th>
      ${cols.map(c => `<th title="${esc(colD.n(c))}">${esc((colD.short || colD.n)(c))}</th>`).join('')}
      <th class="tot">Toplam</th>
      ${isUser ? '<th class="tot">Kapasite</th><th class="tot">Kullanım</th>' : ''}
    </tr>`;

  const body = visible.map(r => {
    const t = rowTot(r);
    const u = isUser ? user(r) : null;
    const cap = u ? capOfPeriod(u) : 0;
    const ratio = cap ? t / cap : 0;
    return `<tr>
      <td class="who">${isUser ? `<div style="display:flex;align-items:center;gap:8px">${avat(r)}<span>${esc(rowD.n(r))}</span></div>`
        : `<span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rowD.n(r))}</span>`}</td>
      ${cols.map(c => { const v = cell(r, c);
        return `<td><button class="cell ${v ? '' : 'z'}" style="${heat(v / (maxCell / 8))}"
          data-drill="${esc(r)}" data-drillc="${esc(c)}" title="${esc(rowD.n(r))} × ${esc(colD.n(c))}">
          ${v ? v.toFixed(1).replace('.0', '') : '·'}</button></td>`; }).join('')}
      <td class="tot"><button class="cell" data-drill="${esc(r)}" style="font-weight:700">${t ? efFmt(t) : '—'}</button></td>
      ${isUser ? `<td class="tot"><span class="num" style="font-weight:400;color:var(--ink3)">${cap ? efFmt(cap) : '—'}</span></td>
        <td class="tot"><span class="num" style="color:${ratio > 1.05 ? 'var(--risk)' : ratio < .6 ? 'var(--ink3)' : 'var(--done)'}">
          ${cap ? Math.round(ratio * 100) + '%' : '—'}</span></td>` : ''}
    </tr>`;
  }).join('') || `<tr><td colspan="${cols.length + 4}"><div class="empty">Bu dönemde süre kaydı yok</div></td></tr>`;

  const totCap = isUser ? visible.reduce((a, r) => a + capOfPeriod(user(r) || {}), 0) : 0;

  return `
    <div class="stat" style="margin-bottom:12px">
      <div><b class="num">${efFmt(grand)}</b><span>toplam efor</span></div>
      <div><b class="num">${(grand / H_PER_DAY).toFixed(1)}</b><span>adam-gün</span></div>
      <div><b>${logs.length}</b><span>kayıt</span></div>
      <div><b>${new Set(logs.map(w => w.issueId)).size}</b><span>iş</span></div>
      <div><b>${wd}</b><span>iş günü</span></div>
      ${totCap ? `<div><b style="${grand > totCap ? 'color:var(--risk)' : ''}">${Math.round(grand / totCap * 100)}%</b><span>kapasite kullanımı</span></div>` : ''}
    </div>
    <div class="tswrap"><table class="ts">
      <thead>${head}</thead>
      <tbody>${body}</tbody>
      <tfoot><tr>
        <td class="who" style="font-family:var(--mono);font-size:11px">TOPLAM</td>
        ${cols.map(c => `<td>${colTot(c) ? colTot(c).toFixed(1).replace('.0', '') : '—'}</td>`).join('')}
        <td class="tot">${efFmt(grand)}</td>
        ${isUser ? `<td class="tot">${totCap ? efFmt(totCap) : '—'}</td>
          <td class="tot">${totCap ? Math.round(grand / totCap * 100) + '%' : '—'}</td>` : ''}
      </tr></tfoot>
    </table></div>
    <p style="color:var(--ink3);font-size:11.5px;margin-top:8px">
      Hücreye tıklayınca o kesitin tüm süre kayıtları açılır. Kapasite = kişinin haftalık kapasitesi ÷ 5 × dönemdeki iş günü (${wd} gün).
      Adam-gün hesabı ${H_PER_DAY} saatlik gün üzerinden.</p>`;
}
function D_hasData(v, D, logs) { return logs.some(w => D.k(w) === v); }

/* Bir kayıt kümesinin dökümü: önce iş bazında özet, sonra ham kayıtlar. */

      ${byIssue.map(x => `<div class="row" style="padding:6px 0" data-open="${x.i.id}">
        ${tIcon(x.i.type)}<span class="k" style="color:var(--ink3);width:64px">${x.i.key}</span>
        <span class="sum">${esc(x.i.summary)}</span>
        <span class="chip cat-${stat(x.i.statusId).cat}">${esc(stat(x.i.statusId).name)}</span>

        <span class="k" style="width:40px;text-align:right;color:var(--ink3)">${tot ? Math.round(x.h / tot * 100) : 0}%</span>
      </div>`).join('') || '<div class="empty">Kayıt yok</div>'}
      <div class="sec">Kayıtlar (${logs.length})</div>
      ${logs.map(w => `<div class="wl" style="padding:6px 0">
        ${avat(w.userId)}<span class="k" style="width:70px">${fmtD(w.date)}</span>
        <span class="k" style="color:var(--ink3);width:64px">${issue(w.issueId)?.key || '—'}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.comment || issue(w.issueId)?.summary || '')}</span>
        <b class="num">${efFmt(w.hours)}</b>

      <button class="btn pri" id="dl_add">+ Süre ekle</button></div>` : ''}`);
  const b = $('#dl_add');
  if (b) b.onclick = () => { closeModal(); logWorkForm(addCtx.issueId, addCtx.userId, addCtx.date); };

/* ---- efor raporu hücresi ---- */
function drill(rv, cv) {
  const rowD = DIMS[DB.ui.efRow || 'user'], colK = DB.ui.efCol ?? 'project';
  const colD = cv != null && colK ? DIMS[colK] : null;
  const logs = periodLogs().filter(w => String(rowD.k(w)) === String(rv) && (!colD || String(colD.k(w)) === String(cv)));
  showLogs(rowD.n(rv) + (colD ? ' × ' + colD.n(cv) : ''), period().label, logs,
    { userId: (DB.ui.efRow || 'user') === 'user' ? rv : null,
      issueId: (DB.ui.efRow || 'user') === 'issue' ? rv : null,
      date: DIMS[DB.ui.efCol]?.l === 'Gün' ? cv : null });
}

function wireEffort() {
  const rg = $('#efRange'); if (!rg) return;
  rg.onclick = e => { const b = e.target.closest('[data-r]');
    if (!b) return;
    DB.ui.efRange = b.dataset.r;
    if (b.dataset.r === 'custom' && !DB.ui.efFrom) { const p = period(); DB.ui.efFrom = p.from; DB.ui.efTo = p.to; }

  /* select'e onclick bağlamak listeyi açar açmaz yeniden çizip kapatıyordu. */
  const on = (s, fn) => { const e = $(s); if (e) e.onchange = fn; };
  const nav = n => { DB.ui.efMonth = shiftMonth(DB.ui.efMonth || TODAY.slice(0, 7), n); save(); render(); };
  if ($('#mPrev')) $('#mPrev').onclick = () => nav(-1);
  if ($('#mNext')) $('#mNext').onclick = () => nav(1);
  if ($('#mNow')) $('#mNow').onclick = () => { DB.ui.efMonth = TODAY.slice(0, 7); save(); render(); };
  if ($('#efFrom')) $('#efFrom').onchange = e => { DB.ui.efFrom = e.target.value; save(); render(); };
  if ($('#efTo')) $('#efTo').onchange = e => { DB.ui.efTo = e.target.value; save(); render(); };
  on('#efRow', e => { DB.ui.efRow = e.target.value; save(); render(); });
  on('#efCol', e => { DB.ui.efCol = e.target.value; save(); render(); });
  on('#efProject', e => { DB.ui.efProject = e.target.value; DB.ui.efProjFor = DB.ui.project; save(); render(); });
  on('#efUser', e => { DB.ui.efUser = e.target.value; save(); render(); });

  $$('[data-drill]').forEach(b => b.onclick = () => drill(b.dataset.drill, b.dataset.drillc));

  const xl = $('#efXlsx'); if (xl) xl.onclick = () => reportPreview();
  const sm = $('#efSum'); if (sm) sm.onclick = () => monthlySummary();

}


/* ============================================================
   Bölüm 8b: GENEL RAPORLAR (docs/tasarim/genel-raporlar, grup D1)
   Tüm projelerde süre: "Süre" (serbest pivot) ve "Faturalanabilir saat" (cari başına). Adres #raporlar/sure, #raporlar/fatura.
   Hesap Efor raporuyla aynı kurallar (dönem, işin projesi, billOf/btypeOf); fark yalnız kapsam ve toplama biçimi:
   kayıtlar TEK geçişte süzülüp toplanır, iş/proje/kişi aramaları önceden kurulan Map'lerden yapılır (50.000 kayıt).
   Kapsam: süper hepsi, diğerleri userProjects (üye listesi boş projeler herkese). Sunucu herkese her şeyi gönderir;
   bu bir güvenlik sınırı değildir, yalnız görünüm kapsamıdır. Süzgeçler kişisel (DB.ui.grF → user_prefs).
   ============================================================ */
const GR = { cell: null, open: new Set(), sl: 0, sheet: false, last: null };
const GR_FMT = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const grH = h => GR_FMT.format(Math.round((h || 0) * 100) / 100);
const grR2 = h => Math.round((h || 0) * 100) / 100;
const grTab = () => DB.ui.grTab === 'fatura' ? 'fatura' : 'sure';
const grF = () => (DB.ui.grF && typeof DB.ui.grF === 'object' && !Array.isArray(DB.ui.grF)) ? DB.ui.grF : (DB.ui.grF = {});
/* Adres: #raporlar/sure | #raporlar/fatura (başına "/" da kabul). Diğer ekranlar #görünüm. */
function hashView(h = location.hash.slice(1)) {
  h = decodeURIComponent(String(h || '')).replace(/^\//, '');
  const m = /^raporlar(?:\/(sure|fatura))?$/.exec(h);
  if (m) { if (m[1]) DB.ui.grTab = m[1]; return 'greports'; }
  return Object.hasOwn(VIEWS, h) ? h : null;
}
const viewHash = v => v === 'greports' ? 'raporlar/' + grTab() : v;

function grPeriod() {
  const f = grF();
  if (f.range === 'custom' && f.from && f.to) {
    const [a, b] = f.from <= f.to ? [f.from, f.to] : [f.to, f.from];
    return { from: a, to: b, label: `${trDate(a)} – ${trDate(b)}`, file: `${a}_${b}` };
  }
  const m = /^\d{4}-\d{2}$/.test(f.month || '') ? f.month : TODAY.slice(0, 7);
  const last = new Date(+m.slice(0, 4), +m.slice(5, 7), 0);
  return { from: m + '-01', to: iso(last), label: monthName(m), month: m, file: m };
}
/* Görünüm kapsamındaki projeler (arşivliler dahil: geçmiş dönem etiketle görünür). */
const grScope = () => isSuper() ? DB.projects.slice() : userProjects(CU()?.id).filter(projVisible);
const GR_NONE = '__none', GR_UNK = '__unk';
const GR_FKEYS = ['ws', 'proj', 'cu', 'user', 'type', 'bill'];

/* Bağlam: bir kez kurulur (Map'ler), boyut anahtarları buradan okunur. */
function grCtx() {
  const scope = grScope(), f = grF();
  const PM = new Map(), WS = new Map(), CUM = new Map(cuList().map(c => [c.id, c]));
  scope.forEach(p => { PM.set(p.id, p); WS.set(p.id, wsOf(p)); });
  /* alan seçiliyse proje listesi daralır; geçersiz proje seçimi temizlenir */
  if (f.ws && !scope.some(p => WS.get(p.id) === f.ws)) delete f.ws;
  if (f.proj && (!PM.has(f.proj) || (f.ws && WS.get(f.proj) !== f.ws))) delete f.proj;
  if (f.user && f.user !== GR_UNK && !DB.users.some(u => u.id === f.user)) delete f.user;
  if (f.type && !TYPE[f.type]) delete f.type;
  if (f.bill && !BILLABLE.includes(f.bill)) delete f.bill;
  if (f.cu && f.cu !== GR_NONE && !CUM.has(f.cu)) delete f.cu;
  const IM = new Map(); DB.issues.forEach(i => { if (PM.has(i.projectId)) IM.set(i.id, i); });
  const UM = new Map(DB.users.map(u => [u.id, u]));
  const cuOfP = p => p.customerId && CUM.has(p.customerId) ? p.customerId : GR_NONE;
  const cuOfI = (i, p) => i?.customerId && CUM.has(i.customerId) ? i.customerId : cuOfP(p);
  return { scope, f, PM, WS, CUM, IM, UM, cuOfP, cuOfI, SM: new Map((DB.sprints || []).map(s => [s.id, s])) };
}

/* Boyutlar: Efor DIMS ile aynı anahtarlar; Cari (işin carisi, yoksa projenin) ve Çalışma alanı eklenir. */
function grDims(X) {
  const WK = new Map();
  const wk = d => { let v = WK.get(d); if (!v) { v = iso(monday(new Date(d))); WK.set(d, v); } return v; };
  const pName = id => { const p = X.PM.get(id); return p ? `${p.key} — ${p.name}` : '—'; };
  const D = {
    user:     { l: 'Kişi', k: (w) => X.UM.has(w.userId) ? w.userId : GR_UNK, n: id => id === GR_UNK ? 'Bilinmeyen' : (X.UM.get(id)?.name || 'Bilinmeyen') },
    project:  { l: 'Proje', k: (w, i, p) => p.id, n: pName, tag: id => X.PM.get(id)?.archived ? 'arch' : '' },
    customer: { l: 'Cari', k: (w, i, p) => X.cuOfI(i, p), n: id => id === GR_NONE ? 'Cari bağlı değil' : (X.CUM.get(id)?.name || '—'),
                tag: id => id !== GR_NONE && !cuActive(X.CUM.get(id)) ? 'pas' : '' },
    ws:       { l: 'Çalışma alanı', k: (w, i, p) => X.WS.get(p.id), n: id => wsById(id)?.name || '—' },
    month:    { l: 'Ay', k: w => w.date.slice(0, 7), n: m => monthName(m), time: true },
    week:     { l: 'Hafta', k: w => wk(w.date), n: d => trDate(d) + ' haftası', time: true },
    type:     { l: 'İş tipi', k: (w, i) => i.type, n: t => TYPE[t]?.[2] || '—' },
    billable: { l: 'Faturalama', k: (w, i) => billOf(i), n: x => x },
    billType: { l: 'Fatura türü', k: (w, i) => btypeOf(i), n: x => x },
  };
  if (MOD('epic')) D.epic = { l: 'Epik', k: (w, i) => i.epicId || GR_NONE, n: id => id === GR_NONE ? 'Epik yok' : (issue(id)?.summary || '—') };
  if (anyAgile()) D.sprint = { l: 'Sprint', k: (w, i) => i.sprintId || GR_NONE, n: id => id === GR_NONE ? 'Backlog' : (X.SM.get(id)?.name || '—') };
  return D;
}

/* TEK GEÇİŞ: dönem + süzgeç + kapsam; pivot hücreleri, satır/sütun toplamları ve cari/proje faturalama birlikte. */
function grCompute() {
  const X = grCtx(), f = X.f, per = grPeriod(), D = grDims(X);
  const rowK = D[f.row] ? f.row : 'customer';
  const colK = f.col === '' ? '' : (D[f.col] ? f.col : 'user');
  const rD = D[rowK], cD = colK ? D[colK] : null;
  const cells = new Map(), rT = new Map(), cT = new Map(), bill = new Map(), logs = [], issues = new Set(), projs = new Set();
  let grand = 0;
  const F0 = BILLABLE[0];
  for (const w of DB.worklogs) {
    const d = w.date;
    if (!d || d < per.from || d > per.to) continue;
    const i = X.IM.get(w.issueId); if (!i) continue;
    const p = X.PM.get(i.projectId); if (!p) continue;
    if (f.proj && p.id !== f.proj) continue;
    if (f.ws && X.WS.get(p.id) !== f.ws) continue;
    if (f.user && (f.user === GR_UNK ? X.UM.has(w.userId) : w.userId !== f.user)) continue;
    if (f.type && i.type !== f.type) continue;
    const b = billOf(i);
    if (f.bill && b !== f.bill) continue;
    const cu = X.cuOfP(p);
    if (f.cu && cu !== f.cu) continue;
    const h = +w.hours || 0;
    logs.push({ w, i, p, cu });
    issues.add(i.id); projs.add(p.id);
    grand += h;
    const r = rD.k(w, i, p) ?? GR_NONE, c = cD ? (cD.k(w, i, p) ?? GR_NONE) : '';
    rT.set(r, (rT.get(r) || 0) + h);
    if (cD) {
      cT.set(c, (cT.get(c) || 0) + h);
      let m = cells.get(r); if (!m) cells.set(r, m = new Map());
      m.set(c, (m.get(c) || 0) + h);
    }
    let bc = bill.get(cu); if (!bc) bill.set(cu, bc = { f: 0, n: 0, p: new Map() });
    let bp = bc.p.get(p.id); if (!bp) bc.p.set(p.id, bp = { f: 0, n: 0 });
    if (b === F0) { bc.f += h; bp.f += h; } else { bc.n += h; bp.n += h; }
  }
  const order = (Dm, tot) => [...tot.keys()].sort((a, b) => {
    const sa = a === GR_NONE || a === GR_UNK, sb = b === GR_NONE || b === GR_UNK;
    if (sa !== sb) return sa ? 1 : -1;
    if (Dm.time) return String(a).localeCompare(String(b));
    return (tot.get(b) - tot.get(a)) || String(Dm.n(a)).localeCompare(String(Dm.n(b)), 'tr');
  });
  const rows = order(rD, rT), cols = cD ? order(cD, cT) : [];
  return { X, D, f, per, rowK, colK, rD, cD, cells, rT, cT, bill, logs, issues, projs, grand, rows, cols };
}

/* ---- görünüm ---- */
function grTag(kind) {
  return kind === 'arch' ? `<span class="gr-tag">${ic('archive')}Arşivli</span>` : kind === 'pas' ? `<span class="gr-tag">${ic('pause')}Pasif</span>` : '';
}
function grDimLabel(Dm, k, id) {
  if (k === 'user') return `<span class="gr-rn">${id === GR_UNK ? '<span class="gr-unk" aria-hidden="true">?</span>' : avat(id)}<span class="nm">${esc(Dm.n(id))}</span></span>`;
  if (k === 'customer' && id === GR_NONE) return `<span class="gr-rn none">${ic('link')}<span class="nm">${esc(Dm.n(id))}</span></span>`;
  return `<span class="gr-rn"><span class="nm" title="${esc(Dm.n(id))}">${esc(Dm.n(id))}</span>${Dm.tag ? grTag(Dm.tag(id)) : ''}</span>`;
}
function grFilterBar(R) {
  const X = R.X, f = R.f, per = R.per, custom = f.range === 'custom';
  const wsIds = [...new Set(X.scope.map(p => X.WS.get(p.id)))];
  const wsOpts = wsIds.map(id => [id, wsById(id)?.name || '—']).sort((a, b) => a[1].localeCompare(b[1], 'tr'));
  const pOpts = X.scope.filter(p => !f.ws || X.WS.get(p.id) === f.ws).sort((a, b) => String(a.key).localeCompare(String(b.key), 'tr'))
    .map(p => [p.id, `${p.key} — ${p.name}${p.archived ? ' (arşivli)' : ''}`]);
  const cuIds = new Set(X.scope.map(X.cuOfP));
  const cOpts = cuList().filter(c => cuIds.has(c.id)).sort(cuSort).map(c => [c.id, c.name + (cuActive(c) ? '' : ' (pasif)')]);
  if (cuIds.has(GR_NONE)) cOpts.push([GR_NONE, 'Cari bağlı değil']);
  const uOpts = DB.users.filter(u => !u.system || isSuper()).map(u => [u.id, u.name]).sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'tr'));
  uOpts.push([GR_UNK, 'Bilinmeyen (silinmiş)']);
  const tOpts = Object.keys(TYPE).map(t => [t, TYPE[t][2]]);
  const bOpts = BILLABLE.map(b => [b, b]);
  const sel = (k, l, all, opts) => `<label class="gr-fs ${f[k] ? 'on' : ''}"><span class="lb">${l}</span>
      <select class="inp" data-grf="${k}" aria-label="${l}"><option value="">${all}</option>${opts.map(([v, t]) =>
        `<option value="${esc(v)}" ${f[k] === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
  const nameOf = { ws: id => wsById(id)?.name, proj: id => { const p = X.PM.get(id); return p && `${p.key} — ${p.name}`; },
    cu: id => id === GR_NONE ? 'Cari bağlı değil' : X.CUM.get(id)?.name, user: id => id === GR_UNK ? 'Bilinmeyen' : X.UM.get(id)?.name,
    type: t => TYPE[t]?.[2], bill: b => b };
  const LBL = { ws: 'Alan', proj: 'Proje', cu: 'Cari', user: 'Kişi', type: 'İş tipi', bill: 'Faturalama' };
  const act = GR_FKEYS.filter(k => f[k]);
