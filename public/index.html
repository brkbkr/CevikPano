/* ================= genel raporlar (gr-, docs/tasarim/genel-raporlar) ================= */
:root{--gr-heat:#2563EB;--gr-bar:#2563EB;--gr-bar-bg:#E3EAF5;--gr-sub-bg:#F9FBFE}
:root[data-theme="dark"]{--gr-heat:#60A5FA;--gr-bar:#60A5FA;--gr-bar-bg:#1E2B45;--gr-sub-bg:#0E1729}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--gr-heat:#60A5FA;--gr-bar:#60A5FA;--gr-bar-bg:#1E2B45;--gr-sub-bg:#0E1729} }
.gr{display:flex;flex-direction:column;gap:14px;min-width:0}
.gr-panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.gr-tabs{display:flex;gap:2px;margin:12px -20px 0;padding:0 14px}
.gr-tab{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border:0;background:none;border-radius:8px 8px 0 0;font-size:13px;font-weight:550;color:var(--nv-tab-ink);white-space:nowrap;position:relative;margin-bottom:-1px;text-decoration:none}
.gr-tab svg.i{width:16px;height:16px;color:var(--meta)}
.gr-tab:hover{background:var(--nv-tab-hover);color:var(--ink)}
.gr-tab[aria-selected="true"]{color:var(--nv-tab-on);font-weight:650}
.gr-tab[aria-selected="true"] svg.i{color:var(--nv-tab-bar)}
.gr-tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--nv-tab-bar)}

/* süzgeç çubuğu */
.gr-fbar{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow-sm)}
.gr-frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gr-per{display:inline-flex;align-items:center;gap:4px}
.gr-step{display:inline-flex;align-items:center;height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);overflow:hidden}
.gr-step button{width:32px;height:34px;border:0;background:none;display:grid;place-items:center;color:var(--ink2);padding:0}
.gr-step button:hover{background:var(--surface2)}
.gr-step button svg.i{width:16px;height:16px}
.gr-step b{min-width:118px;text-align:center;font-size:13px;font-weight:650;padding:0 4px;border-left:1px solid var(--line);border-right:1px solid var(--line);height:34px;display:grid;place-items:center}
.gr-range{display:inline-flex;align-items:center;gap:6px}
.gr-range .inp{width:132px;font-family:var(--mono);font-size:12.5px}
.gr-range span{color:var(--meta)}
.gr-fhint{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--meta)}
.gr-fhint svg.i{width:14px;height:14px}
.gr-fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.gr-fb{display:flex;align-items:center;gap:6px;height:36px;padding:0 9px 0 11px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);font-size:13px;white-space:nowrap;min-width:0;text-align:left}
.gr-fb > svg.i:last-child{margin-left:auto}
.gr-fb .lb{color:var(--meta);font-weight:550}
.gr-fb .v{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gr-fb > svg.i{width:14px;height:14px;color:var(--meta)}
.gr-fb:hover{background:var(--surface2)}
.gr-fb.on{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-soft)}
.gr-fb.on .v{color:var(--accent-d)}
.gr-fb.on .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.gr-fbtn{display:none}
.gr-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px dashed var(--line)}
.gr-chips .lbl{font-size:12px;color:var(--meta);margin-right:2px}
.gr-chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-d);font-size:12px;font-weight:600;max-width:100%}
.gr-chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-chip .t span{color:var(--ink2);font-weight:550}
.gr-chip button{width:22px;height:22px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--accent-d);padding:0;position:relative}
.gr-chip button::before{content:"";position:absolute;inset:-7px}
.gr-chip button:hover{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.gr-chip button svg.i{width:13px;height:13px;stroke-width:2.2}
.gr-clear{height:28px;padding:0 8px;font-size:12.5px}

/* özet kutuları (benim işlerim dilinden, sade) */
.gr-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.gr-kpi{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);min-width:0}
.gr-kpi .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.gr-kpi .ic svg.i{width:18px;height:18px}
.gr-kpi .tx{min-width:0}
.gr-kpi .l{display:block;font-size:12px;color:var(--ink2);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-kpi b{display:block;font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:1px;font-variant-numeric:tabular-nums}
.gr-kpi b small{font-family:var(--sans);font-size:12px;font-weight:550;color:var(--meta);margin-left:3px;letter-spacing:0}
.gr-kpi .s{display:block;font-size:11.5px;color:var(--meta);margin-top:1px}

/* rapor kartı (pivot / fatura) */
.gr-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);min-width:0}
.gr-card-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.gr-card-h .spacer{flex:1}
.gr-card-h .meta{font-size:12px;color:var(--meta)}
.gr-card-h .meta b{font-family:var(--mono);color:var(--ink2);font-weight:650}
.gr-dim{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:550}
.gr-dim select.inp{font-weight:600;color:var(--ink);min-width:132px}
.gr-swap{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;color:var(--ink2);padding:0}
.gr-swap svg.i{width:16px;height:16px}
.gr-xls svg.i{color:var(--ok)}
.gr-pv-wrap{overflow-x:auto;border-radius:0 0 12px 12px}
.gr-pv{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.gr-pv th{font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface2);padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.gr-pv th.dimh{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.gr-pv th.dimh span{color:var(--ink3);font-weight:600;margin:0 4px}
.gr-pv th .ph{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.gr-pv td{border-bottom:1px solid var(--line);padding:0;text-align:right;white-space:nowrap}
.gr-pv tbody tr:last-child td{border-bottom:0}
.gr-pv .rh{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:8px 12px;min-width:240px;border-right:1px solid var(--line)}
.gr-pv th.rh{background:var(--surface2);z-index:2}
.gr-pv tfoot .rh,.gr-pv tfoot td{background:var(--surface2)}
.gr-rn{display:flex;align-items:center;gap:8px;min-width:0}
.gr-rn .nm{font-weight:650;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-rn .sub{display:block;font-size:11.5px;color:var(--meta);font-weight:500;margin-top:1px}
.gr-rn.none .nm{color:var(--ink2);font-weight:600}
.gr-rn.none > svg.i{width:16px;height:16px;color:var(--meta)}
.gr-c{display:flex;align-items:center;justify-content:flex-end;width:100%;min-width:96px;height:44px;padding:0 12px;border:0;background:none;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);border-radius:0}
.gr-c:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.gr-c:focus-visible{box-shadow:inset 0 0 0 2px var(--accent),var(--ring)}
.gr-c.z{color:var(--ink3)}
.gr-c[aria-pressed="true"]{background:var(--accent)!important;color:var(--accent-ink);font-weight:700}
.gr-pv .tot{background:var(--surface2)}
.gr-pv .tot .gr-c{font-weight:700}
.gr-pv tfoot td{border-top:1px solid var(--line2);border-bottom:0}
.gr-pv tfoot .rh{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border-top:1px solid var(--line2)}
.gr-pv tfoot .gr-c{font-weight:700}
.gr-pv tfoot .grand .gr-c{color:var(--accent-d)}
.gr-foot{display:flex;align-items:center;gap:6px;padding:9px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--meta)}
.gr-foot svg.i{width:14px;height:14px}

/* etiketler: arşivli proje / pasif cari (ikon + metin, yalnız renge dayanmaz) */
.gr-tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:6px;border:1px dashed var(--line2);background:var(--surface);color:var(--ink2);font-size:11px;font-weight:650;white-space:nowrap;flex-shrink:0}
.gr-tag svg.i{width:12px;height:12px}

/* hücre kayıt listesi */
.gr-drill{overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));box-shadow:var(--shadow-sm),0 0 0 3px color-mix(in srgb,var(--accent) 8%,transparent)}
.gr-drill .gr-card-h{background:color-mix(in srgb,var(--accent) 5%,var(--surface));border-radius:12px 12px 0 0}
.gr-dt{flex:1;min-width:0}
.gr-dt b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;letter-spacing:-.01em;flex-wrap:wrap}
.gr-dt b .x{color:var(--meta);font-weight:500}
.gr-dt .s{display:block;font-size:12px;color:var(--meta);margin-top:2px}
.gr-dsum{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent-d);white-space:nowrap}
.gr-dsum small{font-family:var(--sans);font-size:12px;font-weight:550;color:var(--meta);margin-left:3px}
.gr-dl{width:100%;border-collapse:collapse;font-size:13px}
.gr-dl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);background:var(--surface2);padding:8px 12px;border-bottom:1px solid var(--line)}
.gr-dl td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:middle}
.gr-dl th.r,.gr-dl td.r{text-align:right}
.gr-dl td.d{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}
.gr-dl td.h{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:600;white-space:nowrap}
.gr-dl .who{display:flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap}
.gr-is{display:flex;align-items:center;gap:8px;min-width:0}
.gr-is .gr-key{font-family:var(--mono);font-size:11.5px;font-weight:650;color:var(--accent-d);text-decoration:none;white-space:nowrap}
.gr-is .gr-key:hover{text-decoration:underline}
.gr-is span{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-dl tfoot td{background:var(--surface2);border-bottom:0;font-weight:700;color:var(--ink)}
.gr-dl tfoot td.lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.gr-dl tfoot .eq{font-family:var(--sans);font-size:11.5px;font-weight:550;color:var(--ok);margin-right:8px}
.gr-dl tfoot .eq svg.i{width:13px;height:13px;vertical-align:-2px;margin-right:3px}

/* faturalanabilir saat tablosu */
.gr-ft{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.gr-ft th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);background:var(--surface2);padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.gr-ft th:first-child{text-align:left}
.gr-ft td{padding:0 12px;height:52px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.gr-ft td:first-child{text-align:left;font-family:var(--sans);font-size:13px;padding-left:6px}
.gr-ft td.t{font-weight:700}
.gr-ft tbody tr.top:hover td{background:var(--surface2)}
.gr-ft tr.sub td{background:var(--gr-sub-bg);height:44px;color:var(--ink2)}
.gr-ft tr.sub td:first-child{padding-left:50px;position:relative}
.gr-ft tr.sub td:first-child::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:1px;background:var(--line2)}
.gr-ft tr.sub td:first-child::after{content:"";position:absolute;left:24px;top:50%;width:14px;height:1px;background:var(--line2)}
.gr-ft tr.sub.last td:first-child::before{bottom:50%}
.gr-ft tfoot td{background:var(--surface2);font-weight:700;border-bottom:0;border-top:1px solid var(--line2)}
.gr-ft tfoot td:first-child{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding-left:50px}
.gr-ft tfoot td.grand{color:var(--accent-d)}
.gr-xr{display:flex;align-items:center;gap:6px;min-width:0}
.gr-tg{width:36px;height:36px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--ink2);padding:0;flex-shrink:0}
.gr-tg:hover{background:var(--surface3)}
.gr-tg svg.i{width:16px;height:16px;transition:transform .15s}
.gr-tg[aria-expanded="false"] svg.i{transform:rotate(-90deg)}
.gr-xr .nm{font-weight:650;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-xr .sub{font-size:11.5px;color:var(--meta);white-space:nowrap}
.gr-xr .nmw{display:flex;flex-direction:column;min-width:0}
.gr-xr .nmr{display:flex;align-items:center;gap:6px;min-width:0}
.gr-pk{font-family:var(--mono);font-size:11px;font-weight:650;color:var(--meta);flex-shrink:0;width:34px}
.gr-pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:550}
.gr-rate{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.gr-rate i{display:block;width:64px;height:6px;border-radius:3px;background:var(--gr-bar-bg);overflow:hidden}
.gr-rate i b{display:block;height:100%;background:var(--gr-bar);border-radius:3px}
.gr-rate span{min-width:38px;text-align:right}
.gr-fc-list{display:none} .gr-fcw{display:none}

/* bildirim */
.gr-toast{display:inline-flex;align-items:center;gap:10px;padding:10px 8px 10px 14px;border-radius:12px;background:var(--gr-toast);color:var(--gr-toast-ink);box-shadow:var(--shadow-lg);font-size:13px;font-weight:550;max-width:100%}
/* fatura kartı (mobil) */
.gr-fc{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm);overflow:hidden}
.gr-fc.tot{background:var(--surface2)}
.gr-fc-h{display:flex;align-items:flex-start;gap:8px;padding:12px 12px 0}

.gr-fc-h .nm{display:block;font-weight:700;font-size:14px;color:var(--ink);line-height:1.3}

.gr-fc-n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px 12px 8px}
.gr-fc-n div{min-width:0}
.gr-fc-n span{display:block;font-size:11px;color:var(--meta);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr-fc-n b{display:block;font-family:var(--mono);font-size:13.5px;font-weight:650;margin-top:1px;font-variant-numeric:tabular-nums}

.gr-fc-bar{display:block;height:6px;margin:0 12px 12px;border-radius:3px;background:var(--gr-bar-bg);overflow:hidden}

.gr-fc-tg{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;padding:0 12px;border:0;border-top:1px solid var(--line);background:none;font-size:13px;font-weight:600;color:var(--accent-d);text-align:left}

.gr-fc-p{border-top:1px solid var(--line);background:var(--gr-sub-bg)}

.gr-tabs{margin:0;padding:0;border-bottom:1px solid var(--line)}
.gr .btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--accent-d)}
.gr .btn.ghost:hover{background:var(--accent-soft)}
.gr .btn{display:inline-flex;align-items:center;gap:6px}
.gr .btn svg.i{width:16px;height:16px}
.gr-eflk{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.gr-fs{display:flex;align-items:center;gap:6px;height:36px;padding:0 4px 0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);font-size:13px;min-width:0}

.gr-fs select.inp{flex:1;min-width:0;border:0;background-color:transparent;height:32px;padding-left:2px;font-weight:600;color:var(--ink);box-shadow:none}

<script>
/* ============================================================
   SUNUCU BAĞLANTISI
   Veri artık tarayıcıda ya da SharePoint'teki tek bir metinde değil,
   sunucudaki PostgreSQL veritabanında durur. Ön yüz eskisi gibi tüm
   veriyi bellekteki DB nesnesinde tutar; her kayıtta yalnızca DEĞİŞEN
   kayıtlar (iş, yorum, süre kaydı ...) sunucuya gönderilir. Başka
   kullanıcıların değişiklikleri birkaç saniyede bir çekilir. Böylece
   check-in / check-out gerekmez, iki kişi aynı anda çalışabilir.
   ============================================================ */
const API = {
  async req(method, url, body) {
    const opt = { method, credentials: 'same-origin', headers: { 'x-pano': '1' } };
    if (body !== undefined) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
    let r;
    try { r = await fetch(url, opt); }
    catch (e) { const er = new Error('Sunucuya ulaşılamıyor'); er.status = 0; throw er; }
    let j = null; try { j = await r.json(); } catch (e) { }
    if (!r.ok) { const e = new Error(j?.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
    return j;
  },
  get: u => API.req('GET', u),
  post: (u, b) => API.req('POST', u, b === undefined ? {} : b),
};

let ME = null;            // oturumdaki kullanıcı (sunucudan)
let SEQ = 0;              // son görülen değişiklik numarası
let SNAP = null;          // sunucuyla eşit olduğu bilinen son durum
let SYNC_STATE = 'ok';    // ok | pending | saving | error
let SYNC_AT = null;
const PREF_KEYS = ['ui', 'board', 'open'];
const IGNORED_KEYS = ['savedAt', 'savedBy'];

/* Anahtar sırası bağımsız JSON — PostgreSQL jsonb anahtarları yeniden sıralar. */
function cj(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v) ?? 'null';
  if (Array.isArray(v)) return '[' + v.map(x => x === undefined ? 'null' : cj(x)).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort()
    .map(k => JSON.stringify(k) + ':' + cj(v[k])).join(',') + '}';
}

function snapOf(db) {
  const s = { rec: {}, set: {}, pref: {} };
  for (const [k, v] of Object.entries(db)) {
    if (IGNORED_KEYS.includes(k) || v === undefined) continue;
    if (PREF_KEYS.includes(k)) s.pref[k] = cj(v);
    else if (Array.isArray(v)) {
      const m = new Map();
      v.forEach(x => { if (x && x.id != null) m.set(String(x.id), cj(x)); });
      s.rec[k] = m;
    } else s.set[k] = cj(v);
  }
  return s;
}

function diffSnap(a, b) {
  const out = [];
  for (const k of new Set([...Object.keys(a.rec), ...Object.keys(b.rec)])) {
    const A = a.rec[k] || new Map(), B = b.rec[k] || new Map();
    for (const [id, j] of B) if (A.get(id) !== j)
      out.push({ c: k, id, op: 'put', data: JSON.parse(j), base: A.has(id) ? JSON.parse(A.get(id)) : undefined });
    for (const id of A.keys()) if (!B.has(id)) out.push({ c: k, id, op: 'del' });
  }
  for (const k of new Set([...Object.keys(a.set), ...Object.keys(b.set)])) {
    if (a.set[k] === b.set[k]) continue;
    out.push(b.set[k] === undefined ? { c: '_settings', id: k, op: 'del' }
      : { c: '_settings', id: k, op: 'put', data: JSON.parse(b.set[k]), base: a.set[k] === undefined ? undefined : JSON.parse(a.set[k]) });
  }
  for (const k of PREF_KEYS)
    if (a.pref[k] !== b.pref[k] && b.pref[k] !== undefined) out.push({ c: '_prefs', id: k, op: 'put', data: JSON.parse(b.pref[k]) });
  /* Kullanıcılar önce gitsin (yeni bir iş yeni bir kullanıcıya atanmış olabilir); yeni çalışma alanı
     ondan sonra (aynı gönderimde o alana proje açılmış olabilir); alan silme en sonda (önce projeler taşınır).
     Kolon silme de en sonda: içindeki işler aynı gönderimde önce taşınır (#12).
     Geçmiş ve yorumlar işlerden sonra: yeni işin geçmişi işi bulur (B2; sunucu da aynı sırayı uygular). */
  const rank = x => x.c === 'users' ? 0 : x.c === 'workspaces' ? (x.op === 'del' ? 3 : 1)
    : x.c === 'statuses' && x.op === 'del' ? 3 : x.c === 'history' || x.c === 'comments' ? 2.5 : 2;
  return out.sort((x, y) => rank(x) - rank(y));
}

function setSync(st) {
  SYNC_STATE = st;
  DIRTY = st !== 'ok';
  if (typeof renderFileBar === 'function') renderFileBar();
}

let syncT = null, syncing = null, syncAgain = false, retryT = null, BUSY_N = 0;
/* Silmede 8 sn "Geri al" (HOLD): bekletilen kayıtların SNAP'teki değeri korunur, böylece süre dolana
   kadar sunucuya hiçbir şey gitmez; süre dolunca normal fark gönderimiyle silinir. */
const HOLDS = [];
function holdMask(now) {
  for (const h of HOLDS) for (const k of h.keys) {
    const [c, id] = k.split('\u0001'), old = SNAP?.rec[c]?.get(id), m = (now.rec[c] ||= new Map());
    if (old === undefined) m.delete(id); else m.set(id, old);
  }
  return now;
}
function scheduleSync(delay = 400) {
  clearTimeout(syncT);
  if (SYNC_STATE === 'ok') setSync('pending');
  syncT = setTimeout(flushSync, delay);
}

/* Devam eden ve bekleyen tüm değişiklikler gidene kadar kaydet. */
async function flushAll() {
  for (let k = 0; k < 5; k++) {
    await flushSync();
    if (syncing) { await syncing; continue; }
    if (!SNAP || !diffSnap(SNAP, holdMask(snapOf(DB))).length) return;
  }
}

async function flushSync() {
  clearTimeout(syncT); clearTimeout(retryT);
  if (!SNAP || !DB || !ME) return;
  if (syncing) { syncAgain = true; return syncing; }
  syncing = (async () => {
    const now = holdMask(snapOf(DB));
    let ch = diffSnap(SNAP, now);
    if (typeof canEditAny === 'function' && !canEditAny()) ch = ch.filter(x => x.c === '_prefs');
    else if (typeof isAdmin === 'function' && !isAdmin())
      /* Kolonlar (statuses) ve projeye özel alanlar süzülmez: alan yöneticisi de değiştirir, yetkiyi sunucu denetler (#12, 22b). */
      ch = ch.filter(x => !['rules', '_settings', 'customers'].includes(x.c) && !(x.c === 'fields' && !(x.data?.projectId || x.base?.projectId))
        && !(['projects', 'workspaces'].includes(x.c) && x.op === 'del')
        && !(x.c === 'users' && x.id !== ME.id));
    if (!ch.length) { SNAP = now; setSync('ok'); return; }
    setSync('saving');
    try {
      const rejected = [], adjusted = [];
      for (let i = 0; i < ch.length; i += 1000) {
        const r = await API.post('/api/sync', { changes: ch.slice(i, i + 1000) });
        rejected.push(...(r.rejected || []));
        adjusted.push(...(r.adjusted || []));
      }
      SNAP = now; SYNC_AT = Date.now(); BUSY_N = 0; setSync('ok');
      /* Sunucu bir kaydı birleştirdi ya da iş numarasını değiştirdi: güncel hâli hemen al. */
      if (adjusted.length) setTimeout(poll, 30);
      if (rejected.length) {
        /* Cari vergi no çakışması: sunucu yalnız kimlik döner; unvan ve "Kartı aç" yeniden yüklemeden sonra (#11). */
        const cuTaken = /^Bu vergi numarasıyla kayıtlı cari var \(#([^)]+)\)$/.exec(rejected[0].reason || '');
        if (!cuTaken) toast('Kaydedilemeyen değişiklik: ' + (rejected[0].reason || 'yetki yok') + (rejected.length > 1 ? ` (+${rejected.length - 1})` : ''));
        await reloadState();
        if (typeof colsRefresh === 'function') colsRefresh(rejected[0].reason);
        if (cuTaken) cuTakenToast(cuTaken[1]);
      }
    } catch (e) {
      if (e.status === 401) return sessionLost();
      /* Sunucu meşgul (kilitlenme, sunucudaki yeniden deneme de olmadı): yerel değişiklik atılmaz (SNAP aynı
         kalır), kısa ve giderek uzayan beklemeyle aynı fark yeniden gönderilir. */
      if (e.status === 409 && /^Sunucu meşgul/.test(e.message || '')) {
        BUSY_N++; setSync('pending');
        retryT = setTimeout(flushSync, Math.min(8000, 500 * 2 ** Math.min(BUSY_N - 1, 4)) + Math.floor(Math.random() * 300));
        return;
      }
      if (e.status === 409 || e.status === 400 || e.status === 403) {
        toast(e.message); SNAP = now; setSync('ok'); await reloadState();
        if (typeof colsRefresh === 'function') colsRefresh(e.message);
        return;
      }
      setSync('error');
      retryT = setTimeout(flushSync, 5000);
    }
  })();
  try { await syncing; } finally {
    syncing = null;
    if (syncAgain) { syncAgain = false; scheduleSync(50); }
  }
}

/* ---- başkalarının değişikliklerini çek ---- */
let pollT = null, RERENDER = false, OPEN_ISSUE = null, ONLINE = [], UNREAD = 0, MODAL_STALE = false;
function startPolling() {
  clearInterval(pollT);
  pollT = setInterval(poll, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}
async function poll() {
  if (!ME || !SNAP || document.hidden) return;
  if (RERENDER) tryRerender();
  try {
    const r = await API.get('/api/changes?since=' + SEQ + '&view=' + encodeURIComponent(DB?.ui?.view || '')
      + '&issue=' + encodeURIComponent(OPEN_ISSUE || ''));
    if (r.reload) { SEQ = r.seq || SEQ; toast(r.access ? 'Erişim yetkileriniz güncellendi' : 'Veri yönetici tarafından yenilendi'); return reloadState(); }
    if (r.items?.length) applyRemote(r.items);
    SEQ = Math.max(SEQ, r.seq || 0);
    setUnread(r.unread || 0);
    setOnline(r.online || []);
  } catch (e) { if (e.status === 401) sessionLost(); }
}

function applyRemote(items) {
  const cur = snapOf(DB);
  let changed = false;
  for (const it of items) {
    const j = it.op === 'put' ? cj(it.data) : undefined;
    if (it.c === '_settings') {
      if (cur.set[it.id] !== SNAP.set[it.id]) continue;           // bende kaydedilmemiş değişiklik var
      if (SNAP.set[it.id] === j) continue;
      if (j === undefined) { delete DB[it.id]; delete SNAP.set[it.id]; } else { DB[it.id] = it.data; SNAP.set[it.id] = j; }
      changed = true; continue;
    }
    const arr = (DB[it.c] ||= []);
    const m = (SNAP.rec[it.c] ||= new Map());
    if (cur.rec[it.c]?.get(it.id) !== m.get(it.id)) continue;   // bende kaydedilmemiş değişiklik var
    if (m.get(it.id) === j) continue;
    const idx = arr.findIndex(x => x && String(x.id) === it.id);
    if (j === undefined) {
      if (idx >= 0) arr.splice(idx, 1); m.delete(it.id);
      if (it.c === 'issues' && it.id === OPEN_ISSUE) { closeModal(); toast('Açık olan iş başka bir kullanıcı tarafından silindi'); }
    } else {
      if (idx >= 0) { const o = arr[idx]; for (const k of Object.keys(o)) delete o[k]; Object.assign(o, it.data); }
      else arr.push(it.data);
      m.set(it.id, j);
    }
    if (OPEN_ISSUE && (it.id === OPEN_ISSUE || it.data?.issueId === OPEN_ISSUE)) MODAL_STALE = true;
    if (it.c === 'users' && it.id === ME.id && it.data) { ME.role = it.data.role; ME.mustChange = it.data.mustChange; }
    changed = true;
  }
  if (changed) { RERENDER = true; tryRerender(); }
}

/* Açık bir pencere, sürükleme ya da yazılan bir alan varken ekranı yenileme. */
function tryRerender() {
  const typing = document.activeElement && (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable);
  /* Açık iş penceresi başkası tarafından değiştirildiyse, yazı yazılmıyorsa tazele. */
  if (MODAL_STALE && OPEN_ISSUE && (!typing || ID_ED) && issue(OPEN_ISSUE)) { MODAL_STALE = false; try { openIssue(OPEN_ISSUE); } catch (e) { } }
  const busy = document.getElementById('scrim')?.classList.contains('on')
    || (typeof DRAG !== 'undefined' && DRAG)
    || (typeof QM !== 'undefined' && QM)
    || document.querySelector('#navPop, .ws-pop:not([hidden]), #acctMenu')
    || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (busy) return;
  RERENDER = false;
  try { render(); } catch (e) { console.error(e); }
}

async function reloadState() {
  try {
    const open = OPEN_ISSUE, prevProj = DB?.ui?.project, typed = modalTyped();
    holdClear(); DB = await load(); ensureSchema(); ensureAccounts();
    dropLostModal(open, prevProj, typed);
    startApp(false);
  }
  catch (e) { if (e.status === 401) sessionLost(); }
}
/* Açık pencerede kaydedilmemiş yazı var mı (değeri ilk hâlinden farklı metin alanı ya da açık düzenleme). */
function modalTyped() {
  const boxes = [...document.querySelectorAll('#scrim.on, #scrim2.on')];
  if (!boxes.length) return false;
  if (ID_ED || ID_CEDIT) return true;
  return boxes.some(b => [...b.querySelectorAll('textarea, input')].some(e => !['checkbox', 'radio', 'button', 'submit', 'hidden'].includes(e.type)
    && e.value !== e.defaultValue) || [...b.querySelectorAll('[contenteditable="true"]')].some(e => e.textContent.trim()));
}
/* Erişim değişince (18): artık görünmeyen işin ya da (iş açık değilken) seçili projenin açık penceresi kapanır;
   veri ekranda kalmaz. Sunucu zaten yazmayı reddeder; yazılmış metin varsa kullanıcı uyarılır. */
function dropLostModal(openId, prevProj, typed) {
  if (!document.getElementById('scrim')?.classList.contains('on')) return;
  const lost = openId ? !issue(openId) : !!prevProj && !DB.projects.some(p => p.id === prevProj);
  if (!lost) return;
  closeSub(); closeModal();
  toast(typed ? 'Bu kayda erişiminiz kalmadı; yazdığınız metin kaydedilmedi' : 'Bu kayda erişiminiz kalmadı');
}

let LOST = null;
function sessionLost() {
  if (SNAP && DB && ME) {
    const ch = diffSnap(SNAP, snapOf(DB));
    if (ch.length) LOST = { user: ME.id, changes: ch };
  }
  ME = null; SNAP = null; clearInterval(pollT);
  closeModal && closeModal();
  showLogin('Oturumunuz sona erdi, lütfen tekrar giriş yapın.');
}
</script>
<script>
/* ============================================================
   Bölüm 15: DOSYAYA KAYDETME
   Veri, HTML'in içindeki <script id="pano-data"> bloğuna gömülür.
   Tarayıcı bir sayfanın kendi dosyasına sessizce yazmasına izin
   vermez; bu yüzden kaydetme her zaman kullanıcının bir eylemiyle
   olur. Destekleyen tarayıcılarda (Chrome/Edge, http(s) üzerinden)
   dosya tutamacı alınıp aynı dosyanın üzerine yazılır; aksi halde
   yeni bir kopya indirilir ve eskisiyle değiştirilir.
   ============================================================ */

let FILE_HANDLE = null;   // File System Access API tutamacı
let FS_STATE = 'none';    // none | ready | prompt | blocked
let DIRTY = false;        // dosyaya yazılmamış değişiklik var mı
let AUTOSAVE = true;
let autoT = null;

/* Sayfa açıldığında, hiçbir şey çizilmeden önce alınan temiz şablon. */
const TEMPLATE = document.documentElement.outerHTML;

/* ---- tutamağı IndexedDB'de sakla: sayfayı yenileyince dosya bağlı kalsın ---- */
const idbOpen = () => new Promise((res, rej) => {
  const r = indexedDB.open('pano-fs', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('h');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function idbGet(k) {
  try { const db = await idbOpen(); return await new Promise(r => {
    const q = db.transaction('h').objectStore('h').get(k);
    q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); }
  catch (e) { return null; }
}
async function idbSet(k, v) {
  try { const db = await idbOpen(); await new Promise(r => {
    const q = db.transaction('h', 'readwrite').objectStore('h').put(v, k);
    q.onsuccess = () => r(1); q.onerror = () => r(0); }); } catch (e) { }
}

function embeddedData() {
  const el = document.getElementById('pano-data');
  if (!el) return null;
  const t = el.textContent.trim();
  if (!t || t === 'null') return null;
  try { return JSON.parse(t); } catch (e) { return null; }
}

function buildHtml() {
  DB.savedAt = Date.now();
  DB.savedBy = CU()?.name || '';
  const json = JSON.stringify(DB).replace(/</g, '\\u003c');
  const body = TEMPLATE.replace(
    /(<script id="pano-data"[^>]*>)[\s\S]*?(<\/script>)/,
    (_, a, b) => a + json + b);
  return '<!DOCTYPE html>\n' + body;
}

/* Açılışta önceki tutamağı geri yükle. */
async function initFileHandle() {
  if (!window.showSaveFilePicker) { FS_STATE = 'blocked'; return renderFileBar(); }
  const h = await idbGet('handle');
  if (!h) { FS_STATE = 'none'; return renderFileBar(); }
  FILE_HANDLE = h;
  try {
    const p = await h.queryPermission({ mode: 'readwrite' });
    FS_STATE = p === 'granted' ? 'ready' : 'prompt';
  } catch (e) { FS_STATE = 'prompt'; }
  renderFileBar();
}

async function ensurePermission() {
  if (!FILE_HANDLE) return false;
  try {
    if (await FILE_HANDLE.queryPermission({ mode: 'readwrite' }) === 'granted') { FS_STATE = 'ready'; return true; }
    if (await FILE_HANDLE.requestPermission({ mode: 'readwrite' }) === 'granted') { FS_STATE = 'ready'; return true; }
  } catch (e) { }
  FS_STATE = 'prompt'; return false;
}

async function writeHandle() {
  const wr = await FILE_HANDLE.createWritable();
  await wr.write(buildHtml());
  await wr.close();
  markClean();
}

async function pickFile() {
  try {
    FILE_HANDLE = await window.showSaveFilePicker({
      suggestedName: 'Kanbanpano.html',
      types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }],
    });

    FS_STATE = 'ready';
    await writeHandle();
    toast('Dosya bağlandı — değişiklikler artık buraya kaydedilir');
    return true;
  } catch (e) {
    if (e && e.name === 'AbortError') return false;   // kullanıcı vazgeçti
    FILE_HANDLE = null; FS_STATE = 'blocked';
    renderFileBar();
    return false;
  }
}

/* Yazılamadığında ne olduğunu açıkla; indirme ancak kullanıcı isterse. */

          : '<b>1.</b> Chrome veya Edge ile açarsan dosyaya doğrudan kaydedebilirsin.<br><b>2.</b> Ya da JSON yedeği al.'}

async function saveToFile(pickNew) {

/* Dosya bağlıyken sessiz otomatik kayıt. */

/* Kayıt durumu yalnız SORUN olduğunda görünür (üst çubukta çip): çevrimdışı, gönderim başarısız ya da 10 sn'den uzun
   süren kaydetme. Tıklamak hemen yeniden dener (data-act="savefile"). Normal durumda hiçbir gösterge yok. */
let SYNC_SLOW_T = null, SYNC_BUSY_AT = 0;
const SYNC_SLOW_MS = 10000;
function syncProblem() {
  if (!DIRTY) return '';
  if (navigator.onLine === false) return 'Bağlantı yok — değişiklikler bekliyor';
  if (SYNC_STATE === 'error') return 'Kaydedilemedi, yeniden deneniyor';

  return '';
}
function renderFileBar() {
  if (SYNC_STATE === 'ok') { SYNC_BUSY_AT = 0; clearTimeout(SYNC_SLOW_T); SYNC_SLOW_T = null; }
  else if (!SYNC_BUSY_AT) { SYNC_BUSY_AT = Date.now(); clearTimeout(SYNC_SLOW_T); SYNC_SLOW_T = setTimeout(renderFileBar, SYNC_SLOW_MS + 50); }
  const el = document.getElementById('syncWarn'); if (!el) return;
  const t = syncProblem(), cur = el.querySelector('button')?.dataset.msg || '';

  el.innerHTML = t ? `<button type="button" class="nv-syncchip" data-act="savefile" data-msg="${esc(t)}" title="Şimdi yeniden dene">${ic(navigator.onLine === false ? 'alert' : 'sync')}<span>${esc(t)}</span></button>` : '';
}

/* ---- tarih yardımcıları (hepsi yerel, ISO 'YYYY-MM-DD') ---- */
const iso  = d => { const t = new Date(d); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0, 10); };
const addD = (d, n) => { const t = new Date(d); t.setDate(t.getDate() + n); return t; };
const TODAY = iso(new Date());
const monday = d => { const t = new Date(d); const w = (t.getDay() + 6) % 7; return addD(t, -w); };
const fmtD = s => { if (!s) return '—'; const [y, m, dd] = s.split('-'); return `${dd}.${m}`; };

const DAYS = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];

/* ---- süre: Jira ile aynı gramer → 3w 2d 4h 30m ---- */
let H_PER_DAY = 8, D_PER_WEEK = 5;
function parseDur(str) {
  if (str == null || str === '') return 0;
  if (typeof str === 'number') return str;
  let h = 0, hit = false;
  String(str).toLowerCase().replace(/(\d+(?:[.,]\d+)?)\s*([wdhm])/g, (_, n, u) => {
    n = parseFloat(n.replace(',', '.')); hit = true;
    h += n * ({ w: H_PER_DAY * D_PER_WEEK, d: H_PER_DAY, h: 1, m: 1 / 60 }[u]);
    return '';
  });
  if (!hit) { const n = parseFloat(String(str).replace(',', '.')); return isNaN(n) ? 0 : n; }
  return h;
}
function fmtDur(h) {
  if (!h) return '0h';
  const w = Math.floor(h / (H_PER_DAY * D_PER_WEEK)); h -= w * H_PER_DAY * D_PER_WEEK;
  const d = Math.floor(h / H_PER_DAY); h -= d * H_PER_DAY;
  const hh = Math.floor(h); const m = Math.round((h - hh) * 60);
  return [w && w + 'w', d && d + 'd', hh && hh + 'h', m && m + 'm'].filter(Boolean).join(' ') || '0h';
}

  D.forEach(([t, s, st, as, pts, est, sp, ep, pri]) => {
    add({
      projectId: 'p1', type: t, summary: s, statusId: st == null ? S('p1', 0) : S('p1', st),
      assignee: as, reporter: 'u1', points: pts, estimate: parseDur(est),
      sprintId: sp, epicId: ep ? ep.id : null, priority: pri,
      description: s + ' — kabul kriterleri detaylandırılacak.',
    });
  });
  [['task', 'Runner havuzunu ölçekle', 1, 'u4', 5], ['bug', 'Nightly build zaman aşımı', 1, 'u4', 3],
   ['task', 'Docker imajını küçült', 0, 'u5', 3], ['task', 'Secret rotasyonu', 2, 'u4', 2]]
    .forEach(([t, s, st, as, pts], i) => add({
      projectId: 'p2', type: t, summary: s, statusId: S('p2', st), assignee: as,
      reporter: 'u4', points: pts, estimate: parseDur('1d'), sprintId: i < 3 ? 'sp4' : null, priority: 3,
    }));

  /* Demo işlere gerçekçi plan tarihleri ver. */
  issues.filter(i => i.type !== 'epic').forEach((i, k) => {
    const s = addWorkdays(iso(addD(m, -10)), (k * 2) % 22);
    i.start = s; i.due = addWorkdays(s, 1 + (k % 5));
  });

  /* Demo iş listesi beş kişilik yazılmıştı; kalan referansları üç kişiye dağıt. */
  const valid = new Set(U.map(u => u.id));
  const fixU = id => !id ? null : (valid.has(id) ? id : U[(parseInt(String(id).slice(1), 10) - 1) % U.length].id);
  issues.forEach(i => { i.assignee = fixU(i.assignee); i.reporter = fixU(i.reporter) || U[0].id; });
  projects.forEach(p => p.lead = fixU(p.lead));

  /* worklog: son 3 hafta, gerçekçi dağılım */
  const pool = issues.filter(i => i.type !== 'epic' && i.sprintId);
  for (let d = -80; d <= 0; d++) {
    const day = addD(new Date(), d);
    if (day.getDay() === 0 || day.getDay() === 6) continue;
    U.forEach(u => {
      const mine = pool.filter(i => i.assignee === u.id);
      if (!mine.length) return;
      if (Math.random() < .12) return;                 // izin / boş gün
      let left = 4 + Math.floor(Math.random() * 5);
      for (let k = 0; k < 3 && left > 0; k++) {
        const it = mine[Math.floor(Math.random() * mine.length)];
        const h = Math.min(left, [1, 2, 2, 3, 4][Math.floor(Math.random() * 5)]);
        worklogs.push({ id: uid('w'), issueId: it.id, userId: u.id, date: iso(day), hours: h, comment: '' });
        left -= h;
      }
    });
  }
  worklogs.forEach(w => { const i = issues.find(x => x.id === w.issueId); if (i) i.spent += w.hours; });
  issues.forEach(i => i.remainingEst = Math.max(0, (i.estimate || 0) - (i.spent || 0)));

  comments.push(
    { id: uid('c'), issueId: issues[3].id, userId: 'u3', at: Date.now() - 7200000, body: 'Kalan süre = tahmin − harcanan olmalı, negatifse 0 gösterelim.' },

  history.push({ id: uid('h'), issueId: issues[3].id, userId: 'u3', at: Date.now() - 9000000, field: 'Durum', from: 'Yapılacak', to: 'Geliştirmede' });

  /* Müşteri atamaları cariden (görev 11b): demo işleri iki cariye bağlı, kalanlar projenin carisini alır. */
  const fields = [];
  const customers = [
    { id: 'cu_acme', name: 'Acme', kind: 'customer', active: true, contacts: [] },
    { id: 'cu_globex', name: 'Globex', kind: 'customer', active: true, contacts: [] },
  ];
  issues.forEach((i, k) => { i.cf = {}; if (k % 3 < 2) i.customerId = k % 3 === 0 ? 'cu_acme' : 'cu_globex'; });
  const rules = [
    { id: 'r1', projectId: 'p1', name: 'İncelemeye geçince Adem\'e ata', on: 'status', whenStatus: 'p1_s2',
      then: [{ act: 'assign', v: 'u2' }, { act: 'label', v: 'inceleme' }], enabled: true },
  ];
  const links = [{ id: 'l1', from: issues[6].id, to: issues[7].id, type: 'blocks' }];
  comments.forEach(c => c.userId = fixU(c.userId));
  history.forEach(x => x.userId = fixU(x.userId));

  /* Gerçekçi durum geçişi geçmişi — kümülatif akış ve döngü süresi
     raporlarının demo veride de anlamlı çıkması için. */
  const transitions = [];
  issues.filter(i => i.type !== 'epic').forEach(i => {
    const chain = statuses.filter(s => s.projectId === i.projectId).sort((a, b) => a.ord - b.ord);
    const target = chain.findIndex(s => s.id === i.statusId);
    if (target < 1) return;
    let day = 26 - Math.floor(Math.random() * 8);
    for (let k = 1; k <= target; k++) {
      day -= 1 + Math.floor(Math.random() * 5);
      if (day < 0) day = 0;
      const d = iso(addD(new Date(), -day));
      transitions.push({ id: uid('t'), issueId: i.id, at: new Date(d).getTime(), date: d,
        from: chain[k - 1].id, to: chain[k].id });
      if (chain[k].cat === 'done') i.doneAt = d;
    }
  });
  transitions.sort((a, b) => a.date.localeCompare(b.date));

  return {
    users: U, projects, statuses, sprints, issues, worklogs, comments, history,
    fields, customers, rules, links, transitions, filters: [], cfg: { h: H_PER_DAY, d: D_PER_WEEK,
      modules: { ...MODULE_DEFAULTS }, types: TYPE_DEFAULTS.map(t => ({ ...t })),
      defaultStatuses: STATUS_TEMPLATES.uyarlama[1].map(x => [...x]) },
    board: { swimlane: 'none', filterUser: '', filterType: '', q: '' },
    ui: { project: 'p1', view: 'board', week: iso(monday(new Date())), tsMode: 'user' },
  };
}

   Metinler kırpılır: açıklama 120, yorum 80, diğerleri 200 karakter (sunucu da 200'e kırpar). */
let RULE_CTX = null;
const HIST_CLIP = { 'Açıklama': 120, 'Yorum': 80 };
const histClip = (v, n) => { if (typeof v !== 'string') return v ?? '';
  const s = n < 200 ? v.replace(/\s+/g, ' ').trim() : v; return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function logHist(i, field, from, to, o = {}) {
  if (!i) return;
  i.updatedAt = Date.now();
  if (!o.kind && String(from) === String(to)) return;
  const n = HIST_CLIP[field] || 200;
  const h = { id: uid('h'), issueId: i.id, userId: CU().id, at: Date.now(), field, from: histClip(from, n), to: histClip(to, n) };
  if (o.kind) h.kind = o.kind;
  if (o.key) h.key = histClip(String(o.key), 200);
  if (RULE_CTX) h.rule = histClip(String(RULE_CTX), 200);

}

function histName(f, v) {
  if (f === 'sprintId') return v ? sprint(v)?.name || String(v) : 'Backlog';
  if (f === 'epicId') return v ? issue(v)?.summary || String(v) : 'Yok';
  if (f === 'reporter' || f === 'assignee') return v ? user(v)?.name || String(v) : '—';
  if (f === 'type') return v ? TYPE[v]?.[2] || String(v) : '—';
  if (f === 'start' || f === 'due') return v ? fmtDMid(v) : '—';
  if (f === 'parentId') return v ? issue(v)?.key || String(v) : 'Yok';
  if (f === 'customerId') return v ? cuById(v)?.name || String(v) : 'Yok';
  return v ?? '—';
}
/* Alanı yazar ve geçmişe adla kaydeder (toplu düzenleme, kolon/kişi/tip/sprint silme, otomasyon). */
function histSet(i, f, v) {
  if (String(i[f] ?? '') === String(v ?? '')) return false;
  logHist(i, ID_LABEL[f] || f, histName(f, i[f]), histName(f, v));
  i[f] = v; return true;
}
const labelAdd = (i, v) => { v = String(v || '').trim(); if (!v || (i.labels || []).includes(v)) return false;
  i.labels = [...(i.labels || []), v]; logHist(i, 'Etiket', '', v, { kind: 'add' }); return true; };
const labelDel = (i, v) => { if (!(i.labels || []).includes(v)) return false;
  i.labels = i.labels.filter(l => l !== v); logHist(i, 'Etiket', v, '', { kind: 'remove' }); return true; };

function linkHist(l, kind) {

}

/* Bildirim. toast('metin') eskisi gibi 2 sn düz metin. Eylemli çeşit:
   toast('metin', { label: 'Geri al', fn, ms }) → eylem + kapat düğmesi, süre çizgisi (varsayılan 6 sn);
   toast('metin', { warn: true }) → kırmızı ikonlu, düğmesiz (varsayılan 4 sn).
   Üzerine gelince ya da odak içindeyken süre durur. Metin her zaman kaçışlı basılır. */
function toast(msg, o) {
  const t = $('#toast');
  clearTimeout(toast._t); toast._fn = null; toast._left = 0;
  t.inert = false;
  if (!o) {
    t.className = 'toast on'; t.textContent = msg;
    toast._t = setTimeout(() => t.classList.remove('on'), 2000);
    return;
  }
  const ms = o.ms || (o.label ? 6000 : 4000);
  t.className = 'toast on rich' + (o.warn ? ' t-warn' : '');
  t.innerHTML = `${ic(o.warn ? 'alert' : 'checkc')}<span class="tx">${esc(msg)}</span>${o.label
    ? `<button type="button" class="toast-undo">${esc(o.label)}</button>`
      + `<button type="button" class="toast-x" aria-label="Kapat" title="Kapat">${ic('x')}</button>` : ''}`
    + `<span class="tm" style="animation-duration:${ms}ms"></span>`;
  toast._fn = typeof o.fn === 'function' ? o.fn : null;
  toast._left = ms; toast._at = Date.now();
  toast._t = setTimeout(toastHide, ms);
}
function toastHide() {
  const t = $('#toast');
  clearTimeout(toast._t); toast._fn = null; toast._left = 0;
  t.classList.remove('on');
  if (t.classList.contains('rich')) {
    if (t.contains(document.activeElement)) document.activeElement.blur();
    t.inert = true;
  }
}
function toastPause(on) {
  const t = $('#toast');
  if (!t.classList.contains('rich') || !t.classList.contains('on') || !toast._left) return;
  if (on) {
    if (t.classList.contains('paused')) return;
    clearTimeout(toast._t);
    toast._left = Math.max(800, toast._left - (Date.now() - toast._at));
    t.classList.add('paused');
  } else {
    if (!t.classList.contains('paused') || t.matches(':hover') || t.contains(document.activeElement)) return;
    t.classList.remove('paused');
    toast._at = Date.now(); toast._t = setTimeout(toastHide, toast._left);
  }
}
function wireToast() {
  const t = $('#toast');
  t.addEventListener('click', e => {
    if (e.target.closest('.toast-undo')) { const fn = toast._fn; toastHide(); if (fn) fn(); }
    else if (e.target.closest('.toast-x')) toastHide();
  });
  t.addEventListener('mouseenter', () => toastPause(true));
  t.addEventListener('mouseleave', () => toastPause(false));
  t.addEventListener('focusin', () => toastPause(true));
  t.addEventListener('focusout', () => setTimeout(() => toastPause(false), 0));
}

/* ---- ortak sürükle-bırak: hedefteki sıraya göre rank hesabı ---- */
let DRAG = null;
function dropIndexRank(container, y, sel) {
  const rows = [...container.querySelectorAll(sel)].filter(el => el.dataset.id !== DRAG);
  let before = null;
  for (const el of rows) {
    const r = el.getBoundingClientRect();
    if (y < r.top + r.height / 2) { before = el; break; }
  }
  const list = rows.map(el => issue(el.dataset.id).rank);
  if (!rows.length) return 1000;
  if (!before) return list[list.length - 1] + 100;
  const idx = rows.indexOf(before);
  return rankBetween(idx === 0 ? null : list[idx - 1], list[idx]);
}

addEventListener('keydown', e => {
  if (!QM) return;
  const opts = [...QM.el.querySelectorAll('.qm-opt')];
  const idx = opts.indexOf(document.activeElement);
  const stop = () => { e.preventDefault(); e.stopPropagation(); };
  if (e.key === 'Escape') { stop(); return closeQuick(true); }
  if (e.key === 'Tab') { e.stopPropagation(); return closeQuick(true); }
  const nav = ['ArrowDown', 'ArrowUp'].concat(e.target.classList?.contains('qm-in') ? [] : ['Home', 'End']);
  if (nav.includes(e.key) && opts.length) {
    stop();
    const n = opts.length;
    const k = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1
      : idx < 0 ? (e.key === 'ArrowDown' ? 0 : n - 1) : (idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
    return opts[k].focus();
  }
  if (QM.kind === 'pri' && /^[1-4]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { stop(); return pickQuick(+e.key); }
  if (e.key === 'Enter' && e.target.classList?.contains('qm-in')) { stop(); const o = opts[0]; if (o) pickQuick(o.dataset.qv); return; }

}, true);

/* ---- sprint yaşam döngüsü (Jira ile aynı kurallar) ----
   Başlatma/tamamlama yalnız alan yöneticisinde (canManageProject); asıl kural sunucuda (store.js checkSprintState).
   Sprint süresi projede (projects.data.sprintWeeks, 1–8 hafta, varsayılan 1). */
const SPRINT_FORBIDDEN = 'Sprinti yalnızca alan yöneticisi başlatıp bitirebilir';
const sprintWeeks = p => { const w = p?.sprintWeeks; return Number.isInteger(w) && w >= 1 && w <= 8 ? w : 1; };
const sprintEnd = (start, p) => iso(addD(start + 'T12:00', sprintWeeks(p) * 7 - 1));
/* Yeni sprintin önerilen tarihleri: önceki sprintin bitişinin ertesi günü (yoksa bu pazartesi) + süre. */
function sprintRange(p) {
  const last = DB.sprints.filter(s => s.projectId === p?.id && s.end).map(s => s.end).sort().pop();
  const now = new Date(), mon = addD(now, -((now.getDay() + 6) % 7));
  const start = last ? iso(addD(last + 'T12:00', 1)) : iso(mon);
  return { start, end: sprintEnd(start, p) };
}
/* Sprint özetleri (pencereler ve Aktif sprint sekmesi): iş sayısı, tamamlanan, tahmin saatleri. */
function sprintStats(sid) {
  const items = issuesOf().filter(i => i.sprintId === sid && i.type !== 'epic');
  const done = items.filter(isDone);
  const est = items.reduce((a, i) => a + (i.estimate || 0), 0), estDone = done.reduce((a, i) => a + (i.estimate || 0), 0);
  return { items, n: items.length, done: done.length, open: items.length - done.length, est, estDone, noEst: items.filter(i => !i.estimate).length };
}
const spDays = (a, b) => (a && b ? Math.round((hmDay(b) - hmDay(a)) / 864e5) + 1 : 0);
const spStat = (v, l, cls = '') => `<div class="sp-stat ${cls}"><b class="num">${v}</b><small>${l}</small></div>`;
const spBar = (pct, cls = '', label = '') => `<div class="sp-bar ${cls}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(Math.min(100, pct))}"${label ? ` aria-label="${esc(label)}"` : ''}><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>`;
const spHead = (icon, id, title, sub) => `<div class="id-mh"><span class="id-mic">${ic(icon)}</span>
    <div class="tx"><b id="${id}">${title}</b><div class="sub">${sub}</div></div>
    <button type="button" class="id-ib" data-close aria-label="Kapat">${ic('x')}</button></div>`;
const spDlg = (tid) => { const m = $('#scrim .modal'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', tid); return m; };

function startSprint(id) {
  const s = sprint(id), pr = P();
  if (!s) return;
  if (!canManageProject(pr)) return toast(SPRINT_FORBIDDEN);
  if (activeSprint()) return toast('Zaten aktif bir sprint var. Önce onu tamamlayın.');
  const st = sprintStats(id);
  if (!st.n) return toast('Sprintte iş yok. Önce backlog\'dan iş taşıyın.');
  const start = s.start || TODAY, end = s.start ? (s.end || sprintEnd(start, pr)) : sprintEnd(TODAY, pr);
  const days = spDays(start, end), wk = Math.max(1, days) / 7;
  const cap = projUsers().reduce((a, u) => a + capOf(u) * wk, 0);
  const load = cap ? st.est / cap * 100 : 0;
  openModal(`${spHead('sprint', 'spStartT', 'Sprinti başlat', `<span class="k">${esc(pr.key)}</span> ${esc(s.name)}`)}
    <div class="id-mb">
      ${s.goal ? `<div class="sp-goal">${ic('flag')}<span>${esc(s.goal)}</span></div>` : ''}
      <div class="sp-stats">
        ${spStat(st.n, 'iş')}${spStat(fmtDur(st.est), 'tahmin')}${spStat(days, 'gün · ' + esc(fmtD(start)) + ' → ' + esc(fmtD(end)))}
      </div>
      ${cap ? `<div class="sp-cap">
        <div class="sp-capl"><span>Ekip kapasitesi <b class="num">${fmtDur(cap)}</b></span><span class="${load > 100 ? 'bad' : ''}">${load > 100 ? 'Kapasite aşılıyor · doluluk' : 'Doluluk'} <b class="num">%${Math.round(load)}</b></span></div>
        ${spBar(load, load > 100 ? 'over' : load > 85 ? 'warn' : '', 'Tahmin / kapasite')}</div>` : ''}
      ${st.noEst ? `<div class="id-hint sp-note">${ic('alert')}${st.noEst} işin tahmini yok; toplam eksik görünebilir.</div>` : ''}
    </div>
    <div class="m-f"><span class="spacer"></span><button type="button" class="btn" data-close>Vazgeç</button>
      <button type="button" class="btn pri" id="doStart">${ic('sprint')}Sprinti başlat</button></div>`, 'id-m narrow sp-m id-trap');
  spDlg('spStartT');
  $('#doStart').onclick = () => {
    if (activeSprint()) { closeModal(); return toast('Zaten aktif bir sprint var. Önce onu tamamlayın.'); }
    s.state = 'active'; s.start = start; s.end = end;
    closeModal(); save(); render(); toast(s.name + ' başlatıldı');
  };
  setTimeout(() => $('#doStart')?.focus(), 40);
}
function completeSprint(id) {
  const s = sprint(id), pr = P();
  if (!s) return;
  if (!canManageProject(pr)) return toast(SPRINT_FORBIDDEN);
  const st = sprintStats(id);
  const open = st.items.filter(i => !isDone(i));
  const nexts = sprintsOf().filter(x => x.state === 'future');
  const pct = st.n ? st.done / st.n * 100 : 0;
  const dests = [...nexts.map(x => [x.id, x.name, x.start ? `${fmtD(x.start)} → ${fmtD(x.end)}` : 'Sonraki sprint']), ['', 'Backlog', 'Planlanmamış işler']];
  openModal(`${spHead('checkc', 'spDoneT', 'Sprinti tamamla', `<span class="k">${esc(pr.key)}</span> ${esc(s.name)}`)}
    <div class="id-mb">
      <div class="sp-stats">
        ${spStat(st.done, 'tamamlandı', 'ok')}${spStat(st.open, 'tamamlanmadı', st.open ? 'warn' : '')}${spStat(fmtDur(st.estDone), 'tamamlanan tahmin')}
      </div>
      <div class="sp-cap">
        <div class="sp-capl"><span>Başarı</span><span><b class="num">%${Math.round(pct)}</b> · ${st.done}/${st.n} iş</span></div>
        ${spBar(pct, 'done', 'Tamamlanan iş oranı')}</div>
      ${open.length ? `<div class="id-fl">Tamamlanmayan ${open.length} iş nereye taşınsın?</div>
        <div class="id-types sp-dest" role="radiogroup" aria-label="Tamamlanmayan işlerin hedefi">${dests.map(([v, n, sub], k) =>
          `<button type="button" class="id-tcard" role="radio" data-dest="${esc(v)}" aria-checked="${k === 0}">
            <span class="id-mic sm">${ic(v ? 'sprint' : 'backlog')}</span><span class="tx"><b>${esc(n)}</b><small>${esc(sub)}</small></span></button>`).join('')}</div>`
        : `<div class="sp-goal ok">${ic('checkc')}<span>Tüm işler tamamlandı. Tebrikler!</span></div>`}
    </div>
    <div class="m-f"><span class="spacer"></span><button type="button" class="btn" data-close>Vazgeç</button>
      <button type="button" class="btn pri" id="doComplete">${ic('check')}Sprinti tamamla</button></div>`, 'id-m narrow sp-m id-trap');
  const m = spDlg('spDoneT');
  const g = m.querySelector('.sp-dest');
  if (g) {
    g.onclick = e => { const b = e.target.closest('[data-dest]'); if (!b) return; g.querySelectorAll('[data-dest]').forEach(x => x.setAttribute('aria-checked', String(x === b))); };
    g.onkeydown = e => { if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
      const r = [...g.querySelectorAll('[role=radio]')], k = r.indexOf(e.target); if (k < 0) return;
      e.preventDefault(); const n = r[(k + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1) + r.length) % r.length]; n.focus(); n.click(); };
  }
  $('#doComplete').onclick = () => {
    const to = m.querySelector('.sp-dest [aria-checked="true"]')?.dataset.dest || null;
    open.forEach(i => { i.sprintId = to; logHist(i, 'Sprint', s.name, to ? sprint(to).name : 'Backlog'); });
    s.state = 'closed'; s.end = TODAY;
    closeModal(); save(); render(); toast(`${s.name} tamamlandı · %${Math.round(pct)} başarı`);
  };
  setTimeout(() => $('#doComplete')?.focus(), 40);
}

function renderSprint() {
  if (!stats().length) return noColsView();

/* ============================ YOL HARİTASI ============================ */
function epicRange(e) {
  const kids = issuesOf().filter(i => i.epicId === e.id);
  const sps = kids.map(k => k.sprintId && sprint(k.sprintId)).filter(s => s && s.start);
  const start = e.start || (sps.length ? sps.map(s => s.start).sort()[0] : iso(addD(new Date(), -7)));
  const end = e.due || (sps.length ? sps.map(s => s.end).sort().pop() : iso(addD(new Date(), 21)));
  const done = kids.filter(k => stat(k.statusId).cat === 'done').length;
  return { start, end, kids, pct: kids.length ? Math.round(done / kids.length * 100) : 0 };
}

function renderRoadmap() {
  const w0 = monday(addD(new Date(), -21)), N = 14;
  const weeks = Array.from({ length: N }, (_, k) => addD(w0, k * 7));
  const colW = 100 / N;
  const dayPos = d => {
    const diff = (new Date(d) - w0) / 86400000 / 7;
    return Math.max(0, Math.min(N, diff)) * colW;
  };
  const eps = epicsOf();
  if (!eps.length) return '<div class="panel"><div class="empty">Bu projede epik yok. Backlog\'da “+ İş oluştur” ile tip olarak Epik seçin.</div></div>';

  return `<div class="rmwrap"><table class="rm">
    <thead><tr><th class="lead">Epik</th>
      ${weeks.map(d => `<th>${fmtD(iso(d))}</th>`).join('')}</tr></thead>
    <tbody>${eps.map(e => {
      const r = epicRange(e);
      const L = dayPos(r.start), R = dayPos(addD(new Date(r.end), 1));
      const late = r.end < TODAY && r.pct < 100;
      return `<tr data-open="${e.id}" style="cursor:pointer">
        <td class="lead">
          <div style="display:flex;align-items:center;gap:8px">
            ${tIcon('epic')}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.summary)}</span>
            <span class="k" style="color:var(--ink3)">${r.pct}%</span>${avat(e.assignee)}
          </div>
        </td>
        <td colspan="${N}"><div class="track">
          <div class="today" style="left:${dayPos(TODAY)}%"></div>
          <div class="gantt" style="left:${L}%;width:${Math.max(R - L, 3)}%;background:${safeColor(e.color || '#6B4FBB')};${late ? 'box-shadow:inset 0 0 0 2px var(--risk)' : ''}">
            <i style="width:${r.pct}%"></i>
            <span style="position:relative">${r.kids.length} iş · ${fmtD(r.end)}</span>
          </div>
        </div></td></tr>`;
    }).join('')}</tbody></table></div>
    <p style="color:var(--ink3);font-size:11.5px;margin-top:8px">
      Kırmızı dikey çizgi bugünü, çubuk içindeki açık alan tamamlanma oranını gösterir.
      Epik tarihleri, alt işlerin sprintlerinden türetilir; epiği açıp elle de verebilirsiniz.</p>`;
}

/* ============================ RAPORLAR ============================ */
function svgLine(w, h, pts, color, dash) {
  return `<polyline fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="5 4"' : ''}
    points="${pts.map(p => p.join(',')).join(' ')}"/>`;
}
function doneDate(i) {
  if (i.doneAt) return i.doneAt;
  const h = DB.history.filter(x => x.issueId === i.id && x.field === 'Durum').pop();
  return h ? iso(new Date(h.at)) : null;
}

function burndown(s) {
  const W = 460, H = 180, PL = 34, PB = 22;
  const items = DB.issues.filter(i => i.sprintId === s.id);
  const total = items.reduce((a, i) => a + (i.points || 0), 0) || 1;
  const n = Math.max(1, Math.round((new Date(s.end) - new Date(s.start)) / 86400000));
  const days = Array.from({ length: n + 1 }, (_, k) => iso(addD(new Date(s.start), k)));
  const x = k => PL + k * (W - PL - 8) / n;
  const y = v => 8 + (1 - v / total) * (H - PB - 8);

  let left = total; const real = [];
  days.forEach((d, k) => {
    if (d > TODAY) return;
    items.forEach(i => { if (stat(i.statusId).cat === 'done' && doneDate(i) === d) left -= (i.points || 0); });
    real.push([x(k), y(left)]);
  });
  const ideal = [[x(0), y(total)], [x(n), y(0)]];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sprint burndown">
    ${[0, .5, 1].map(f => `<line x1="${PL}" x2="${W - 8}" y1="${y(total * f)}" y2="${y(total * f)}" stroke="var(--line)"/>
      <text x="4" y="${y(total * f) + 4}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${Math.round(total * f)}</text>`).join('')}
    ${svgLine(W, H, ideal, '#C7CBD1', true)}
    ${svgLine(W, H, real, 'var(--accent)')}
    ${real.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join('')}
    <text x="${PL}" y="${H - 6}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(s.start)}</text>
    <text x="${W - 8}" y="${H - 6}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(s.end)}</text>
  </svg>`;
}

function velocity() {
  const done = sprintsOf().filter(s => s.state !== 'future').slice(-6);
  if (!done.length) return '<div class="empty">Henüz kapanmış sprint yok</div>';
  const data = done.map(s => {
    const it = DB.issues.filter(i => i.sprintId === s.id);
    return { s, c: it.reduce((a, i) => a + (i.points || 0), 0),
             d: it.filter(i => stat(i.statusId).cat === 'done').reduce((a, i) => a + (i.points || 0), 0) };
  });
  const max = Math.max(...data.map(d => d.c), 1), W = 460, H = 170, bw = (W - 20) / data.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sprint hızı">
    ${data.map((d, k) => {
      const x = 10 + k * bw, ch = (d.c / max) * (H - 40), dh = (d.d / max) * (H - 40);
      return `<rect x="${x + 6}" y="${H - 26 - ch}" width="${bw * .36}" height="${ch}" fill="#C7CBD1" rx="2"/>
        <rect x="${x + 6 + bw * .40}" y="${H - 26 - dh}" width="${bw * .36}" height="${dh}" fill="var(--accent)" rx="2"/>
        <text x="${x + bw / 2}" y="${H - 12}" text-anchor="middle" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${esc(d.s.name.replace(/^\S+\s/, ''))}</text>
        <text x="${x + bw / 2}" y="${H - 32 - Math.max(ch, dh)}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--ink2)">${d.d}/${d.c}</text>`;
    }).join('')}</svg>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--ink3);margin-top:4px">
      <span>▬ <span style="color:var(--ink2)">Taahhüt</span></span>
      <span style="color:var(--accent)">▬ <span style="color:var(--ink2)">Tamamlanan</span></span></div>`;
}

      </div>${burndown(act)}` : '<div class="empty">Backlog\'dan bir sprint başlatın</div>'}

    <section class="panel">
      <h3>Sprint hızı</h3><div class="sub">Taahhüt edilen ve tamamlanan puan</div>
      ${velocity()}
    </section>` : ''}

    <section class="panel">
      <h3>Kişi bazlı harcanan süre</h3>
      <div class="sub">${fmtD(days[0])} – ${fmtD(days[6])} haftası</div>
      ${perUser.map(p => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
        ${avat(p.u.id)}<span style="width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.u.name)}</span>
        <span style="flex:1;height:9px;background:var(--track);border-radius:5px;overflow:hidden">
          <i style="display:block;height:100%;width:${p.h / maxH * 100}%;background:${p.u.color}"></i></span>
        <b class="num" style="width:52px;text-align:right;font-size:12px">${fmtDur(p.h)}</b></div>`).join('')}
      <div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;justify-content:space-between">
        <span class="k" style="color:var(--ink3)">HAFTA TOPLAMI</span>
        <b class="num">${fmtDur(wl.reduce((a, w) => a + w.hours, 0))}</b></div>
    </section>

    <section class="panel">
      <h3>Kapasite planı</h3><div class="sub">${AGILE() ? 'Aktif sprint' : 'Açık işler'} · kalan iş yükü / kişi kapasitesi</div>
      ${capacityPanel()}
    </section>

    <section class="panel">
      <h3>Kümülatif akış</h3><div class="sub">Son 30 gün · durum bazında iş sayısı</div>
      ${cfd(30)}

/* o.rules === false: otomasyon kuralları çalışmaz (kolon silmede toplu taşıma, #12). */
function setStatus(i, sid, o = {}) {
  if (i.statusId === sid) return;
  const from = stat(i.statusId), to = stat(sid);
  logHist(i, 'Durum', from.name, to.name);
  i.statusId = sid;
  if (to.cat === 'done') i.doneAt = TODAY; else delete i.doneAt;
  i.updatedAt = Date.now();
  const par = to.cat === 'done' && from.cat !== 'done' && i.parentId && issue(i.parentId);
  if (par) logHist(par, 'Alt iş', '', `${i.key} ${i.summary || ''}`.trim(), { kind: 'done', key: i.key });
  recordTransition(i, from.id, sid);
  if (o.rules !== false) runRules(i, 'status');
}

function createIssue(pr, f, prefix = pr.key) {

    summary: '', description: '', statusId: statsOf(pr.id)[0]?.id, assignee: null, reporter: CU().id, priority: 3,
    points: null, estimate: est, remainingEst: est, spent: 0, labels: [], cf: {}, sprintId: null, epicId: null,
    parentId: null, start: '', due: '', created: Date.now(), updatedAt: Date.now(),
    billable: BILLABLE[0], billType: BILLTYPE[0], rank: Math.max(0, ...DB.issues.map(x => x.rank || 0)) + 100,
  }, f);
  if (f.remainingEst == null) it.remainingEst = it.estimate;

/* ---- 8 sn bekletme (HOLD): silinen kayıtlar yerelde çıkarılır, sunucuya süre dolunca gider ---- */
/* added: silmeyle birlikte EKLENEN kayıtlar (ör. "Yorumu sildi" geçmişi); onlar da bekletilir, Geri al'da kaldırılır. */
function holdStart(recs, msg, added = []) {
  holdReleaseAll();
  added = added.filter(([, x]) => x);
  const h = { keys: new Set([...recs, ...added].map(([c, x]) => c + '\u0001' + x.id)), before: recs.map(([c, x]) => [c, JSON.parse(JSON.stringify(x))]),
    added: added.map(([c, x]) => [c, x.id]), t: null };
  h.undo = () => holdUndo(h);
  HOLDS.push(h);
  const tick = () => {
    if (!HOLDS.includes(h)) return;
    const t = $('#toast');
    if (toast._fn === h.undo && t.classList.contains('on') && t.classList.contains('paused')) { h.t = setTimeout(tick, 500); return; }
    holdRelease(h);
  };
  h.t = setTimeout(tick, 8000);
  toast(msg, { label: 'Geri al', fn: h.undo, ms: 8000 });
  return h;
}
function holdRelease(h) {
  const k = HOLDS.indexOf(h); if (k < 0) return;
  HOLDS.splice(k, 1); clearTimeout(h.t);
  if (toast._fn === h.undo) toastHide();
  scheduleSync(50);
}
function holdReleaseAll() { [...HOLDS].forEach(holdRelease); }
function holdClear() { HOLDS.forEach(h => clearTimeout(h.t)); HOLDS.length = 0; }
function holdUndo(h) {
  if (!HOLDS.includes(h)) return toast('Geri alınamadı: silme sunucuya gönderildi', { warn: true });
  HOLDS.splice(HOLDS.indexOf(h), 1); clearTimeout(h.t);
  for (const [c, obj] of h.before) {
    const arr = (DB[c] ||= []), k = arr.findIndex(x => x && x.id === obj.id);
    if (k >= 0) { const o = arr[k]; for (const key of Object.keys(o)) delete o[key]; Object.assign(o, obj); } else arr.push(obj);
  }
  for (const [c, id] of h.added || []) if (Array.isArray(DB[c])) DB[c] = DB[c].filter(x => x?.id !== id);
  save();
  if (OPEN_ISSUE && issue(OPEN_ISSUE)) { RERENDER = true; refreshIssue(['all']); } else render();
  toast('Geri alındı');
}

function issueDelete(ids) {
  ids = ids.filter(id => issue(id)); if (!ids.length || !canEdit()) return;
  const set = new Set(ids), one = ids.length === 1 ? issue(ids[0]) : null;
  const cm = DB.comments.filter(c => set.has(c.issueId)), wl = DB.worklogs.filter(w => set.has(w.issueId));
  const ln = DB.links.filter(l => set.has(l.from) || set.has(l.to));
  const kids = DB.issues.filter(x => !set.has(x.id) && set.has(x.parentId)), ekids = DB.issues.filter(x => !set.has(x.id) && set.has(x.epicId));
  const hs = DB.history.filter(x => set.has(x.issueId)), tr = DB.transitions.filter(x => set.has(x.issueId));
  const hours = wl.reduce((a, w) => a + (w.hours || 0), 0);
  const warns = [];
  if (kids.length) warns.push(`<b>${kids.length} alt işin üst iş bağı kopar.</b> Alt işler silinmez, üst işsiz kalır.`);
  if (ekids.length) warns.push(`<b>${ekids.length} işin epik bağı kopar.</b> İşler silinmez.`);
  confirmDel({
    title: one ? 'İş silinsin mi?' : `${ids.length} iş silinsin mi?`, sub: 'Bağlı kayıtlarıyla birlikte çöp kutusuna gider.',
    item: one ? `${tIcon(one.type)}<span class="k">${esc(one.key)}</span><span class="t">${esc(one.summary)}</span>`
      : `<span class="t">${ids.slice(0, 5).map(id => esc(issue(id).key)).join(', ')}${ids.length > 5 ? ` +${ids.length - 5}` : ''}</span>`,
    counts: [['chat', cm.length, 'yorum'], ['clock', wl.length, `süre kaydı${hours ? ' · ' + fmtDur(hours) : ''}`], ['link', ln.length, 'bağlantı']],
    warns, undoText: ids.length > 1 ? 'işler ve bağlı kayıtları geri gelir' : 'iş ve bağlı kayıtları geri gelir',
    onOk: () => {
      const recs = [...ids.map(id => ['issues', issue(id)]), ...cm.map(x => ['comments', x]), ...wl.map(x => ['worklogs', x]),
        ...ln.map(x => ['links', x]), ...hs.map(x => ['history', x]), ...tr.map(x => ['transitions', x]),
        ...kids.map(x => ['issues', x]), ...ekids.filter(x => !kids.includes(x)).map(x => ['issues', x])];
      const keys = ids.map(id => issue(id).key), before = holdBefore(recs);   // kopya, bağlar koparılmadan önce
      DB.issues = DB.issues.filter(x => !set.has(x.id));
      DB.comments = DB.comments.filter(x => !set.has(x.issueId)); DB.worklogs = DB.worklogs.filter(x => !set.has(x.issueId));
      DB.history = DB.history.filter(x => !set.has(x.issueId)); DB.transitions = DB.transitions.filter(x => !set.has(x.issueId));
      DB.links = DB.links.filter(l => !set.has(l.from) && !set.has(l.to));
      kids.forEach(k => { k.parentId = null; }); ekids.forEach(k => { k.epicId = null; });
      ids.forEach(id => SEL.delete(id));
      if (set.has(OPEN_ISSUE)) closeModal();
      save(); render();
      const parts = [cm.length && `${cm.length} yorum`, wl.length && `${wl.length} süre kaydı`, ln.length && `${ln.length} bağlantı`].filter(Boolean);
      holdStart(before, `${keys.length > 1 ? keys.length + ' iş' : keys[0]} silindi.${parts.length ? ' ' + parts.join(', ') + ' ile birlikte' : ''}`);
    },
  });
}

/* Süre kaydı silmenin tek yolu (iş detayı, çizelge, efor listesi, düzenleme penceresi). */
function deleteWorklog(id) {
  const w = DB.worklogs.find(x => x.id === id); if (!w) return;
  if (!canOwn(w.userId)) return toast('Başkasının süre kaydını yalnızca yönetici silebilir');

    onOk: () => {

      holdStart(h, `Süre kaydı silindi: ${fmtDur(w.hours)}`, [['history', hx]]);
    } });
}
/* Kayıtların silmeden ÖNCEKİ kopyası (iş kaydı değişeceği için önce alınır). */

/* ---- alan yazımı: menü ve satır içi düzenleyicinin ortak kapısı ---- */
const ID_LABEL = { statusId: 'Durum', assignee: 'Atanan', reporter: 'Raporlayan', priority: 'Öncelik', type: 'Tip', points: 'Puan',
  sprintId: 'Sprint', epicId: 'Epik', parentId: 'Üst iş', due: 'Bitiş', start: 'Başlangıç', estimate: 'Tahmin', remainingEst: 'Kalan tahmin', billable: 'Faturalama', billType: 'Fatura türü', customerId: 'Cari' };
function idSet(i, f, v) {
  if (!i || !canEdit()) return false;
  if (f === 'statusId') { if (i.statusId === v || !stat(v)) return false; delete i.doneFrom; setStatus(i, v); }
  else if (f === 'priority') { if (!setPriority(i, +v)) return false; }
  else if (f === 'assignee') { if (!setAssignee(i, v || null)) return false; }
  else if (f === 'requester') {
    if (reqVal(i.requester) === reqVal(v)) return false;
    logHist(i, 'Talep eden', reqName(i.requester) || '—', reqName(v) || '—');
    i.requester = v || null;
  }
  else {
    const isDur = f === 'estimate' || f === 'remainingEst';
    const before = isDur ? fmtDur(f === 'estimate' ? i.estimate : remaining(i)) : histName(f, i[f]);
    if (f === 'points') { v = String(v ?? '').trim() === '' ? null : parseFloat(String(v).replace(',', '.')); if (Number.isNaN(v)) v = null; }
    else if (isDur) v = parseDur(v);
    else if (['sprintId', 'epicId', 'reporter'].includes(f)) v = v || null;
    else if (f === 'customerId') {
      v = v || '';
      if (v && v !== i.customerId && !cuActive(cuById(v))) { toast('Pasif cari işe bağlanamaz'); return false; }
    }
    if (isDur ? (f === 'estimate' ? (i.estimate || 0) === v : remaining(i) === v) : String(i[f] ?? '') === String(v ?? '')) return false;
    i[f] = v;
    if (f === 'estimate' && !i.spent) i.remainingEst = v;
    logHist(i, ID_LABEL[f] || f, before, isDur ? fmtDur(v) : histName(f, v));
  }
  i.updatedAt = Date.now();
  save(); RERENDER = true;
  return true;
}

/* ---- özellik menüleri (#8 hızlı menülerinin temeli: openQuick/qmMobile) ---- */
const pmOpt = (v, cur, icon, label, sub = '') => `<button type="button" class="qm-opt" role="menuitemradio" aria-checked="${String(cur ?? '') === String(v)}" data-qv="${esc(v)}">
  ${icon}<span class="qm-l">${label}${sub ? `<span class="qm-sub">${sub}</span>` : ''}</span>${String(cur ?? '') === String(v) ? `<span class="qm-chk">${ic('check')}</span>` : ''}</button>`;
function pmOpen(o) {
  closeQuick(false);
  const mob = qmMobile(), btn = o.btn;
  const wrap = document.createElement('div');
  wrap.className = 'qm-wrap id-pm' + (mob ? ' sheet' : '');
  wrap.innerHTML = `${mob ? '<div class="qm-dim"></div>' : ''}
    <div class="qm ${o.kind}" role="menu" aria-label="${esc(o.title)}">
      ${mob ? `<div class="qm-grab"></div><div class="qm-ttl">${esc(o.title)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</div>` : `<div class="qm-h">${esc(o.title)}</div>`}
      ${o.search ? `<label class="qm-q">${ic('search')}<input class="qm-in" type="search" placeholder="Kişi ara…" aria-label="Kişi ara" autocomplete="off"></label>` : ''}
      <div class="qm-list">${o.list('')}</div></div>`;
  document.body.appendChild(wrap);
  QM = { kind: o.kind, id: o.id || '', wrap, el: wrap.querySelector('.qm'), mob, sel: o.sel, pick: o.pick };
  btn.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
  wrap.addEventListener('click', e => { const x = e.target.closest('[data-qv]'); if (x) { e.stopPropagation(); pickQuick(x.dataset.qv); } });
  const inp = wrap.querySelector('.qm-in');
  if (inp) inp.oninput = () => { wrap.querySelector('.qm-list').innerHTML = o.list(inp.value); };
  if (!mob) {
    const m = QM.el, r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
    let left = o.right ? r.right - w : r.left;
    left = Math.max(8, Math.min(left, innerWidth - w - 8));
    let top = r.bottom + 6; if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
    m.style.left = left + 'px'; m.style.top = top + 'px';
  }
  (inp || QM.el.querySelector('.qm-opt[aria-checked="true"]') || QM.el.querySelector('.qm-opt'))?.focus({ preventScroll: true });
}
function propMenu(kind, btn) {
  const i = curIssue(); if (!i || !canEdit()) return;

  const usersList = (cur, pool) => q => { const k = qmKey(q).trim(), hit = t => !k || qmKey(t).includes(k);
    return pool.filter(u => hit(u.name)).map(u => pmOpt(u.id, cur, `<span class="c-av" style="background:${safeColor(u.color)}">${esc(u.ini || '?')}</span>`, esc(u.name))).join('') || '<div class="qm-empty">Eşleşen kişi yok</div>'; };
  const M = {
    status: () => ({ title: 'Durum', list: () => statsOf(i.projectId).map(s => pmOpt(s.id, i.statusId, `<span class="cat-dot ${esc(s.cat)}"></span>`, esc(s.name))).join(''),

    req: () => ({ kind: 'req', title: 'Talep eden', search: true, list: reqList(reqVal(i.requester), reqMode(projOfI(i)) === 'req', projOfI(i)),
      pick: v => (v === '__add' ? quickContact({ customerId: projOfI(i)?.customerId }, r => after(idSet(i, 'requester', r))) : after(idSet(i, 'requester', reqParse(v)))) }),
    rep: () => ({ title: 'Raporlayan', search: DB.users.length > 8, list: usersList(i.reporter, DB.users.filter(u => u.active !== false && !u.system)), pick: v => after(idSet(i, 'reporter', v)) }),
    type: () => ({ title: 'Tip', list: () => ISSUE_TYPES().map(t => pmOpt(t, i.type, tIcon(t), esc(TYPE[t][2]))).join(''), pick: v => after(idSet(i, 'type', v)) }),
    sprint: () => ({ title: 'Sprint', list: () => pmOpt('', i.sprintId || '', ic('backlog'), 'Backlog')

      pick: v => after(idSet(i, 'sprintId', v)) }),
    epic: () => ({ title: 'Epik', list: () => pmOpt('', i.epicId || '', ic('x'), 'Yok')
      + DB.issues.filter(e => e.type === 'epic' && e.projectId === i.projectId && e.id !== i.id).map(e => pmOpt(e.id, i.epicId, ic('layers'), esc(e.summary), esc(e.key))).join(''),
      pick: v => after(idSet(i, 'epicId', v)) }),
    bill: () => ({ title: 'Faturalama', list: () => BILLABLE.map(x => pmOpt(x, billOf(i), '', esc(x))).join(''), pick: v => after(idSet(i, 'billable', v)) }),
    btype: () => ({ title: 'Fatura türü', list: () => BILLTYPE.map(x => pmOpt(x, btypeOf(i), '', esc(x))).join(''), pick: v => after(idSet(i, 'billType', v)) }),
    cari: () => ({ title: 'Cari', search: cuList().filter(cuActive).length > 8, list: q => cuPickList(i.customerId || '', DB.projects.find(p => p.id === i.projectId), q),
      pick: v => after(idSet(i, 'customerId', v)) }),
    more: () => ({ title: 'Diğer işlemler', right: true, list: () => `<button type="button" class="qm-opt" role="menuitem" data-qv="copy">${ic('copy')}<span class="qm-l">Anahtarı kopyala</span></button>
        <hr><button type="button" class="qm-opt danger" role="menuitem" data-qv="del">${ic('trash')}<span class="qm-l">Sil</span></button>`,
      pick: v => { if (v === 'copy') copyText(`${i.key} ${i.summary}`); if (v === 'del') issueDelete([i.id]); } }),
    subas: () => ({ kind: 'as', title: 'Alt işin atananı', search: issueUsers(i).length > 8, list: q => qmAsList({ ...i, assignee: ID_SUB_AS }, q),
      pick: v => { ID_SUB_AS = v || null; refreshIssue(['subs']); } }),
  };
  const o = M[kind]?.(); if (!o) return;
  pmOpen({ ...base, ...o, kind: o.kind || kind });
