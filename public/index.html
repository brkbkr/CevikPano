        <div class="cu-fld" id="cu_k_f"><div class="lb" id="cu_k_l"><span>Tür<span class="req" aria-hidden="true">*</span></span></div>
          <div class="cu-kseg" role="radiogroup" aria-labelledby="cu_k_l" aria-required="true" aria-describedby="cu_k_e">
            ${Object.entries(CU_KIND).map(([k, [l, i]]) => `<button type="button" role="radio" data-cuk="${k}" aria-checked="${kind === k}" tabindex="${kind === k || (!kind && k === 'customer') ? 0 : -1}">${ic(i)}${l}</button>`).join('')}</div>
          <div class="cu-err" id="cu_k_e" role="alert"></div></div>
        ${fld('cu_vd', 'Vergi dairesi', inp('cu_vd', 'taxOffice', 100))}
        ${fld('cu_vn', 'Vergi no', inp('cu_vn', 'taxNo', 40, 'inputmode="numeric" style="font-family:var(--mono)" aria-describedby="cu_vn_h"'),
          { right: '<span class="opt" id="cu_vn_h">10 hane VKN · 11 hane TCKN</span>' })}
        ${fld('cu_a', 'Adres', `<textarea class="inp" id="cu_a" rows="2" maxlength="500">${esc(v('address'))}</textarea>`, { full: true, right: cnt('cu_a', 500) })}
        ${fld('cu_p', 'Telefon', inp('cu_p', 'phone', 30, 'inputmode="tel"'))}
        ${fld('cu_m', 'E-posta', inp('cu_m', 'email', 200, 'type="email"'))}
        ${fld('cu_no', 'Notlar', `<textarea class="inp" id="cu_no" rows="2" maxlength="2000" aria-describedby="cu_no_h">${esc(v('notes'))}</textarea>`,
          { full: true, right: cnt('cu_no', 2000), hint: `<div class="cu-hint warn" id="cu_no_h">${ic('shield')}Kişisel veya hassas bilgi yazmayın (T.C. kimlik no, sağlık, banka bilgisi vb.).</div>` })}
        <div class="cu-fld full"><div class="cu-active">
          <button type="button" role="switch" id="cu_act" aria-checked="${active}"><span class="cu-sw" aria-hidden="true"></span><span id="cu_act_l">${active ? 'Etkin' : 'Pasif'}</span></button>
          <span class="tx">Pasif cariler yeni projelere bağlanamaz; mevcut bağlar ve geçmiş süreler korunur.</span></div></div>
      </div>
      <div class="cu-sech"><h3>${ic('users')}Yetkili kişiler <span class="n" id="cu_ctn">${cts.length}</span></h3></div>
      <div class="cu-ct" id="cu_ct"></div>
      <button type="button" class="cu-add" id="cu_add">${ic('userplus')}Kişi ekle</button>
      <div class="cu-hint" id="cu_add_h" hidden>${ic('info')}En çok ${CU_MAX_CT} yetkili kişi eklenebilir.</div>
      ${c ? `<div class="cu-sech"><h3>${ic('folder')}Özet</h3></div>${cuSummaryHtml(c)}` : ''}
      <div style="height:10px"></div>
    </div>
    <div class="m-f">${c ? `<button type="button" class="btn danger icon-m" id="cu_del" aria-label="Cariyi sil">${ic('trash')}<span class="lbl">Cariyi sil</span></button>
      <button type="button" class="btn icon-m" id="cu_mrg" aria-label="Başka bir cariyle birleştir">${ic('swap')}<span class="lbl">Birleştir</span></button>` : ''}<span class="spacer"></span>
      <button class="btn" data-close>İptal</button><button class="btn pri" id="cu_ok">${ic('check')}Kaydet</button></div>`, 'cu-m');
  wsDialog('cu_t');

  const ctErr = {};
  const drawCts = () => {
    $('#cu_ct').innerHTML = cts.length ? `<div class="cu-cthead" aria-hidden="true"><span>Ad soyad *</span><span>Görev</span><span>E-posta</span><span>Telefon</span><span></span></div>`
      + cts.map((x, k) => { const e = all || shown.has('ct' + k) ? ctErr[k] || {} : {};
        const cell = (f, cls, label, max, extra = '') => `<div class="${cls} ${e[f] ? 'has-err' : ''}"><label class="cu-cl" for="ct_${k}_${f}">${label}</label>
          <input class="inp" id="ct_${k}_${f}" data-ctf="${f}" data-cti="${k}" value="${esc(x[f] || '')}" maxlength="${max}" placeholder="${label.replace(/ <.*$/, '')}" aria-label="${label.replace(/ <.*$/, '')}" ${extra}
            ${e[f] ? `aria-invalid="true" aria-describedby="ct_${k}_${f}_e"` : ''}>${e[f] ? `<div class="cu-err" id="ct_${k}_${f}_e">${ic('alert')}<span>${e[f]}</span></div>` : ''}</div>`;
        return `<div class="cu-ctrow" role="group" aria-label="Yetkili ${k + 1}" data-ctrow="${k}"><span class="cu-ctno">Yetkili ${k + 1}</span>
          ${cell('name', 'c-name', 'Ad soyad <span style="color:var(--risk)">*</span>', 120)}${cell('title', 'c-title', 'Görev', 120)}
          ${cell('email', 'c-mail', 'E-posta', 200, 'type="email"')}${cell('phone', 'c-tel', 'Telefon', 30, 'inputmode="tel"')}
          <button type="button" class="iconbtn del" data-ctdel="${k}" aria-label="Yetkili ${k + 1}: ${esc(x.name || 'boş satır')} sil" title="Kişiyi sil">${ic('trash')}</button></div>`; }).join('') : '';
    $('#cu_ctn').textContent = cts.length;
    $('#cu_add').disabled = cts.length >= CU_MAX_CT; $('#cu_add_h').hidden = cts.length < CU_MAX_CT;
  };
  const blankCt = x => !['name', 'title', 'email', 'phone'].some(f => String(x[f] || '').trim());
  /* Hatalar: { alan kimliği: html } — alan "Kaydet"e basınca ya da alandan çıkınca gösterilir. */
  const check = () => {
    const e = {}, val = fid => $('#' + fid).value;
    const name = val('cu_n').trim();
    if (!name) e.cu_n = 'Unvan gerekli'; else if (name.length > 200) e.cu_n = 'Unvan en fazla 200 karakter';
    if (!kind) e.cu_k = 'Tür seçin';
    if (val('cu_s').trim().length > 60) e.cu_s = 'Kısa ad en fazla 60 karakter';
    if (val('cu_vd').trim().length > 100) e.cu_vd = 'Vergi dairesi en fazla 100 karakter';
    const tn = val('cu_vn').replace(/[\s-]/g, '');
    if (tn && !/^\d{10,11}$/.test(tn)) e.cu_vn = 'Vergi numarası 10 ya da 11 haneli olmalı';
    else if (tn) { const o = cuList().find(x => x.id !== c?.id && x.taxNo === tn);
      if (o) e.cu_vn = `Bu vergi numarasıyla kayıtlı cari var: ${esc(o.name)} · <a href="#" role="button" data-cuopen="${esc(o.id)}">Kartı aç</a>`; }
    if (val('cu_a').trim().length > 500) e.cu_a = 'Adres en fazla 500 karakter';
    if (val('cu_p').trim().length > 30) e.cu_p = 'Telefon en fazla 30 karakter';
    const em = val('cu_m').trim();
    if (em && em !== c?.email && (em.length > 200 || !CU_EMAIL.test(em))) e.cu_m = 'E-posta adresi geçersiz';
    if (val('cu_no').length > 2000) e.cu_no = 'Notlar en fazla 2000 karakter';
    for (const k of Object.keys(ctErr)) delete ctErr[k];
    cts.forEach((x, k) => { if (blankCt(x)) return; const r = {};
      if (!String(x.name || '').trim()) r.name = 'Ad zorunlu';
      if (String(x.title || '').trim().length > 120) r.title = 'Görev en fazla 120 karakter';
      const m = String(x.email || '').trim(), m0 = (c?.contacts || []).find(o => o && o.id === x.id)?.email;
      if (m && m !== m0 && (m.length > 200 || !CU_EMAIL.test(m))) r.email = 'E-posta adresi geçersiz';
      if (String(x.phone || '').trim().length > 30) r.phone = 'Telefon en fazla 30 karakter';
      if (Object.keys(r).length) ctErr[k] = r; });
    return e;
  };
  const FIELDS = ['cu_n', 'cu_k', 'cu_s', 'cu_vd', 'cu_vn', 'cu_a', 'cu_p', 'cu_m', 'cu_no'];
  const paint = () => {
    const e = check();
    for (const fid of FIELDS) {
      const on = (all || shown.has(fid)) && e[fid], box = $('#' + fid + '_f'), el = $('#' + fid), er = $('#' + fid + '_e');
      box.classList.toggle('has-err', !!on);
      er.innerHTML = on ? `${ic('alert')}<span>${e[fid]}</span>` : '';
      if (el) { if (on) { el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-describedby', [fid + '_e', fid === 'cu_vn' ? 'cu_vn_h' : fid === 'cu_no' ? 'cu_no_h' : ''].filter(Boolean).join(' ')); }
        else { el.removeAttribute('aria-invalid'); if (fid === 'cu_vn') el.setAttribute('aria-describedby', 'cu_vn_h'); else if (fid === 'cu_no') el.setAttribute('aria-describedby', 'cu_no_h'); else el.removeAttribute('aria-describedby'); } }
    }
    return e;
  };
  drawCts();
  const body = $('#scrim .cu-body');
  body.addEventListener('input', ev => {
    const t = ev.target;
    if (t.dataset.ctf) { cts[+t.dataset.cti][t.dataset.ctf] = t.value; return; }
    const ce = $('#' + t.id + '_c'); if (ce) ce.textContent = `${t.value.length} / ${t.maxLength}`;
    if (shown.has(t.id) || all) paint();
  });
  body.addEventListener('focusout', ev => {
    const t = ev.target;
    if (t.dataset?.ctf) { if (!shown.has('ct' + t.dataset.cti) && !all) { shown.add('ct' + t.dataset.cti); } return; }
    if (FIELDS.includes(t.id) && t.value !== '') { shown.add(t.id); paint(); }
  });
  body.addEventListener('click', ev => {
    const k = ev.target.closest('[data-cuk]');
    if (k) { kind = k.dataset.cuk; $$('[data-cuk]').forEach(b => { b.setAttribute('aria-checked', String(b === k)); b.tabIndex = b === k ? 0 : -1; }); shown.add('cu_k'); paint(); return; }
    const d = ev.target.closest('[data-ctdel]');
    if (d) { cts.splice(+d.dataset.ctdel, 1); check(); drawCts(); ($('#cu_ct .del') || $('#cu_add')).focus(); return; }
  });
  $('.cu-kseg').onkeydown = ev => {
    const keys = Object.keys(CU_KIND), cur = Math.max(0, keys.indexOf(kind)), to = { ArrowRight: cur + 1, ArrowDown: cur + 1, ArrowLeft: cur - 1, ArrowUp: cur - 1 }[ev.key];
    if (to === undefined) return; ev.preventDefault();
    const b = $(`[data-cuk="${keys[(to + keys.length) % keys.length]}"]`); b.click(); b.focus();
  };
  $('#cu_act').onclick = () => { active = !active; $('#cu_act').setAttribute('aria-checked', String(active)); $('#cu_act_l').textContent = active ? 'Etkin' : 'Pasif'; };
  $('#cu_add').onclick = () => {
    if (cts.length >= CU_MAX_CT) return;
    cts.push({ id: uid('ct'), name: '', title: '', email: '', phone: '' }); check(); drawCts();
    $(`#ct_${cts.length - 1}_name`)?.focus();
  };
  if (c) $('#cu_del').onclick = () => customerDelete(c.id);
  if (c) $('#cu_mrg').onclick = () => customerMerge(c.id);
  $('#cu_ok').onclick = () => {
    all = true;
    const e = paint(); drawCts();
    const firstCt = Object.keys(ctErr)[0];
    if (FIELDS.some(f => e[f]) || firstCt !== undefined) {
      const f = FIELDS.find(x => e[x]);
      (f ? (f === 'cu_k' ? $('[data-cuk][tabindex="0"]') : $('#' + f)) : $(`#ct_${firstCt}_${Object.keys(ctErr[firstCt])[0]}`))?.focus();
      return;
    }
    const val = fid => $('#' + fid).value.trim();
    const contacts = cts.filter(x => !blankCt(x)).map(x => { const o = { id: x.id, name: String(x.name).trim() };
      for (const f of ['title', 'email', 'phone']) { const s = String(x[f] || '').trim(); if (s) o[f] = s; }
      return o; });
    const data = { name: val('cu_n'), shortName: val('cu_s'), kind, taxOffice: val('cu_vd'), taxNo: val('cu_vn').replace(/[\s-]/g, ''),
      address: val('cu_a'), phone: val('cu_p'), email: val('cu_m'), notes: val('cu_no'), active, contacts };
    if (c) Object.assign(c, data);
    else (DB.customers ||= []).push({ id: uid('cu'), ...data });
    closeModal(); save(); render(); toast(c ? `${data.name} kaydedildi` : `${data.name} eklendi`);
  };
  setTimeout(() => $('#cu_n')?.focus(), 40);
}

/* Silme: bağlı projesi (arşivli dahil) olan cari silinmez → "Pasife al". Bağsızsa kalıcı silme onayı (çöp kutusuna gitmez). */
function customerDelete(id) {
  if (!isAdmin()) return toast('Cari silme yalnızca yöneticiler içindir');
  const c = cuById(id); if (!c) return toast('Cari bulunamadı');
  const projs = cuProjects(id), nCt = Array.isArray(c.contacts) ? c.contacts.length : 0;
  const nIss = DB.issues.filter(i => i.customerId === id).length;
  closeModal();
  if (projs.length || nIss) {
    openModal(`<div class="m-h cu-h"><div class="tx"><b id="cud_t">Cari silinemez</b><div class="s">${esc(c.name)}</div></div><button class="x" data-close aria-label="Kapat">×</button></div>
      <div class="cu-body" style="padding-bottom:14px"><div class="cu-alert" id="cud_d">${ic('alert')}<div class="tx"><b>Bu cariye bağlı ${[projs.length ? `${projs.length} proje` : '', nIss ? `${nIss} iş` : ''].filter(Boolean).join(' ve ')} var; silmek yerine pasife alın ya da başka bir cariyle birleştirin.</b>
        <ul class="cu-plist">${projs.map(p => `<li><span class="ws-key">${esc(p.key)}</span><span class="t">${esc(p.name)}</span>${p.archived
          ? `<span class="ws-chip">${ic('archive')}Arşivli</span>` : wsBadge(wsById(wsOf(p)), 'sm')}</li>`).join('')}</ul></div></div></div>
      <div class="m-f"><span class="spacer"></span><button class="btn" data-close>Kapat</button><button class="btn" id="cud_mrg">${ic('swap')}Birleştir</button>${cuActive(c) ? `<button class="btn pri" id="cud_pas">${ic('pause')}Pasife al</button>` : ''}</div>`, 'narrow cu-m');
    $('#cud_mrg').onclick = () => customerMerge(id);
    const m = $('#scrim .modal'); m.setAttribute('role', 'alertdialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'cud_t'); m.setAttribute('aria-describedby', 'cud_d');
    const pb = $('#cud_pas');
    if (pb) { pb.onclick = () => { c.active = false; closeModal(); save(); render(); toast(`${c.name} pasife alındı`); }; setTimeout(() => pb.focus(), 40); }
    return;
  }
  openModal(`<div class="m-h cu-h"><div class="tx"><b id="cud_t">Cariyi sil</b></div><button class="x" data-close aria-label="Kapat">×</button></div>
    <div class="cu-body" style="padding-bottom:14px"><p class="cu-confirm" id="cud_d"><b>${esc(c.name)}</b>${nCt ? ` ve ${nCt} yetkili kişisi` : ''} <b>kalıcı olarak silinir, çöp kutusuna gitmez.</b> Bu işlem geri alınamaz.</p>
      <div class="ws-info">${ic('info')}<span>Bu cariye bağlı proje yok. Kaydı saklamak istiyorsanız silmek yerine pasife alabilirsiniz.</span></div></div>
    <div class="m-f"><span class="spacer"></span><button class="btn" data-close id="cud_no">Vazgeç</button><button class="btn cu-danger" id="cud_ok">${ic('trash')}Kalıcı olarak sil</button></div>`, 'narrow cu-m');

  setTimeout(() => $('#cud_no')?.focus(), 40);
  $('#cud_ok').onclick = () => {
    DB.customers = cuList().filter(x => x.id !== id);
    closeModal(); save(); render(); toast(`${c.name} silindi`);
  };
}

/* Birleştir (görev 11b, yönetici): kaynak carinin tüm proje ve iş bağları (arşivliler dahil) ve yetkili kişileri
   hedefe taşınır, kaynak kalıcı olarak silinir. Sunucuda tek değişiklikle, tek işlemde yapılır
   ({ c:'customers', op:'del', mergeInto }); yerel kopya ardından sunucudan yeniden yüklenir. */
function customerMerge(id) {
  if (!isAdmin()) return toast('Cari birleştirme yalnızca yöneticiler içindir');
  const c = cuById(id); if (!c) return toast('Cari bulunamadı');
  const targets = cuList().filter(x => x.id !== id && cuActive(x)).sort(cuSort);
  if (!targets.length) return toast('Birleştirilecek başka etkin cari yok');
  const nP = cuProjects(id).length, nI = DB.issues.filter(i => i.customerId === id).length;
  const nCt = Array.isArray(c.contacts) ? c.contacts.length : 0;
  closeModal();
  openModal(`<div class="m-h cu-h"><div class="tx"><b id="cum_t">Cariyi birleştir</b><div class="s">${esc(c.name)}</div></div><button class="x" data-close aria-label="Kapat">×</button></div>
    <div class="cu-body" style="padding-bottom:14px">
      <div class="cu-fld full"><label for="cum_to"><span>Hedef cari</span></label>
        <select class="inp" id="cum_to">${targets.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select></div>
      <p class="cu-confirm" id="cum_d"><b>${esc(c.name)}</b> carisine bağlı <b>${nP} proje</b> ve <b>${nI} iş</b>${nCt ? `, ${nCt} yetkili kişisiyle birlikte,` : ''} seçilen cariye taşınır;
        <b>${esc(c.name)} kalıcı olarak silinir.</b> Bu işlem geri alınamaz.</p></div>
    <div class="m-f"><span class="spacer"></span><button class="btn" data-close id="cum_no">Vazgeç</button><button class="btn pri" id="cum_ok">${ic('swap')}Birleştir</button></div>`, 'narrow cu-m');
  const m = $('#scrim .modal'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', 'cum_t'); m.setAttribute('aria-describedby', 'cum_d');
  setTimeout(() => $('#cum_to')?.focus(), 40);
  $('#cum_ok').onclick = async () => {
    const to = $('#cum_to').value, t = cuById(to); if (!t) return toast('Cari bulunamadı');
    $('#cum_ok').disabled = true;
    try {
      await flushSync();
      const r = await API.post('/api/sync', { changes: [{ c: 'customers', id, op: 'del', mergeInto: to }] });
      closeModal();
      await reloadState();
      if (r.rejected?.length) return toast('Birleştirilemedi: ' + (r.rejected[0].reason || 'yetki yok'), { warn: true });
      toast(`${c.name}, ${t.name} ile birleştirildi`);
    } catch (e) {
      if (e.status === 401) return sessionLost();
      closeModal(); toast('Birleştirilemedi: ' + e.message, { warn: true });
    }
  };
}

/* Proje formu ve Projeler kartı: cari seçimi. Yalnız etkin cariler; projenin bağlı olduğu pasif cari "(Pasif)" ekiyle korunur. */
function cuOptions(cur) {
  const c = cuById(cur), act = cuList().filter(cuActive).sort(cuSort);
  return `<option value="">— Cari yok —</option>${cur && !c ? `<option value="${esc(cur)}" selected>(Bulunamayan cari)</option>` : ''}${
    c && !cuActive(c) ? `<option value="${esc(c.id)}" selected>${esc(c.name)} (Pasif)</option>` : ''}${
    act.map(x => `<option value="${esc(x.id)}" ${x.id === cur ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}`;

/* İş detayı ve yeni iş: cari seçim listesi (yalnız etkin cariler; işin pasif carisi "pasif" ekiyle korunur).
   Boş seçenek: işe ayrı cari bağlanmaz, projenin carisi geçerli olur. */
function cuPickList(cur, pr, q = '') {
  const k = qmKey(q || '').trim(), hit = t => !k || qmKey(t).includes(k);
  const c = cuById(cur), pc = cuById(pr?.customerId);
  const act = cuList().filter(x => cuActive(x) && hit(x.name)).sort(cuSort);
  return pmOpt('', cur, ic('x'), pc ? `Projeden: ${esc(pc.name)}` : CU_NONE)
    + (c && !cuActive(c) ? pmOpt(c.id, cur, ic('building'), esc(c.name), 'pasif') : '')
    + (act.map(x => pmOpt(x.id, cur, ic('building'), esc(x.name))).join('') || (k ? '<div class="qm-empty">Eşleşen cari yok</div>' : ''));
}
function cuProjRow(p) {
  const cur = p.customerId || '', c = cuById(cur), pid = esc(p.id);
  if (!cur && !cuList().length) return '';
  if (canDesign(p)) return `<div class="cu-plink"><label class="lbl" for="pcu-${pid}">${ic('building')}Cari</label>
      <select class="inp" id="pcu-${pid}" data-pcust="${pid}">${cuOptions(cur)}</select>
      ${c && !cuActive(c) ? `<div class="cu-hint">${ic('pause')}Bağlı cari pasif; bağ korunur. Değiştirirseniz yalnız etkin cariler seçilebilir.</div>` : ''}</div>`;
  return `<div class="cu-plink"><span class="lbl">${ic('building')}Cari</span><span class="val">${c
    ? `<a href="#" data-cuopen="${esc(c.id)}">${esc(c.name)}</a>${cuActive(c) ? '' : `<span class="cu-st off">${ic('pause')}Pasif</span>`}`
    : '<span style="color:var(--meta);font-weight:500">—</span>'}</span></div>`;
}

/* Olay devri: liste, süzgeçler, kart bağlantıları. */
function cuClick(e) {
  const t = e.target; if (!(t instanceof Element)) return;
  const b = t.closest('[data-cunew],[data-cuopen],[data-cukind],[data-cupas],[data-cuclear],[data-cugoproj],[data-cuissues],[data-cugo]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (b.tagName === 'A') e.preventDefault();
  if ('cunew' in d) return customerForm();
  if ('cuopen' in d) return openCustomer(d.cuopen);
  if ('cukind' in d) { DB.ui.cuKind = d.cukind; save(); render(); $(`[data-cukind="${d.cukind}"]`)?.focus(); return; }
  if ('cupas' in d) { DB.ui.cuPassive = !DB.ui.cuPassive; save(); render(); $('[data-cupas]')?.focus(); return; }
  if ('cuclear' in d) { CU_Q = ''; DB.ui.cuKind = 'all'; DB.ui.cuPassive = !cuList().some(cuActive); save(); render(); $('#cuQ')?.focus(); return; }
  if ('cugo' in d) { closeModal(); DB.ui.view = 'customers'; save(); return render(); }
  if ('cugoproj' in d) {
    const p = DB.projects.find(x => x.id === d.cugoproj); if (!p) return;
    DB.ui.project = p.id; DB.board.q = ''; DB.ui.view = 'board'; closeModal(); save(); return render();
  }
  if ('cuissues' in d) {
    const c = cuById(d.cuissues); if (!c) return;
    DB.ui.pql = `cari = "${String(c.name).replace(/"/g, '')}" AND kategori != Bitti`;
    DB.ui.view = 'search'; closeModal(); save(); return render();
  }
}
function cuKey(e) {
  const t = e.target; if (!(t instanceof Element)) return;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches('tr.cu-row[data-cuopen]')) { e.preventDefault(); return openCustomer(t.dataset.cuopen); }
  if (t.matches('.cu-seg [data-cukind]') && /^Arrow(Left|Right|Up|Down)$/.test(e.key)) {
    e.preventDefault();
    const bs = [...t.parentElement.querySelectorAll('[data-cukind]')], k = bs.indexOf(t) + (/Right|Down/.test(e.key) ? 1 : -1);
    bs[(k + bs.length) % bs.length].click();
  }
}
function cuInput(e) {
  if (e.target?.id !== 'cuQ') return;
  CU_Q = e.target.value;
  const l = $('#cuList'); if (l) l.innerHTML = cuListHtml();
}
function cuChange(e) {
  const s = e.target; if (!(s instanceof Element) || !s.matches('[data-pcust]')) return;
  const p = DB.projects.find(x => x.id === s.dataset.pcust); if (!p) return;
  if (!canDesign(p)) { render(); return toast(canEdit(p) ? 'Projeyi yalnızca alan yöneticisi değiştirebilir' : 'İzleyiciler projeyi değiştiremez'); }
  const v = s.value;
  if (!v) { if (p.customerId === undefined) return; delete p.customerId; save(); render(); return toast(`${p.name}: cari bağı kaldırıldı`); }
  if (v === p.customerId) return;
  const c = cuById(v);
  if (!c) { render(); return toast('Cari bulunamadı'); }
  if (!cuActive(c)) { render(); return toast('Pasif cari projeye bağlanamaz'); }
  p.customerId = v; save(); render(); toast(`${p.name}, ${c.name} carisine bağlandı`);
}

/* Projeler ekranı alan başlıkları altında gruplanır (#22). Proje listesi daraltılmaz: görünür alanlar ve
   listelenen projelerin alanları çizilir; arşivli alanlar anahtar açıkken en altta. */
function renderProjects() {
  const list = isSuper() || DB.ui.showArchived ? DB.projects : DB.projects.filter(p => !p.archived);
  const nArch = DB.projects.filter(p => p.archived).length;
  const has = id => list.some(p => wsOf(p) === id);
  const vis = new Set(visibleWs().map(w => w.id)), visA = new Set(visibleWs(true).map(w => w.id));
  const groups = wsAll().filter(w => !w.archived && (vis.has(w.id) || has(w.id))).sort(wsSort);
  const archWs = wsAll().filter(w => w.archived && (visA.has(w.id) || has(w.id))).sort(wsSort);
  const showA = !!DB.ui.showArchivedWs;
  return `${nArch ? `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:14px">
      <input type="checkbox" id="showArch" ${DB.ui.showArchived || isSuper() ? 'checked' : ''} ${isSuper() ? 'disabled' : ''}>
      Arşivlenmiş projeleri göster (${nArch})</label>` : ''}
    ${groups.map(w => wsGroup(w, list, false)).join('')}
    ${archWs.length ? `<button type="button" class="ws-archtog" data-wsarchtog aria-pressed="${showA}">${ic('archive')}Arşivlenmiş çalışma alanlarını göster
      <span class="n">(${archWs.length})</span><span class="ws-sw" aria-hidden="true"></span></button>
      ${showA ? archWs.map(w => wsGroup(w, list, true)).join('') : ''}` : ''}`;
}

function wsGroup(w, list, arch) {
  const projs = list.filter(p => wsOf(p) === w.id), id = esc(w.id);
  const all = DB.projects.filter(p => wsOf(p) === w.id), nA = all.filter(p => p.archived).length;
  const manage = canManageWs(w);
  const why = w.id === WS_DEFAULT ? 'Genel çalışma alanı silinemez'
    : all.length ? `Önce projeleri taşıyın · ${all.length} proje${nA ? ` (${nA} arşivli)` : ''}` : '';
  const items = [
    manage && !arch ? `<button type="button" class="ws-mi" role="menuitem" data-wsedit="${id}">${ic('pencil')}Düzenle (ad, renk, açıklama)</button>` : '',
    manage && !arch ? (w.id === WS_DEFAULT
      ? `<button type="button" class="ws-mi" role="menuitem" disabled>${ic('archive')}<span class="two">Arşivle<span class="why">Genel çalışma alanı arşivlenemez</span></span></button>`
      : `<button type="button" class="ws-mi" role="menuitem" data-wsarch="${id}">${ic('archive')}Arşivle</button>`) : '',
    isAdmin() ? `${manage && !arch ? '<div class="ws-hr" role="separator"></div>' : ''}
      <button type="button" class="ws-mi danger" role="menuitem" data-wsdel="${id}" ${why ? `disabled aria-describedby="wsdw-${id}"` : ''}>${ic('trash')}<span class="two">Sil${
        why ? `<span class="why" id="wsdw-${id}">${esc(why)}</span>` : ''}</span></button>` : ''].join('');
  const head = `<div class="ws-gh">${wsBadge(w, 'lg' + (arch ? ' is-arch' : ''))}
    <div class="tx"><h2 id="wsg-${id}"><span class="t">${esc(w.name)}</span><span class="cnt">${all.length - nA} proje${nA ? ` · ${nA} arşivli` : ''}</span>${
      arch ? `<span class="ws-chip">${ic('archive')}Arşivlendi</span>` : ''}</h2>
      ${w.description ? `<div class="ds" title="${esc(w.description)}">${esc(w.description)}</div>` : ''}</div>
    <div class="acts">${arch ? (manage ? `<button type="button" class="btn" data-wsunarch="${id}">${ic('unarchive')}Arşivden çıkar</button>` : '')
      : canNewProj(w.id) ? `<button type="button" class="btn ghost" data-wsnewproj="${id}" aria-label="${esc(w.name)} alanına proje ekle">${ic('plus')}Proje</button>` : ''}
      ${items ? wsPopMenu(`${w.name}: alan işlemleri`, 'Alan işlemleri', items) : ''}</div></div>`;
  return `<section class="ws-grp ${arch ? 'is-arch' : ''}" data-wsgrp="${id}" aria-labelledby="wsg-${id}">${head}
    ${projs.length ? `<div class="ws-grid">${projs.map(p => wsProjCard(p, arch)).join('')}</div>`
      : `<div class="ws-gempty">${ic('folderplus')}<span class="tx">Bu çalışma alanında henüz proje yok</span>${
        canNewProj(w.id) && !arch ? `<button type="button" class="btn" data-wsnewproj="${id}">${ic('plus')}Yeni proje</button>` : ''}</div>`}</section>`;
}

/* ⋯ düğmesi + açılır menü. Menü DOM'da gizli durur (data-arch / data-delproj işleyicileri bağlı kalsın). */
const wsPopMenu = (label, title, items) => `<div class="ws-mw"><button type="button" class="ws-more" data-wsmore aria-haspopup="menu" aria-expanded="false"

function wsProjCard(p, arch) {
  const all = DB.issues.filter(i => i.projectId === p.id);
  const open = all.filter(i => stat(i.statusId).cat !== 'done').length;
  const hours = DB.worklogs.filter(w => issue(w.issueId)?.projectId === p.id).reduce((a, w) => a + (+w.hours || 0), 0);

  const items = [
    canEditCols(p) && !arch ? `<button type="button" class="ws-mi" role="menuitem" data-ptypedlg="${pid}">${ic('swap')}<span class="two">Türü değiştir…<span class="why">Şu an ${TYPE_LABEL[projType(p)]}</span></span></button>` : '',
    canMoveProj(p) ? `<button type="button" class="ws-mi" role="menuitem" data-movproj="${pid}">${ic('move')}Çalışma alanını değiştir…</button>` : '',
    canDesign(p) ? `<button type="button" class="ws-mi" role="menuitem" data-arch="${pid}">${ic(p.archived ? 'unarchive' : 'archive')}${p.archived ? 'Yeniden etkinleştir' : 'Arşivle'}</button>` : '',
    isAdmin() ? `<div class="ws-hr" role="separator"></div><button type="button" class="ws-mi danger" role="menuitem" data-delproj="${pid}"
      ${DB.projects.length < 2 ? 'disabled title="Son proje silinemez"' : ''}>${ic('trash')}Projeyi sil</button>` : ''].join('');
  return `<article class="ws-pcard ${cur ? 'is-cur' : ''}" data-wsproj="${pid}">
    <div class="ws-ph"><span class="ws-key">${esc(p.key)}</span>
      <input class="inp ws-pname" data-projname="${pid}" value="${esc(p.name)}" aria-label="Proje adı" ${canDesign(p) ? '' : 'disabled'}>
      ${typeTag(projType(p))}
      ${p.archived ? `<span class="ws-chip">${ic('archive')}arşiv</span>` : cur ? `<span class="ws-chip cur">${ic('check')}seçili</span>` : ''}
      ${items ? wsPopMenu(`${p.name}: işlemler`, 'Proje işlemleri', items) : ''}</div>
    <div class="ws-pstats"><span>${ic('issues')}<b>${all.length}</b> iş</span><span>${ic('circle')}<b>${open}</b> açık</span><span>${ic('hour')}<b>${efFmtSafe(hours)}</b> efor</span></div>
    ${cuProjRow(p)}
    <div><div class="ws-plbl">Üyeler (${people.filter(u => isMember(p, u.id)).length})</div>
      <div class="ws-mems">${people.map(u => {
        const on = isMember(p, u.id);
        return `<button class="memchip ${on ? 'on' : ''}" data-mem="${pid}" data-memu="${esc(u.id)}" aria-pressed="${on}" ${canDesign(p) ? '' : 'disabled'}>

      }).join('')}</div></div>
    <div class="ws-pf"><span class="lead2">Yürüten <b>${esc(user(p.lead)?.name || '—')}</b></span>
      ${arch ? '' : `<button class="btn" data-goproj="${pid}">Projeye geç${ic('arrow')}</button>`}</div>

/* ============================================================
   PROJE TÜRÜ VE KOLON YÖNETİMİ (#12, docs/tasarim/proje-turu)
   Kurallar sunucuda da var (store.js: canConfigure, checkColumns, checkProjectType);
   buradaki denetimler yalnızca kullanıcı deneyimi içindir.
   ============================================================ */
const COL_MAX = 12, COL_NAME_MAX = 30;
const LAST_DONE = 'Projede en az bir Bitti kolonu kalmalı';
const colKey = s => String(s ?? '').trim().replace(/\s+/g, ' ').toLocaleLowerCase('tr');
const colsOf = pid => DB.statuses.filter(s => s.projectId === pid).sort((a, b) => (a.ord ?? 0) - (b.ord ?? 0));
/* Kolonları ve türü değiştirebilen: yönetici ya da projenin üyesi olan Üye (izleyici hiçbir zaman). */
const canEditCols = p => canDesign(p);
/* Proje yöneticiliği için tek kapı (sprint oluştur/başlat/bitir, sprint süresi): projenin alanında Yönetici
   (sistem yöneticisi ve alan sahibi dahil; üyesiz eski alanda yalnız sistem yöneticisi). Sunucuda store.js → canManageSprint. */
const canManageProject = p => !!p && wsRole(CU(), wsOf(p)) === 'admin';
const typeTag = t => t === 'agile' ? `<span class="pt-type agile">${ic('sprint')}Agile</span>` : `<span class="pt-type">${ic('board')}Pano</span>`;
const catOk = c => ['todo', 'inprogress', 'done'].includes(c) ? c : 'todo';
function colNameErr(name, others) {
  const n = String(name ?? '').trim();
  if (!n || n.length > COL_NAME_MAX) return `Kolon adı 1 ile ${COL_NAME_MAX} karakter arasında olmalı`;
  if (others.some(o => colKey(o) === colKey(n))) return 'Bu adla bir kolon zaten var';
  return '';
}
const colCount = id => DB.issues.filter(i => i.statusId === id).length;

/* Tek kolon satırı: Kolonları düzenle penceresi ve yeni proje formu aynı bileşeni kullanır. */
function colRowHtml(r, k, o = {}) {
  const nm = esc(r.name), pre = o.pre || 'c', c = catOk(r.cat);
  const lockId = `${pre}${k}-l`, errId = `${pre}${k}-e`;
  const delOff = o.lock || o.only;
  return `<div class="pt-row ${o.compact ? 'compact' : ''} ${o.err ? 'has-err' : ''}" role="listitem">
    <span class="pt-ix" aria-hidden="true">${k + 1}</span>
    <div class="pt-nm"><input class="inp" data-cn="${k}" value="${esc(o.draft ?? r.name)}" maxlength="${COL_NAME_MAX}" aria-label="Kolon ${k + 1} adı"
      ${o.err ? `aria-invalid="true" aria-describedby="${errId}"` : ''}><span class="cnt" aria-hidden="true">${String(o.draft ?? r.name).length}/${COL_NAME_MAX}</span></div>
    <div class="pt-cat"><span class="cat-dot ${c}" aria-hidden="true"></span>
      <select class="inp" data-cc="${k}" aria-label="${nm}: kategori" ${o.lock ? `disabled aria-describedby="${lockId}"` : ''}>${
        CATS.map(([v, l]) => `<option value="${v}" ${v === c ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    ${o.compact ? '' : `<span class="pt-n ${o.n ? '' : 'zero'}">${o.n || 0} iş</span>`}
    <button type="button" class="iconbtn pt-up" data-cu="${k}" aria-label="${nm}: yukarı taşı" title="Yukarı taşı" ${o.first ? 'disabled' : ''}>${ic('up')}</button>
    <button type="button" class="iconbtn pt-dn" data-cd="${k}" aria-label="${nm}: aşağı taşı" title="Aşağı taşı" ${o.last ? 'disabled' : ''}>${ic('dn')}</button>
    <button type="button" class="iconbtn del pt-del" data-cx="${k}" aria-label="${nm}: sil"
      title="${o.lock ? LAST_DONE : o.only ? 'Projenin son kolonu silinemez' : 'Sil'}" ${delOff ? 'disabled' : ''} ${o.lock ? `aria-describedby="${lockId}"` : ''}>${ic('trash')}</button>
    ${o.err ? `<div class="pt-msg err" id="${errId}">${ic('alert')}${esc(o.err)}</div>` : ''}
    ${o.lock ? `<div class="pt-msg hint" id="${lockId}">${ic('lock')}${LAST_DONE}</div>` : ''}
  </div>`;
}
const colHd = compact => `<div class="pt-colhd ${compact ? 'compact' : ''}" aria-hidden="true"><span>#</span><span>Ad</span><span>Kategori</span>${compact ? '' : '<span>İş</span>'}<span></span></div>`;

/* Odağı yeniden çizimden sonra aynı denetime geri ver. */
const FOCUS_ATTRS = ['cn', 'cc', 'cu', 'cd', 'cx', 'cto', 'ptype', 'tpl'];
function focusKey(el) {
  if (!(el instanceof Element)) return null;
  if (el.id) return '#' + el.id;
  const a = FOCUS_ATTRS.find(x => x in el.dataset);
  return a ? `[data-${a}="${el.dataset[a]}"]` : null;
}
function focusBack(host, sel, fallback) {
  const el = sel && host.querySelector(sel);
  const t = el && !el.disabled ? el : fallback && host.querySelector(fallback);
  if (t) t.focus();
}

/* Kolon silme (Kolonları düzenle ve Proje ayarları → İş akışı aynı işlevi kullanır): içindeki işler önce
   hedef kolona taşınır (geçmişe "Durum: X → Y"; otomasyon kuralları çalışmaz), sonra kolon silinir. */
function colDelete(id, to) {
  const s = DB.statuses.find(x => x.id === id); if (!s) return false;
  const cols = colsOf(s.projectId);
  if (cols.length < 2) { toast('Projenin son kolonu silinemez'); return false; }
  if (s.cat === 'done' && cols.filter(c => c.cat === 'done').length < 2) { toast(LAST_DONE); return false; }
  const moved = DB.issues.filter(i => i.statusId === id);
  if (moved.length && !cols.some(c => c.id === to && c.id !== id)) { toast('Hedef kolon seçin'); return false; }
  moved.forEach(i => setStatus(i, to, { rules: false }));
  DB.issues.forEach(i => { if (i.doneFrom === id) delete i.doneFrom; });
  if (DB.ui.qaOpen === id) DB.ui.qaOpen = null;
  DB.statuses = DB.statuses.filter(x => x.id !== id);
  save(); render();
  return true;
}

/* ---- Kolonları düzenle penceresi ---- */
let COLS_UI = null;     // { pid, del, to, err: {id: ileti}, draft: {id: yazılan ad}, alert }
function colsEditor(pid, delId) {
  const p = DB.projects.find(x => x.id === pid);
  if (!canEditCols(p)) return toast('Kolonları yalnızca yönetici ya da proje üyesi değiştirebilir');
  COLS_UI = { pid, del: null, to: null, err: {}, draft: {}, alert: '' };
  openModal('', 'pt-dlg');
  $('#scrim .modal').dataset.cols = '1';
  if (delId) colsAskDelete(delId); else colsDraw();
}
const colsBox = () => document.querySelector('#scrim.on .modal[data-cols]');
/* Sunucu bir değişikliği reddetti (flushSync → reloadState): pencere açıksa uyarıyla yeniden çiz. */
function colsRefresh(msg) {
  if (!COLS_UI || !colsBox()) return;
  Object.assign(COLS_UI, { alert: msg || '', err: {}, draft: {} });
  colsDraw();
}
function colsAskDelete(id) {
  const U = COLS_UI, cols = colsOf(U.pid), k = cols.findIndex(c => c.id === id);
  if (k < 0) return colsDraw();
  if (!colCount(id)) { colDelete(id); return colsDraw(null, '#pt_add'); }
  U.del = id; U.to = (cols[k - 1] || cols[k + 1]).id;
  colsDraw();
}
function colsDraw(focusSel, fallback) {
  const box = colsBox(), U = COLS_UI; if (!box || !U) return;
  const p = DB.projects.find(x => x.id === U.pid);
  if (!p || !canEditCols(p)) { closeModal(); COLS_UI = null; return; }
  const cols = colsOf(U.pid), nDone = cols.filter(s => s.cat === 'done').length;
  const sub = `<span class="ws-key">${esc(p.key)}</span>${esc(p.name)} · ${typeTag(projType(p))}`;
  const ds = U.del && cols.find(c => c.id === U.del);
  box.classList.toggle('w-md', !!ds);
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'pt_ct');
  if (ds) {
    const k = cols.indexOf(ds), n = colCount(ds.id), others = cols.filter(c => c.id !== ds.id);
    if (!others.some(c => c.id === U.to)) U.to = (cols[k - 1] || cols[k + 1]).id;
    const to = cols.find(c => c.id === U.to);
    box.innerHTML = `<div class="m-h"><button type="button" class="iconbtn" data-cback aria-label="Geri: kolon listesine dön">${ic('back')}</button>
        <div class="t"><b id="pt_ct">Kolonu sil: ${esc(ds.name)}</b><span class="s"><span class="cat-dot ${catOk(ds.cat)}" aria-hidden="true"></span>${esc(catName(ds.cat))} · ${n} iş</span></div>
        <button class="x" data-close aria-label="Kapat">×</button></div>
      <div class="pt-b">
        <p class="pt-q" id="pt_dq">İçindeki ${n} iş hangi kolona taşınsın?</p>
        <p class="pt-qs">Taşıma bitince "${esc(ds.name)}" kolonu silinir.</p>
        <div class="ws-opts" role="radiogroup" aria-labelledby="pt_dq">${others.map(o => {
          const on = o.id === U.to, j = cols.indexOf(o);
          const why = [colCount(o.id) + ' iş', j === k - 1 ? 'önceki kolon' : (k === 0 && j === 1 ? 'sonraki kolon' : ''), o.cat === 'done' ? 'Bitti kategorisi' : ''].filter(Boolean).join(' · ');
          return `<button type="button" class="ws-opt" role="radio" aria-checked="${on}" tabindex="${on ? 0 : -1}" data-cto="${esc(o.id)}">
            <span class="cat-dot ${catOk(o.cat)}" aria-hidden="true"></span><span class="tx"><span class="nm">${esc(o.name)}</span><span class="s">${why}</span></span><span class="ws-rad"></span></button>`;
        }).join('')}</div>
        <div class="ws-info">${ic('info')}<span>Her işin geçmişine <span class="k">Durum: ${esc(ds.name)} → ${esc(to.name)}</span> yazılır. Otomasyon kuralları bu toplu taşımada çalışmaz.</span></div>
      </div>
      <div class="m-f"><button type="button" class="btn" data-cback>Vazgeç</button><button type="button" class="btn pt-fill" id="pt_delok">${ic('trash')}Sil ve taşı</button></div>`;
    $$('[data-cback]', box).forEach(b => b.onclick = () => { U.del = null; colsDraw(`[data-cx="${k}"]`, '#pt_add'); });
    const opts = $$('[data-cto]', box);
    opts.forEach((b, j) => {
      b.onclick = () => { U.to = b.dataset.cto; colsDraw(`[data-cto="${b.dataset.cto}"]`); };
      b.onkeydown = e => {
        const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key]; if (!d) return;
        e.preventDefault(); const t = opts[(j + d + opts.length) % opts.length];
        U.to = t.dataset.cto; colsDraw(`[data-cto="${t.dataset.cto}"]`);
      };
    });
    $('#pt_delok', box).onclick = () => { if (colDelete(ds.id, U.to)) { U.del = null; colsDraw(null, '#pt_add'); } };
    return focusBack(box, focusSel, '[data-cto][aria-checked="true"]');
  }
  U.del = null;
  const full = cols.length >= COL_MAX;
  box.innerHTML = `<div class="m-h"><div class="t"><b id="pt_ct">Kolonları düzenle</b><span class="s">${sub}</span></div>
      <button class="x" data-close aria-label="Kapat">×</button></div>
    <div class="pt-b">
      ${U.alert ? `<div class="ws-alert" role="alert">${ic('alert')}<span class="tx"><b>${esc(U.alert)}</b>Değişiklik kaydedilmedi; kolonlar yeniden yüklendi.</span></div>` : ''}
      ${cols.length ? colHd(false) : `<p class="pt-qs">Bu projede henüz kolon yok. İlk kolonu ekleyin; en az bir "Bitti" kolonu gerekir.</p>`}
      <div class="pt-cols" role="list" aria-label="Kolonlar, soldan sağa">${cols.map((s, k) => colRowHtml(s, k, {
        n: colCount(s.id), first: k === 0, last: k === cols.length - 1, only: cols.length < 2,
        lock: s.cat === 'done' && nDone === 1, err: U.err[s.id], draft: U.draft[s.id] })).join('')}</div>
      <button type="button" class="pt-add" id="pt_add" ${full ? 'disabled aria-describedby="pt_lim"' : ''}>${ic('plus')}Kolon ekle<span class="lim" id="pt_lim">${cols.length}/${COL_MAX} · ${
        full ? `Bir projede en fazla ${COL_MAX} kolon olabilir` : 'yeni kolon "Devam ediyor" olarak eklenir'}</span></button>
    </div>
    <div class="m-f"><span class="note">${ic('check')}Değişiklikler hemen kaydedilir</span><button type="button" class="btn" data-close>Kapat</button></div>`;
  const redo = (sel, fb) => { U.alert = ''; colsDraw(sel, fb); };
  const commit = (k, el) => {
    const s = cols[k]; if (!s) return;
    const v = el.value.trim().replace(/\s+/g, ' ');
    /* Geçerli adda yeniden çizim yalnız hata kalkınca (yoksa aynı anda tıklanan düğme kaybolmasın). */
    const had = !!U.err[s.id];
    if (v === s.name) { delete U.err[s.id]; delete U.draft[s.id]; return had && redo(focusKey(document.activeElement)); }
    const err = colNameErr(v, cols.filter(c => c.id !== s.id).map(c => c.name));
    if (err) { U.err[s.id] = err; U.draft[s.id] = el.value; return redo(focusKey(document.activeElement) || `[data-cn="${k}"]`); }
    delete U.err[s.id]; delete U.draft[s.id];
    s.name = v; save(); render();
    if (had || el.value !== v) redo(focusKey(document.activeElement));
  };
  $$('[data-cn]', box).forEach(el => {
    el.oninput = () => { el.nextElementSibling.textContent = `${el.value.length}/${COL_NAME_MAX}`; };
    el.onchange = () => setTimeout(() => commit(+el.dataset.cn, el), 0);
    el.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(+el.dataset.cn, el); }
      if (e.key === 'Escape') { e.stopPropagation(); const s = cols[+el.dataset.cn]; delete U.err[s.id]; delete U.draft[s.id]; redo(`[data-cn="${el.dataset.cn}"]`); }
    };
  });
  $$('[data-cc]', box).forEach(el => el.onchange = () => {
    const s = cols[+el.dataset.cc];
    if (s.cat === 'done' && el.value !== 'done' && nDone < 2) { toast(LAST_DONE); return redo(`[data-cc="${el.dataset.cc}"]`); }
    s.cat = el.value; save(); render(); redo(`[data-cc="${el.dataset.cc}"]`);
  });
  const move = (k, d) => {
    const j = k + d; if (j < 0 || j >= cols.length) return;
    if (new Set(cols.map(c => c.ord)).size !== cols.length || cols.some(c => typeof c.ord !== 'number')) cols.forEach((c, x) => { c.ord = x; });
    [cols[k].ord, cols[j].ord] = [cols[j].ord, cols[k].ord];
    save(); render();
    redo(d < 0 ? `[data-cu="${j}"]` : `[data-cd="${j}"]`, d < 0 ? `[data-cd="${j}"]` : `[data-cu="${j}"]`);
  };
  $$('[data-cu]', box).forEach(b => b.onclick = () => move(+b.dataset.cu, -1));
  $$('[data-cd]', box).forEach(b => b.onclick = () => move(+b.dataset.cd, 1));
  $$('[data-cx]', box).forEach(b => b.onclick = () => { U.alert = ''; colsAskDelete(cols[+b.dataset.cx].id); });
  $('#pt_add', box).onclick = () => {
    if (colsOf(U.pid).length >= COL_MAX) return toast(`Bir projede en fazla ${COL_MAX} kolon olabilir`);
    const names = new Set(cols.map(c => colKey(c.name)));
    let n = 'Yeni kolon', x = 2; while (names.has(colKey(n))) n = 'Yeni kolon ' + x++;
    DB.statuses.push({ id: uid('st'), projectId: U.pid, name: n, cat: 'inprogress', wip: 0,
      ord: Math.max(-1, ...cols.map(c => +c.ord || 0)) + 1 });
    save(); render(); redo();
    const inp = box.querySelector(`[data-cn="${cols.length}"]`); if (inp) { inp.focus(); inp.select(); }
  };
  focusBack(box, focusSel, fallback);
}

function wireTypeCards(host, pick) {

function typeDialog(pid) {

/* Yeni proje formundaki kolon listesi (kayıt "Oluştur"a basınca yapılır; satırlar kilitlenmez). */
/* o.only: gösterilecek kaynak listesi (boş/tek → seçici yok); o.onTpl(v, satırlar): kaynak değişti (görev 10). */
function newColsEditor(host, flow, o = {}) {
  const st = { tpl: o.tpl || 'default', err: '' };
  const ALL = () => [
    ['default', 'Varsayılan akış', DB.cfg.defaultStatuses || STATUS_TEMPLATES.uyarlama[1]],
    ['basic', 'Basit', STATUS_TEMPLATES.basic[1]],
    ['dev', 'Geliştirme', STATUS_TEMPLATES.dev[1]],
    ['uyarlama', 'Uyarlama', STATUS_TEMPLATES.uyarlama[1]],
    ...(P() && stats().length ? [['copy', `${P().key} projesinden kopyala`, stats().map(s => [s.name, catOk(s.cat)])]] : [])];
  const TPLS = () => o.only ? ALL().filter(t => o.only.includes(t[0])) : ALL();
  const rowErr = k => colNameErr(flow[k][0], flow.filter((_, j) => j !== k).map(r => r[0]));
  let sig = '';
  const draw = (focusSel, fb) => {
    const full = flow.length >= COL_MAX;
    sig = flow.map((_, k) => rowErr(k)).join('|');
    host.innerHTML = `${TPLS().length < 2 ? '' : `<div class="pt-tpls" role="radiogroup" aria-label="${esc(o.label || 'Kolon şablonu')}">${TPLS().map(([v, l, r]) =>
        `<button type="button" class="pt-tpl" role="radio" aria-checked="${st.tpl === v}" tabindex="${st.tpl === v ? 0 : -1}" data-tpl="${v}">${v === 'copy' ? ic('copy') : ''}${esc(l)}<span class="n">${r.length}</span></button>`).join('')}</div>`}
      ${colHd(true)}
      <div class="pt-cols" role="list" aria-label="Kolon önizlemesi">${flow.map((r, k) => colRowHtml({ name: r[0], cat: r[1] }, k, {
        pre: 'n', compact: true, first: k === 0, last: k === flow.length - 1, only: flow.length < 2, err: rowErr(k) })).join('')}</div>
      <button type="button" class="pt-add" id="np_add" ${full ? 'disabled aria-describedby="np_lim"' : ''}>${ic('plus')}Kolon ekle<span class="lim" id="np_lim">${flow.length}/${COL_MAX}${
        full ? ` · Bir projede en fazla ${COL_MAX} kolon olabilir` : ''}</span></button>
      <div class="pt-ferr" id="np_cerr" role="alert">${st.err ? ic('alert') + esc(st.err) : ''}</div>`;
    const tpls = $$('[data-tpl]', host);
    const pickTpl = v => { st.tpl = v; st.err = ''; flow.length = 0;
      (TPLS().find(t => t[0] === v)?.[2] || []).slice(0, COL_MAX).forEach(r => flow.push([r[0], catOk(r[1])])); o.onTpl?.(v, flow); draw(`[data-tpl="${v}"]`); };
    tpls.forEach((b, j) => {
      b.onclick = () => pickTpl(b.dataset.tpl);
      b.onkeydown = e => { const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!d) return;
        e.preventDefault(); pickTpl(tpls[(j + d + tpls.length) % tpls.length].dataset.tpl); };
    });
    $$('[data-cn]', host).forEach(el => {
      el.oninput = () => { flow[+el.dataset.cn][0] = el.value; el.nextElementSibling.textContent = `${el.value.length}/${COL_NAME_MAX}`; };
      /* Yeniden çizim yalnız satır hataları değişince (aynı anda tıklanan düğme kaybolmasın). */
      el.onchange = () => setTimeout(() => { if (flow.map((_, k) => rowErr(k)).join('|') !== sig) draw(focusKey(document.activeElement)); }, 0);
    });
    $$('[data-cc]', host).forEach(el => el.onchange = () => { flow[+el.dataset.cc][1] = el.value; st.err = ''; draw(`[data-cc="${el.dataset.cc}"]`); });
    const mv = (k, d) => { const j = k + d; if (j < 0 || j >= flow.length) return;
      [flow[k], flow[j]] = [flow[j], flow[k]]; draw(d < 0 ? `[data-cu="${j}"]` : `[data-cd="${j}"]`, d < 0 ? `[data-cd="${j}"]` : `[data-cu="${j}"]`); };
    $$('[data-cu]', host).forEach(b => b.onclick = () => mv(+b.dataset.cu, -1));
    $$('[data-cd]', host).forEach(b => b.onclick = () => mv(+b.dataset.cd, 1));
    $$('[data-cx]', host).forEach(b => b.onclick = () => { if (flow.length < 2) return; const k = +b.dataset.cx; flow.splice(k, 1);
      draw(`[data-cx="${Math.min(k, flow.length - 1)}"]`, '#np_add'); });
    $('#np_add', host).onclick = () => {
      if (flow.length >= COL_MAX) return;
      const names = new Set(flow.map(r => colKey(r[0])));
      let n = 'Yeni kolon', x = 2; while (names.has(colKey(n))) n = 'Yeni kolon ' + x++;
      flow.push([n, 'inprogress']); draw();
      const inp = host.querySelector(`[data-cn="${flow.length - 1}"]`); if (inp) { inp.focus(); inp.select(); }
    };
    focusBack(host, focusSel, fb);
  };
  draw();
  /* "Oluştur" öncesi denetim: hata iletisi ya da '' */
  return () => {
    let e = '';
    if (!flow.length) e = 'En az bir kolon gerekli.';
    else if (flow.length > COL_MAX) e = `Bir projede en fazla ${COL_MAX} kolon olabilir`;
    else if (flow.some((_, k) => rowErr(k))) e = 'Kolon adlarını düzeltin.';
    else if (!flow.some(r => r[1] === 'done')) e = 'Projede en az bir Bitti kolonu olmalı. Bir kolonun kategorisini "Bitti" yap.';
    st.err = e; if (e) draw('#np_ok');
    return e;
  };
}

const psSteps = cur => `<ol class="ps-steps" aria-label="Adımlar">

function newProjectForm(preset = {}) {
  if (!canNewProjAny()) return toast(role() === 'viewer' ? 'İzleyiciler proje oluşturamaz' : 'Proje açmak için alan yöneticisi yetkisi gerekli');

  /* Alan seçimi (#22): grubun "+ Proje"si o alanı, diğer girişler seçili alanı önerir. */
  const fromWs = !!(preset.workspaceId && wsById(preset.workspaceId) && !wsArchived(preset.workspaceId));
  const def = [preset.workspaceId, DB.ui.workspace, WS_DEFAULT, ...wsAll().map(w => w.id)].find(id => canNewProj(id)) || WS_DEFAULT;
  /* Adımlar arası korunan girdiler: ad, anahtar, alan, cari, üyeler; kolonlar şablonla yeniden dolar. */
  const st = { k: 'kanban', sel: 'kanban', name: '', key: '', keyTouched: false, ws: def, cu: '', picked: new Set([SESSION]),
    flow: null, base: '', src: 'default', epic: false, def: false, err: {} };
  openModal('', 'pt-dlg ps-m');
  const box = $('#scrim .modal');
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
  const show = (html, cls, label) => { box.className = 'modal pt-dlg ps-m ' + cls; box.innerHTML = html; box.setAttribute('aria-labelledby', label); box.scrollTop = 0; $('#scrim').scrollTop = 0; };
  const T = () => tplBy(st.k);
  const opensAt = t => t.open === 'roadmap' && !MOD('epic') && !st.epic ? 'board' : t.open;
  const card = t => `<div class="ps-card ${t.k === st.sel ? 'on' : ''}" data-pk="${t.k}">
      <label class="ps-pick"><input class="sr" type="radio" name="ps_tpl" value="${t.k}" ${t.k === st.sel ? 'checked' : ''} aria-describedby="ps_d_${t.k}">
        <span class="ps-pv">${svgPv(t.k)}${t.rec ? `<span class="ps-rec">${ic('star')}Önerilen</span>` : ''}</span>
        <span class="ps-body"><span class="ps-nm"><b>${esc(t.n)}</b>${typeTag(t.t)}<span class="ps-rad" aria-hidden="true"></span></span>
          <span class="ps-desc" id="ps_d_${t.k}">${esc(t.d)}</span>
          ${t.epic ? `<span class="ps-mod">${ic('zap')}Önerilen modül: Epik</span>` : ''}</span></label>
      <div class="ps-foot"><span class="ps-meta"><span class="ps-strip" aria-hidden="true">${tplCols(t).map(([, c]) => `<i class="${c}"></i>`).join('')}</span>${tplCols(t).length} kolon</span>
        <button type="button" class="btn ghost ps-look" data-pvw="${t.k}" aria-label="${esc(t.n)} şablonunu önizle">${ic('eye')}Önizle</button></div></div>`;
  const note = () => { const t = tplBy(st.sel); return `${ic('check')}Seçili: <b>${esc(t.n)}</b> · ${TYPE_LABEL[t.t]} · ${tplCols(t).length} kolon`; };

  /* ---- Adım 1: galeri ---- */
  /* Galerideki seçim (st.sel) uygulanmış şablonu (st.k) "Devam et"e kadar değiştirmez. */
  const gallery = focusK => {
    if (!focusK) st.sel = st.k;
    const ws = wsById(st.ws);
    show(`<div class="ps-h"><div class="t"><h2 id="ps_t">Yeni proje · Şablon seçin</h2>

        <fieldset class="ps-grid" id="ps_grid"><legend class="sr">Şablon</legend>${PROJ_TPLS.map(card).join('')}</fieldset></div>

      $$('.ps-card', box).forEach(c => c.classList.toggle('on', c.dataset.pk === st.sel)); $('#ps_note', box).innerHTML = note(); };

    $('#ps_next', box).onclick = () => pickTpl(st.sel);
    (focusK ? box.querySelector(`[data-pvw="${focusK}"]`) : box.querySelector('input[name="ps_tpl"]:checked'))?.focus();
  };

  /* ---- Önizle: kolonlar kategori renkli + tür + açılış ekranı; kayıt oluşmaz ---- */
  const preview = k => {
    const t = tplBy(k), cols = tplCols(t), n = c => cols.filter(x => x[1] === c).length, gh = c => c === 'todo' ? 3 : c === 'done' ? 1 : 2;
    const op = OPEN_LBL[t.open];
    show(`<div class="ps-h back"><button type="button" class="iconbtn bare" id="ps_pvback" aria-label="Galeriye dön">${ic('back')}</button>

        <section class="ps-board" aria-label="Kolonlar, soldan sağa">

            <span class="k" aria-hidden="true">${CATS.map(([c, l]) => `<span><i class="cat-dot ${c}"></i>${l}</span>`).join('')}</span></div>

            ? 'Epik modülü kapalıyken Pano açılır' : 'Proje oluşunca bu ekran açılır'}</small></dd></div>
          <div><dt>Kolonlar</dt><dd><b class="mono">${cols.length} kolon</b>
            <span class="ps-cnt">${CATS.map(([c, l]) => `<span><i class="cat-dot ${c}" aria-hidden="true"></i><b>${n(c)}</b> ${l}</span>`).join('')}</span></dd></div>
          <div><dt>Değişmeyenler</dt><dd><small>İş tipleri, modüller ve otomasyon kuralları tüm projelerde ortaktır; şablon bunları değiştirmez.</small></dd></div>
        </dl></div></div>
      <div class="ps-f"><span class="note">${ic('info')}Kolonları bir sonraki adımda düzenleyebilirsiniz.</span>
        <button type="button" class="btn" id="ps_pvgal">${ic('back')}Galeriye dön</button>
        <button type="button" class="btn pri" id="ps_pvuse">Bu şablonu kullan${ic('arrow')}</button></div>`, 'w-pv', 'ps_pt');
    $('#ps_pvback', box).onclick = $('#ps_pvgal', box).onclick = () => gallery(k);
    $('#ps_pvuse', box).onclick = () => pickTpl(k);
    $('#ps_pvuse', box).focus();
  };

  /* Şablon seçildi → adım 2. Kolonlar elle değiştiyse ve şablon değişiyorsa önce sorulur. */
  const pickTpl = k => {
    const dirty = st.flow && JSON.stringify(st.flow) !== st.base;
    if (st.flow && st.flowK === k) return details();
    if (dirty) return details({ ask: k });
    fill(k); details();
  };
  const fill = k => { st.k = k; st.flowK = k; st.src = 'default'; st.flow = tplCols(tplBy(k)); st.base = JSON.stringify(st.flow); };

  /* ---- Adım 2: ayrıntılar ---- */
  const details = (o = {}) => {
    const t = T(), admin = isAdmin(), cols = st.flow, op = OPEN_LBL[opensAt(t)];
    const wsl = visibleWs().filter(w => canNewProj(w.id));
    if (!wsl.some(w => w.id === st.ws) && wsById(st.ws)) wsl.unshift(wsById(st.ws));
    const E = st.err, fe = (id, m) => m ? `<div class="ps-err" id="${id}" role="alert">${ic('alert')}${esc(m)}</div>` : '';

        <div class="ps-chosen"><span class="ps-thumb">${svgPv(t.k)}</span>

      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.querySelector('em').textContent = on ? '✓' : '+';

  const freeKey = k => { const base = String(k || 'PRJ').slice(0, 17); let c = base, n = 2; while (keyTaken(c)) c = base + n++; return c; };

function deleteProject(pid) {
  const p = DB.projects.find(x => x.id === pid);
  const iss = DB.issues.filter(i => i.projectId === pid);
  const wl = DB.worklogs.filter(w => iss.some(i => i.id === w.issueId));
  openModal(`<div class="m-h"><b>Projeyi sil</b><button class="x" data-close>×</button></div>
    <div style="padding:16px 18px">
      <p style="margin:0 0 12px"><b>${esc(p.name)}</b> ve içindeki her şey kalıcı olarak silinecek:</p>
      <div class="stat">
        <div><b>${iss.length}</b><span>iş</span></div>
        <div><b>${wl.length}</b><span>süre kaydı</span></div>
        <div><b>${efFmtSafe(wl.reduce((a, w) => a + w.hours, 0))}</b><span>efor</span></div>
      </div>
      <p style="color:var(--risk);font-size:12.5px">Bu işlem geri alınamaz. Onaylamak için proje adını yazın.</p>
      <input class="inp" id="dp_c" placeholder="${esc(p.name)}">
      <div id="dp_err" class="lg-err"></div>
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button>
      <button class="btn danger" id="dp_ok">Kalıcı olarak sil</button></div>`, 'narrow');
  $('#dp_ok').onclick = () => {
    if ($('#dp_c').value.trim().toLowerCase() !== p.name.toLowerCase())
      return $('#dp_err').textContent = 'Proje adı eşleşmiyor.';
    const ids = new Set(iss.map(i => i.id));
    DB.worklogs = DB.worklogs.filter(w => !ids.has(w.issueId));
    DB.comments = DB.comments.filter(c => !ids.has(c.issueId));
    /* Geçmiş kayıtları istemciden silinmez (yalnız eklenir); sunucu işle birlikte cascade siler (B2). */
    DB.transitions = DB.transitions.filter(t => !ids.has(t.issueId));
    DB.links = DB.links.filter(l => !ids.has(l.from) && !ids.has(l.to));
    DB.issues = DB.issues.filter(i => i.projectId !== pid);
    DB.statuses = DB.statuses.filter(s => s.projectId !== pid);
    DB.sprints = DB.sprints.filter(s => s.projectId !== pid);
    DB.rules = DB.rules.filter(r => r.projectId !== pid);
    DB.fields = DB.fields.filter(f => f.projectId !== pid);
    DB.projects = DB.projects.filter(x => x.id !== pid);
    if (DB.ui.project === pid) DB.ui.project = null;          // ensureSel alanın ilk projesini seçer
    closeModal(); save(); startApp(); toast(`${p.name} silindi`);
  };
}

/* Varsayılanlar. Story yok — tipler Proje ayarları → İş tipleri'nden değişir. */
const TYPE_DEFAULTS = [
  { id: 'task', name: 'Görev', letter: 'G', color: '#3E7BC4' },
  { id: 'bug',  name: 'Hata',  letter: 'H', color: '#C0392B' },
];
const STATUS_TEMPLATES = {
  uyarlama: ['Uyarlama akışı', [['Analiz', 'todo'], ['Uyarlama', 'inprogress'], ['Yazılım', 'inprogress'],
              ['Kullanıcı Kabul', 'inprogress'], ['Canlı Takip', 'inprogress'], ['Raporlama', 'done']]],
  basic:    ['Basit', [['Yapılacak', 'todo'], ['Devam ediyor', 'inprogress'], ['Bitti', 'done']]],
  dev:      ['Geliştirme', [['Yapılacak', 'todo'], ['Geliştirmede', 'inprogress'], ['İncelemede', 'inprogress'],
              ['Testte', 'inprogress'], ['Bitti', 'done']]],
};
const CATS = [['todo', 'Yapılacak'], ['inprogress', 'Devam ediyor'], ['done', 'Bitti']];
const catName = c => CATS.find(x => x[0] === c)?.[1] || c;

function buildTypes() {
  TYPE = {};
  (DB.cfg.types || TYPE_DEFAULTS).forEach(t => TYPE[t.id] = [t.letter, t.id, t.name, t.color]);
  if (!TYPE.epic) TYPE.epic = ['E', 'epic', 'Epik', '#6B4FBB'];
  if (!TYPE.sub)  TYPE.sub  = ['↳', 'sub', 'Alt görev', '#7B8794'];
}
function ensureTypes() {
  DB.cfg.types ||= TYPE_DEFAULTS.map(t => ({ ...t }));
  DB.cfg.defaultStatuses ||= STATUS_TEMPLATES.uyarlama[1].map(x => [...x]);
  buildTypes();
  const ok = new Set(Object.keys(TYPE));
  DB.issues.forEach(i => { if (!ok.has(i.type)) i.type = DB.cfg.types[0].id; });
}

/* ---- yönetim: iş tipleri ---- */
function renderTypes() {

      <span class="k" style="color:var(--ink3)">${used(t.id)} iş</span>
      <button class="btn sm" data-tymv="${t.id}" data-dir="-1" ${k === 0 ? 'disabled' : ''}>↑</button>
      <button class="btn sm" data-tymv="${t.id}" data-dir="1" ${k === DB.cfg.types.length - 1 ? 'disabled' : ''}>↓</button>
      <button class="btn sm danger" data-tydel="${t.id}" ${DB.cfg.types.length < 2 ? 'disabled' : ''}>Sil</button>
    </div>`).join('')}
    <div style="display:flex;gap:6px;margin-top:8px">
      <input class="inp" id="ty_new" placeholder="Yeni tip adı — örn. Talep, Analiz, Danışmanlık" style="max-width:300px">

    </div>
    ${MOD('epic') ? '<div style="font-size:11.5px;color:var(--ink3);margin-top:8px">Epik ve alt görev yerleşik tiplerdir, listede görünmez.</div>' : ''}

function wireTypes() {
  $$('[data-ty]').forEach(el => el.onchange = () => {
    const t = DB.cfg.types.find(x => x.id === el.dataset.ty);
    let v = el.value.trim();
    if (el.dataset.p === 'letter') v = (v || t.name[0] || '?').toUpperCase().slice(0, 2);
    if (el.dataset.p === 'name' && !v) v = t.name;
    t[el.dataset.p] = v; buildTypes(); save(); render();
  });
  $$('[data-tymv]').forEach(b => b.onclick = () => {
    const i = DB.cfg.types.findIndex(t => t.id === b.dataset.tymv), j = i + (+b.dataset.dir);
    if (j < 0 || j >= DB.cfg.types.length) return;
    [DB.cfg.types[i], DB.cfg.types[j]] = [DB.cfg.types[j], DB.cfg.types[i]];
    save(); render();
  });
  $$('[data-tydel]').forEach(b => b.onclick = () => {
    const id = b.dataset.tydel, n = DB.issues.filter(i => i.type === id).length;
    const other = DB.cfg.types.find(t => t.id !== id);
    if (n && !confirm(`${n} iş "${TYPE[id][2]}" tipinde. Hepsi "${other.name}" tipine taşınsın mı?`)) return;
    DB.issues.forEach(i => { if (i.type === id) histSet(i, 'type', other.id); });
    DB.cfg.types = DB.cfg.types.filter(t => t.id !== id);
    buildTypes(); save(); render();
  });
  const add = $('#ty_add'); if (add) add.onclick = () => {
    const n = $('#ty_new').value.trim(); if (!n) return toast('Tip adı gerekli');
    const base = slugName(n) || 'tip';
    let id = base, k = 2; while (TYPE[id]) id = base + k++;
    const colors = ['#3E7BC4', '#C0392B', '#1F6F5C', '#B45309', '#6B4FBB', '#2B7A78', '#8E44AD'];
    DB.cfg.types.push({ id, name: n, letter: n[0].toUpperCase(), color: colors[DB.cfg.types.length % colors.length] });
    buildTypes(); save(); render(); toast(n + ' eklendi');
  };
}

/* ============================================================
   DURUM AKIŞI DÜZENLEYİCİ
   Hem yeni proje formunda hem de iş akışı ekranında kullanılır.
   ============================================================ */
function statusEditor(rows, host, onChange) {
  const draw = () => {
    $(host).innerHTML = rows.map((r, k) => `<div style="display:flex;gap:6px;margin-bottom:5px;align-items:center">
      <span class="k" style="width:18px;color:var(--ink3)">${k + 1}</span>
      <input class="inp" data-sr="${k}" value="${esc(r[0])}" placeholder="Durum adı" style="flex:1">
      <select class="inp" data-sc="${k}" style="width:auto">
        ${CATS.map(([v, l]) => `<option value="${v}" ${r[1] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button type="button" class="btn sm" data-sm="${k}" data-d="-1" ${k === 0 ? 'disabled' : ''}>↑</button>
      <button type="button" class="btn sm" data-sm="${k}" data-d="1" ${k === rows.length - 1 ? 'disabled' : ''}>↓</button>
      <button type="button" class="btn sm danger" data-sx="${k}" ${rows.length < 2 ? 'disabled' : ''}>×</button>
    </div>`).join('') +
    `<button type="button" class="btn sm" id="sr_add" style="margin-top:4px">+ Durum ekle</button>`;
    $$('[data-sr]', $(host)).forEach(el => el.oninput = () => { rows[+el.dataset.sr][0] = el.value; onChange?.(); });
    $$('[data-sc]', $(host)).forEach(el => el.onchange = () => { rows[+el.dataset.sc][1] = el.value; onChange?.(); });
    $$('[data-sm]', $(host)).forEach(b => b.onclick = () => {
      const i = +b.dataset.sm, j = i + (+b.dataset.d);
      if (j < 0 || j >= rows.length) return;
      [rows[i], rows[j]] = [rows[j], rows[i]]; draw(); onChange?.();
    });
    $$('[data-sx]', $(host)).forEach(b => b.onclick = () => { rows.splice(+b.dataset.sx, 1); draw(); onChange?.(); });
    $('#sr_add', $(host)).onclick = () => { rows.push(['Yeni durum', 'inprogress']); draw(); onChange?.(); };
  };
  draw();
  return draw;
}

const BILLABLE = ['Faturalanacak', 'Faturalanmayacak'];
const BILLTYPE = ['Kişi/Saat', 'Adam/Ay'];

const btypeOf = i => i?.billType || BILLTYPE[0];

function ensureBilling() {
  DB.issues.forEach(i => {
    if (!BILLABLE.includes(i.billable)) i.billable = BILLABLE[0];
    i.billType ||= BILLTYPE[0];
  });
  if (DB.ui.qa && !BILLABLE.includes(DB.ui.qa.billable)) DB.ui.qa.billable = BILLABLE[0];
  DB.ui.qa ||= { type: null, assignee: SESSION || '', priority: 3, billable: BILLABLE[0],
    billType: BILLTYPE[0], estimate: '', start: '', due: '', dur: '', cf: {} };
  /* "Ortam" özel alanı istenmedi — bir kez temizle */
  if (!DB.cfg.dropOrtam) {
    const f = DB.fields.find(x => x.key === 'ortam');
    if (f) { DB.fields = DB.fields.filter(x => x.id !== f.id); DB.issues.forEach(i => { if (i.cf) delete i.cf[f.id]; }); }
    DB.cfg.dropOrtam = true;
  }
}

const qaTypes = () => ISSUE_TYPES().filter(t => t !== 'epic');

      menu(e.currentTarget, { kind: 'due', title: 'Bitiş', list: () => opts.map(([l, d]) => pmOpt(d, q.due, ic('cal'), l, esc(fmtD(d)))).join('')

/* ============================================================
   XLSX YAZICI
   Bağımlılık yok: sıkıştırmasız (stored) ZIP + minimal
   SpreadsheetML. Excel, LibreOffice ve Google Sheets açar.
   ============================================================ */
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; }

function zipStore(files) {
  const enc = new TextEncoder(), parts = [], cdir = [];
  let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
    parts.push(lh, name, data);

    const cd = new Uint8Array(46), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true); cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, off, true);
    cdir.push(cd, name);
    off += 30 + name.length + data.length;
  });
  const cdSize = cdir.reduce((a, b) => a + b.length, 0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true); ev.setUint16(20, 0, true);
  return new Blob([...parts, ...cdir, eo], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const xmlEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]))
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
const colRef = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };

/* rows: hücre dizisi dizisi. Sayılar sayı, diğerleri metin olarak yazılır. */
/* sheets: [{name, rows, widths}] — tek dizi verilirse tek sayfa sayılır. */
function makeXlsx(sheets, sheetName = 'Rapor', widths) {
  if (Array.isArray(sheets) && Array.isArray(sheets[0])) sheets = [{ name: sheetName, rows: sheets, widths }];
  const sheetXml = s => {
    const body = s.rows.map((r, ri) => `<row r="${ri + 1}">${r.map((c, ci) => {
      const ref = colRef(ci) + (ri + 1);
      if (typeof c === 'number' && isFinite(c)) return `<c r="${ref}"><v>${c}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const cols = s.widths ? `<cols>${s.widths.map((wd, k) =>
      `<col min="${k + 1}" max="${k + 1}" width="${wd}" customWidth="1"/>`).join('')}</cols>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${body}</sheetData></worksheet>`;
  };
  const files = [
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_, k) => `<Override PartName="/xl/worksheets/sheet${k + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, k) => `<sheet name="${xmlEsc(s.name || 'Sayfa' + (k + 1)).slice(0, 31)}" sheetId="${k + 1}" r:id="rId${k + 1}"/>`).join('')}</sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, k) => `<Relationship Id="rId${k + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${k + 1}.xml"/>`).join('')}</Relationships>` },
  ];
  sheets.forEach((s, k) => files.push({ name: `xl/worksheets/sheet${k + 1}.xml`, data: sheetXml(s) }));
  return zipStore(files);
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============================================================
   AYLIK FATURA RAPORU (Excel)
   Cari · Tarih · Proje · Açıklama · Tür · Çalışılan Zaman · Faturalanma Durumu
   ============================================================ */
const trDate = d => { const [y, m, dd] = String(d).split('-'); return `${dd}.${m}.${y}`; };
/* İşin carisi (görev 11b): işe bağlı cari, yoksa projenin carisi; ikisi de yoksa (ya da cari bulunamıyorsa) boş. */
const CU_NONE = 'Cari bağlı değil';
function customerIdOf(i) {
  if (!i) return '';
  if (i.customerId && cuById(i.customerId)) return i.customerId;
  const p = DB.projects.find(x => x.id === i.projectId);
  return p?.customerId && cuById(p.customerId) ? p.customerId : '';
}
function customerOf(i) {
  const c = cuById(customerIdOf(i));
  return c ? c.name : CU_NONE;
}
function billingRows() {
  const logs = periodLogs().slice().sort((a, b) =>
    a.date.localeCompare(b.date) || (issue(a.issueId)?.key || '').localeCompare(issue(b.issueId)?.key || ''));
  return logs.map(w => {
    const i = issue(w.issueId);
    return [
      customerOf(i),
      trDate(w.date),
      DB.projects.find(p => p.id === i.projectId)?.name || '',
      w.comment?.trim() || i.description?.trim() || i.summary,
      btypeOf(i),
      Math.round(w.hours * 100) / 100,
      billOf(i),
    ];
  });
}
const BILL_HEAD = ['Cari', 'Tarih', 'Proje', 'Açıklama', 'Tür', 'Çalışılan Zaman', 'Faturalanma Durumu'];

function exportBillingXlsx() {
  const rows = billingRows();
  if (!rows.length) return toast('Bu dönemde süre kaydı yok');
  const total = rows.reduce((a, r) => a + r[5], 0);
  const data = [BILL_HEAD, ...rows, [], ['', '', '', 'TOPLAM', '', Math.round(total * 100) / 100, '']];
  const p = period();
  download(makeXlsx(data, p.month ? monthName(p.month) : 'Rapor', [18, 12, 24, 70, 12, 15, 20]),
    `fatura-raporu-${p.month || p.from}.xlsx`);
  toast(`${rows.length} satır · ${efFmt(total)} Excel'e aktarıldı`);
}


/* ============================================================
   Bölüm 13: PLANLAMA — başlangıç/bitiş tarihi ve zaman çizelgesi
   ============================================================ */

/* İş günü aritmetiği: hafta sonları planlamaya dahil edilmez. */
const isWorkday = d => { const w = new Date(d).getDay(); return w !== 0 && w !== 6; };
/* n negatif olabilir: geriye doğru iş günü sayar. */
function addWorkdays(from, n) {
  const d = new Date(from);
  const step = n < 0 ? -1 : 1;
  let left = Math.abs(n);
  while (left > 0) { d.setDate(d.getDate() + step); if (isWorkday(d)) left--; }
  return iso(d);
}
function workdaysBetween(a, b) {
  if (!a || !b || a > b) return 0;
  let n = 0;
  for (const d = new Date(a); iso(d) <= b; d.setDate(d.getDate() + 1)) if (isWorkday(d)) n++;
  return n;
}
const planDays = i => (i.start && i.due) ? workdaysBetween(i.start, i.due) : 0;

/* Plana göre iş durumu: bitmediyse ve tarih geçtiyse gecikmiş sayılır. */
function planState(i) {
  const done = stat(i.statusId).cat === 'done';
  if (!i.due) return done ? 'done' : 'none';
  if (done) return 'done';
  if (i.due < TODAY) return 'late';
  if (i.start && i.start > TODAY) return 'future';
  return 'active';
}
const PLAN_COLOR = { done: 'var(--done)', late: 'var(--risk)', active: 'var(--accent)', future: '#98A0AC', none: '#C7CBD1' };

function ensurePlanning() {
  DB.issues.forEach(i => { if (i.start === undefined) i.start = ''; });
}

/* ============================================================
   ZAMAN ÇİZELGESİ (proje planı)
   ============================================================ */
function toolbarPlan() {
  const z = DB.ui.planZoom || 'week';
  return `<div class="seg" id="planZoom">
      ${[['day', 'Gün'], ['week', 'Hafta'], ['month', 'Ay']].map(([v, l]) =>
        `<button data-z="${v}" class="${z === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    <button class="btn sm" id="planPrev">‹</button>
    <button class="btn sm" id="planNow">Bugün</button>
    <button class="btn sm" id="planNext">›</button>
    <select class="inp" id="planGroup" style="width:auto">
      ${[['none', 'Gruplama yok'], ['assignee', 'Kişiye göre'], ['status', 'Duruma göre']].map(([v, l]) =>
        `<option value="${v}" ${(DB.ui.planGroup || 'none') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)">
      <input type="checkbox" id="planUnset" ${DB.ui.planUnset ? 'checked' : ''}> Tarihsizleri de göster</label>
    <div class="spacer"></div>
    ${canEdit() ? '<button class="btn pri" id="planNew">+ İş oluştur</button>' : ''}`;
}

/* Görünen zaman aralığı ve sütunlar */
function planScale() {
  const z = DB.ui.planZoom || 'week';
  const off = DB.ui.planOff || 0;
  if (z === 'day') {
    const from = monday(addD(new Date(), off * 7));
    const cols = Array.from({ length: 14 }, (_, k) => iso(addD(from, k)));
    return { from: cols[0], to: cols[13], cols, label: c => fmtD(c), sub: c => DAYS[(new Date(c).getDay() + 6) % 7],
             isEnd: c => c, dim: c => !isWorkday(c) };
  }
  if (z === 'month') {
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + off);
    const cols = Array.from({ length: 8 }, (_, k) => {
      const d = new Date(base.getFullYear(), base.getMonth() + k, 1); return iso(d); });
    const end = new Date(new Date(cols[7]).getFullYear(), new Date(cols[7]).getMonth() + 1, 0);
    return { from: cols[0], to: iso(end), cols,
             label: c => MONTHS[new Date(c).getMonth()].slice(0, 3), sub: c => c.slice(0, 4),
             isEnd: c => iso(new Date(new Date(c).getFullYear(), new Date(c).getMonth() + 1, 0)), dim: () => false };
  }
  const from = monday(addD(new Date(), off * 7 - 14));
  const cols = Array.from({ length: 12 }, (_, k) => iso(addD(from, k * 7)));
  return { from: cols[0], to: iso(addD(new Date(cols[11]), 6)), cols,
           label: c => fmtD(c), sub: () => 'hafta', isEnd: c => iso(addD(new Date(c), 6)), dim: () => false };
}

function renderPlan() {
  const sc = planScale();
  const span = (new Date(sc.to) - new Date(sc.from)) / 86400000 + 1;
  const pos = d => Math.max(0, Math.min(100, ((new Date(d) - new Date(sc.from)) / 86400000) / span * 100));
  const list = issuesOf().filter(i => i.type !== 'epic' && matches(i))
    .filter(i => DB.ui.planUnset ? true : (i.start || i.due))
    .filter(i => !(i.start || i.due) || !(i.due && i.due < sc.from) && !(i.start && i.start > sc.to))
    .sort((a, b) => (a.start || a.due || '9999').localeCompare(b.start || b.due || '9999') || a.rank - b.rank);

  const bar = i => {
    if (!i.start && !i.due) return `<span class="pl-none">tarih yok</span>`;
    const s = i.start || i.due, e = i.due || i.start;
    const L = pos(s), R = pos(addD(new Date(e), 1));
    const st = planState(i);
    const prog = i.estimate ? Math.min(100, i.spent / i.estimate * 100) : (stat(i.statusId).cat === 'done' ? 100 : 0);
    return `<div class="pl-bar" style="left:${L}%;width:${Math.max(R - L, 1.2)}%;background:${PLAN_COLOR[st]}"
        title="${esc(i.key)} · ${fmtD(s)} → ${fmtD(e)}${planDays(i) ? ' · ' + planDays(i) + ' iş günü' : ''}">
        <i style="width:${prog}%"></i>
        <span>${planDays(i) > 2 ? esc(i.summary) : ''}</span></div>`;
  };

  const row = i => `<tr data-open="${i.id}" style="cursor:pointer">
      <td class="lead">
        <div style="display:flex;align-items:center;gap:7px">
          ${tIcon(i.type)}<span class="k" style="color:var(--ink3)">${i.key}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.summary)}</span>
          ${avat(i.assignee)}
        </div>
      </td>
      <td class="pl-dates"><span class="k">${i.start ? fmtD(i.start) : '—'} → ${i.due ? fmtD(i.due) : '—'}</span>
        ${canEdit() && i.type !== 'sub' ? `<button class="btn sm" data-plansub="${i.id}" title="Bu işin altına alt iş ekle">+</button>` : ''}</td>
      <td colspan="${sc.cols.length}"><div class="pl-track">
        <div class="today" style="left:${pos(TODAY)}%"></div>
        ${sc.cols.map(c => sc.dim(c) ? `<div class="pl-dim" style="left:${pos(c)}%;width:${100 / span}%"></div>` : '').join('')}
        ${bar(i)}</div></td>
    </tr>`;

  let body;
  const g = DB.ui.planGroup || 'none';
  if (g === 'none') body = list.map(row).join('');
  else {
    const groups = g === 'assignee'

        ${sc.cols.map(c => `<th>${sc.label(c)}<br><span style="font-weight:400;opacity:.7">${sc.sub(c)}</span></th>`).join('')}
      </tr></thead>
      <tbody>${body || `<tr><td colspan="${2 + sc.cols.length}"><div class="empty">

        ya da “Tarihsizleri de göster” kutusunu işaretleyin.</div></td></tr>`}</tbody>
    </table></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:8px">
      ${[['active', 'planlanan'], ['future', 'başlamamış'], ['late', 'gecikmiş'], ['done', 'tamamlanan']]
        .map(([k, l]) => `<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${PLAN_COLOR[k]};vertical-align:-1px"></i> ${l}</span>`).join('')}
      <span>Çubuğun içindeki açık alan harcanan sürenin tahmine oranıdır; kırmızı dikey çizgi bugün.</span>
    </div>`;
}

function wirePlan() {
  const z = $('#planZoom'); if (!z) return;
  z.onclick = e => { const b = e.target.closest('[data-z]');
    if (b) { DB.ui.planZoom = b.dataset.z; DB.ui.planOff = 0; save(); render(); } };
  const step = () => (DB.ui.planZoom === 'month' ? 1 : DB.ui.planZoom === 'day' ? 2 : 4);
  $('#planPrev').onclick = () => { DB.ui.planOff = (DB.ui.planOff || 0) - step(); save(); render(); };
  $('#planNext').onclick = () => { DB.ui.planOff = (DB.ui.planOff || 0) + step(); save(); render(); };
  $('#planNow').onclick = () => { DB.ui.planOff = 0; save(); render(); };
  $('#planGroup').onchange = e => { DB.ui.planGroup = e.target.value; save(); render(); };
  $('#planUnset').onchange = e => { DB.ui.planUnset = e.target.checked; save(); render(); };
