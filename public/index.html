  --c-track:#E6ECF4;
}
:root[data-theme="dark"]{
  --meta:#8494AE; --late:#F87171; --today:#FBBF24; --ok:#34D399; --over:#FBBF24;
  --p-acil:#FCA5A5;   --p-acil-bg:rgba(248,113,113,.14);  --p-acil-ln:rgba(248,113,113,.30);
  --p-yuksek:#FDBA74; --p-yuksek-bg:rgba(251,146,60,.14); --p-yuksek-ln:rgba(251,146,60,.30);
  --p-orta:#B4C2D8;   --p-orta-bg:rgba(148,163,184,.14);  --p-orta-ln:rgba(148,163,184,.28);
  --p-dusuk:#8A97AB;  --p-dusuk-bg:rgba(148,163,184,.06); --p-dusuk-ln:rgba(148,163,184,.18);
  --c-track:#1E2B45;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --meta:#8494AE; --late:#F87171; --today:#FBBF24; --ok:#34D399; --over:#FBBF24;
    --p-acil:#FCA5A5;   --p-acil-bg:rgba(248,113,113,.14);  --p-acil-ln:rgba(248,113,113,.30);
    --p-yuksek:#FDBA74; --p-yuksek-bg:rgba(251,146,60,.14); --p-yuksek-ln:rgba(251,146,60,.30);
    --p-orta:#B4C2D8;   --p-orta-bg:rgba(148,163,184,.14);  --p-orta-ln:rgba(148,163,184,.28);
    --p-dusuk:#8A97AB;  --p-dusuk-bg:rgba(148,163,184,.06); --p-dusuk-ln:rgba(148,163,184,.18);
    --c-track:#1E2B45;
  }
}
svg.i{width:14px;height:14px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- kart ---- */
.card{position:relative;padding:12px 12px 10px;border-radius:12px}
.card .sum{margin:0 0 8px;font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-right:4px}
.card.is-done{opacity:1;background:color-mix(in srgb,var(--surface) 70%,var(--surface2))}
.card.is-done .sum{text-decoration:none;color:var(--meta);font-weight:550}
.card .epic-tag{margin-bottom:8px}

.c-tags{display:flex;gap:4px;margin:0 0 8px;flex-wrap:wrap;min-width:0}
.c-tag{font-size:10.5px;font-weight:550;color:var(--ink2);background:var(--surface3);border-radius:6px;padding:2px 7px;
  display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-tag i{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}

.c-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--meta);flex-wrap:wrap;row-gap:4px;min-height:24px;white-space:nowrap}
.c-sep{width:3px;height:3px;border-radius:50%;background:var(--line2);flex-shrink:0}
.c-due{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.c-due.d-late{color:var(--late);font-weight:650}
.c-due.d-today{color:var(--today);font-weight:650}
.c-due.d-ok{color:var(--ok);font-weight:600}
.c-est{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;margin-left:auto}
.c-est .b{width:30px;height:4px;border-radius:4px;background:var(--c-track);overflow:hidden}
.c-est .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.c-est.e-over{color:var(--over)} .c-est.e-over .b i{background:var(--over)}
.c-est.e-full .b i{background:var(--ok)}

/* öncelik rozeti: kartta ikon + metin (tıklanabilir) */
.prio{position:relative;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px 0 5px;border-radius:7px;
  font-size:11px;font-weight:650;border:1px solid transparent;font-family:inherit;flex-shrink:0;line-height:1}
button.prio{cursor:pointer}
button.prio::after{content:"";position:absolute;inset:-7px -3px}
button.prio:hover{filter:brightness(.97)}
.prio svg.i{width:13px;height:13px;stroke-width:2.2}
.prio.acil{color:var(--p-acil);background:var(--p-acil-bg);border-color:var(--p-acil-ln)}
.prio.yuksek{color:var(--p-yuksek);background:var(--p-yuksek-bg);border-color:var(--p-yuksek-ln)}
.prio.orta{color:var(--p-orta);background:var(--p-orta-bg);border-color:var(--p-orta-ln)}
.prio.dusuk{color:var(--p-dusuk);background:var(--p-dusuk-bg);border-color:var(--p-dusuk-ln)}
.prio.open{box-shadow:var(--ring)}
/* dar alanlar: yalnız ikon */
.pr{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;border:1px solid transparent;flex-shrink:0}
.pr svg.i{width:13px;height:13px;stroke-width:2.2}
.pr.acil{color:var(--p-acil);background:var(--p-acil-bg);border-color:var(--p-acil-ln)}
.pr.yuksek{color:var(--p-yuksek);background:var(--p-yuksek-bg);border-color:var(--p-yuksek-ln)}
.pr.orta{color:var(--p-orta);background:var(--p-orta-bg);border-color:var(--p-orta-ln)}
.pr.dusuk{color:var(--p-dusuk);background:var(--p-dusuk-bg);border-color:var(--p-dusuk-ln)}

/* alt satır */
.c-foot{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.c-foot .ti{width:18px;height:18px;border-radius:5px;font-size:10px}
.c-key{font-size:11px;font-weight:500;color:var(--meta)}
.c-sub{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--meta);
  padding:1px 6px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.c-sub svg.i{width:12px;height:12px}
.c-av{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;
  font-size:9.5px;letter-spacing:.02em;flex-shrink:0;border:0;padding:0;font-family:var(--sans);box-shadow:0 0 0 2px var(--surface)}
button.c-av{cursor:pointer}
button.c-av::after{content:"";position:absolute;inset:-6px}
.c-av.none{background:transparent;color:var(--meta);border:1.5px dashed var(--line2);box-shadow:none}
.c-av.none svg.i{width:12px;height:12px}
.c-av.open{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
/* alt iş kartı: üst işin anahtarı (tıklayınca üst iş açılır) */
.c-par{display:inline-flex;align-items:center;gap:3px;max-width:100%;margin:0 0 6px;padding:1px 7px;border-radius:6px;
  font-family:var(--mono);font-size:10.5px;color:var(--meta);background:var(--surface2);border:1px solid var(--line);cursor:pointer;line-height:1.6}
.c-par:hover{color:var(--accent-d);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.c-par:focus-visible{outline:none;box-shadow:var(--ring)}
.row .c-par{margin:0}
/* sprint pencereleri (id- dili) */
.sp-m .id-mb{display:flex;flex-direction:column}
.sp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.sp-stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface2);min-width:0}
.sp-stat b{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.sp-stat small{font-size:11.5px;color:var(--ink2);overflow-wrap:anywhere}
.sp-stat.ok b{color:var(--ok)} .sp-stat.warn b{color:var(--over)}
.sp-cap{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.sp-capl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.sp-capl b{color:var(--ink)} .sp-capl .bad,.sp-capl .bad b{color:var(--risk)}
.sp-bar{height:8px;border-radius:6px;background:var(--c-track,var(--track));overflow:hidden}
.sp-bar i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .3s}
.sp-bar.done i{background:var(--ok)} .sp-bar.warn i{background:var(--over)} .sp-bar.over i{background:var(--risk)}
.sp-bar.hrs{height:5px} .sp-bar.hrs i{background:var(--accent)}
.sp-goal{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:11px;background:var(--accent-soft);color:var(--accent-d);font-size:13px;line-height:1.5}
.sp-goal svg.i{width:15px;height:15px;flex-shrink:0;margin-top:2px}
.sp-goal.ok{margin-top:14px;background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.sp-note{display:flex;align-items:center;gap:6px;margin-top:12px}
.sp-note svg.i{width:14px;height:14px;flex-shrink:0}
.sp-dest{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.id-mic.sm{width:30px;height:30px;border-radius:9px} .id-mic.sm svg.i{width:16px;height:16px}
/* Aktif sprint sekmesi */
.as-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:14px;
  background:radial-gradient(600px 160px at 0 0,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%),var(--surface);box-shadow:var(--shadow-sm)}
.as-main{flex:1 1 280px;min-width:0}
.as-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.as-t h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.as-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 20%,transparent)}
.as-dates{font-family:var(--mono);font-size:12px;color:var(--meta)}
.as-left{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.as-left.soon{color:var(--over);border-color:color-mix(in srgb,var(--over) 40%,transparent)}
.as-left.late{color:var(--risk);border-color:color-mix(in srgb,var(--risk) 40%,transparent)}
.as-goal{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.as-goal svg.i{width:14px;height:14px;flex-shrink:0;color:var(--accent)}
.as-prog{flex:1 1 240px;max-width:380px;display:flex;flex-direction:column;gap:6px}
.as-pl{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink2)} .as-pl b{color:var(--ink)}
.as-empty{max-width:460px;margin:48px auto;text-align:center;padding:32px 24px;border:1px dashed var(--line2);border-radius:16px;background:var(--surface)}
.as-eic{display:inline-grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--accent-soft);color:var(--accent)}
.as-eic svg.i{width:26px;height:26px}
.as-empty h3{margin:14px 0 6px;font-size:17px}
.as-empty p{margin:0 0 16px;color:var(--ink2);font-size:13.5px;line-height:1.55}
.as-empty .btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
@media (max-width:900px){
  .sp-stats{grid-template-columns:1fr 1fr}
  .as-head .btn{min-height:44px}
  .as-prog{max-width:none}
}
.b-subs{display:inline-flex;align-items:center;gap:7px}
.b-subs svg.i{width:14px;height:14px}
.b-sw{position:relative;width:26px;height:14px;border-radius:8px;background:var(--line2);transition:background .15s;flex-shrink:0}
.b-sw::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--surface);transition:transform .15s}
.b-subs[aria-checked="true"] .b-sw{background:var(--accent)}
.b-subs[aria-checked="true"] .b-sw::after{transform:translateX(12px)}

/* hızlı kart ekleme (kolon başı): tek satır başlık + çipler */
.qadd{border-radius:11px;padding:10px;gap:8px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));
  box-shadow:var(--shadow-sm),0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent)}
.qadd .qa-in{height:36px;padding:0 10px;font-size:13.2px;font-weight:550;border-radius:8px}
.qa-chips{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;min-width:0}
.qa-chip{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:32px;height:32px;padding:0 5px;flex-shrink:0;
  border-radius:8px;border:1px solid transparent;background:none;color:var(--ink2);font-size:12px;font-weight:550;font-family:inherit;cursor:pointer}
.qa-chip:hover{background:var(--surface2);border-color:var(--line)}
.qa-chip:focus-visible{outline:none;box-shadow:var(--ring)}
.qa-chip.open{background:var(--surface2);border-color:var(--line2)}
.qa-chip .ti{width:18px;height:18px;border-radius:5px;font-size:10px}
.qa-chip .c-av{width:22px;height:22px;font-size:9px}
.qa-chip .prio{pointer-events:none}
.qa-du svg.i{width:13px;height:13px}
.qa-du.on{color:var(--accent-d)}
.qa-dn{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.qa-more{color:var(--accent-d);margin-left:auto;padding:0 6px;white-space:nowrap}
@media (max-width:900px),(pointer:coarse){
  .qadd .qa-in{height:44px;font-size:16px}
  .qa-chips{flex-wrap:wrap}
  .qa-chip{min-width:44px;height:44px}
  .c-par{min-height:32px;padding:0 9px}
}

/* tamamla: masaüstünde üzerine gelince, dokunmatik/dar ekranda her zaman */
.c-tick{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);
  background:var(--surface);display:grid;place-items:center;color:var(--meta);padding:0;opacity:0;transition:opacity .12s,color .12s,border-color .12s}
.c-tick svg.i{width:12px;height:12px;stroke-width:2.2}
.c-tick:hover{color:var(--ok);border-color:var(--ok)}
.c-tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.card:hover .c-tick,.card:focus-within .c-tick{opacity:1}
.card:hover .sum,.card:focus-within .sum{padding-right:30px}
@media (hover:none),(max-width:900px){
  .c-tick{opacity:1}
  .card .sum{padding-right:30px}
}

/* ---- hızlı menüler ---- */
.qm{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);
  padding:6px;width:220px;max-height:min(440px,calc(100vh - 16px));overflow:auto;color:var(--ink)}
.qm.as{width:260px}
.qm.req{width:320px}
.qm-wrap.sheet .qm.req{top:0;max-height:none;border-radius:0}
.qm-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);padding:6px 8px}
.qm-opt{display:flex;align-items:center;gap:9px;width:100%;min-height:36px;padding:4px 8px;border-radius:8px;font-size:13px;
  color:var(--ink);text-align:left;background:none;border:0}
.qm-opt:hover,.qm-opt:focus-visible{background:var(--surface3);outline:none}
.qm-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.qm-sub{display:block;font-size:11px;color:var(--meta);font-weight:400}
.qm-chk{color:var(--accent);display:inline-flex}
.qm-chk svg.i{width:16px;height:16px;stroke-width:2.2}
.qm .kbd{font-family:var(--mono);font-size:10.5px;color:var(--meta);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:17px}
.qm-ic.prio{padding:0;width:22px;height:22px;justify-content:center}
.qm .c-av{width:26px;height:26px;font-size:10px;box-shadow:none}
.qm hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.qm-q{display:flex;align-items:center;gap:8px;margin:2px 2px 6px;height:36px;padding:0 10px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surface);color:var(--meta)}
.qm-q:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.qm-in{flex:1;min-width:0;border:0;outline:none;background:none;font-size:13px;color:var(--ink);padding:0}
.qm-empty{padding:10px 8px;font-size:12.5px;color:var(--meta)}
.qm-grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:2px auto 10px}
.qm-ttl{font-size:14px;font-weight:700;padding:0 6px 6px}
.qm-ttl small{display:block;font-weight:500;font-size:12px;color:var(--meta);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qm-dim{position:fixed;inset:0;z-index:119;background:rgba(11,27,51,.38)}
:root[data-theme="dark"] .qm-dim{background:rgba(0,0,0,.55)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qm-dim{background:rgba(0,0,0,.55)} }
.qm-wrap.sheet .qm{left:0;right:0;bottom:0;top:auto;width:auto;max-height:80vh;border-radius:18px 18px 0 0;
  border-bottom:0;padding:8px 12px calc(16px + env(safe-area-inset-bottom))}
.qm-wrap.sheet .qm-opt{min-height:48px;font-size:14px}
.qm-wrap.sheet .kbd{display:none}
@media (max-width:640px){
  .card .sum{font-size:14px}
  .prio{height:26px;font-size:11.5px}
  .c-av{width:28px;height:28px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){.c-tick{transition:none}}
/* ==========================================================================
   Benim işlerim (hm-) ve eylemli bildirim — docs/tasarim/benim-islerim, issue #9
   ========================================================================== */
:root{ --late-bg:#FEF2F2; --today-bg:#FFF7ED; --toast-act:#93C5FD; --toast-ok:#4ADE80; --toast-warn:#FCA5A5; }
:root[data-theme="dark"]{ --late-bg:rgba(248,113,113,.12); --today-bg:rgba(251,191,36,.12);
  --toast-act:#1D4ED8; --toast-ok:#15803D; --toast-warn:#B91C1C; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --late-bg:rgba(248,113,113,.12); --today-bg:rgba(251,191,36,.12);
    --toast-act:#1D4ED8; --toast-ok:#15803D; --toast-warn:#B91C1C; }
}
/* bildirim en alttaki satırı örtmesin */
.main .content{padding-bottom:96px}
.hm-c{container:hm / inline-size}

/* proje süzgeci */
.hm-filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.hm-filter .lbl{font-size:12px;font-weight:600;color:var(--meta);margin-right:4px;background:none}
.hm-pf{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:550;max-width:100%;min-width:0}
.hm-pf span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-pf .n{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--meta)}
.hm-pf:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line2))}
.hm-pf.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-d)}
.hm-pf.on .n{color:var(--accent-d)}

/* üst özet */
.hm-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.hm-stat{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm);min-width:0}
.hm-stat-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.hm-stat-ic svg.i{width:19px;height:19px}
.hm-stat-b{min-width:0;flex:1}
.hm-stat-l{font-size:12px;font-weight:600;color:var(--ink2)}
.hm-stat-l span{font-weight:500;color:var(--meta)}
.hm-stat-v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--ink)}
.hm-stat-v small{font-size:13px;font-weight:600;color:var(--meta);letter-spacing:0}
.hm-stat-s{font-size:11.5px;color:var(--meta);margin-top:1px}
.hm-stat.is-late .hm-stat-ic{background:var(--late-bg);color:var(--late)}
.hm-stat.is-late .hm-stat-v{color:var(--late)}
.hm-stat.is-zero .hm-stat-ic{background:var(--surface3);color:var(--ok)}
.hm-cap{display:flex;align-items:center;gap:8px;margin-top:6px}
.hm-bar{flex:1;height:6px;border-radius:6px;background:var(--c-track);overflow:hidden}
.hm-bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.hm-bar.over i{background:var(--over)}
.hm-cap b{font-family:var(--mono);font-size:11.5px;font-weight:650;color:var(--accent-d)}

/* grup */
.hm-grp{margin-top:18px}
.hm-gh{display:flex;align-items:center;gap:8px;margin:0;padding:0 4px 8px;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.005em}
.hm-gh svg.i{width:16px;height:16px;color:var(--meta)}
.hm-gh .n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink2);background:var(--surface3);padding:1px 8px;border-radius:999px}
.hm-gh .d{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--meta)}
.hm-grp.g-late .hm-gh{color:var(--late)}
.hm-grp.g-late .hm-gh svg.i{color:var(--late)}
.hm-grp.g-late .hm-gh .n{background:var(--late-bg);color:var(--late)}
.hm-grp.g-today .hm-gh svg.i{color:var(--today)}
.hm-grp.g-week .hm-gh svg.i,.hm-grp.g-later .hm-gh svg.i{color:var(--accent)}
.hm-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.hm-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:40px;border:0;border-top:1px solid var(--line);
  background:var(--surface2);color:var(--accent-d);font-size:12.5px;font-weight:600}

/* iş satırı — masaüstü tek sıra; dar kapta 3 kat */
.hm-row{display:grid;grid-template-columns:40px minmax(0,1fr) 78px 120px 116px 276px;align-items:center;column-gap:12px;
  min-height:60px;padding:8px 14px 8px 6px;border-bottom:1px solid var(--line);position:relative}
.hm-row:last-child{border-bottom:0}
.hm-row:hover{background:color-mix(in srgb,var(--surface2) 70%,var(--surface))}
.hm-tick{width:40px;height:40px;border:0;background:none;padding:0;display:grid;place-items:center;border-radius:10px;color:transparent}
.hm-tick::before{content:"";grid-area:1/1;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface)}
.hm-tick svg.i{grid-area:1/1;width:12px;height:12px;stroke-width:2.4;z-index:1}
.hm-tick:hover::before,.hm-tick:focus-visible::before{border-color:var(--ok)} .hm-tick:hover,.hm-tick:focus-visible{color:var(--ok)}
.hm-main{min-width:0}
.hm-t{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;cursor:pointer}
.hm-t:hover{color:var(--accent-d);text-decoration:underline;text-underline-offset:2px}
.hm-sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;color:var(--meta);white-space:nowrap;min-width:0}
.hm-sub .k{font-family:var(--mono);font-size:11px;font-weight:500}
.hm-sub .pj{display:inline-flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hm-sub .pj svg.i,.hm-sub .rem svg.i,.hm-sub .blk svg.i{width:12px;height:12px}
.hm-sub .rem{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px}
.hm-sub .blk{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.hm-sub .blk .k{color:var(--accent-d)}
.hm-sep{width:3px;height:3px;border-radius:50%;background:var(--line2);flex-shrink:0}
.hm-meta{display:contents}
.hm-meta .prio{justify-self:start}
.hm-due{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.hm-due svg.i{width:14px;height:14px;color:var(--meta)}
.hm-due.d-late{color:var(--late);font-weight:650} .hm-due.d-late svg.i{color:var(--late)}
.hm-due.d-today{color:var(--today);font-weight:650} .hm-due.d-today svg.i{color:var(--today)}
.hm-due.d-none{color:var(--meta)}
.hm-st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  color:var(--ink2);background:var(--surface2);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;justify-self:start}
.hm-st i{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--todo)}
.hm-st.s-inprogress i{background:var(--prog)}
.hm-st.s-done i{background:var(--done)}
.hm-act{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.hm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 11px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap;min-width:0}
.hm-btn span{overflow:hidden;text-overflow:ellipsis}
.hm-btn svg.i{width:15px;height:15px;color:var(--accent)}
.hm-btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2));background:var(--accent-soft)}
.hm-adv{max-width:144px}
.hm-adv.to-done svg.i{color:var(--ok)}
.hm-adv.none{visibility:hidden}

/* talep havuzu ve talep eden (görev 12) */
.tp-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tp-bar select.inp{width:auto;min-width:160px;max-width:100%}
.tp-bar .spacer{flex:1}
.tp-un{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);min-height:36px}
.tp-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tp-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;column-gap:12px;min-height:60px;padding:8px 14px;border-bottom:1px solid var(--line)}
.tp-row:last-child{border-bottom:0}
.tp-main{min-width:0}
.tp-sub{flex-wrap:wrap;white-space:normal;row-gap:2px}
.tp-rq{display:inline-flex;align-items:center;gap:4px;min-width:0} .tp-rq svg.i{width:12px;height:12px}
.tp-rq.none{color:var(--late);font-weight:600}
.tp-as{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.tp-match{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-height:18px} .tp-match svg.i{width:14px;height:14px}
.id-reqwarn{display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--id-late);background:var(--id-late-bg);border-radius:8px;padding:6px 8px;margin:2px 0 6px}
.id-reqwarn svg.i{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.id-pick small{color:var(--meta);font-weight:500}
@media (max-width:600px){
  .tp-row{grid-template-columns:minmax(0,1fr);row-gap:8px;padding:10px 12px}
  .tp-row .btn{justify-self:start;min-height:40px}
  .tp-bar select.inp{flex:1 1 100%}
}

/* izleyici */
.hm-ro-note{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:6px;font-size:12px;color:var(--ink2);background:var(--surface2);
  border:1px solid var(--line);border-radius:12px}
.hm-ro-note svg.i{width:15px;height:15px;color:var(--meta)}
.hm-list.ro .hm-row{grid-template-columns:40px minmax(0,1fr) 78px 120px 116px}
.hm-ro-dot{width:40px}

/* boş durum */
.hm-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 20px 30px;background:var(--surface);
  border:1px dashed var(--line2);border-radius:14px}
.hm-empty-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}
.hm-empty-ic svg.i{width:24px;height:24px}
.hm-empty h3{margin:0 0 4px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.hm-empty p{margin:0 0 16px;font-size:12.5px;color:var(--ink2);max-width:340px;line-height:1.5}
.hm-empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hm-empty .btn{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.hm-empty .btn svg.i{width:16px;height:16px}

/* eylemli bildirim (toast('…', { label, fn })) */
.toast.rich{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 6px 6px 14px;border-radius:12px;
  font-size:13px;font-weight:500;overflow:hidden;width:max-content;max-width:min(520px,calc(100vw - 24px))}
.toast.rich.on{pointer-events:auto}
.toast.rich > svg.i{width:18px;height:18px;color:var(--toast-ok)}
.toast.rich.t-warn > svg.i{color:var(--toast-warn)}
.toast.rich.t-warn{padding-right:14px}
.toast .tx{flex:1;min-width:0;line-height:1.35}
.toast-undo{height:36px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--toast-act);font-weight:700;font-size:13px;flex-shrink:0}
.toast-undo:hover{background:color-mix(in srgb,var(--paper) 10%,transparent)}
.toast-x{width:36px;height:36px;border:0;background:none;color:color-mix(in srgb,var(--paper) 70%,transparent);display:grid;place-items:center;border-radius:8px;flex-shrink:0}
.toast-x svg.i{width:16px;height:16px}
.toast .tm{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-act);opacity:.7;transform-origin:left;
  animation:hm-tm linear forwards}
.toast.t-warn .tm{display:none}
.toast.paused .tm{animation-play-state:paused}
@keyframes hm-tm{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.toast .tm{display:none}}

@media (max-width:640px){
  .hm-pf{height:40px;padding:0 14px}
  .hm-filter .lbl{width:100%}
  .hm-sum{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:18px}
  .hm-stat{padding:12px;gap:10px}
  .hm-stat-ic{width:32px;height:32px} .hm-stat-ic svg.i{width:17px;height:17px}
  .hm-stat-v{font-size:19px}
  .hm-stat.wk{grid-column:1 / -1}
  .toast.rich{left:12px;right:12px;transform:none;width:auto;max-width:none;bottom:calc(12px + env(safe-area-inset-bottom))}
}
@container hm (max-width:640px){
  .hm-row{grid-template-columns:40px minmax(0,1fr);grid-template-areas:"tick main" ". meta" ". act";row-gap:8px;padding:10px 12px 12px 2px;align-items:start}
  .hm-tick,.hm-ro-dot{grid-area:tick;margin-top:-6px}
  .hm-main{grid-area:main}
  .hm-t{white-space:normal;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .hm-sub{flex-wrap:wrap;row-gap:2px;white-space:normal}
  .hm-meta{grid-area:meta;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
  .hm-meta .prio{height:26px;font-size:11.5px}
  .hm-act{grid-area:act;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 40px;gap:8px}
  .hm-btn{height:40px;width:100%}
  .hm-adv{max-width:none}
  .hm-adv.none{display:none}
  .hm-act:has(.hm-adv.none){grid-template-columns:minmax(0,1fr) 40px}
  .hm-act .c-av{width:40px;height:40px;font-size:12px;box-shadow:none}
  .hm-list.ro .hm-row{grid-template-columns:40px minmax(0,1fr);grid-template-areas:"tick main" ". meta"}
}
@container hm (max-width:350px){ .hm-log span{display:none} }

/* ==========================================================================
   Çalışma alanları (issue #22, docs/tasarim/calisma-alanlari) — ws- sınıfları
   ========================================================================== */
:root{ --ws-arch-bg:#F1F4F8; --ws-info-bg:#EFF5FF; --ws-info-ln:#CFE0FB; --ws-info-ink:#1E3A8A; }
:root[data-theme="dark"]{ --ws-arch-bg:#0A1220; --ws-info-bg:rgba(96,165,250,.10); --ws-info-ln:rgba(96,165,250,.28); --ws-info-ink:#BFDBFE; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ws-arch-bg:#0A1220; --ws-info-bg:rgba(96,165,250,.10); --ws-info-ln:rgba(96,165,250,.28); --ws-info-ink:#BFDBFE; }
}
.ws-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ws-badge{width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;flex-shrink:0;
  background:var(--ws-c,#64748B);color:#fff;font-size:11.5px;font-weight:750;line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.ws-badge.sm{width:18px;height:18px;border-radius:5px;font-size:9.5px}
.ws-badge.lg{width:32px;height:32px;border-radius:9px;font-size:14px}
.ws-badge.xl{width:44px;height:44px;border-radius:12px;font-size:19px}
.ws-badge.is-arch{filter:saturate(.35);opacity:.8}
.ws-badge.none{background:var(--surface3);color:var(--meta)}
.ws-badge.none svg.i{width:14px;height:14px}

.ws-mi{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:6px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;color:var(--ink);cursor:pointer}
.ws-mi:hover,.ws-mi:focus-visible{background:var(--surface2)}
.ws-mi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
.ws-mi .n{font-family:var(--mono);font-size:11px;color:var(--meta)}
.ws-mi .ck{width:16px;height:16px;color:var(--accent);stroke-width:2.2}
.ws-mi .ph{width:16px;flex-shrink:0}
.ws-mi[aria-checked="true"]{background:var(--accent-soft)}
.ws-mi[aria-checked="true"] .nm{font-weight:700;color:var(--accent-d)}
.ws-mi.ws-act{color:var(--accent-d);font-weight:600}
.ws-mi > svg.i{width:17px;height:17px;margin:0 2px;color:var(--ink2)}
.ws-mi.ws-act > svg.i{color:var(--accent-d)}
.ws-mi.danger,.ws-mi.danger > svg.i{color:var(--risk)}
.ws-mi:disabled{cursor:not-allowed;color:var(--meta);background:none}
.ws-mi:disabled > svg.i{color:var(--meta)}
.ws-mi .two{flex:1;min-width:0;line-height:1.3}
.ws-mi .why{display:block;font-size:11.5px;font-weight:500;color:var(--meta);margin-top:1px;white-space:normal}
.ws-hr{height:1px;background:var(--line);margin:6px 4px}

/* Projeler ekranı */
.ws-grp{margin-bottom:26px}
.ws-gh{display:flex;align-items:center;gap:12px;padding:0 2px 12px;position:relative}
.ws-gh .tx{flex:1;min-width:0}
.ws-gh h2{margin:0;display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:720;letter-spacing:-.015em;min-width:0}
.ws-gh h2 span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-gh .cnt{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink2);background:var(--surface3);padding:2px 8px;border-radius:999px;white-space:nowrap}
.ws-gh .ds{font-size:12px;color:var(--meta);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-gh .acts{display:flex;align-items:center;gap:6px;flex-shrink:0}
.ws-gh .btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--accent-d);display:inline-flex;align-items:center;gap:6px}
.ws-gh .btn.ghost:hover{background:var(--accent-soft)}
.ws-gh .btn svg.i,.ws-gempty .btn svg.i,.ws-empty .btn svg.i,.ws-pf .btn svg.i,.ws-tb .btn svg.i{width:16px;height:16px}
.ws-tb .btn{display:inline-flex;align-items:center;gap:6px}
.ws-mw{position:relative}
.ws-more{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--ink2);padding:0;cursor:pointer}
.ws-more:hover,.ws-more[aria-expanded="true"]{background:var(--surface);border-color:var(--line2)}
.ws-more svg.i{width:18px;height:18px}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ws-pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px 16px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:12px;min-width:0}
.ws-pcard:hover{border-color:var(--line2)}
.ws-pcard.is-cur{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ws-ph{display:flex;align-items:center;gap:8px;min-width:0}
.ws-key{font-family:var(--mono);font-size:11px;font-weight:650;color:var(--ink2);background:var(--surface3);border-radius:6px;padding:3px 7px;flex-shrink:0}
.ws-pname.inp{flex:1;min-width:0;width:auto;height:32px;border:1px solid transparent;background:none;border-radius:8px;padding:0 6px;margin-left:-6px;
  font-size:14px;font-weight:650;color:var(--ink);text-overflow:ellipsis;box-shadow:none}
.ws-pname.inp:hover:not(:disabled){border-color:var(--line2)}
.ws-pname.inp:focus{border-color:var(--accent);box-shadow:var(--ring);background:var(--surface)}
.ws-pname.inp:disabled{color:var(--ink);opacity:1}
.ws-pstats{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:var(--ink2)}
.ws-pstats span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ws-pstats svg.i{width:13px;height:13px;color:var(--meta)}
.ws-pstats b{font-family:var(--mono);font-weight:650;color:var(--ink)}
.ws-plbl{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin-bottom:6px}
.ws-mems{display:flex;flex-wrap:wrap;gap:5px}
.ws-pf{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--line);margin-top:auto}
.ws-pf .lead2{flex:1;min-width:0;font-size:12px;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-pf .lead2 b{color:var(--ink2);font-weight:600}
.ws-pf .btn{display:inline-flex;align-items:center;gap:6px}
.ws-pop{position:absolute;right:0;top:calc(100% + 4px);z-index:12;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px}
.ws-pop[hidden]{display:none}
.ws-gempty{display:flex;align-items:center;gap:12px;padding:16px 18px;border:1px dashed var(--line2);border-radius:12px;background:var(--surface);color:var(--ink2);font-size:13px}
.ws-gempty > svg.i{width:20px;height:20px;color:var(--accent)}
.ws-gempty .tx{flex:1;min-width:0}
.ws-gempty .btn,.ws-empty .btn{display:inline-flex;align-items:center;gap:6px}
.ws-archtog{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border:1px dashed var(--line2);border-radius:12px;background:none;color:var(--ink2);font-size:13px;font-weight:550;text-align:left;margin-bottom:14px;cursor:pointer}
.ws-archtog:hover{background:var(--surface);color:var(--ink)}
.ws-archtog svg.i{width:18px;height:18px;color:var(--meta)}
.ws-archtog .n{font-family:var(--mono);font-size:11px;color:var(--meta)}
.ws-sw{margin-left:auto;width:34px;height:20px;border-radius:999px;background:var(--line2);position:relative;flex-shrink:0}
.ws-sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm)}
.ws-archtog[aria-pressed="true"] .ws-sw{background:var(--accent)}
.ws-archtog[aria-pressed="true"] .ws-sw::after{left:16px;background:#fff}
.ws-grp.is-arch{background:var(--ws-arch-bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.ws-grp.is-arch .ws-gh h2 .t{color:var(--ink2)}
.ws-grp.is-arch .ws-pcard{background:var(--surface2);box-shadow:none}
.ws-chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:650;white-space:nowrap;
  border:1px solid var(--line);background:var(--surface2);color:var(--ink2)}
.ws-chip.cur{background:var(--accent-soft);color:var(--accent-d);border-color:transparent}
.ws-chip svg.i{width:12px;height:12px}

/* pencereler */
.ws-dlg .ws-b{padding:16px 18px 6px}

/* ---- Yeni proje · şablon galerisi (ps-, görev 10; docs/tasarim/proje-sablonu) ---- */
:root{--ps-pv-bg:linear-gradient(180deg,#F6F9FD,#EEF3FA);--ps-pv-on:linear-gradient(180deg,#EEF4FF,#E2ECFD);--ps-rec-bg:#FFFFFF}
:root[data-theme="dark"]{--ps-pv-bg:linear-gradient(180deg,#101A2E,#0E1729);--ps-pv-on:linear-gradient(180deg,rgba(96,165,250,.16),rgba(96,165,250,.08));--ps-rec-bg:#0C1424}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ps-pv-bg:linear-gradient(180deg,#101A2E,#0E1729);--ps-pv-on:linear-gradient(180deg,rgba(96,165,250,.16),rgba(96,165,250,.08));--ps-rec-bg:#0C1424}}
.modal.pt-dlg.ps-m{max-width:1120px}
.modal.pt-dlg.ps-m.w-pv{max-width:980px}
.modal.pt-dlg.ps-m.w-form{max-width:780px}
.ps-h{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.ps-h.back{padding-left:12px}
.ps-h .t{flex:1;min-width:0}
.ps-h h2{margin:0;font-size:16.5px;font-weight:750;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-h .s{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px;font-size:12px;color:var(--ink2)}
.ps-h .iconbtn.bare{border-color:transparent;background:none}
.ps-b{padding:20px 24px 24px;min-width:0}
.ps-f{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 24px;background:var(--surface2);border-top:1px solid var(--line)}
.ps-f .note{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.ps-f .note svg.i{width:16px;height:16px;color:var(--accent)}
.ps-f .note b{color:var(--ink);font-weight:650}
.ps-steps{display:flex;align-items:center;gap:8px;margin:0;padding:0;list-style:none;font-size:12px;color:var(--ink2);flex-shrink:0}
.ps-steps li{display:flex;align-items:center;gap:7px}
.ps-steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700;border:1.5px solid var(--line2);color:var(--ink2);background:var(--surface)}
.ps-steps .n svg.i{width:12px;height:12px;stroke-width:2.4}
.ps-steps li[aria-current="step"]{color:var(--ink);font-weight:650}
.ps-steps li[aria-current="step"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,#fff)}
.ps-steps li.done .n{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-d)}
.ps-steps .sep{width:28px;height:1.5px;background:var(--line2)}
.ps-intro{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.ps-intro p{flex:1;margin:0;font-size:13px;color:var(--ink2);line-height:1.5;max-width:640px}
.ps-ctx{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px 0 5px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);font-size:12px;color:var(--ink2);white-space:nowrap;max-width:100%;overflow:hidden}
.ps-ctx b{color:var(--ink);font-weight:650;overflow:hidden;text-overflow:ellipsis}
.ps-grid{border:0;margin:0;padding:0;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ps-card{position:relative;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden;transition:border-color .12s,box-shadow .12s}
.ps-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line2));box-shadow:var(--shadow)}
.ps-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.ps-card:has(input:focus-visible){box-shadow:0 0 0 1px var(--accent),var(--ring)}
.ps-pick{display:flex;flex-direction:column;flex:1;cursor:pointer;min-width:0}
.ps-pv{position:relative;display:block;height:124px;background:var(--ps-pv-bg);border-bottom:1px solid var(--line)}
.ps-card.on .ps-pv{background:var(--ps-pv-on)}
.ps-pv > svg{display:block;width:100%;height:100%}
.ps-rec{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px 0 7px;border-radius:999px;
  background:var(--ps-rec-bg);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-d);font-size:11px;font-weight:700;box-shadow:var(--shadow-sm)}
.ps-rec svg.i{width:13px;height:13px}
.ps-rad{position:absolute;right:14px;top:13px;width:20px;height:20px;border-radius:50%;border:1.6px solid var(--line2);background:var(--surface)}
.ps-card.on .ps-rad{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.ps-body{position:relative;display:flex;flex-direction:column;gap:7px;padding:13px 14px 12px;flex:1}
.ps-nm{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;padding-right:28px;min-height:22px}
.ps-nm b{min-width:0;font-size:14.5px;font-weight:720;letter-spacing:-.01em}
.ps-desc{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.ps-mod{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.ps-mod svg.i{width:14px;height:14px;color:var(--accent)}
.ps-foot{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-top:1px dashed var(--line);margin-top:auto}
.ps-meta{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
.ps-strip{display:flex;gap:3px}
.ps-strip i{width:10px;height:6px;border-radius:3px;background:var(--todo)}
.ps-strip i.inprogress{background:var(--prog)} .ps-strip i.done{background:var(--done)}
.ps-look{height:36px;padding:0 10px;font-size:12.5px}
.ps-look svg.i{width:15px;height:15px}
.pv-col{fill:var(--surface);stroke:var(--line2)}
.pv-card{fill:var(--surface2);stroke:var(--line)}
.pv-bar{fill:var(--line2)} .pv-bar2{fill:var(--line)}
.pv-todo{fill:var(--todo)} .pv-prog{fill:var(--prog)} .pv-done{fill:var(--done)}
.pv-acc{fill:var(--accent)} .pv-acc2{fill:color-mix(in srgb,var(--accent) 50%,var(--surface))}
.pv-accs{fill:var(--accent-soft);stroke:var(--accent)}
.pv-hl{fill:var(--surface);stroke:var(--accent);stroke-width:1.4}
.pv-ln{stroke:var(--line2);fill:none}
.pv-dash{fill:none;stroke:var(--line2);stroke-width:1.4;stroke-dasharray:4 3}
.pv-st{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ps-pvwrap{display:flex;flex-direction:column;gap:16px}
.ps-board{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px}
.ps-board-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;font-weight:650;color:var(--ink2)}
.ps-board-h > svg.i{width:16px;height:16px}
.ps-board-h .k{margin-left:auto;display:flex;gap:12px;font-weight:550}
.ps-board-h .k span{display:inline-flex;align-items:center;gap:5px}
.ps-mcols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;list-style:none;margin:0;padding:0}
.ps-mcol{min-width:0;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--todo);border-radius:12px;padding:10px 9px 9px}
.ps-mcol.inprogress{border-top-color:var(--prog)} .ps-mcol.done{border-top-color:var(--done)}
.ps-mcol .nm{display:block;font-size:12.5px;font-weight:700;line-height:1.3;min-height:2.6em;overflow-wrap:anywhere}
.ps-mcol .ct{display:inline-flex;align-items:center;gap:5px;margin:4px 0 10px;font-size:11px;font-weight:600;color:var(--ink2)}
.ps-gh{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);margin-top:6px;padding:9px 9px 0}
.ps-gh i{display:block;height:4px;border-radius:2px;background:var(--line2);width:78%}
.ps-gh i + i{margin-top:6px;width:46%;background:var(--line)}
.ps-facts{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ps-facts > div{padding:12px 14px;border-left:1px solid var(--line);min-width:0}
.ps-facts > div:first-child{border-left:0}
.ps-facts dt{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin-bottom:6px}
.ps-facts dd{margin:0;font-size:13px;color:var(--ink);display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.45}
.ps-facts dd b{font-weight:650} .ps-facts dd b.mono{font-family:var(--mono)}
.ps-facts dd small{flex-basis:100%;font-size:12px;color:var(--ink2)}
.ps-facts dd svg.i{width:16px;height:16px;color:var(--accent)}
.ps-cnt{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink2);flex-basis:100%}
.ps-cnt span{display:inline-flex;align-items:center;gap:6px}
.ps-cnt b{font-family:var(--mono);color:var(--ink)}
.ps-chosen{display:flex;align-items:center;gap:14px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);margin-bottom:18px;flex-wrap:wrap}
.ps-thumb{width:104px;height:56px;border-radius:8px;border:1px solid var(--line);background:var(--ps-pv-bg);overflow:hidden;flex-shrink:0}
.ps-thumb svg{display:block;width:100%;height:100%}
.ps-chosen .tx{flex:1;min-width:0}
.ps-chosen .lb{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.ps-chosen .nm{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:14px;font-weight:700;flex-wrap:wrap}
.ps-chosen .mt{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:3px}
.ps-r2{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px}
.ps-r2.eq{grid-template-columns:repeat(2,minmax(0,1fr))}
.ps-fld{margin-bottom:16px;min-width:0}
.ps-fld > label,.ps-fld > .lb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.ps-fld .opt{font-weight:500;color:var(--meta)}
.ps-fld .inp{width:100%}
.ps-fld .inp.key{font-family:var(--mono);font-weight:650;letter-spacing:.06em;text-transform:uppercase}
.ps-fld.err .inp{border-color:var(--risk);box-shadow:0 0 0 3px color-mix(in srgb,var(--risk) 14%,transparent)}
.ps-err{display:flex;align-items:flex-start;gap:6px;margin-top:7px;font-size:12px;font-weight:600;color:var(--risk);line-height:1.4}
.ps-err svg.i{width:14px;height:14px;margin-top:1px;flex-shrink:0}
.ps-hint{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink2)}
.ps-hint svg.i{width:13px;height:13px;color:var(--meta)}
.ps-sug{display:inline-flex;align-items:center;gap:6px;height:28px;margin-top:6px;padding:0 9px;border:1px solid var(--line2);border-radius:7px;background:var(--surface);font-size:12px;color:var(--ink2);cursor:pointer}
.ps-sug b{font-family:var(--mono);color:var(--accent-d)}
.ps-secth{display:flex;align-items:baseline;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.ps-secth b{font-size:13px;font-weight:700}
.ps-secth span{font-size:12px;color:var(--ink2)}
.ps-chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45;cursor:pointer}
.ps-chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex-shrink:0}
.ps-chk small{display:block;font-size:12px;color:var(--ink2)}
.ps-epic{margin-top:16px;padding:12px 14px;border:1px solid var(--ws-info-ln);background:var(--ws-info-bg);border-radius:12px}
.ps-epic .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px;font-weight:650;color:var(--ws-info-ink)}
.ps-epic .hd svg.i{width:16px;height:16px}
.ps-epic .ps-chk b{font-weight:650}
.ps-einfo{margin:16px 0 0}
.ps-dflt{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.ps-own{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--meta);background:var(--surface3);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.ps-sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:16px}
.ps-conf{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ps-conf b{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.ps-conf p{margin:0 0 12px;font-size:12.5px;color:var(--ink2);line-height:1.5}
.ps-conf .bt{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
@media (max-width:1180px){ .ps-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:900px){ .ps-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .ps-facts{grid-template-columns:repeat(2,minmax(0,1fr))} .ps-facts > div:nth-child(3){border-left:0} .ps-facts > div:nth-child(n+3){border-top:1px solid var(--line)} }
@media (max-width:640px){
  .modal.pt-dlg.ps-m{overflow:visible}
  .ps-h{position:sticky;top:0;z-index:3;padding:8px 6px 8px 16px;min-height:60px}
  .ps-h.back{padding-left:4px}
  .ps-h h2{font-size:15.5px}
  .ps-h:not(.back) .s{display:none}
  .ps-h .iconbtn{width:44px;height:44px}
  .ps-steps .lbl,.ps-steps .sep{display:none}
  .ps-steps li:not([aria-current]){display:none}
  .ps-steps .n{width:auto;padding:0 8px;border-radius:999px}
  .ps-b{padding:14px 14px 18px;flex:1}
  .ps-intro{flex-direction:column;align-items:flex-start;gap:10px}
  .ps-pv{height:104px}
  .ps-look{height:44px;padding:0 12px}
  .ps-foot{padding:4px 4px 4px 14px}
  .ps-f{position:sticky;bottom:0;z-index:3;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 16px -8px rgba(11,27,51,.18);flex-wrap:wrap}
  .ps-f .note{display:none}
  .ps-f .btn{flex:1;min-height:44px;justify-content:center}
  .ps-mcols{grid-auto-flow:row;grid-auto-columns:auto;gap:6px}
  .ps-mcol{display:flex;align-items:center;gap:10px;border-top-width:1px;border-left:4px solid var(--todo);padding:10px 12px;min-height:48px}
  .ps-mcol.inprogress{border-left-color:var(--prog)} .ps-mcol.done{border-left-color:var(--done)}
  .ps-mcol.inprogress,.ps-mcol.done{border-top-color:var(--line)}
  .ps-mcol .nm{flex:1;min-height:0}
  .ps-mcol .ct{margin:0}
  .ps-gh{display:none}
  .ps-facts{grid-template-columns:minmax(0,1fr)} .ps-facts > div{border-left:0;border-top:1px solid var(--line)} .ps-facts > div:first-child{border-top:0}
  .ps-board-h .k{display:none}
  .ps-r2,.ps-r2.eq{grid-template-columns:minmax(0,1fr)}
  .ps-m .inp{min-height:44px;font-size:15px}
  .ps-m .memchip{min-height:44px}
  .ps-sug{height:44px}
  .ps-chosen .btn{min-height:44px}
}
@media (max-width:600px){ .ps-grid{grid-template-columns:minmax(0,1fr);gap:12px} }
/* ==========================================================================
   Gezinme — proje sekmeleri, yol + proje adı, sağ üstte hesap menüsü, dar ekranda ☰ çekmece
   (docs/tasarim/gezinme, dilim A1)
   ========================================================================== */
:root{
  --nv-tab-ink:#43546E; --nv-tab-on:#1D4ED8; --nv-tab-bar:#2563EB; --nv-tab-hover:#F3F7FD;
  --nv-av-ink:#FFFFFF; --nv-scrim:rgba(11,27,51,.45); --nv-busy:#B45309;
}
:root[data-theme="dark"]{
  --nv-tab-ink:#A3B2CB; --nv-tab-on:#BFDBFE; --nv-tab-bar:#60A5FA; --nv-tab-hover:#121D33;
  --nv-scrim:rgba(0,0,0,.6); --nv-busy:#FBBF24;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --nv-tab-ink:#A3B2CB; --nv-tab-on:#BFDBFE; --nv-tab-bar:#60A5FA; --nv-tab-hover:#121D33;
    --nv-scrim:rgba(0,0,0,.6); --nv-busy:#FBBF24;
  }
}
/* yol (çalışma alanı / anahtar) ve proje adı */
.crumb .nv-crumb{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--sans);font-size:12px;text-transform:none;letter-spacing:0;color:var(--ink2)}
.nv-crumb a{display:inline-flex;align-items:center;gap:6px;min-width:0;color:var(--ink2);text-decoration:none;border-radius:6px;padding:1px 2px}
.nv-crumb a .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv-crumb a:hover{color:var(--accent-d);text-decoration:underline}
.nv-crumb .sep{color:var(--meta)}
.nv-crumb .key{font-family:var(--mono);font-size:11px;font-weight:650;color:var(--ink2);white-space:nowrap}
#title{min-width:0}
#title .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* proje sekmeleri */
.nv-tabbar{display:flex;align-items:flex-end;margin:12px -24px 0;padding:0 18px;border-bottom:1px solid var(--line)}
.nv-tabbar[hidden]{display:none}
.nv-projbtn{display:none}
.nv-tabs{position:relative;display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nv-tabs::-webkit-scrollbar{display:none}
.nv-tab{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 11px;border:0;background:none;border-radius:8px 8px 0 0;
  font-size:13px;font-weight:550;color:var(--nv-tab-ink);white-space:nowrap;position:relative;flex-shrink:0;cursor:pointer}
.nv-tab svg.i{width:16px;height:16px;color:var(--meta)}
.nv-tab:hover{background:var(--nv-tab-hover);color:var(--ink)}
.nv-tab[aria-selected="true"]{color:var(--nv-tab-on);font-weight:650}
.nv-tab[aria-selected="true"] svg.i{color:var(--nv-tab-bar)}
.nv-tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--nv-tab-bar)}
.nv-tab:focus-visible,.nv-projbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.nv-tabbar + .toolrow{padding-top:12px}
/* avatar düğmesi ve hesap menüsü */
.tb-actions{position:relative}
.nv-avbtn{width:36px;height:36px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--accent);color:var(--nv-av-ink);
  font-size:12.5px;font-weight:700;letter-spacing:.02em;flex-shrink:0;cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line2)}
.nv-avbtn[aria-expanded="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.nv-avbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.nv-acct{position:absolute;z-index:30;right:0;top:calc(100% + 8px);width:292px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px}
.nv-acct-h{display:flex;align-items:center;gap:11px;padding:10px 10px 12px}
.nv-acct-h .nv-avbtn{width:42px;height:42px;font-size:14px;box-shadow:none;cursor:default}
.nv-acct-h .tx{flex:1;min-width:0}
.nv-acct-h b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-acct-h .u{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-role{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:650;background:var(--accent-soft);color:var(--accent-d);margin-top:6px}
.nv-role svg.i{width:12px;height:12px}
.nv-role.neu{background:var(--surface3);color:var(--ink2)}
.nv-role.sup{background:var(--risk-bg);color:var(--risk)}

:root{ --nv-guide:#E5EAF2; --nv-sec-ink:#64748B; --nv-fixed-bg:#F6F9FD; --nv-fixed-ink:#64748B; --nv-check-off:#94A3B8; }

.nv-rail{display:flex;flex-direction:column;gap:2px;padding:0 10px}

.id-box{flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;background:var(--surface);overflow:hidden}

.id-box:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.id-boxf{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid var(--line);background:var(--surface2)}
.id-boxf .id-hint{flex:1;margin:0}
.id-cnew .id-boxf{display:none}
.id-cnew.open .id-boxf{display:flex}
.id-hint{font-size:11.5px;color:var(--meta);margin-top:6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:5px;padding:0 5px;line-height:17px;background:var(--surface)}
.id-stalebox{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0 0;padding:8px 10px;border-radius:9px;font-size:12.5px;
  background:var(--ws-info-bg);border:1px solid var(--ws-info-ln);color:var(--ws-info-ink)}
.id-stalebox[hidden]{display:none}
.id-stalebox > svg.i{width:15px;height:15px}
.id-stalebox span{flex:1;min-width:160px}
.id-err{font-size:12px;color:var(--id-late);min-height:0;margin-top:5px;display:flex;align-items:center;gap:5px}
.id-err:empty{margin:0}
.id-err svg.i{width:14px;height:14px;flex-shrink:0}
.id-prog{display:inline-block;width:96px;height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.id-prog i{display:block;height:100%;background:var(--done);border-radius:6px}
.id-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.id-srow,.id-lrow{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 10px;border-top:1px solid var(--line);font-size:13px}
.id-list > :first-child{border-top:0}
.id-srow .k,.id-lrow .k{font-family:var(--mono);font-size:11.5px;color:var(--meta);white-space:nowrap}
.id-srow .t,.id-lrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.id-srow .t:hover,.id-lrow .t:hover{color:var(--accent-d);text-decoration:underline}
.id-srow.done .t,.id-lrow.done .t{text-decoration:line-through;color:var(--meta)}
.id-srow.new{background:var(--id-flash)}
.id-est{font-size:11.5px;color:var(--ink2);min-width:34px;text-align:right}
.id-chk{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);color:#fff;flex-shrink:0;position:relative}
.id-chk::after{content:"";position:absolute;inset:-11px}
.id-chk.on{background:var(--done);border-color:var(--done)}
.id-chk svg.i{width:13px;height:13px;stroke-width:2.6}
.id-chk.ro::after{display:none}
.id-sadd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface2)}
.id-sadd > svg.i{width:16px;height:16px;color:var(--accent);flex-shrink:0}
.id-sadd #subIn{flex:1;min-width:0}
.id-sadd .btn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.id-sadd .btn svg.i{width:14px;height:14px}
.id-sest{width:84px;flex-shrink:0}
.id-lg{font-family:var(--mono);font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);padding:8px 12px 4px;border-top:1px solid var(--line)}
.id-feedf{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);width:max-content;max-width:100%}
.id-feedf button{min-height:32px;padding:0 10px;border-radius:7px;border:1px solid transparent;background:none;font-size:12.5px;color:var(--ink2)}
.id-feedf button .num{font-size:11px;color:var(--meta)}
.id-feedf button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:650;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.id-cnew{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.id-feed{display:flex;flex-direction:column;gap:14px}
.id-ev{display:flex;gap:10px;align-items:flex-start}
.id-ev > .av{margin-top:1px;flex-shrink:0}
.id-ev .bd{flex:1;min-width:0}
.id-ev .hd{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:12.5px;color:var(--ink2);min-height:24px}
.id-ev .hd b{color:var(--ink)}
.id-evact{margin-left:auto;display:inline-flex;gap:4px}
.id-ago{color:var(--meta);font-size:11.5px}
.id-edited{color:var(--meta);font-size:11.5px}
.id-cbody{margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.id-wbody,.id-hbody{margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:12.5px}
.id-wbody > b{font-size:14px;color:var(--accent-d)}
.id-wbody span{flex:1;min-width:0;overflow-wrap:anywhere;color:var(--ink2)}
.id-hbody .f{font-weight:600;min-width:84px;color:var(--ink)}
.id-hbody svg.i{width:13px;height:13px;color:var(--meta)}
.id-old{color:var(--id-old);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--id-old) 70%,transparent);overflow-wrap:anywhere;min-width:0}
.id-new{color:var(--ink);font-weight:600;text-decoration:none;overflow-wrap:anywhere;min-width:0}
.id-chg{list-style:none;margin:4px 0 0;padding:4px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.id-chg > li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;align-items:center;padding:5px 12px;min-height:32px}
.id-chg > li + li{border-top:1px dashed var(--line)}
.id-chg .f{font-size:12px;font-weight:600;color:var(--ink2);overflow-wrap:anywhere}
.id-chg .v{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-width:0;font-size:12.5px}
.id-chg .v > svg.i{width:13px;height:13px;color:var(--meta)}
.id-chg > li.line{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.id-chg .line strong{color:var(--ink);font-weight:600}
.id-chg .id-quote{flex-basis:100%}
.id-auto{grid-column:1 / -1;display:flex;align-items:center;gap:6px;margin:0 0 0 120px;font-size:11.5px;color:var(--meta)}
.id-chg > li.line .id-auto{margin-left:0;flex-basis:100%}
.id-auto svg.i{width:13px;height:13px;color:var(--id-auto,#6D28D9)}
.id-auto b{font-weight:600;color:var(--ink2)}
.id-quote{margin-top:2px;padding:6px 10px;border-left:3px solid var(--line2);background:var(--surface);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink2);line-height:1.55;overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:640px){ .id-chg > li{grid-template-columns:minmax(0,1fr);gap:2px;padding:7px 12px} .id-chg .f{font-size:11.5px;color:var(--meta)} .id-auto{margin-left:0} }
.id-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:40px;margin-top:12px;border:1px dashed var(--line2);border-radius:10px;background:none;
  font-weight:650;font-size:12.5px;color:var(--accent-d)}
.id-more svg.i{width:15px;height:15px}
/* sağ panel */
.id-grp{padding:12px 14px;border-top:1px solid var(--line)}
.id-grp:first-child{border-top:0}
.id-gh{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--meta);margin-bottom:8px}
.id-gh svg.i{width:13px;height:13px}
.id-prow{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:8px;min-height:36px}
.id-prow.date{align-items:start}
.id-prow.date .id-pl{padding-top:9px}
.id-pl{font-size:12.5px;color:var(--ink2)}
.id-pvw{min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.id-pv{display:inline-flex;align-items:center;gap:7px;min-height:32px;max-width:100%;padding:0 8px;margin-left:-8px;border-radius:8px;border:1px solid transparent;background:none;
  font-size:13px;color:var(--ink);text-align:left}
.id-pv .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-pv small{color:var(--meta);font-size:11px}
.id-pv .muted,.id-side .muted{color:var(--meta)}
button.id-pv{cursor:pointer}
button.id-pv:hover{background:var(--surface);border-color:var(--line)}
.id-pv.ro{cursor:default}
.id-pv svg.i{width:14px;height:14px}
.id-pv .lock,.id-pv.ro > svg.i{color:var(--meta)}
.id-pv .av{width:22px;height:22px;font-size:8.5px}
.id-pv .c-av{width:22px;height:22px}
.id-ie{height:32px;padding:4px 8px;font-family:var(--mono);font-size:13px}
.id-epic{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:650;color:#6D28D9;background:#F1EBFE}
:root[data-theme="dark"] .id-epic{color:#C4B5FD;background:rgba(167,139,250,.16)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .id-epic{color:#C4B5FD;background:rgba(167,139,250,.16)} }
.id-epic svg.i{width:13px;height:13px}
.id-steps{display:flex;gap:4px;margin-bottom:10px}
.id-steps i{flex:1;height:4px;border-radius:4px;background:var(--track)}
.id-steps i.todo{background:var(--todo)} .id-steps i.inprogress{background:var(--prog)} .id-steps i.done{background:var(--done)}
.id-stline{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12.5px;color:var(--ink2);margin-bottom:6px;min-height:32px}
.id-stline b{color:var(--ink)}
.id-stline .btn{display:inline-flex;align-items:center;gap:5px}
.id-stline .btn svg.i{width:13px;height:13px}
.id-saved{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--id-saved);white-space:nowrap}
.id-saved svg.i{width:13px;height:13px;stroke-width:2.2}
.id-over{font-size:12px;color:var(--id-late);background:var(--id-late-bg);border-radius:6px;padding:2px 8px;margin:4px 0;display:inline-block}
.id-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.id-tag{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 4px 0 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink);max-width:100%}
.id-tag i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.id-tag button{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border:0;background:none;color:var(--meta);border-radius:4px}
.id-tag button::after{content:"";position:absolute;inset:-6px}
.id-tag button svg.i{width:12px;height:12px}
.id-tagin{width:110px;height:28px;padding:2px 8px;font-size:12px}
.id-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--meta);line-height:1.7}
.id-foot b{color:var(--ink2);font-weight:600}
/* tarih bileşeni */
.id-df{min-width:0;width:100%}
.id-date{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);padding:0 6px 0 0}
.id-df.bad .id-date{border-color:var(--id-late);box-shadow:0 0 0 3px color-mix(in srgb,var(--id-late) 15%,transparent)}
.id-dbtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:34px;padding:0 8px 0 10px;border:0;background:none;text-align:left;font-size:13px;color:var(--ink)}
.id-dbtn svg.i{width:15px;height:15px;color:var(--meta);flex-shrink:0}
.id-dbtn .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-dbtn .wd{color:var(--meta);margin-left:5px}
.id-date.empty .id-dbtn .t{color:var(--meta)}
.id-date.late .id-dbtn .t{color:var(--id-late);font-weight:650}
.id-dnat{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.id-late{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;border:1px solid var(--id-late-ln);background:var(--id-late-bg);color:var(--id-late);font-size:11.5px;font-weight:650;white-space:nowrap}
.id-late svg.i{width:12px;height:12px}
.id-dlate{margin-top:5px}
.id-dq{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.id-dq button{min-height:28px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink2)}
.id-dq button:hover{border-color:var(--line2);color:var(--ink)}
.id-dq button[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft);color:var(--accent-d);font-weight:650}
.id-dq .clr{color:var(--id-late)}
.id-side .id-dq{gap:3px;margin-top:4px}
.id-side .id-dq button{min-height:24px;padding:0 7px;font-size:11.5px}
/* ortak pencere: yeni iş, süre kaydet, silme onayı, alt iş */
#scrim2{z-index:60}
.modal.id-m{max-width:720px}
.modal.id-m.narrow{max-width:520px}
.id-mh{display:flex;align-items:center;gap:12px;padding:16px 16px 14px 20px;border-bottom:1px solid var(--line)}
.id-mh .tx{flex:1;min-width:0}
.id-mh b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.id-mh .sub{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);margin-top:2px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.id-mh .sub .k{font-family:var(--mono);font-size:11.5px;color:var(--meta)}
.id-mic{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.id-mic svg.i{width:20px;height:20px}
.id-mic.del{background:var(--id-late-bg);color:var(--id-late)}
.id-mb{padding:14px 20px 18px}
.id-fl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.id-mb > .id-fl:first-child{margin-top:0}
.id-fl .opt{font-weight:400;color:var(--meta)}
.id-fl .req{color:var(--id-late)}
.id-cc{font-size:11px;color:var(--meta);font-weight:400}
.id-g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.id-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.id-tcard{position:relative;display:flex;align-items:center;gap:10px;min-height:54px;padding:8px 10px;border:1px solid var(--line2);border-radius:11px;background:var(--surface);text-align:left;color:var(--ink)}
.id-tcard .ti{width:28px;height:28px;border-radius:8px;font-size:12px}
.id-tcard .tx{min-width:0}
.id-tcard b{display:block;font-size:13px}
.id-tcard small{display:block;font-size:11.5px;color:var(--ink2)}
.id-tcard[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.id-seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:3px;border:1px solid var(--line2);border-radius:10px;background:var(--surface2)}
.id-seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;border-radius:7px;border:1px solid transparent;background:none;font-size:13px;color:var(--ink2)}
.id-seg button .prio{border:0;background:none;padding:0}
.id-seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);font-weight:650;border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:var(--shadow-sm)}
.id-pick{display:flex;align-items:center;gap:9px;width:100%;min-height:38px;padding:0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);text-align:left;font-size:13.5px;color:var(--ink)}
.id-pick .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-pick.empty .t{color:var(--meta)}
.id-pick > svg.i{width:15px;height:15px;color:var(--meta)}
.id-pick .av,.id-pick .c-av{width:22px;height:22px;font-size:8.5px}
.id-morebtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:16px;padding:0 12px;border:1px dashed var(--line2);border-radius:10px;background:none;text-align:left;color:var(--ink2);font-size:12.5px}
.id-morebtn b{color:var(--accent-d);font-size:13px}
.id-morebtn span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-morebtn svg.i{width:15px;height:15px;color:var(--accent);transition:transform .12s}
.id-morebtn[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.modal.id-m .m-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal.id-m .m-f .btn{display:inline-flex;align-items:center;gap:6px;min-height:38px}
.modal.id-m .m-f .btn svg.i{width:15px;height:15px}
.modal.id-m .m-f .id-hint{margin:0}
.btn.id-danger{background:var(--id-danger);border-color:transparent;color:var(--id-danger-ink)}
.btn.id-danger:hover{filter:brightness(.95)}
.id-wdur{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.id-wdur #w_h{width:120px;font-size:16px;font-weight:650;text-align:center;font-family:var(--mono)}
.id-chips{display:flex;flex-wrap:wrap;gap:4px}
.id-chips button{min-height:34px;min-width:44px;padding:0 9px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-family:var(--mono);font-size:12px;color:var(--ink2)}
.id-chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-d);font-weight:650}
.id-wprev{margin-top:12px;padding:10px 12px;border:1px solid var(--ws-info-ln);border-radius:10px;background:var(--ws-info-bg);font-size:12.5px;color:var(--ink2)}
.id-wprev:empty{display:none}
.id-wprev > div{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.id-wprev > div > span:first-child{display:inline-flex;align-items:center;gap:6px}
.id-wprev svg.i{width:13px;height:13px}
.id-wprev s{color:var(--id-old);margin-right:4px}
.id-wprev b{color:var(--ink)}
.id-wprev small{display:block;margin-top:4px;color:var(--meta)}
.id-delitem{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:13px;min-width:0}
.id-delitem .k{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.id-delitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.id-sec2{font-family:var(--mono);font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--meta);margin:14px 0 6px}
.id-delc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.id-delc > div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--ink2)}
.id-delc svg.i{width:15px;height:15px;color:var(--meta)}
.id-delc b{font-size:18px;color:var(--ink)}
.id-delw,.id-deli{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:12.5px;line-height:1.5}
.id-delw{border:1px solid var(--id-late-ln);background:var(--id-late-bg);color:var(--ink)}

  .id-ib,.id-stbtn,.id-hb,.id-key{min-height:44px;min-width:44px}

}
