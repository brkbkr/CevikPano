.hm-ro-note svg.i{width:15px;height:15px;color:var(--meta)}
.hm-list.ro .hm-row{grid-template-columns:40px minmax(0,1fr) 78px 120px 116px}
.hm-ro-dot{width:40px}

/* boş durum */
.hm-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 20px 30px;background:var(--surface);
  border:1px dashed var(--line2);border-radius:14px}
.hm-empty-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:12px}
.hm-empty-ic svg.i{width:24px;height:24px}
.hm-empty h3{margin:0 0 4px;font-size:15px;font-weight:700;letter-spacing:-.01em}
.hm-empty p{margin:0 0 16px;font-size:12.5px;color:var(--ink2);max-width:340px;line-height:1.5}
.hm-empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hm-empty .btn{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.hm-empty .btn svg.i{width:16px;height:16px}

/* eylemli bildirim (toast('…', { label, fn })) */
.toast.rich{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 6px 6px 14px;border-radius:12px;
  font-size:13px;font-weight:500;overflow:hidden;width:max-content;max-width:min(520px,calc(100vw - 24px))}
.toast.rich.on{pointer-events:auto}
.toast.rich > svg.i{width:18px;height:18px;color:var(--toast-ok)}
.toast.rich.t-warn > svg.i{color:var(--toast-warn)}
.toast.rich.t-warn{padding-right:14px}
.toast .tx{flex:1;min-width:0;line-height:1.35}
.toast-undo{height:36px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--toast-act);font-weight:700;font-size:13px;flex-shrink:0}
.toast-undo:hover{background:color-mix(in srgb,var(--paper) 10%,transparent)}
.toast-x{width:36px;height:36px;border:0;background:none;color:color-mix(in srgb,var(--paper) 70%,transparent);display:grid;place-items:center;border-radius:8px;flex-shrink:0}
.toast-x svg.i{width:16px;height:16px}
.toast .tm{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--toast-act);opacity:.7;transform-origin:left;
  animation:hm-tm linear forwards}
.toast.t-warn .tm{display:none}
.toast.paused .tm{animation-play-state:paused}
@keyframes hm-tm{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.toast .tm{display:none}}

<script>
/* ============================================================
   SUNUCU BAĞLANTISI
   Veri artık tarayıcıda ya da SharePoint'teki tek bir metinde değil,
   sunucudaki PostgreSQL veritabanında durur. Ön yüz eskisi gibi tüm
   veriyi bellekteki DB nesnesinde tutar; her kayıtta yalnızca DEĞİŞEN
   kayıtlar (iş, yorum, süre kaydı ...) sunucuya gönderilir. Başka
   kullanıcıların değişiklikleri birkaç saniyede bir çekilir. Böylece
   check-in / check-out gerekmez, iki kişi aynı anda çalışabilir.
   ============================================================ */
const API = {
  async req(method, url, body) {
    const opt = { method, credentials: 'same-origin', headers: { 'x-pano': '1' } };
    if (body !== undefined) { opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
    let r;
    try { r = await fetch(url, opt); }
    catch (e) { const er = new Error('Sunucuya ulaşılamıyor'); er.status = 0; throw er; }
    let j = null; try { j = await r.json(); } catch (e) { }
    if (!r.ok) { const e = new Error(j?.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
    return j;
  },
  get: u => API.req('GET', u),
  post: (u, b) => API.req('POST', u, b === undefined ? {} : b),
};

let ME = null;            // oturumdaki kullanıcı (sunucudan)
let SEQ = 0;              // son görülen değişiklik numarası
let SNAP = null;          // sunucuyla eşit olduğu bilinen son durum
let SYNC_STATE = 'ok';    // ok | pending | saving | error
let SYNC_AT = null;
const PREF_KEYS = ['ui', 'board', 'open'];
const IGNORED_KEYS = ['savedAt', 'savedBy'];

/* Anahtar sırası bağımsız JSON — PostgreSQL jsonb anahtarları yeniden sıralar. */
function cj(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v) ?? 'null';
  if (Array.isArray(v)) return '[' + v.map(x => x === undefined ? 'null' : cj(x)).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort()
    .map(k => JSON.stringify(k) + ':' + cj(v[k])).join(',') + '}';
}

function snapOf(db) {
  const s = { rec: {}, set: {}, pref: {} };
  for (const [k, v] of Object.entries(db)) {
    if (IGNORED_KEYS.includes(k) || v === undefined) continue;
    if (PREF_KEYS.includes(k)) s.pref[k] = cj(v);
    else if (Array.isArray(v)) {
      const m = new Map();
      v.forEach(x => { if (x && x.id != null) m.set(String(x.id), cj(x)); });
      s.rec[k] = m;
    } else s.set[k] = cj(v);
  }
  return s;
}

function diffSnap(a, b) {
  const out = [];
  for (const k of new Set([...Object.keys(a.rec), ...Object.keys(b.rec)])) {
    const A = a.rec[k] || new Map(), B = b.rec[k] || new Map();
    for (const [id, j] of B) if (A.get(id) !== j)
      out.push({ c: k, id, op: 'put', data: JSON.parse(j), base: A.has(id) ? JSON.parse(A.get(id)) : undefined });
    for (const id of A.keys()) if (!B.has(id)) out.push({ c: k, id, op: 'del' });
  }
  for (const k of new Set([...Object.keys(a.set), ...Object.keys(b.set)])) {
    if (a.set[k] === b.set[k]) continue;
    out.push(b.set[k] === undefined ? { c: '_settings', id: k, op: 'del' }
      : { c: '_settings', id: k, op: 'put', data: JSON.parse(b.set[k]), base: a.set[k] === undefined ? undefined : JSON.parse(a.set[k]) });
  }
  for (const k of PREF_KEYS)
    if (a.pref[k] !== b.pref[k] && b.pref[k] !== undefined) out.push({ c: '_prefs', id: k, op: 'put', data: JSON.parse(b.pref[k]) });
  /* Kullanıcılar önce gitsin (yeni bir iş yeni bir kullanıcıya atanmış olabilir). */
  return out.sort((x, y) => (x.c === 'users' ? 0 : 1) - (y.c === 'users' ? 0 : 1));
}

function setSync(st) {
  SYNC_STATE = st;
  DIRTY = st !== 'ok';
  if (typeof renderFileBar === 'function') renderFileBar();
}

let syncT = null, syncing = null, syncAgain = false, retryT = null;
function scheduleSync(delay = 400) {
  clearTimeout(syncT);
  if (SYNC_STATE === 'ok') setSync('pending');
  syncT = setTimeout(flushSync, delay);
}

/* Devam eden ve bekleyen tüm değişiklikler gidene kadar kaydet. */
async function flushAll() {
  for (let k = 0; k < 5; k++) {
    await flushSync();
    if (syncing) { await syncing; continue; }
    if (!SNAP || !diffSnap(SNAP, snapOf(DB)).length) return;
  }
}

async function flushSync() {
  clearTimeout(syncT); clearTimeout(retryT);
  if (!SNAP || !DB || !ME) return;
  if (syncing) { syncAgain = true; return syncing; }
  syncing = (async () => {
    const now = snapOf(DB);
    let ch = diffSnap(SNAP, now);
    if (typeof canEdit === 'function' && !canEdit()) ch = ch.filter(x => x.c === '_prefs');
    else if (typeof isAdmin === 'function' && !isAdmin())
      ch = ch.filter(x => !['statuses', 'fields', 'rules', '_settings'].includes(x.c) && !(x.c === 'projects' && x.op === 'del')
        && !(x.c === 'users' && x.id !== ME.id));
    if (!ch.length) { SNAP = now; setSync('ok'); return; }
    setSync('saving');
    try {
      const rejected = [], adjusted = [];
      for (let i = 0; i < ch.length; i += 1000) {
        const r = await API.post('/api/sync', { changes: ch.slice(i, i + 1000) });
        rejected.push(...(r.rejected || []));
        adjusted.push(...(r.adjusted || []));
      }
      SNAP = now; SYNC_AT = Date.now(); setSync('ok');
      /* Sunucu bir kaydı birleştirdi ya da iş numarasını değiştirdi: güncel hâli hemen al. */
      if (adjusted.length) setTimeout(poll, 30);
      if (rejected.length) {
        toast('Kaydedilemeyen değişiklik: ' + (rejected[0].reason || 'yetki yok') + (rejected.length > 1 ? ` (+${rejected.length - 1})` : ''));
        await reloadState();
      }
    } catch (e) {
      if (e.status === 401) return sessionLost();
      if (e.status === 409 || e.status === 400 || e.status === 403) { toast(e.message); SNAP = now; setSync('ok'); return reloadState(); }
      setSync('error');
      retryT = setTimeout(flushSync, 5000);
    }
  })();
  try { await syncing; } finally {
    syncing = null;
    if (syncAgain) { syncAgain = false; scheduleSync(50); }
  }
}

/* ---- başkalarının değişikliklerini çek ---- */
let pollT = null, RERENDER = false, OPEN_ISSUE = null, ONLINE = [], UNREAD = 0, MODAL_STALE = false;
function startPolling() {
  clearInterval(pollT);
  pollT = setInterval(poll, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}
async function poll() {
  if (!ME || !SNAP || document.hidden) return;
  if (RERENDER) tryRerender();
  try {
    const r = await API.get('/api/changes?since=' + SEQ + '&view=' + encodeURIComponent(DB?.ui?.view || '')
      + '&issue=' + encodeURIComponent(OPEN_ISSUE || ''));
    if (r.reload) { SEQ = r.seq || SEQ; toast('Veri yönetici tarafından yenilendi'); return reloadState(); }
    if (r.items?.length) applyRemote(r.items);
    SEQ = Math.max(SEQ, r.seq || 0);
    setUnread(r.unread || 0);
    setOnline(r.online || []);
  } catch (e) { if (e.status === 401) sessionLost(); }
}

function applyRemote(items) {
  const cur = snapOf(DB);
  let changed = false;
  for (const it of items) {
    const j = it.op === 'put' ? cj(it.data) : undefined;
    if (it.c === '_settings') {
      if (cur.set[it.id] !== SNAP.set[it.id]) continue;           // bende kaydedilmemiş değişiklik var
      if (SNAP.set[it.id] === j) continue;
      if (j === undefined) { delete DB[it.id]; delete SNAP.set[it.id]; } else { DB[it.id] = it.data; SNAP.set[it.id] = j; }
      changed = true; continue;
    }
    const arr = (DB[it.c] ||= []);
    const m = (SNAP.rec[it.c] ||= new Map());
    if (cur.rec[it.c]?.get(it.id) !== m.get(it.id)) continue;   // bende kaydedilmemiş değişiklik var
    if (m.get(it.id) === j) continue;
    const idx = arr.findIndex(x => x && String(x.id) === it.id);
    if (j === undefined) {
      if (idx >= 0) arr.splice(idx, 1); m.delete(it.id);
      if (it.c === 'issues' && it.id === OPEN_ISSUE) { closeModal(); toast('Açık olan iş başka bir kullanıcı tarafından silindi'); }
    } else {
      if (idx >= 0) { const o = arr[idx]; for (const k of Object.keys(o)) delete o[k]; Object.assign(o, it.data); }
      else arr.push(it.data);
      m.set(it.id, j);
    }
    if (OPEN_ISSUE && (it.id === OPEN_ISSUE || it.data?.issueId === OPEN_ISSUE)) MODAL_STALE = true;
    if (it.c === 'users' && it.id === ME.id && it.data) { ME.role = it.data.role; ME.mustChange = it.data.mustChange; }
    changed = true;
  }
  if (changed) { RERENDER = true; tryRerender(); }
}

/* Açık bir pencere, sürükleme ya da yazılan bir alan varken ekranı yenileme. */
function tryRerender() {
  const typing = document.activeElement && (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || document.activeElement.isContentEditable);
  /* Açık iş penceresi başkası tarafından değiştirildiyse, yazı yazılmıyorsa tazele. */
  if (MODAL_STALE && OPEN_ISSUE && !typing && issue(OPEN_ISSUE)) { MODAL_STALE = false; try { openIssue(OPEN_ISSUE); } catch (e) { } }
  const busy = document.getElementById('scrim')?.classList.contains('on')
    || (typeof DRAG !== 'undefined' && DRAG)
    || (typeof QM !== 'undefined' && QM)
    || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)
        && document.activeElement.id !== 'projSel');
  if (busy) return;
  RERENDER = false;
  try { render(); } catch (e) { console.error(e); }
}

async function reloadState() {
  try { DB = await load(); ensureSchema(); ensureAccounts(); startApp(false); }
  catch (e) { if (e.status === 401) sessionLost(); }
}

let LOST = null;
function sessionLost() {
  if (SNAP && DB && ME) {
    const ch = diffSnap(SNAP, snapOf(DB));
    if (ch.length) LOST = { user: ME.id, changes: ch };
  }
  ME = null; SNAP = null; clearInterval(pollT);
  closeModal && closeModal();
  showLogin('Oturumunuz sona erdi, lütfen tekrar giriş yapın.');
}

<script>
/* ============================================================
   Bölüm 15: DOSYAYA KAYDETME
   Veri, HTML'in içindeki <script id="pano-data"> bloğuna gömülür.
   Tarayıcı bir sayfanın kendi dosyasına sessizce yazmasına izin
   vermez; bu yüzden kaydetme her zaman kullanıcının bir eylemiyle
   olur. Destekleyen tarayıcılarda (Chrome/Edge, http(s) üzerinden)

let FILE_HANDLE = null;   // File System Access API tutamacı
let FS_STATE = 'none';    // none | ready | prompt | blocked

/* Sayfa açıldığında, hiçbir şey çizilmeden önce alınan temiz şablon. */
const TEMPLATE = document.documentElement.outerHTML;

/* ---- tutamağı IndexedDB'de sakla: sayfayı yenileyince dosya bağlı kalsın ---- */
const idbOpen = () => new Promise((res, rej) => {
  const r = indexedDB.open('pano-fs', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('h');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function idbGet(k) {
  try { const db = await idbOpen(); return await new Promise(r => {
    const q = db.transaction('h').objectStore('h').get(k);
    q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); }
  catch (e) { return null; }
}
async function idbSet(k, v) {
  try { const db = await idbOpen(); await new Promise(r => {
    const q = db.transaction('h', 'readwrite').objectStore('h').put(v, k);
    q.onsuccess = () => r(1); q.onerror = () => r(0); }); } catch (e) { }
}

function embeddedData() {
  const el = document.getElementById('pano-data');

}

function buildHtml() {
  DB.savedAt = Date.now();

  const body = TEMPLATE.replace(
    /(<script id="pano-data"[^>]*>)[\s\S]*?(<\/script>)/,

}

  if (!h) { FS_STATE = 'none'; return renderFileBar(); }
  FILE_HANDLE = h;
  try {
    const p = await h.queryPermission({ mode: 'readwrite' });
    FS_STATE = p === 'granted' ? 'ready' : 'prompt';
  } catch (e) { FS_STATE = 'prompt'; }
  renderFileBar();
}

async function ensurePermission() {
  if (!FILE_HANDLE) return false;
  try {
    if (await FILE_HANDLE.queryPermission({ mode: 'readwrite' }) === 'granted') { FS_STATE = 'ready'; return true; }
    if (await FILE_HANDLE.requestPermission({ mode: 'readwrite' }) === 'granted') { FS_STATE = 'ready'; return true; }
  } catch (e) { }
  FS_STATE = 'prompt'; return false;
}

async function writeHandle() {
  const wr = await FILE_HANDLE.createWritable();
  await wr.write(buildHtml());

}

async function pickFile() {

/* ============================================================

const KEY = 'pano-db-v2';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---- tarih yardımcıları (hepsi yerel, ISO 'YYYY-MM-DD') ---- */
const iso  = d => { const t = new Date(d); t.setMinutes(t.getMinutes() - t.getTimezoneOffset()); return t.toISOString().slice(0, 10); };
const addD = (d, n) => { const t = new Date(d); t.setDate(t.getDate() + n); return t; };
const TODAY = iso(new Date());
const monday = d => { const t = new Date(d); const w = (t.getDay() + 6) % 7; return addD(t, -w); };
const fmtD = s => { if (!s) return '—'; const [y, m, dd] = s.split('-'); return `${dd}.${m}`; };
const fmtDT = ts => new Date(ts).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const DAYS = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];

/* ---- süre: Jira ile aynı gramer → 3w 2d 4h 30m ---- */
let H_PER_DAY = 8, D_PER_WEEK = 5;
function parseDur(str) {
  if (str == null || str === '') return 0;
  if (typeof str === 'number') return str;
  let h = 0, hit = false;
  String(str).toLowerCase().replace(/(\d+(?:[.,]\d+)?)\s*([wdhm])/g, (_, n, u) => {
    n = parseFloat(n.replace(',', '.')); hit = true;
    h += n * ({ w: H_PER_DAY * D_PER_WEEK, d: H_PER_DAY, h: 1, m: 1 / 60 }[u]);
    return '';
  });
  if (!hit) { const n = parseFloat(String(str).replace(',', '.')); return isNaN(n) ? 0 : n; }
  return h;
}
function fmtDur(h) {
  if (!h) return '0h';
  const w = Math.floor(h / (H_PER_DAY * D_PER_WEEK)); h -= w * H_PER_DAY * D_PER_WEEK;
  const d = Math.floor(h / H_PER_DAY); h -= d * H_PER_DAY;
  const hh = Math.floor(h); const m = Math.round((h - hh) * 60);
  return [w && w + 'w', d && d + 'd', hh && hh + 'h', m && m + 'm'].filter(Boolean).join(' ') || '0h';
}

/* ---- sıralama anahtarı: kesirli indeksleme (LexoRank'in sade hâli) ---- */
function rankBetween(a, b) {
  if (a == null && b == null) return 1000;
  if (a == null) return b - 1;
  if (b == null) return a + 1;
  return (a + b) / 2;
}

  const D = [
    ['task', 'Worklog kaydı ekleme formu', 1, 'u1', 5, '3d', 'sp2', e1, 4],
    ['task', 'Haftalık çizelge tablosu', 2, 'u1', 8, '5d', 'sp2', e1, 3],

      if (Math.random() < .12) return;                 // izin / boş gün
      let left = 4 + Math.floor(Math.random() * 5);
      for (let k = 0; k < 3 && left > 0; k++) {
        const it = mine[Math.floor(Math.random() * mine.length)];
        const h = Math.min(left, [1, 2, 2, 3, 4][Math.floor(Math.random() * 5)]);
        worklogs.push({ id: uid('w'), issueId: it.id, userId: u.id, date: iso(day), hours: h, comment: '' });
        left -= h;
      }
    });
  }
  worklogs.forEach(w => { const i = issues.find(x => x.id === w.issueId); if (i) i.spent += w.hours; });
  issues.forEach(i => i.remainingEst = Math.max(0, (i.estimate || 0) - (i.spent || 0)));

  comments.push(
    { id: uid('c'), issueId: issues[3].id, userId: 'u3', at: Date.now() - 7200000, body: 'Kalan süre = tahmin − harcanan olmalı, negatifse 0 gösterelim.' },
    { id: uid('c'), issueId: issues[3].id, userId: 'u1', at: Date.now() - 3600000, body: 'Katılıyorum. Aşım durumunu ayrı bir rozette gösteririz.' });
  history.push({ id: uid('h'), issueId: issues[3].id, userId: 'u3', at: Date.now() - 9000000, field: 'Durum', from: 'Yapılacak', to: 'Geliştirmede' });

  const fields = [
    { id: 'cf_mus', key: 'musteri', name: 'Müşteri', type: 'select', projectId: null, onList: true,
      options: ['Acme', 'Globex', 'İç proje'] },
  ];
  issues.forEach((i, k) => { i.cf = k % 3 === 0 ? { cf_mus: 'Acme' } : k % 3 === 1 ? { cf_mus: 'Globex' } : {}; });
  const rules = [
    { id: 'r1', projectId: 'p1', name: 'İncelemeye geçince Adem\'e ata', on: 'status', whenStatus: 'p1_s2',
      then: [{ act: 'assign', v: 'u2' }, { act: 'label', v: 'inceleme' }], enabled: true },
  ];
  const links = [{ id: 'l1', from: issues[6].id, to: issues[7].id, type: 'blocks' }];
  comments.forEach(c => c.userId = fixU(c.userId));
  history.forEach(x => x.userId = fixU(x.userId));

  /* Gerçekçi durum geçişi geçmişi — kümülatif akış ve döngü süresi
     raporlarının demo veride de anlamlı çıkması için. */
  const transitions = [];
  issues.filter(i => i.type !== 'epic').forEach(i => {
    const chain = statuses.filter(s => s.projectId === i.projectId).sort((a, b) => a.ord - b.ord);
    const target = chain.findIndex(s => s.id === i.statusId);
    if (target < 1) return;
    let day = 26 - Math.floor(Math.random() * 8);
    for (let k = 1; k <= target; k++) {
      day -= 1 + Math.floor(Math.random() * 5);
      if (day < 0) day = 0;
      const d = iso(addD(new Date(), -day));
      transitions.push({ id: uid('t'), issueId: i.id, at: new Date(d).getTime(), date: d,
        from: chain[k - 1].id, to: chain[k].id });
      if (chain[k].cat === 'done') i.doneAt = d;
    }
  });
  transitions.sort((a, b) => a.date.localeCompare(b.date));

  return {
    users: U, projects, statuses, sprints, issues, worklogs, comments, history,
    fields, rules, links, transitions, filters: [], cfg: { h: H_PER_DAY, d: D_PER_WEEK,
      modules: { ...MODULE_DEFAULTS }, types: TYPE_DEFAULTS.map(t => ({ ...t })),
      defaultStatuses: STATUS_TEMPLATES.uyarlama[1].map(x => [...x]) },
    board: { swimlane: 'none', filterUser: '', filterType: '', q: '' },
    ui: { project: 'p1', view: 'board', week: iso(monday(new Date())), tsMode: 'user' },
  };
}

/* Bildirim. toast('metin') eskisi gibi 2 sn düz metin. Eylemli çeşit:
   toast('metin', { label: 'Geri al', fn, ms }) → eylem + kapat düğmesi, süre çizgisi (varsayılan 6 sn);
   toast('metin', { warn: true }) → kırmızı ikonlu, düğmesiz (varsayılan 4 sn).
   Üzerine gelince ya da odak içindeyken süre durur. Metin her zaman kaçışlı basılır. */
function toast(msg, o) {
  const t = $('#toast');
  clearTimeout(toast._t); toast._fn = null; toast._left = 0;
  t.inert = false;
  if (!o) {
    t.className = 'toast on'; t.textContent = msg;
    toast._t = setTimeout(() => t.classList.remove('on'), 2000);
    return;
  }
  const ms = o.ms || (o.label ? 6000 : 4000);
  t.className = 'toast on rich' + (o.warn ? ' t-warn' : '');
  t.innerHTML = `${ic(o.warn ? 'alert' : 'checkc')}<span class="tx">${esc(msg)}</span>${o.label
    ? `<button type="button" class="toast-undo">${esc(o.label)}</button>`
      + `<button type="button" class="toast-x" aria-label="Kapat" title="Kapat">${ic('x')}</button>` : ''}`
    + `<span class="tm" style="animation-duration:${ms}ms"></span>`;
  toast._fn = typeof o.fn === 'function' ? o.fn : null;
  toast._left = ms; toast._at = Date.now();
  toast._t = setTimeout(toastHide, ms);
}
function toastHide() {
  const t = $('#toast');
  clearTimeout(toast._t); toast._fn = null; toast._left = 0;
  t.classList.remove('on');
  if (t.classList.contains('rich')) {
    if (t.contains(document.activeElement)) document.activeElement.blur();
    t.inert = true;
  }
}
function toastPause(on) {
  const t = $('#toast');
  if (!t.classList.contains('rich') || !t.classList.contains('on') || !toast._left) return;
  if (on) {
    if (t.classList.contains('paused')) return;
    clearTimeout(toast._t);
    toast._left = Math.max(800, toast._left - (Date.now() - toast._at));
    t.classList.add('paused');
  } else {
    if (!t.classList.contains('paused') || t.matches(':hover') || t.contains(document.activeElement)) return;
    t.classList.remove('paused');
    toast._at = Date.now(); toast._t = setTimeout(toastHide, toast._left);
  }
}
function wireToast() {
  const t = $('#toast');
  t.addEventListener('click', e => {
    if (e.target.closest('.toast-undo')) { const fn = toast._fn; toastHide(); if (fn) fn(); }
    else if (e.target.closest('.toast-x')) toastHide();
  });
  t.addEventListener('mouseenter', () => toastPause(true));
  t.addEventListener('mouseleave', () => toastPause(false));
  t.addEventListener('focusin', () => toastPause(true));
  t.addEventListener('focusout', () => setTimeout(() => toastPause(false), 0));
}

/* ---- ortak sürükle-bırak: hedefteki sıraya göre rank hesabı ---- */
let DRAG = null;
function dropIndexRank(container, y, sel) {
  const rows = [...container.querySelectorAll(sel)].filter(el => el.dataset.id !== DRAG);
  let before = null;
  for (const el of rows) {
    const r = el.getBoundingClientRect();
    if (y < r.top + r.height / 2) { before = el; break; }
  }
  const list = rows.map(el => issue(el.dataset.id).rank);
  if (!rows.length) return 1000;
  if (!before) return list[list.length - 1] + 100;
  const idx = rows.indexOf(before);
  return rankBetween(idx === 0 ? null : list[idx - 1], list[idx]);
}

const TAG_COLORS = ['#2563EB', '#7C3AED', '#0F766E', '#B45309', '#BE185D', '#15803D', '#0891B2', '#9333EA'];
const tagColor = t => { let h = 0; for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return TAG_COLORS[h % TAG_COLORS.length]; };
function cardDue(i, done) {
  if (done) return `<span class="c-due d-ok">${ic('checkc')}Tamamlandı</span>`;

  if (i.due === TODAY) return `<span class="c-due d-today" title="Bitiş bugün">${ic('clock')}Bugün</span>`;
  return `<span class="c-due" title="Bitiş">${ic('cal')}${fmtD(i.due)}</span>`;
}
function cardEst(i) {
  const est = rollEstimate(i), sp = rollSpent(i);
  /* Kartta kısa saat gösterimi (6h/8h); ayrıntı title'da ve iş detayında. */
  const hr = h => String(Math.round(h * 10) / 10).replace('.', ',') + 'h';
  if (!est) return sp ? `<span class="c-est" title="Harcanan ${fmtDur(sp)}">${hr(sp)}</span>` : '';
  const pct = Math.min(100, Math.round(sp / est * 100));
  const cls = sp > est ? 'e-over' : sp === est ? 'e-full' : '';
  return `<span class="c-est ${cls}" title="Harcanan ${fmtDur(sp)} / tahmin ${fmtDur(est)} · kalan ${fmtDur(rollRemaining(i))}"><span class="b"><i style="width:${pct}%"></i></span>${hr(sp)}/${hr(est)}</span>`;
}
function cardAv(i, edit) {

  const st = u ? ` style="background:${safeColor(u.color)}"` : '';
  const inner = u ? esc(u.ini || '?') : ic('userplus');
  return edit
    ? `<button type="button" class="c-av ${u ? '' : 'none'}"${st} data-qas="${esc(i.id)}" aria-haspopup="menu" title="${lab}" aria-label="${u ? lab : 'Atanmamış (kişi ata)'} (değiştir)">${inner}</button>`
    : `<span class="c-av ${u ? '' : 'none'}"${st} role="img" title="${lab}" aria-label="${lab}">${inner}</span>`;

function card(i) {
  const ep = MOD('epic') && i.epicId && issue(i.epicId);
  const done = stat(i.statusId).cat === 'done';
  const edit = canEdit();
  const kids = kidsOf(i.id), kd = kids.filter(k => stat(k.statusId).cat === 'done').length;
  const tags = Array.isArray(i.labels) ? i.labels : [];
  /* İlerleme sağa yaslanır: dar kolonda alt satıra geçse de sarkan ayraç kalmaz. */
  const meta = [priBadge(i, edit), cardDue(i, done)].filter(Boolean);
  return `<article class="card ${done ? 'is-done' : ''}" draggable="${edit}" data-id="${esc(i.id)}">
    ${edit ? (done
      ? `<button type="button" class="c-tick on" data-reopen="${esc(i.id)}" title="Yeniden aç" aria-label="Yeniden aç">${ic('check')}</button>`
      : `<button type="button" class="c-tick" data-complete="${esc(i.id)}" title="Tamamla" aria-label="Tamamla">${ic('check')}</button>`) : ''}
    ${ep ? `<span class="epic-tag" style="background:${safeColor(ep.color || '#6B4FBB')}">${esc(ep.summary)}</span>` : ''}
    <p class="sum">${esc(i.summary)}</p>
    ${tags.length ? `<div class="c-tags">${tags.slice(0, 2).map(t => `<span class="c-tag"><i style="background:${tagColor(t)}"></i>${esc(t)}</span>`).join('')}${
      tags.length > 2 ? `<span class="c-tag" title="${esc(tags.slice(2).join(', '))}">+${tags.length - 2}</span>` : ''}</div>` : ''}
    <div class="c-meta">${meta.join('<span class="c-sep"></span>')}${cardEst(i)}</div>
    <div class="c-foot">
      ${tIcon(i.type)}<span class="k c-key">${esc(i.key)}</span>
      ${kids.length ? `<span class="c-sub" data-open="${esc(i.id)}" title="Alt işler: ${kd}/${kids.length} tamamlandı">${ic('subs')}${kd}/${kids.length}</span>` : ''}
      ${MOD('points') && i.points != null ? `<span class="chip pt">${esc(i.points)}</span>` : ''}
      <span class="spacer"></span>
      ${cardAv(i, edit)}
    </div>
  </article>`;
}

/* ---- karttan hızlı düzenleme: öncelik rozeti ve avatar ----
   Menü body'ye eklenir: masaüstünde düğmeye bağlı position:fixed, ≤900px'te alt sayfa.
   Esc ve dışarı tıklama kapatır (kartı açmaz); açıkken tryRerender ertelenir. */
let QM = null;
const qmMobile = () => matchMedia('(max-width:900px)').matches;
const QM_FOLD = { 'ı': 'i', 'ş': 's', 'ç': 'c', 'ğ': 'g', 'ü': 'u', 'ö': 'o', 'â': 'a', 'î': 'i', 'û': 'u' };
const qmKey = v => String(v ?? '').toLocaleLowerCase('tr').replace(/[ışçğüöâîû]/g, c => QM_FOLD[c]);
const qmTrig = q => document.querySelector(`[${q.kind === 'pri' ? 'data-qpri' : 'data-qas'}="${CSS.escape(q.id)}"]`);
function qmPriList(i) {
  const cur = lvl(i.priority);
  return LVLS.map(p => { const [c, n] = PRI[p];
    return `<button type="button" class="qm-opt" role="menuitemradio" aria-checked="${cur === p}" data-qv="${p}">
      <span class="qm-ic prio ${c}">${ic(c)}</span><span class="qm-l">${n}</span>
      ${cur === p ? `<span class="qm-chk">${ic('check')}</span>` : ''}<span class="kbd">${p}</span></button>`; }).join('');
}
/* Hızlı atama listesi işin kendi projesinin üyeleridir (ana ekranda başka projenin işi olabilir). */
const issueUsers = i => memsOf(DB.projects.find(p => p.id === i?.projectId));
function qmAsList(i, q = '') {
  const me = CU(), ppl = issueUsers(i), k = qmKey(q).trim();
  const hit = txt => !k || qmKey(txt).includes(k);
  const openN = id => DB.issues.filter(x => x.assignee === id && x.type !== 'epic' && stat(x.statusId).cat !== 'done').length;
  const av = u => `<span class="c-av" style="background:${safeColor(u.color)}">${esc(u.ini || '?')}</span>`;
  const row = (v, icon, label, sub) => `<button type="button" class="qm-opt" role="menuitemradio" aria-checked="${(i.assignee || '') === v}" data-qv="${esc(v)}">
      ${icon}<span class="qm-l">${label}${sub ? `<span class="qm-sub">${sub}</span>` : ''}</span>
      ${(i.assignee || '') === v ? `<span class="qm-chk">${ic('check')}</span>` : ''}</button>`;
  const out = [];
  const meIn = me && ppl.some(u => u.id === me.id);
  if (meIn && (hit(me.name) || hit('Bana ata'))) out.push(row(me.id, av(me), 'Bana ata', `${esc(me.name)} · ${openN(me.id)} açık iş`));
  ppl.filter(u => !(meIn && u.id === me.id) && hit(u.name))
    .forEach(u => out.push(row(u.id, av(u), esc(u.name), `${openN(u.id)} açık iş`)));
  if (hit('Atanmamış')) out.push((out.length ? '<hr>' : '') + row('', `<span class="c-av none">${ic('userx')}</span>`, 'Atanmamış', ''));
  return out.join('') || '<div class="qm-empty">Eşleşen kişi yok</div>';
}
function openQuick(kind, btn) {
  closeQuick(false);
  const id = kind === 'pri' ? btn.dataset.qpri : btn.dataset.qas;
  const i = issue(id); if (!i || !canEdit()) return;
  const mob = qmMobile();
  const title = kind === 'pri' ? 'Öncelik' : 'Atanan kişi';
  const search = kind === 'as' && issueUsers(i).length > 8;
  const wrap = document.createElement('div');
  wrap.className = 'qm-wrap' + (mob ? ' sheet' : '');
  wrap.innerHTML = `${mob ? '<div class="qm-dim"></div>' : ''}
    <div class="qm ${kind}" role="menu" aria-label="${title}: ${esc(i.key)}">
      ${mob ? `<div class="qm-grab"></div><div class="qm-ttl">${title}<small>${esc(i.summary)}</small></div>` : `<div class="qm-h">${title}</div>`}
      ${search ? `<label class="qm-q">${ic('search')}<input class="qm-in" type="search" placeholder="Kişi ara…" aria-label="Kişi ara" autocomplete="off"></label>` : ''}
      <div class="qm-list">${kind === 'pri' ? qmPriList(i) : qmAsList(i)}</div>
    </div>`;
  document.body.appendChild(wrap);
  QM = { kind, id, wrap, el: wrap.querySelector('.qm'), mob };
  btn.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
  wrap.addEventListener('click', e => {
    const o = e.target.closest('[data-qv]');
    if (o) { e.stopPropagation(); pickQuick(o.dataset.qv); }
  });
  const inp = wrap.querySelector('.qm-in');
  if (inp) inp.oninput = () => { wrap.querySelector('.qm-list').innerHTML = qmAsList(i, inp.value); };
  if (!mob) {
    const m = QM.el, r = btn.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
    let left = kind === 'as' ? r.right - w : r.left;
    left = Math.max(8, Math.min(left, innerWidth - w - 8));
    let top = r.bottom + 6;
    if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
    m.style.left = left + 'px'; m.style.top = top + 'px';
  }
  (inp || QM.el.querySelector('.qm-opt[aria-checked="true"]') || QM.el.querySelector('.qm-opt'))?.focus({ preventScroll: true });
}
function closeQuick(refocus = true) {
  if (!QM) return;
  const q = QM; QM = null;
  q.wrap.remove();
  const b = qmTrig(q);
  if (b) { b.classList.remove('open'); b.removeAttribute('aria-expanded'); if (refocus) b.focus({ preventScroll: true }); }
  if (RERENDER) setTimeout(tryRerender, 0);
}
function pickQuick(v) {
  const q = QM; if (!q) return;
  closeQuick(false);
  const i = issue(q.id); if (!i || !canEdit()) return;
  const was = i.assignee || null;
  const changed = q.kind === 'pri' ? setPriority(i, +v) : setAssignee(i, v || null);
  if (changed) save();
  render();
  /* Benim işlerim: başkasına (ya da atanmamışa) verilen iş listeden düşer → "Geri al". */
  if (changed && q.kind === 'as' && DB.ui.view === 'home' && was === CU().id && (i.assignee || null) !== was) {
    const u = user(i.assignee);
    return homeUndo(`${i.key} ${u ? u.name + ' kişisine atandı' : 'atanmamış yapıldı'}; listenden çıktı.`,
      [{ id: i.id, f: 'assignee', was, now: i.assignee || null }]);
  }
  qmTrig(q)?.focus({ preventScroll: true });
}
/* Menü açıkken: dışarı tıklama yalnızca menüyü kapatır; klavye menüye aittir. */
document.addEventListener('click', e => {
  if (!QM || e.target.closest?.('.qm')) return;
  const tr = e.target.closest?.('[data-qpri],[data-qas]');
  const same = tr && qmTrig(QM) === tr;
  closeQuick(false);
  if (tr && !same) return;                   // başka bir rozet/avatar: onun menüsü açılsın
  e.stopPropagation(); e.preventDefault();
}, true);
addEventListener('keydown', e => {
  if (!QM) return;
  const opts = [...QM.el.querySelectorAll('.qm-opt')];
  const idx = opts.indexOf(document.activeElement);
  const stop = () => { e.preventDefault(); e.stopPropagation(); };
  if (e.key === 'Escape') { stop(); return closeQuick(true); }
  if (e.key === 'Tab') { e.stopPropagation(); return closeQuick(true); }
  const nav = ['ArrowDown', 'ArrowUp'].concat(e.target.classList?.contains('qm-in') ? [] : ['Home', 'End']);
  if (nav.includes(e.key) && opts.length) {
    stop();
    const n = opts.length;
    const k = e.key === 'Home' ? 0 : e.key === 'End' ? n - 1
      : idx < 0 ? (e.key === 'ArrowDown' ? 0 : n - 1) : (idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
    return opts[k].focus();
  }
  if (QM.kind === 'pri' && /^[1-4]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { stop(); return pickQuick(+e.key); }
  if (e.key === 'Enter' && e.target.classList?.contains('qm-in')) { stop(); const o = opts[0]; if (o) pickQuick(o.dataset.qv); return; }
  e.stopPropagation();                       // menü açıkken genel kısayollar (c, w, / …) çalışmasın
}, true);
addEventListener('resize', () => { if (QM && !QM.mob) closeQuick(false); });
addEventListener('scroll', e => { if (QM && !QM.mob && !e.target.closest?.('.qm')) closeQuick(false); }, true);

function columns(list) {

    const all = list.filter(i => colOf(i) === s.id);
    const cards = all.filter(i => stat(i.statusId).cat !== 'done');
    const fin = all.filter(i => stat(i.statusId).cat === 'done');
    const dopen = DB.ui.doneOpen && DB.ui.doneOpen[s.id];
    const over = s.wip && cards.length > s.wip;
    return `<section class="col c-${esc(s.cat || 'todo')} ${over ? 'wip-over' : ''}" data-status="${s.id}">
      <div class="col-h">
        <span class="nm">${esc(s.name)}</span>

        <span class="spacer"></span>

function renderBoard() {
  const list = boardIssues();
  if (MOD('sprint') && !activeSprint() && DB.board.scope !== 'all')
    return `<div class="panel"><h3>Aktif sprint yok</h3>
      <div class="sub">Pano, aktif sprintteki işleri gösterir. Backlog'a gidip bir sprint başlatın

      <a class="btn pri" href="#backlog" style="text-decoration:none;display:inline-block">Backlog'a git</a></div>`;
  const sw = DB.board.swimlane;
  if (sw === 'none') return columns(list);
  let groups;
  if (sw === 'assignee') groups = DB.users.map(u => [u.id, u.name, list.filter(i => i.assignee === u.id)])
    .concat([[null, 'Atanmamış', list.filter(i => !i.assignee)]]);
  else if (sw === 'epic') groups = epicsOf().map(e => [e.id, e.summary, list.filter(i => i.epicId === e.id)])
    .concat([[null, 'Epik yok', list.filter(i => !i.epicId)]]);
  else groups = LVLS.map(p => [p, PRI[p][1], list.filter(i => lvl(i.priority) === p)]);
  return groups.filter(g => g[2].length).map(([id, name, items]) =>

function sumOf(items) {
  const p = items.reduce((a, i) => a + (i.points || 0), 0);
  const c = { todo: 0, inprogress: 0, done: 0 };
  items.forEach(i => c[stat(i.statusId).cat] += (i.points || 0));
  return { p, c };
}

function renderBacklog() {
  const list = issuesOf().filter(i => i.type !== 'epic' && matches(i)).sort((a, b) => a.rank - b.rank);

  /* Sprint modülü kapalıyken backlog, öncelik sırası verilen tek bir iş listesidir. */
  if (!MOD('sprint')) {
    const open = list.filter(i => stat(i.statusId).cat !== 'done');
    const done = list.filter(i => stat(i.statusId).cat === 'done');
    return `<section class="sprintbox" data-drop="sprint" data-sprint="">
        <div class="sb-h"><b>İş listesi</b>
          <span class="ct k" style="color:var(--ink3)">${open.length} açık iş</span>
          <span class="pill">${fmtDur(open.reduce((a, i) => a + remaining(i), 0))} kalan</span>
          <span class="spacer"></span>${canEdit() ? '<button class="btn sm" id="blAdd">+ İş ekle</button>' : ''}</div>
        ${DB.ui.blAdd ? blAddRow() : ''}

  }

  const boxes = sprintsOf().filter(s => s.state !== 'closed').map(s => {
    const items = list.filter(i => i.sprintId === s.id);

    return `<section class="sprintbox ${act ? 'active' : ''}" data-drop="sprint" data-sprint="${s.id}">
      <div class="sb-h">
        <b>${esc(s.name)}</b>

        <span class="ct k" style="color:var(--ink3)">${items.length} iş</span>
        <span class="pill todo">${c.todo}</span><span class="pill prog">${c.inprogress}</span><span class="pill done">${c.done}</span>

               : `<button class="btn sm" data-start="${s.id}" ${items.length ? '' : 'disabled'}>Sprint'i başlat</button>`}

  const bl = list.filter(i => !i.sprintId);
  const { p } = sumOf(bl);
  return boxes + `<section class="sprintbox" data-drop="sprint" data-sprint="">
    <div class="sb-h"><b>Backlog</b>
      <span class="ct k" style="color:var(--ink3)">${bl.length} iş</span>
      <span class="pill">${p} puan</span>
      <span class="spacer"></span>${canEdit() ? '<button class="btn sm" id="blAdd">+ İş ekle</button>' : ''}</div>
    ${DB.ui.blAdd ? blAddRow() : ''}

function wireBacklogAdd() {

        <b>${esc(s.name)}</b> kapatılıyor.<br>
        <span class="num">${items.length - open.length}</span> iş tamamlandı,
        <span class="num">${open.length}</span> iş açık kaldı.</p>
      <label class="field">Açık işler nereye taşınsın?</label>
      <select class="inp" id="moveTo">
        ${next ? `<option value="${next.id}">${esc(next.name)}</option>` : ''}
        <option value="">Backlog</option>
      </select>
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button>
      <button class="btn pri" id="doComplete">Tamamla</button></div>`, 'narrow');
  $('#doComplete').onclick = () => {
    const to = $('#moveTo').value || null;
    open.forEach(i => { i.sprintId = to; logHist(i, 'Sprint', s.name, to ? sprint(to).name : 'Backlog'); });
    s.state = 'closed'; s.end = TODAY;
    closeModal(); save(); render(); toast('Sprint tamamlandı');
  };
}

/* ============================ YOL HARİTASI ============================ */
function epicRange(e) {
  const kids = issuesOf().filter(i => i.epicId === e.id);
  const sps = kids.map(k => k.sprintId && sprint(k.sprintId)).filter(s => s && s.start);
  const start = e.start || (sps.length ? sps.map(s => s.start).sort()[0] : iso(addD(new Date(), -7)));
  const end = e.due || (sps.length ? sps.map(s => s.end).sort().pop() : iso(addD(new Date(), 21)));
  const done = kids.filter(k => stat(k.statusId).cat === 'done').length;
  return { start, end, kids, pct: kids.length ? Math.round(done / kids.length * 100) : 0 };
}

function renderRoadmap() {
  const w0 = monday(addD(new Date(), -21)), N = 14;
  const weeks = Array.from({ length: N }, (_, k) => addD(w0, k * 7));
  const colW = 100 / N;
  const dayPos = d => {
    const diff = (new Date(d) - w0) / 86400000 / 7;
    return Math.max(0, Math.min(N, diff)) * colW;
  };
  const eps = epicsOf();
  if (!eps.length) return '<div class="panel"><div class="empty">Bu projede epik yok. Backlog\'da “+ İş oluştur” ile tip olarak Epik seçin.</div></div>';

  return `<div class="rmwrap"><table class="rm">
    <thead><tr><th class="lead">Epik</th>
      ${weeks.map(d => `<th>${fmtD(iso(d))}</th>`).join('')}</tr></thead>
    <tbody>${eps.map(e => {
      const r = epicRange(e);
      const L = dayPos(r.start), R = dayPos(addD(new Date(r.end), 1));
      const late = r.end < TODAY && r.pct < 100;
      return `<tr data-open="${e.id}" style="cursor:pointer">
        <td class="lead">
          <div style="display:flex;align-items:center;gap:8px">
            ${tIcon('epic')}<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.summary)}</span>
            <span class="k" style="color:var(--ink3)">${r.pct}%</span>${avat(e.assignee)}
          </div>
        </td>
        <td colspan="${N}"><div class="track">
          <div class="today" style="left:${dayPos(TODAY)}%"></div>
          <div class="gantt" style="left:${L}%;width:${Math.max(R - L, 3)}%;background:${safeColor(e.color || '#6B4FBB')};${late ? 'box-shadow:inset 0 0 0 2px var(--risk)' : ''}">
            <i style="width:${r.pct}%"></i>
            <span style="position:relative">${r.kids.length} iş · ${fmtD(r.end)}</span>
          </div>
        </div></td></tr>`;
    }).join('')}</tbody></table></div>
    <p style="color:var(--ink3);font-size:11.5px;margin-top:8px">
      Kırmızı dikey çizgi bugünü, çubuk içindeki açık alan tamamlanma oranını gösterir.
      Epik tarihleri, alt işlerin sprintlerinden türetilir; epiği açıp elle de verebilirsiniz.</p>`;
}

          const r = capOf(u) ? h / capOf(u) : 0;

/* ============================ RAPORLAR ============================ */
function svgLine(w, h, pts, color, dash) {
  return `<polyline fill="none" stroke="${color}" stroke-width="2" ${dash ? 'stroke-dasharray="5 4"' : ''}
    points="${pts.map(p => p.join(',')).join(' ')}"/>`;
}
function doneDate(i) {
  if (i.doneAt) return i.doneAt;
  const h = DB.history.filter(x => x.issueId === i.id && x.field === 'Durum').pop();
  return h ? iso(new Date(h.at)) : null;
}

function burndown(s) {
  const W = 460, H = 180, PL = 34, PB = 22;
  const items = DB.issues.filter(i => i.sprintId === s.id);
  const total = items.reduce((a, i) => a + (i.points || 0), 0) || 1;
  const n = Math.max(1, Math.round((new Date(s.end) - new Date(s.start)) / 86400000));
  const days = Array.from({ length: n + 1 }, (_, k) => iso(addD(new Date(s.start), k)));
  const x = k => PL + k * (W - PL - 8) / n;
  const y = v => 8 + (1 - v / total) * (H - PB - 8);

  let left = total; const real = [];
  days.forEach((d, k) => {
    if (d > TODAY) return;
    items.forEach(i => { if (stat(i.statusId).cat === 'done' && doneDate(i) === d) left -= (i.points || 0); });
    real.push([x(k), y(left)]);
  });
  const ideal = [[x(0), y(total)], [x(n), y(0)]];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sprint burndown">
    ${[0, .5, 1].map(f => `<line x1="${PL}" x2="${W - 8}" y1="${y(total * f)}" y2="${y(total * f)}" stroke="var(--line)"/>
      <text x="4" y="${y(total * f) + 4}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${Math.round(total * f)}</text>`).join('')}
    ${svgLine(W, H, ideal, '#C7CBD1', true)}
    ${svgLine(W, H, real, 'var(--accent)')}
    ${real.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--accent)"/>`).join('')}
    <text x="${PL}" y="${H - 6}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(s.start)}</text>
    <text x="${W - 8}" y="${H - 6}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(s.end)}</text>
  </svg>`;
}

function velocity() {
  const done = sprintsOf().filter(s => s.state !== 'future').slice(-6);
  if (!done.length) return '<div class="empty">Henüz kapanmış sprint yok</div>';
  const data = done.map(s => {
    const it = DB.issues.filter(i => i.sprintId === s.id);
    return { s, c: it.reduce((a, i) => a + (i.points || 0), 0),
             d: it.filter(i => stat(i.statusId).cat === 'done').reduce((a, i) => a + (i.points || 0), 0) };
  });
  const max = Math.max(...data.map(d => d.c), 1), W = 460, H = 170, bw = (W - 20) / data.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sprint hızı">
    ${data.map((d, k) => {
      const x = 10 + k * bw, ch = (d.c / max) * (H - 40), dh = (d.d / max) * (H - 40);
      return `<rect x="${x + 6}" y="${H - 26 - ch}" width="${bw * .36}" height="${ch}" fill="#C7CBD1" rx="2"/>
        <rect x="${x + 6 + bw * .40}" y="${H - 26 - dh}" width="${bw * .36}" height="${dh}" fill="var(--accent)" rx="2"/>
        <text x="${x + bw / 2}" y="${H - 12}" text-anchor="middle" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${esc(d.s.name.replace(/^\S+\s/, ''))}</text>
        <text x="${x + bw / 2}" y="${H - 32 - Math.max(ch, dh)}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--ink2)">${d.d}/${d.c}</text>`;
    }).join('')}</svg>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--ink3);margin-top:4px">
      <span>▬ <span style="color:var(--ink2)">Taahhüt</span></span>
      <span style="color:var(--accent)">▬ <span style="color:var(--ink2)">Tamamlanan</span></span></div>`;
}

function renderReports() {
  const act = MOD('sprint') ? activeSprint() : null;
  const items = MOD('sprint')
    ? (act ? DB.issues.filter(i => i.sprintId === act.id) : [])
    : issuesOf().filter(i => i.type !== 'epic');
  const dn = items.filter(i => stat(i.statusId).cat === 'done');
  const days = weekDays();
  const wl = DB.worklogs.filter(w => days.includes(w.date) && issue(w.issueId)?.projectId === DB.ui.project);
  const perUser = DB.users.map(u => ({ u, h: wl.filter(w => w.userId === u.id).reduce((a, w) => a + w.hours, 0) }))
    .sort((a, b) => b.h - a.h);
  const maxH = Math.max(...perUser.map(p => p.h), 1);
  const est = items.reduce((a, i) => a + (i.estimate || 0), 0);
  const spent = items.reduce((a, i) => a + (i.spent || 0), 0);

  const byStatus = stats().map(s => ({ s, n: items.filter(i => i.statusId === s.id).length }));
  const tot = items.length || 1;

  return `<div class="grid2">
    ${MOD('sprint') ? `<section class="panel">
      <h3>Sprint burndown</h3>
      <div class="sub">${act ? esc(act.name) + ' · kalan story point' : 'Aktif sprint yok'}</div>
      ${act ? `<div class="stat">
        <div><b>${items.length - dn.length}</b><span>açık iş</span></div>
        <div><b>${items.reduce((a, i) => a + (i.points || 0), 0) - dn.reduce((a, i) => a + (i.points || 0), 0)}</b><span>kalan puan</span></div>
        <div><b>${Math.max(0, Math.ceil((new Date(act.end) - new Date()) / 86400000))}</b><span>gün kaldı</span></div>
      </div>${burndown(act)}` : '<div class="empty">Backlog\'dan bir sprint başlatın</div>'}
    </section>

    <section class="panel">
      <h3>Sprint hızı</h3><div class="sub">Taahhüt edilen ve tamamlanan puan</div>
      ${velocity()}
    </section>` : ''}

    <section class="panel">
      <h3>Kişi bazlı harcanan süre</h3>
      <div class="sub">${fmtD(days[0])} – ${fmtD(days[6])} haftası</div>
      ${perUser.map(p => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:7px">
        ${avat(p.u.id)}<span style="width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.u.name)}</span>
        <span style="flex:1;height:9px;background:var(--track);border-radius:5px;overflow:hidden">
          <i style="display:block;height:100%;width:${p.h / maxH * 100}%;background:${p.u.color}"></i></span>
        <b class="num" style="width:52px;text-align:right;font-size:12px">${fmtDur(p.h)}</b></div>`).join('')}
      <div style="margin-top:10px;padding-top:9px;border-top:1px solid var(--line);display:flex;justify-content:space-between">
        <span class="k" style="color:var(--ink3)">HAFTA TOPLAMI</span>
        <b class="num">${fmtDur(wl.reduce((a, w) => a + w.hours, 0))}</b></div>
    </section>

    <section class="panel">
      <h3>Kapasite planı</h3><div class="sub">${MOD('sprint') ? 'Aktif sprint' : 'Açık işler'} · kalan iş yükü / kişi kapasitesi</div>
      ${capacityPanel()}
    </section>

    <section class="panel">
      <h3>Kümülatif akış</h3><div class="sub">Son 30 gün · durum bazında iş sayısı</div>
      ${cfd(30)}
    </section>

    <section class="panel">
      <h3>Döngü süresi</h3><div class="sub">Başlangıçtan bitişe geçen gün</div>
      ${cycleReport()}
    </section>

    <section class="panel">
      <h3>Haftalık üretim</h3><div class="sub">Tamamlanan iş sayısı</div>
      ${throughput(8)}
    </section>

    <section class="panel">
      <h3>Tahmin doğruluğu</h3><div class="sub">${MOD('sprint') ? 'Aktif sprint' : 'Tüm işler'} · tahmin vs harcanan</div>
      <div class="stat">
        <div><b>${fmtDur(est)}</b><span>tahmin</span></div>
        <div><b>${fmtDur(spent)}</b><span>harcanan</span></div>
        <div><b style="${spent > est ? 'color:var(--risk)' : ''}">${est ? Math.round(spent / est * 100) : 0}%</b><span>kullanım</span></div>
      </div>
      <div class="sec" style="margin-top:6px">DURUM DAĞILIMI</div>
      ${byStatus.map(b => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:6px">
        <span style="width:104px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.s.name)}</span>
        <span style="flex:1;height:9px;background:var(--track);border-radius:5px;overflow:hidden">
          <i style="display:block;height:100%;width:${b.n / tot * 100}%;background:var(--${b.s.cat === 'done' ? 'done' : b.s.cat === 'todo' ? 'todo' : 'prog'})"></i></span>
        <b class="num" style="width:26px;text-align:right;font-size:12px">${b.n}</b></div>`).join('')}
    </section>
  </div>`;
}

function openModal(html, cls = '') {
  const s = $('#scrim');
  s.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  s.classList.add('on');
  const f = s.querySelector('input,textarea,select'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('#scrim').classList.remove('on'); $('#scrim').innerHTML = ''; OPEN_ISSUE = null; if (RERENDER) setTimeout(tryRerender, 0); }

/* ---- durum değişimi tek kapıdan ---- */
function setStatus(i, sid) {
  if (i.statusId === sid) return;
  const from = stat(i.statusId), to = stat(sid);
  logHist(i, 'Durum', from.name, to.name);
  i.statusId = sid;
  if (to.cat === 'done') i.doneAt = TODAY; else delete i.doneAt;
  i.updatedAt = Date.now();
  recordTransition(i, from.id, sid);
  runRules(i, 'status');
}

    const lh = $('#logHere'); if (lh) lh.disabled = true;
    const dl = S.querySelector('[data-del]'); if (dl) dl.remove();
  }
  $$('[data-f]', S).forEach(el => el.onchange = () => {
    const f = el.dataset.f; let v = el.value;
    const label = { statusId: 'Durum', assignee: 'Atanan', reporter: 'Raporlayan', priority: 'Öncelik',
      type: 'Tip', points: 'Puan', sprintId: 'Sprint', epicId: 'Epik', due: 'Bitiş', start: 'Başlangıç',
      estimate: 'Tahmin', remainingEst: 'Kalan tahmin', billable: 'Faturalama', billType: 'Fatura türü' }[f];
    const isDur = f === 'estimate' || f === 'remainingEst';
    if (f === 'statusId') { setStatus(i, v); }
    else if (f === 'priority') setPriority(i, +v);
    else if (f === 'assignee') setAssignee(i, v);
    else {
      const before = isDur ? fmtDur(f === 'estimate' ? i.estimate : remaining(i)) : (i[f] ?? '—');
      if (f === 'points') v = v === '' ? null : parseFloat(v.replace(',', '.'));
      else if (isDur) v = parseDur(v);
      else if (f === 'sprintId' || f === 'epicId') v = v || null;
      i[f] = v;
      /* Henüz süre kaydı yoksa tahmin değişince kalan da onunla eşitlenir. */
      if (f === 'estimate' && !i.spent) i.remainingEst = v;
      /* Tarih sırası korunur: bitiş başlangıçtan önce olamaz. */
      if (f === 'start' && v && i.due && v > i.due) i.due = v;
      if (f === 'due' && v && i.start && v < i.start) i.start = v;
      logHist(i, label, before, isDur ? fmtDur(v) : (v ?? '—'));
    }
    save(); render(); openIssue(i.id);
  });
  $('#sum').onblur = () => { const v = $('#sum').innerText.trim(); if (v && v !== i.summary) { logHist(i, 'Özet', i.summary, v); i.summary = v; save(); render(); } };
  $('#desc').onblur = () => { const v = $('#desc').innerText.trim(); if (v !== i.description) { i.description = v; save(); } };
  $('#tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { TAB = b.dataset.t; openIssue(i.id); } };
  $$('[data-cedit]').forEach(b => b.onclick = () => { DB.ui.editCmt = b.dataset.cedit; openIssue(i.id); });
  $$('[data-ccancel]').forEach(b => b.onclick = () => { DB.ui.editCmt = null; openIssue(i.id); });
  $$('[data-csave]').forEach(b => b.onclick = () => {
    const c = DB.comments.find(x => x.id === b.dataset.csave);
    const v = $('#ce_' + c.id).value.trim(); if (!v) return;
    if (v !== c.body) { c.body = v; c.edited = Date.now(); }
    DB.ui.editCmt = null; save(); openIssue(i.id);
  });
  $$('[data-cdel]').forEach(b => b.onclick = () => {
    if (!confirm('Yorum silinsin mi?')) return;
    DB.comments = DB.comments.filter(x => x.id !== b.dataset.cdel); save(); openIssue(i.id); });
  const ac = $('#addCmt'); if (ac) ac.onclick = () => {
    const v = $('#newCmt').value.trim(); if (!v) return;
    DB.comments.push({ id: uid('c'), issueId: i.id, userId: CU().id, at: Date.now(), body: v });
    save(); openIssue(i.id);
  };
  $('#logHere').onclick = () => logWorkForm(i.id);
  wireIssueExtras(i);
}

/* Kalan tahminin süre kaydından sonraki değeri */
function nextRemaining(i, hours, mode, value) {
  const cur = remaining(i);
  if (mode === 'leave') return cur;
  if (mode === 'set') return Math.max(0, value || 0);
  if (mode === 'reduce') return Math.max(0, cur - (value || 0));
  return Math.max(0, cur - hours);          // auto
}

function render() {

/* Kapalı modüllerin ekranlarını menüden kaldırır */
function syncNav() {
  const hidden = { roadmap: !MOD('epic'), admin: !isAdmin(), system: !isAdmin(), users: !isAdmin() };
  $$('.nav a, #vtabs button').forEach(el => {
    if (hidden[el.dataset.v]) el.style.display = 'none';
    else if (VIEWS[el.dataset.v]) el.style.display = '';

}

/* ============================ OLAYLAR ============================ */
function wire() {
  $('#projSel').onchange = e => { DB.ui.project = e.target.value; DB.board.q = ''; save(); render(); };
  addEventListener('hashchange', () => {
    const v = location.hash.slice(1); if (VIEWS[v]) { DB.ui.view = v; save(); render(); }
  });

  document.addEventListener('click', e => {
    const t = e.target;

    /* --- gezinme: hash'e bağlı değil, doğrudan tıklama --- */
    const nv = t.closest('[data-v]');
    if (nv) {
      e.preventDefault();
      const v = nv.dataset.v;
      if (v === '__proj') return projectMenu();
      if (v === '__data') return dataMenu();
      if (VIEWS[v]) { DB.ui.view = v; try { history.replaceState(null, '', '#' + v); } catch (_) {} save(); render(); }
      return;
    }

    /* --- karttaki hızlı menü düğmeleri: kartı açmadan önce yakalanır --- */
    const qp = t.closest('[data-qpri]'); if (qp) { e.preventDefault(); return openQuick('pri', qp); }
    const qs = t.closest('[data-qas]');  if (qs) { e.preventDefault(); return openQuick('as', qs); }
    if (t.closest('.qm-wrap')) return;

    if (t.closest('[data-close]') || t === $('#scrim')) return closeModal();
    const pj = t.closest('[data-proj]');
    if (pj) { DB.ui.project = pj.dataset.proj; DB.board.q = ''; $('#projSel').value = pj.dataset.proj;
      closeModal(); save(); render(); return; }
    const ac2 = t.closest('[data-act]');
    if (ac2) { closeModal();
      if (ac2.dataset.act === 'savefile') { closeModal(); return flushSync().then(() => toast(SYNC_STATE === 'ok' ? 'Kaydedildi' : 'Kaydedilemedi, tekrar denenecek')); }
      if (ac2.dataset.act === 'pw') { closeModal(); return changePwForm(false); }
      if (ac2.dataset.act === 'theme') { closeModal(); return cycleTheme(); }
      if (ac2.dataset.act === 'logout') return logout();
      if (ac2.dataset.act === 'merge') return $('#mergeIn').click();
      const b2 = $({ export: '#btnExport', import: '#btnImport' }[ac2.dataset.act]);
      if (b2) b2.click(); return; }
    const cp2 = t.closest('[data-complete]');
    if (cp2 && cp2.dataset.complete) { e.stopPropagation(); return completeIssue(cp2.dataset.complete, !!cp2.closest('.hm-row')); }
    const ro = t.closest('[data-reopen]');
    if (ro) { e.stopPropagation(); return reopenIssue(ro.dataset.reopen); }
    const dt = t.closest('[data-donetgl]');
    if (dt) { DB.ui.doneOpen ||= {}; DB.ui.doneOpen[dt.dataset.donetgl] = !DB.ui.doneOpen[dt.dataset.donetgl]; save(); return render(); }
    const ew = t.closest('[data-editwl]');
    if (ew) { e.stopPropagation(); return worklogForm({ edit: ew.dataset.editwl }); }
    const cell = t.closest('[data-cell]');
    if (cell) {
      const id = cell.dataset.cell, date = cell.dataset.date, byUser = DB.ui.tsMode === 'user';
      const logs = DB.worklogs.filter(w => w.date === date && tsScopeOk(w)
        && (byUser ? w.userId === id : w.issueId === id));
      if (!logs.length) return canEdit()
        ? (byUser ? logWorkForm(null, id, date) : logWorkForm(id, null, date))
        : toast('Bu güne kayıt girilmemiş');
      const who = byUser ? user(id)?.name : issue(id)?.key + ' — ' + issue(id)?.summary;
      return showLogs(who, fmtD(date), logs,
        { userId: byUser ? id : null, issueId: byUser ? null : id, date });
    }
    const del = t.closest('[data-delwl]');
    if (del) { const w = DB.worklogs.find(x => x.id === del.dataset.delwl); const i = issue(w.issueId);
      if (w.userId !== CU().id && !isAdmin()) return toast('Başkasının süre kaydını yalnızca yönetici silebilir');
      if (!confirm(`${user(w.userId)?.name || ''} · ${fmtD(w.date)} · ${fmtDur(w.hours)} süre kaydı silinsin mi?`)) return;
      i.spent = Math.max(0, (i.spent || 0) - w.hours);
      if (!w.adj || w.adj === 'auto') i.remainingEst = remaining(i) + w.hours;
      DB.worklogs = DB.worklogs.filter(x => x.id !== w.id);
      save(); render(); if ($('#scrim').classList.contains('on')) openIssue(i.id); return; }
    const di = t.closest('[data-del]');
    if (di) { if (!confirm('Bu iş; yorumları, süre kayıtları ve geçmişiyle birlikte silinsin mi?\n\nYönetici gerekirse Sistem › Çöp kutusu’ndan geri yükleyebilir.')) return;
      const id = di.dataset.del;
      DB.issues = DB.issues.filter(x => x.id !== id);
      DB.worklogs = DB.worklogs.filter(x => x.issueId !== id);
      DB.comments = DB.comments.filter(x => x.issueId !== id);
      closeModal(); save(); render(); return; }
    const ds = t.closest('[data-delsprint]');
    if (ds) { const id = ds.dataset.delsprint;
      DB.issues.forEach(i => { if (i.sprintId === id) i.sprintId = null; });
      DB.sprints = DB.sprints.filter(s => s.id !== id);
      closeModal(); save(); render(); return; }
    const st = t.closest('[data-start]');   if (st) return startSprint(st.dataset.start);
    const cp = t.closest('[data-spcomplete]'); if (cp) return completeSprint(cp.dataset.spcomplete);
    const es = t.closest('[data-editsprint]'); if (es) return sprintForm(es.dataset.editsprint);
    if (t.closest('.btn') || t.closest('select') || t.closest('input')) return;
    const op = t.closest('[data-open]'); if (op) return openIssue(op.dataset.open);
    const cd = t.closest('.card,.row');   if (cd && cd.dataset.id) return openIssue(cd.dataset.id);
  });

  addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'c' && !e.ctrlKey && !e.metaKey && canEdit() && !/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) && !e.target.isContentEditable
        && !$('#scrim').classList.contains('on')) { e.preventDefault(); newIssueForm(); }
  });
  wireKeys();

  /* ---- sürükle-bırak ---- */
  const view = $('#view');
  view.addEventListener('dragstart', e => {
    if (!canEdit()) { e.preventDefault(); return; }
    const el = e.target.closest('.card,.row'); if (!el) return;
    DRAG = el.dataset.id; el.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', DRAG);
  });
  view.addEventListener('dragend', e => { DRAG = null;
    $$('.drag').forEach(x => x.classList.remove('drag')); $$('.over').forEach(x => x.classList.remove('over')); });
  view.addEventListener('dragover', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !DRAG) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    $$('.over').forEach(x => x.classList.remove('over'));
    (z.closest('.col') || z).classList.add('over');
  });
  view.addEventListener('drop', e => {
    const z = e.target.closest('[data-drop]'); if (!z || !DRAG) return;
    e.preventDefault();
    const i = issue(DRAG); if (!i) return;
    if (z.dataset.drop === 'status') {
      i.rank = dropIndexRank(z, e.clientY, '.card');
      setStatus(i, z.dataset.status);
      const act = activeSprint();
      if (act && !i.sprintId && DB.board.scope !== 'all') i.sprintId = act.id;
    } else {
      const to = z.dataset.sprint || null;
      if (i.sprintId !== to) logHist(i, 'Sprint', i.sprintId ? sprint(i.sprintId).name : 'Backlog', to ? sprint(to).name : 'Backlog');
      i.sprintId = to;
      i.rank = dropIndexRank(z, e.clientY, '.row');
    }
    DRAG = null; save(); render();
  });

  /* ---- veri taşıma ---- */
  $('#btnExport').onclick = () => {
    if (!isAdmin()) return toast('Veri dışa aktarma yalnızca yöneticiler içindir');
    if (isAdmin()) { location.href = '/api/export'; return toast('Yedek indiriliyor'); }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }));
    a.download = `pano-${TODAY}.json`; a.click(); URL.revokeObjectURL(a.href);
    toast('Veri dışa aktarıldı');
  };
  $('#btnKeys').onclick = () => palette();
  $('#btnMerge').onclick = () => { if (!isAdmin()) return toast('Birleştirme yalnızca yöneticiler içindir'); $('#mergeIn').click(); };
  $('#mergeIn').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const inc = extractData(String(r.result));
      if (!inc || !inc.issues) return toast('Dosya okunamadı — Pano JSON’u ya da kayıtlı HTML seçin');
      mergeDialog(inc, f.name);
    };
    r.readAsText(f);
  };
  $('#btnImport').onclick = () => {
    if (!isAdmin()) return toast('İçe aktarma yalnızca yöneticiler içindir');
    if (!confirm('İçe aktarılan dosya sunucudaki TÜM verinin yerini alacak. Önce “Dışa aktar” ile yedek almanız önerilir. Devam edilsin mi?')) return;
    $('#fileIn').click();
  };
  $('#fileIn').onchange = e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      const data = extractData(String(r.result));
      if (!data || !Array.isArray(data.issues)) return toast('Dosya okunamadı — geçerli bir Pano JSON’u seçin');
      toast('İçe aktarılıyor…');
      try {
        await flushAll();
        const st = await API.post('/api/import', { data });
        await reloadState();
        toast(`İçe aktarıldı: ${st.issues || 0} iş, ${st.worklogs || 0} süre kaydı, ${st.newUsers || 0} yeni kullanıcı` +
          (st.fixedKeys ? ` · ${st.fixedKeys} çift iş numarası düzeltildi` : '') + ' · önceki hâlin yedeği alındı');
      } catch (err) { toast('İçe aktarılamadı: ' + err.message); }
    };
    r.readAsText(f);
  };

}

/* Kapatılabilir modüller. Kapalı bir modül arayüzden tamamen kalkar;
   veri alanları durur, tekrar açılınca geri gelir. */
const MODULE_DEFAULTS = { sprint: false, epic: false, points: false, reporter: false };
const MODULE_LABELS = {
  sprint:   ['Sprint & backlog planlama', 'Sprint kutuları, sprint başlat/tamamla, burndown ve hız raporu'],
  epic:     ['Epik & yol haritası', 'Epik tipi, epik etiketi ve yol haritası ekranı'],
  points:   ['Story point', 'Puan alanı, backlog puan toplamları, puan bazlı burndown'],
  reporter: ['Raporlayan', 'İşi kimin açtığı bilgisi'],
};
const MOD = k => DB?.cfg?.modules?.[k] === true;

/* ---- şema tamamlayıcı (eski kayıtlar için) ---- */
function ensureSchema() {
  DB.cfg ||= {};
  DB.cfg.modules = Object.assign({}, MODULE_DEFAULTS, DB.cfg.modules || {});
  DB.fields  ||= [];
  DB.links   ||= [];
  DB.rules   ||= [];
  DB.filters ||= [];
  DB.transitions ||= [];
  DB.issues.forEach(i => { i.cf ||= {}; if (!Array.isArray(i.labels)) i.labels = []; });
  ensureProjects();
  ensureTypes();
  ensureBilling();
  ensurePlanning();
  ensureSuper();
  ensureArchive();
  DB.projects.forEach(p => { p.code ||= p.key || projCode(p.name, new Set()); });
}

/* ============================================================
   1) SORGU DİLİ  —  PQL
   örn:  durum != Bitti AND atanan = "Elif Demir" ORDER BY oncelik ASC
   ============================================================ */
const QF = {
  key:        { g: i => i.key },
  ozet:       { g: i => i.summary },
  aciklama:   { g: i => i.description },
  metin:      { g: i => i.summary + ' ' + i.description },
  tip:        { g: i => TYPE[i.type][2], alt: i => i.type },
  durum:      { g: i => stat(i.statusId).name },
  kategori:   { g: i => ({ todo: 'Yapılacak', inprogress: 'Devam', done: 'Bitti' })[stat(i.statusId).cat], alt: i => stat(i.statusId).cat },
  atanan:     { g: i => user(i.assignee)?.name || '', empty: i => !i.assignee },
  raporlayan: { g: i => user(i.reporter)?.name || '' },
  oncelik:    { g: i => lvl(i.priority), t: 'num', map: v => { const n = +v; if (!isNaN(n)) return n;
                  const w = priKey(v), k = LVLS.find(k => priKey(PRI[k][1]) === w); return k || PRI_ALIAS[w] || v; } },
  puan:       { g: i => i.points, t: 'num', empty: i => i.points == null },
  tahmin:     { g: i => i.estimate, t: 'dur' },
  harcanan:   { g: i => i.spent, t: 'dur' },
  kalan:      { g: i => remaining(i), t: 'dur' },
  sprint:     { g: i => i.sprintId ? sprint(i.sprintId).name : '', empty: i => !i.sprintId },
  epik:       { g: i => i.epicId ? issue(i.epicId).summary : '', empty: i => !i.epicId },
  etiket:     { g: i => i.labels || [], t: 'list', empty: i => !(i.labels || []).length },
  bitis:      { g: i => i.due, t: 'date', empty: i => !i.due },
  baslangic:  { g: i => i.start, t: 'date', empty: i => !i.start },
  plangun:    { g: i => planDays(i), t: 'num' },
  proje:      { g: i => DB.projects.find(p => p.id === i.projectId).key },
  fatura:     { g: i => billOf(i) },
  faturaturu: { g: i => btypeOf(i) },
};
/* Öncelik adları büyük/küçük harf ve ı/i farkı gözetmeden; eski adlar takma ad. */
const priKey = v => String(v).toLocaleLowerCase('tr').replace(/ı/g, 'i').trim();
const PRI_ALIAS = { kritik: 1, onemsiz: 4, 'önemsiz': 4, dusuk: 4, yuksek: 2 };
const qfield = name => {
  const k = name.toLowerCase().replace(/[ıİ]/g, 'i').replace(/[şŞ]/g, 's').replace(/[çÇ]/g, 'c').replace(/[ğĞ]/g, 'g').replace(/[üÜ]/g, 'u').replace(/[öÖ]/g, 'o');
  if (QF[k]) return QF[k];
  const f = DB.fields.find(f => f.key.toLowerCase() === k);
  if (f) return { g: i => i.cf?.[f.id] ?? '', t: f.type === 'number' ? 'num' : f.type === 'date' ? 'date' : 'str',
                  empty: i => i.cf?.[f.id] === '' || i.cf?.[f.id] == null };
  return null;
};

function tokenize(q) {
  const re = /\s*(?:("(?:[^"\\]|\\.)*")|(\()|(\))|(>=|<=|!=|!~|=|~|>|<)|(\d+(?:[.,]\d+)?\s*[wdhm](?:\s*\d+(?:[.,]\d+)?\s*[wdhm])*)\b|([A-Za-zÇĞİÖŞÜçğıöşü_][\w\-ÇĞİÖŞÜçğıöşü]*(?:\(\))?)|(-?\d+(?:[.,]\d+)?)|(,))/gy;
  const out = [];
  while (re.lastIndex < q.length) {
    const at = re.lastIndex;              // sticky regex başarısız olunca lastIndex sıfırlanır
    const m = re.exec(q);
    if (!m) {
      if (q.slice(at).trim() === '') break;
      throw new Error('Anlaşılmayan ifade: ' + q.slice(at, at + 16));
    }
    if (m[1]) out.push({ t: 'val', v: m[1].slice(1, -1).replace(/\\"/g, '"'), q: true });
    else if (m[2]) out.push({ t: '(' });
    else if (m[3]) out.push({ t: ')' });
    else if (m[4]) out.push({ t: 'op', v: m[4] });
    else if (m[5]) out.push({ t: 'val', v: parseDur(m[5]), num: true, dur: true });
    else if (m[6]) { const w = m[6].toUpperCase();
      out.push(['AND', 'VE', 'OR', 'VEYA', 'NOT', 'DEGIL', 'IN', 'IS', 'EMPTY', 'BOS'].includes(w) ? { t: 'kw', v: m[6].toUpperCase() } : { t: 'val', v: m[6] }); }
    else if (m[7]) out.push({ t: 'val', v: m[7].replace(',', '.'), num: true });
    else if (m[8]) out.push({ t: ',' });
  }
  return out;
}

function parseQuery(q) {
  let order = null;
  q = q.replace(/\border\s+by\s+(\S+)(\s+(asc|desc))?\s*$/i, (_, f, __, d) => { order = { f, dir: (d || 'asc').toLowerCase() }; return ''; });
  const T = tokenize(q); let p = 0;
  const peek = () => T[p], eat = () => T[p++];
  const isKw = v => peek()?.t === 'kw' && peek().v === v;

  function valueTok() {
    const t = eat();
    if (!t || (t.t !== 'val')) throw new Error('Değer bekleniyordu');
    if (typeof t.v === 'string' && /^currentuser\(\)$/i.test(t.v)) return { v: CU().name, q: true };
    return { v: t.num ? parseFloat(t.v) : t.v, q: t.q, dur: t.dur };
  }
  const value = () => valueTok().v;
  function cond() {
    const nameTok = eat();
    if (!nameTok || nameTok.t !== 'val') throw new Error('Alan adı bekleniyordu');
    const F = qfield(nameTok.v);
    if (!F) throw new Error(`Bilinmeyen alan: ${nameTok.v}`);
    if (isKw('IS')) { eat();
      let neg = false; if (isKw('NOT') || isKw('DEGIL')) { eat(); neg = true; }
      if (!(isKw('EMPTY') || isKw('BOS'))) throw new Error('EMPTY bekleniyordu');
      eat();
      return i => { const e = F.empty ? F.empty(i) : !String(F.g(i) ?? '').length; return neg ? !e : e; };
    }
    if (isKw('IN')) { eat();
      if (peek()?.t !== '(') throw new Error('IN sonrası ( bekleniyordu'); eat();
      const vals = []; while (peek() && peek().t !== ')') { if (peek().t === ',') { eat(); continue; } vals.push(value()); }
      eat();
      return i => vals.some(v => cmp(F, i, '=', v));
    }
    const opTok = eat();
    if (!opTok || opTok.t !== 'op') throw new Error(`${nameTok.v} sonrası operatör bekleniyordu`);
    const vt = valueTok();
    /* tırnaksız bir alan adı yazıldıysa alan-alan karşılaştırması yapılır:
       harcanan > tahmin   →   her iş için kendi değerleri kıyaslanır.
       Sabit metin istiyorsanız tırnak kullanın: durum = "tahmin" */
    if (!vt.q && !vt.dur && typeof vt.v === 'string') {
      const RF = qfield(vt.v);
      if (RF) return i => cmp(F, i, opTok.v, RF.g(i));
    }
    return i => cmp(F, i, opTok.v, vt.v);
  }
  function factor() {
    if (isKw('NOT') || isKw('DEGIL')) { eat(); const f = factor(); return i => !f(i); }
    if (peek()?.t === '(') { eat(); const e = expr(); if (peek()?.t !== ')') throw new Error(') eksik'); eat(); return e; }
    return cond();
  }
  function term() { let l = factor();
    while (isKw('AND') || isKw('VE')) { eat(); const r = factor(); const p1 = l; l = i => p1(i) && r(i); } return l; }
  function expr() { let l = term();
    while (isKw('OR') || isKw('VEYA')) { eat(); const r = term(); const p1 = l; l = i => p1(i) || r(i); } return l; }

  const fn = T.length ? expr() : () => true;
  if (p < T.length) throw new Error('Beklenmeyen ifade sonu');
  return { fn, order };
}

function cmp(F, i, op, v) {
  let a = F.g(i);
  if (F.t === 'list') {
    const has = (a || []).some(x => String(x).toLowerCase() === String(v).toLowerCase());
    return op === '!=' ? !has : op === '~' ? (a || []).some(x => String(x).toLowerCase().includes(String(v).toLowerCase())) : has;
  }
  if (F.map) v = F.map(v);
  if (F.t === 'dur' && typeof v === 'string') v = parseDur(v);
  if (F.t === 'num' || F.t === 'dur') { a = +a; v = +v; }
  else if (F.t !== 'date') {
    const A = String(a ?? '').toLowerCase(), V = String(v ?? '').toLowerCase();
    const altOk = F.alt ? String(F.alt(i)).toLowerCase() === V : false;
    switch (op) {
      case '=':  return A === V || altOk;
      case '!=': return !(A === V || altOk);
      case '~':  return A.includes(V);
      case '!~': return !A.includes(V);
      default: throw new Error(`"${op}" bu alanda kullanılamaz`);
    }
  }
  switch (op) {
    case '=':  return a == v;   case '!=': return a != v;
    case '>':  return a > v;    case '<':  return a < v;
    case '>=': return a >= v;   case '<=': return a <= v;
    case '~':  return String(a).includes(String(v));
    default: throw new Error(`"${op}" desteklenmiyor`);
  }
}

function runQuery(q) {
  const { fn, order } = parseQuery(q.trim());
  let out = DB.issues.filter(fn);
  if (order) { const F = qfield(order.f);
    if (F) out.sort((a, b) => { const x = F.g(a), y = F.g(b);
      const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'tr');
      return order.dir === 'desc' ? -r : r; }); }
  return out;
}

const ACTS = {
  assign:   { l: 'Atananı değiştir',   pick: 'user' },
  priority: { l: 'Önceliği değiştir',  pick: 'pri' },
  label:    { l: 'Etiket ekle',        pick: 'text' },

  status:   { l: 'Durumu değiştir',    pick: 'status' },
  comment:  { l: 'Yorum ekle',         pick: 'text' },
  due:      { l: 'Bitiş tarihi ver',   pick: 'days' },
  cf:       { l: 'Özel alanı ayarla',  pick: 'cf' },
};
const TRIGS = { created: 'İş oluşturulduğunda', status: 'Belirli bir duruma geçince', assigned: 'Atanan değişince' };

function runRules(i, trigger, ctx = {}) {
  if ((i.__d || 0) > 3) return;
  DB.rules.filter(r => r.enabled !== false && r.projectId === i.projectId && r.on === trigger).forEach(r => {
    if (r.on === 'status' && r.whenStatus && i.statusId !== r.whenStatus) return;
    (r.then || []).forEach(a => {
      i.__d = (i.__d || 0) + 1;
      switch (a.act) {
        case 'assign':   if (i.assignee !== a.v) { logHist(i, 'Atanan', user(i.assignee)?.name || '—', user(a.v)?.name || '—'); i.assignee = a.v || null; } break;
        case 'priority': if (lvl(i.priority) !== lvl(a.v)) i.priority = lvl(a.v); break;
        case 'label':    i.labels = [...new Set([...(i.labels || []), a.v])]; break;
        case 'sprint':   i.sprintId = a.v || null; break;
        case 'status':   if (a.v && a.v !== i.statusId) setStatus(i, a.v); break;
        case 'cf':       (i.cf ||= {})[a.field] = a.v; break;
        case 'due':      { const n = parseInt(a.v, 10) || 0;
                           i.start ||= TODAY; i.due = addWorkdays(i.start, Math.max(0, n - 1)); break; }
        case 'comment':  DB.comments.push({ id: uid('c'), issueId: i.id, userId: CU().id, at: Date.now(), body: `⚙︎ ${a.v}` }); break;
      }
      i.__d--;
    });
    DB.history.push({ id: uid('h'), issueId: i.id, userId: CU().id, at: Date.now(),
      field: 'Otomasyon', from: r.name, to: (r.then || []).map(a => ACTS[a.act].l).join(', ') });
  });
  delete i.__d;
}

/* Bir projenin durum listesini verilen akışa dönüştürür.
   Mevcut durumlar sırayla yeniden adlandırılır, fazlalıktakiler
   en son duruma taşınıp silinir, eksikler eklenir. */
function applyFlow(pid, rows) {
  const cur = DB.statuses.filter(s => s.projectId === pid).sort((a, b) => a.ord - b.ord);
  rows.forEach(([name, cat], k) => {
    if (cur[k]) { cur[k].name = name; cur[k].cat = cat; cur[k].ord = k; }
    else DB.statuses.push({ id: uid('st'), projectId: pid, name, cat, wip: 0, ord: k });
  });
  const extra = cur.slice(rows.length);
  if (extra.length) {
    const keep = DB.statuses.filter(s => s.projectId === pid && !extra.includes(s)).sort((a, b) => a.ord - b.ord);
    const last = keep[keep.length - 1];
    DB.issues.forEach(i => { if (extra.some(s => s.id === i.statusId)) i.statusId = last.id; });
    DB.statuses = DB.statuses.filter(s => !extra.includes(s));
  }
}
