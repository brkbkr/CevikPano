<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ÇevikPano</title>
<meta name="theme-color" content="#2563EB">
<meta name="description" content="ÇevikPano — ekibinin işleri, zamanı ve teslimleri tek panoda">
<link rel="icon" type="image/svg+xml" href="/img/icon.svg" id="favicon">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ÇevikPano">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A; --ink2:#4A4F58; --ink3:#858B95;
  --paper:#F5F5F1; --surface:#FFFFFF; --surface2:#FAFAF7;
  --line:#E3E3DC; --line2:#D2D2C9;
  --accent:#1F6F5C; --accent-d:#14503F; --accent-soft:#E4F0EC;
  --todo:#767E8B; --prog:#B45309; --done:#15803D; --risk:#B4291F;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r:6px; --shadow:0 1px 2px rgba(20,22,26,.06),0 4px 12px rgba(20,22,26,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------- signature: keys, numbers, durations are data → mono ---------- */
.k{font-family:var(--mono);font-size:11.5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:212px 1fr;height:100vh;overflow:hidden}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{padding:16px 16px 12px;display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.brand b{font-size:16px;letter-spacing:-.02em}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.projsel{padding:12px 12px 8px}
.projsel select{width:100%;padding:7px 8px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface2)}
.navgroup{padding:8px 8px 4px;font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink3);margin-top:6px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 12px;margin:1px 8px;border-radius:var(--r);
  color:var(--ink2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-d);font-weight:600}
.nav a .g{width:16px;text-align:center;font-size:13px;opacity:.85}
.filebar{margin-top:auto;padding:10px 10px 6px;border-top:1px solid var(--line);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filebar .btn{display:flex;align-items:center;gap:6px;justify-content:center}
.fstate{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--done)}
.fstate.dirty{background:#F0B429;box-shadow:0 0 0 3px rgba(240,180,41,.25)}
.fnote{width:100%;font-size:10.5px;color:var(--ink3);line-height:1.3}
.rail-foot{margin-top:0;padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.rail-foot button{font-size:11px;color:var(--ink3);padding:4px 6px;border-radius:4px}
.rail-foot button:hover{background:var(--surface2);color:var(--ink)}

.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 20px 0;flex-shrink:0}
.topbar h1{margin:0;font-size:19px;letter-spacing:-.025em;font-weight:650}
.crumb{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.toolrow{display:flex;align-items:center;gap:10px;padding:11px 0 10px;flex-wrap:wrap}
.vtabs{display:none;gap:2px;margin:10px -20px 0;padding:0 20px;overflow-x:auto;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtabs button{white-space:nowrap;padding:8px 12px;font-size:12.5px;color:var(--ink3);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.vtabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.content{flex:1;overflow:auto;padding:16px 20px 40px}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line2);background:var(--surface);padding:6px 11px;border-radius:var(--r);font-weight:500}
.btn:hover{background:var(--surface2);border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--risk);border-color:var(--risk-line)}
.btn.danger:hover{background:var(--risk-bg)}
.inp{border:1px solid var(--line2);background:var(--surface);padding:6px 9px;border-radius:var(--r);width:100%}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{padding:6px 6px}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search .inp{padding-left:26px}
.search::before{content:"⌕";position:absolute;left:8px;top:5px;color:var(--ink3);font-size:14px}
.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.seg button{padding:5px 10px;font-size:12px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:#fff}
.spacer{flex:1}
label.field{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink3);margin:0 0 4px}

/* ---------- avatars & chips ---------- */
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;
  font-weight:700;color:#fff;flex-shrink:0;font-family:var(--mono);letter-spacing:-.03em}
.av.lg{width:30px;height:30px;font-size:11.5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:3px;
  font-size:10.5px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.cat-todo{background:var(--todo-bg);color:var(--todo);border-color:var(--todo-line)}
.cat-inprogress{background:var(--prog-bg);color:var(--prog);border-color:var(--prog-line)}
.cat-done{background:var(--done-bg);color:var(--done);border-color:var(--done-line)}
.lbl{background:var(--surface2);border-color:var(--line);color:var(--ink2);font-weight:500}
.pt{background:var(--todo-bg);color:var(--ink2);border-color:var(--todo-line);font-family:var(--mono);font-size:10.5px}

/* type & priority glyphs */
.ti{width:15px;height:15px;border-radius:3px;display:inline-grid;place-items:center;font-size:9.5px;
  color:#fff;font-weight:800;flex-shrink:0}
.ti.epic{background:#6B4FBB} .ti.story{background:#3B8A5A} .ti.task{background:#3E7BC4}
.ti.bug{background:#C0392B} .ti.sub{background:#7B8794}
.pr{font-weight:800;font-size:11px;flex-shrink:0}
.pr.p1{color:#B4291F} .pr.p2{color:#D06B14} .pr.p3{color:#8A8F98} .pr.p4{color:#5C8AC4} .pr.p5{color:#8FA3B8}

/* ---------- board ---------- */
.board{display:flex;gap:10px;align-items:flex-start;min-height:100%}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:8px;width:284px;flex-shrink:0;
  display:flex;flex-direction:column;max-height:calc(100vh - 190px)}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col.wip-over{border-color:var(--risk)}
.col-h{padding:9px 11px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.col-h .nm{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink2);font-weight:600}
.col-h .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.col-h .ct.bad{color:var(--risk);font-weight:700}
.col-b{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:70px;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;
  cursor:grab;box-shadow:0 1px 1px rgba(20,22,26,.04)}
.card:hover{border-color:var(--ink3)}
.card.drag{opacity:.35}
.card .sum{margin:0 0 8px;font-size:13px;line-height:1.35}
.card .meta{display:flex;align-items:center;gap:7px}
.card .meta .k{color:var(--ink3)}
.card .c-plan{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-family:var(--mono);font-size:10.5px;
  color:var(--ink2);padding:3px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.card .c-plan.late{background:var(--risk-bg);border-color:var(--risk-line);color:var(--risk)}
.card .c-plan.done{background:var(--done-bg);border-color:var(--done-line);color:var(--done)}
.card .c-plan.future{color:var(--ink3)}
.card .c-dates{flex:1}
.card .c-days{color:var(--ink3);font-weight:600}
.card .c-plan.late .c-days{color:var(--risk)}
.card .c-late{font-weight:700}
.card .c-soon{color:var(--prog);font-weight:700}
.card .c-est{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10.5px;color:var(--ink3);margin-bottom:3px}
.card .c-est-l b{color:var(--ink2);font-size:11px}
.card .c-est-r.bad{color:var(--risk);font-weight:600}
.card .bar{height:3px;background:var(--track);border-radius:2px;margin:0;overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
.epic-tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:10px;font-weight:600;
  color:#fff;background:#6B4FBB;margin-bottom:6px}
.qa-btn{width:20px;height:20px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2);
  font-size:14px;line-height:1;display:grid;place-items:center;background:var(--surface)}
.qa-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.qadd{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:8px;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.qadd .inp{padding:5px 7px;font-size:12px}
.qa-row{display:flex;gap:5px;align-items:center}
.qa-row .inp{flex:1;min-width:0}
.qa-hint{flex:1;font-size:10px;color:var(--ink3);line-height:1.2}
.cbox{width:15px;height:15px;border:1.5px solid var(--line2);border-radius:4px;flex-shrink:0;
  display:grid;place-items:center;font-size:10px;color:#fff;background:var(--surface)}
.cbox:hover{border-color:var(--done);background:var(--done-bg)}
.cbox.on{background:var(--done);border-color:var(--done)}
.card.is-done .sum{text-decoration:line-through;color:var(--ink3)}
.card.is-done{opacity:.75}
.donehead{width:100%;text-align:left;padding:6px 8px;margin-top:4px;border-radius:var(--r);
  background:var(--surface);border:1px dashed var(--line2);color:var(--ink2);font-size:11.5px;
  display:flex;align-items:center;gap:6px}
.donehead:hover{border-color:var(--ink3)}
.donehead b{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.c-subs{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink3);margin-bottom:5px;cursor:pointer}
.c-subbar{flex:1;height:4px;background:var(--track);border-radius:2px;overflow:hidden}
.c-subbar i{display:block;height:100%;background:var(--done)}
.subsum{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);padding:6px 0}
.subsum b{color:var(--ink2);font-size:12px}
.sublist{max-height:260px;overflow:auto}
.bladd{display:flex;gap:6px;align-items:center;padding:8px 12px;background:var(--accent-soft);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.bladd .inp{flex:1;min-width:150px;padding:5px 8px}
.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.untimed{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;margin-bottom:8px;
  background:var(--surface2);border:1px solid var(--line);border-radius:6px}
.untimed .chip{cursor:pointer}
.daygrid{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dg-corner{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:38px}
.dg-head{display:flex;align-items:center;gap:5px;padding:0 8px;height:38px;font-size:12px;
  border-bottom:1px solid var(--line);border-right:1px solid var(--line);overflow:hidden}
.dg-head span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dg-head em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.dg-head b{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--accent)}
.dg-head.dim,.dg-col.dim{background:var(--surface2)}
.dg-col.dim .dg-slot{border-color:var(--line)}
.dg-hours{border-right:1px solid var(--line)}
.dg-h{height:34px;font-family:var(--mono);font-size:10px;color:var(--ink3);
  text-align:right;padding-right:6px;border-bottom:1px solid var(--line)}
.dg-col{position:relative;border-right:1px solid var(--line)}
.dg-slot{height:34px;border-bottom:1px solid var(--line)}
.hblk{position:absolute;left:3px;right:3px;border-radius:4px;color:#fff;font-size:10px;
  padding:2px 5px;overflow:hidden;cursor:pointer;line-height:1.25}
.hblk b{font-family:var(--mono)}
.hblk span{opacity:.85;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts.rp td[contenteditable]{padding:5px 7px;font-size:12px;border-right:1px solid var(--line);
  outline:none;vertical-align:top;text-align:left}
.ts.rp td[contenteditable]:focus{background:var(--accent-soft)}
.ts.rp th{text-align:left;padding-left:7px}
.ts.sm th{text-align:left;padding:6px}
.ts.sm td{padding:5px 6px;font-size:12px;text-align:right}
.ts.sm td.who{text-align:left}
.swim{margin-bottom:14px}
.swim-h{display:flex;align-items:center;gap:8px;padding:6px 2px;margin-bottom:6px;border-bottom:1px solid var(--line2)}
.swim-h b{font-size:12.5px}
.swim-h .ct{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}

/* ---------- backlog ---------- */
.sprintbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.sprintbox.over{border-color:var(--accent)}
.sprintbox.active{border-color:var(--accent);border-left:3px solid var(--accent)}
.sb-h{padding:10px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sb-h b{font-size:13.5px}
.sb-h .goal{color:var(--ink3);font-size:12px;font-style:italic}
.sb-h .dates{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.pill{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:10px;background:var(--todo-bg);color:var(--ink2)}
.pill.todo{background:var(--todo-bg);color:var(--todo)} .pill.prog{background:var(--prog-bg);color:var(--prog)}
.pill.done{background:var(--done-bg);color:var(--done)}
.row{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--line);cursor:grab}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface2)}
.row .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.drag{opacity:.35}
.empty{padding:16px 12px;color:var(--ink3);font-size:12px;text-align:center}

/* ---------- roadmap ---------- */
.rmwrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto}
.rm{border-collapse:collapse;width:100%;min-width:760px}
.rm th{position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line2);
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.06em;padding:8px 6px;text-align:center}
.rm th.lead{text-align:left;padding-left:12px;min-width:230px;border-right:1px solid var(--line)}
.rm td{border-bottom:1px solid var(--line);height:38px;padding:0}
.rm td.lead{padding:0 12px;border-right:1px solid var(--line)}
.rm.pl td{height:34px}
.rm.pl th.lead:nth-child(2),.rm.pl td.pl-dates{min-width:112px;text-align:center;color:var(--ink3);
  border-right:1px solid var(--line);font-size:11px}
.pl-track{position:relative;height:34px}
.pl-bar{position:absolute;top:8px;height:18px;border-radius:4px;color:#fff;font-size:10.5px;
  display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;min-width:6px}
.pl-bar i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.3)}
.pl-bar span{position:relative;overflow:hidden;text-overflow:ellipsis}
.pl-dim{position:absolute;top:0;bottom:0;background:var(--surface2);z-index:0}
.pl-none{position:absolute;left:6px;top:10px;font-size:10.5px;color:var(--ink3);font-style:italic}
.pl-group td{background:var(--surface2);height:30px!important}
.rm .track{position:relative;height:38px}
.gantt{position:absolute;top:9px;height:20px;border-radius:4px;background:#6B4FBB;color:#fff;
  font-size:10.5px;display:flex;align-items:center;padding:0 7px;overflow:hidden;white-space:nowrap}
.gantt i{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28)}
.today{position:absolute;top:0;bottom:0;width:1px;background:var(--risk);z-index:1}

/* ---------- timesheet ---------- */
.tswrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:auto}
.ts{border-collapse:collapse;width:100%;min-width:820px}
.ts th{background:var(--surface);border-bottom:1px solid var(--line2);padding:8px 6px;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.06em}
.ts th.who{text-align:left;padding-left:12px;min-width:170px;border-right:1px solid var(--line)}
.ts th.wknd{background:var(--surface2)}
.ts td{border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}
.ts td.who{text-align:left;padding:8px 12px;border-right:1px solid var(--line)}
.ts td.wknd{background:var(--surface2)}
.cell{width:100%;height:46px;display:grid;place-items:center;font-family:var(--mono);
  font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2);border-radius:3px}
.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
.cell.z{color:var(--line2)}
.ts tfoot td{background:var(--surface2);font-family:var(--mono);font-size:12px;font-weight:700;
  padding:8px 4px;border-top:1px solid var(--line2)}
.ts .tot{background:var(--surface2);font-weight:700}
.wl-list{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.wl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.wl:last-child{border-bottom:none}

/* ---------- reports ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h3{margin:0 0 2px;font-size:13.5px}
.panel .sub{color:var(--ink3);font-size:11.5px;margin-bottom:12px}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:12px}
.stat div b{display:block;font-family:var(--mono);font-size:21px;letter-spacing:-.03em;line-height:1.1}
.stat div span{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,22,26,.42);display:none;z-index:50;
  padding:28px 20px;overflow:auto}
.scrim.on{display:block}
.modal{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);max-width:960px;margin:0 auto;
  border:1px solid var(--line2);overflow:hidden}
.modal.narrow{max-width:520px}
.m-h{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
.m-h .x{margin-left:auto;font-size:20px;color:var(--ink3);line-height:1;padding:0 4px}
.m-h .x:hover{color:var(--ink)}
.m-b{display:grid;grid-template-columns:1fr 268px;gap:0}
.m-l{padding:16px 18px;min-width:0}
.m-r{padding:16px;background:var(--surface2);border-left:1px solid var(--line)}
.m-l h2{margin:0 0 14px;font-size:18px;letter-spacing:-.02em;line-height:1.3}
.sec{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--ink3);margin:18px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.desc{color:var(--ink2);white-space:pre-wrap;font-size:13px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:7px 8px;align-items:center;font-size:12.5px}
.kv .lb{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.timebar{height:7px;border-radius:4px;background:var(--track);overflow:hidden;display:flex;margin:6px 0 5px}
.timebar i{display:block;height:100%}
.timebar i.sp{background:var(--accent)} .timebar i.rm{background:#C7CBD1}
.tlegend{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.cmt{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.cmt:last-child{border-bottom:none}
.cmt .bd{flex:1;min-width:0}
.cmt .hd{font-size:11.5px;color:var(--ink3);margin-bottom:2px}
.cmt .hd b{color:var(--ink);font-size:12.5px}
.hist{font-size:12px;color:var(--ink2);padding:5px 0;border-bottom:1px dotted var(--line)}
.hist:last-child{border-bottom:none}
.hist .w{color:var(--ink3);font-family:var(--mono);font-size:10.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 10px}
.tabs button{padding:6px 11px;font-size:12px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.form-row{margin-bottom:11px}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--surface2)}

/* ana menü */
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:6px}
.hero h2{margin:0 0 4px;font-size:21px;letter-spacing:-.03em}
.hero p{margin:0;color:var(--ink2);font-size:13px}
.hero-week{display:flex;gap:5px;align-items:flex-end;height:58px}
.hw{width:22px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}
.hw i{display:block;width:100%;background:#C7CBD1;border-radius:3px 3px 0 0;min-height:2px}
.hw em{font-family:var(--mono);font-size:9px;color:var(--ink3);font-style:normal}
.today-box{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row-late{background:var(--risk-bg)}
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:10px;margin-bottom:4px}
.projgrid.wide{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.projcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:13px 14px;cursor:pointer;display:block;width:100%}
.projcard:hover{border-color:var(--ink3)}
.pc-h{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.pc-h b{font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-bar{height:4px;background:var(--track);border-radius:2px;overflow:hidden;margin-bottom:9px}
.pc-bar i{display:block;height:100%;background:var(--done)}
.pc-m{display:flex;align-items:center;gap:11px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.pc-m b{color:var(--ink);font-size:12.5px}
.pc-av{display:flex}
.pc-av .av{margin-left:-5px;box-shadow:0 0 0 1.5px var(--surface)}
.memchip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;border:1px solid var(--line2);
  border-radius:14px;font-size:12px;background:var(--surface);cursor:pointer}
.memchip:hover{border-color:var(--ink3)}
.memchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-d);font-weight:600}
.memchip em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.memchip.on em{color:var(--accent)}
.memchip:disabled{opacity:.6;cursor:default}
#login{position:fixed;inset:0;background:var(--paper);z-index:200;display:none;
  align-items:center;justify-content:center;padding:20px;overflow:auto}
body.locked .app{filter:blur(3px);pointer-events:none}
.loginbox{background:var(--surface);border:1px solid var(--line2);border-radius:12px;
  box-shadow:var(--shadow);padding:26px 26px 20px;width:100%;max-width:352px}
.lg-brand{margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lg-brand b{font-size:22px;letter-spacing:-.03em;display:block}
.lg-brand span{font-family:var(--mono);font-size:10px;color:var(--ink3);
  text-transform:uppercase;letter-spacing:.1em}
.lg-err{color:var(--risk);font-size:12px;min-height:16px;margin-top:8px}
.lg-note{margin-top:16px;padding:9px 11px;background:var(--warn-bg);border:1px solid var(--warn-line);
  border-radius:6px;font-size:11.5px;color:var(--warn-ink);line-height:1.5}
.lg-hint{margin-top:8px;font-size:11.5px;color:var(--ink3);line-height:1.7}
.lg-hint code,.lg-note code{font-family:var(--mono);font-size:11px;background:var(--surface2);
  padding:1px 4px;border-radius:3px;border:1px solid var(--line)}
.readonly .card,.readonly .row{cursor:default}
.whoami{padding:9px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.whoami .nm{flex:1;min-width:0;font-size:12px;line-height:1.25}
.whoami .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .nm span{font-size:10px;color:var(--ink3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:20px;font-size:12.5px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .vtabs{display:flex}
  .m-b{grid-template-columns:1fr}
  .m-r{border-left:none;border-top:1px solid var(--line)}
  .content{padding:12px 12px 40px}
  .topbar{padding:10px 12px 0}
  .vtabs{margin:10px -12px 0;padding:0 12px}
  .col{width:82vw;max-width:300px}
  .search{max-width:none}
  .modal{max-width:100%}
  .scrim{padding:10px}
}

/* ==========================================================================
   ÇevikPano tasarım dili v2 — sade, modern, açık + koyu tema
   Bu katman yukarıdaki temel stillerin üzerine yazar.
   ========================================================================== */
:root{
  --paper:#F6F7F9; --surface:#FFFFFF; --surface2:#F3F4F7; --surface3:#ECEEF2;
  --line:#E6E8EC; --line2:#D5D9E0;
  --ink:#0F172A; --ink2:#475569; --ink3:#8590A2;
  --accent:#4F46E5; --accent-d:#4338CA; --accent-soft:#EEF0FF; --accent-ink:#FFFFFF;
  --todo:#64748B; --prog:#C2610C; --done:#059669; --risk:#DC2626;
  --todo-bg:#F1F5F9; --todo-line:#E2E8F0;
  --prog-bg:#FFF4E5; --prog-line:#FCE1BD;
  --done-bg:#E8F8F1; --done-line:#BDEBD6;
  --risk-bg:#FEF1F1; --risk-line:#F9CFCF;
  --warn-bg:#FFF8E6; --warn-line:#F5E1A8; --warn-ink:#7A5300;
  --track:#E9ECF1;
  --sans:"Inter",ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px; --r-lg:12px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 16px -4px rgba(15,23,42,.08);
  --shadow-lg:0 24px 48px -12px rgba(15,23,42,.25),0 2px 6px rgba(15,23,42,.06);
  --ring:0 0 0 3px rgba(79,70,229,.18);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#0B0D12; --surface:#12151C; --surface2:#171B24; --surface3:#1E232E;
  --line:#232836; --line2:#303748;
  --ink:#E7E9EE; --ink2:#A7AFBF; --ink3:#6F788B;
  --accent:#7C83FF; --accent-d:#A3A8FF; --accent-soft:rgba(124,131,255,.14); --accent-ink:#0B0D12;
  --todo:#94A3B8; --prog:#F0A040; --done:#34D399; --risk:#F87171;
  --todo-bg:rgba(148,163,184,.12); --todo-line:rgba(148,163,184,.22);
  --prog-bg:rgba(240,160,64,.12); --prog-line:rgba(240,160,64,.25);
  --done-bg:rgba(52,211,153,.12); --done-line:rgba(52,211,153,.25);
  --risk-bg:rgba(248,113,113,.12); --risk-line:rgba(248,113,113,.28);
  --warn-bg:rgba(240,190,60,.10); --warn-line:rgba(240,190,60,.25); --warn-ink:#F0C870;
  --track:#262C3A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -6px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7);
  --ring:0 0 0 3px rgba(124,131,255,.28);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0D12; --surface:#12151C; --surface2:#171B24; --surface3:#1E232E;
    --line:#232836; --line2:#303748;
    --ink:#E7E9EE; --ink2:#A7AFBF; --ink3:#6F788B;
    --accent:#7C83FF; --accent-d:#A3A8FF; --accent-soft:rgba(124,131,255,.14); --accent-ink:#0B0D12;
    --todo:#94A3B8; --prog:#F0A040; --done:#34D399; --risk:#F87171;
    --todo-bg:rgba(148,163,184,.12); --todo-line:rgba(148,163,184,.22);
    --prog-bg:rgba(240,160,64,.12); --prog-line:rgba(240,160,64,.25);
    --done-bg:rgba(52,211,153,.12); --done-line:rgba(52,211,153,.25);
    --risk-bg:rgba(248,113,113,.12); --risk-line:rgba(248,113,113,.28);
    --warn-bg:rgba(240,190,60,.10); --warn-line:rgba(240,190,60,.25); --warn-ink:#F0C870;
    --track:#262C3A;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px -6px rgba(0,0,0,.5);
    --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7);
    --ring:0 0 0 3px rgba(124,131,255,.28);
    color-scheme:dark;
  }
}

body{font-size:13.5px;letter-spacing:-.006em;font-feature-settings:"cv11","ss01","ss03";background:var(--paper)}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid transparent;background-clip:content-box}

/* küçük başlıklar: mono yerine sade, aralıklı sans */
.navgroup,.crumb,label.field,.sec,.col-h .nm,.kv .lb,.ts th,.rm th,.stat div span,.lg-brand span,.whoami .nm span{
  font-family:var(--sans);letter-spacing:.04em;font-weight:600}
.k{font-family:var(--mono);font-size:11px;letter-spacing:0}

/* ---------- kabuk ---------- */
.app{grid-template-columns:240px 1fr}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-bottom:4px}
.brand{padding:18px 18px 14px;border-bottom:none;align-items:center;gap:10px}
.brand::before{content:"";width:26px;height:26px;border-radius:8px;flex-shrink:0;
  background:conic-gradient(from 200deg,#6366F1,#8B5CF6,#06B6D4,#6366F1);
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.0),0 2px 8px rgba(99,102,241,.35);
  -webkit-mask:radial-gradient(circle at 50% 50%,transparent 4px,#000 4.5px);mask:radial-gradient(circle at 50% 50%,transparent 4px,#000 4.5px)}
.brand b{font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.brand span{font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--ink3)}
.projsel{padding:4px 12px 8px}
.projsel select{padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:600}
.navgroup{padding:14px 20px 6px;font-size:10.5px;margin-top:0}
.nav a{padding:7px 10px;margin:1px 10px;border-radius:8px;color:var(--ink2);font-weight:500;transition:background .12s,color .12s}
.nav a .g{width:18px;font-size:14px;opacity:.7}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a.on .g{opacity:1}
.online{padding:0 0 4px}
.onl-row{display:flex;gap:4px;padding:2px 20px 6px;flex-wrap:wrap}
.onl{position:relative;display:inline-flex}
.onl::after{content:"";position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;
  background:#22C55E;box-shadow:0 0 0 2px var(--surface)}
.onl-more{font-size:11px;color:var(--ink3);align-self:center}
.whoami{margin:auto 10px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.filebar{border-top:none;padding:8px 14px 2px;margin-top:0}
.rail-foot{border-top:1px solid var(--line);margin-top:8px;padding:8px 10px}
.rail-foot button{font-size:11.5px;padding:5px 7px;border-radius:6px}

.main{background:var(--paper)}
.topbar{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:saturate(1.6) blur(10px);
  -webkit-backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line);padding:14px 24px 0;position:relative;z-index:5}
.tb-head{display:flex;align-items:flex-start;gap:16px}
.tb-title{flex:1;min-width:0}
.topbar h1{font-size:21px;font-weight:700;letter-spacing:-.028em}
.crumb{font-size:10.5px;color:var(--ink3);margin-bottom:2px}
.tb-actions{display:flex;align-items:center;gap:6px;padding-top:2px}
.tb-online{display:flex;margin-right:6px}
.tb-online .onl{margin-left:-6px}
.tb-online .onl .av{box-shadow:0 0 0 2px var(--surface)}
.iconbtn{position:relative;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2);
  border:1px solid var(--line);background:var(--surface);font-size:16px;transition:background .12s,border-color .12s,color .12s}
.iconbtn.sm{width:30px;height:30px;font-size:13px;border-radius:8px}
.iconbtn:hover{background:var(--surface2);color:var(--ink);border-color:var(--line2)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--risk);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface)}
.badge[hidden]{display:none}
.toolrow{padding:12px 0 12px;gap:8px}
.content{padding:20px 24px 48px}

/* ---------- kontroller ---------- */
.btn{border:1px solid var(--line2);background:var(--surface);padding:7px 12px;border-radius:9px;font-weight:550;
  box-shadow:var(--shadow-sm);transition:background .12s,border-color .12s,box-shadow .12s,transform .06s;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface2);border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink);
  box-shadow:0 1px 2px rgba(15,23,42,.1),inset 0 1px 0 rgba(255,255,255,.15)}
.btn.pri:hover{background:var(--accent-d);border-color:transparent}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{color:var(--risk);border-color:var(--risk-line);background:var(--surface)}
.btn.danger:hover{background:var(--risk-bg)}
.inp{border:1px solid var(--line2);background:var(--surface);padding:7px 10px;border-radius:9px;transition:border-color .12s,box-shadow .12s}
.inp:hover{border-color:color-mix(in srgb,var(--line2) 60%,var(--ink3))}
.inp:focus{border-color:var(--accent);box-shadow:var(--ring)}
.search::before{left:10px;top:7px}
.search .inp{padding-left:30px}
.seg{border-radius:9px;background:var(--surface2);border:1px solid var(--line);padding:2px;gap:2px}
.seg button{border:none!important;border-radius:7px;padding:5px 11px;font-weight:550}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
label.field{font-size:11px;text-transform:none;letter-spacing:0;color:var(--ink2);margin-bottom:5px}

/* ---------- avatar, etiket ---------- */
.av{width:24px;height:24px;font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:0}
.av.lg{width:32px;height:32px;font-size:12px}
.chip{border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600}
.pill{font-family:var(--sans);font-weight:600;border-radius:999px;padding:2px 8px}
.ti{border-radius:4px}

/* ---------- pano ---------- */
.board{gap:14px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:14px;width:296px}
.col.over{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--ring)}
.col-h{border-bottom:none;padding:12px 12px 6px}
.col-h .nm{font-size:11px;color:var(--ink2)}
.col-h .ct{font-family:var(--sans);font-weight:600;background:var(--surface3);color:var(--ink2);padding:1px 7px;border-radius:999px;font-size:11px}
.col-b{padding:6px 8px 10px;gap:8px}
.card{border-radius:11px;padding:11px 12px;border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:box-shadow .15s,transform .15s,border-color .15s}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow);transform:translateY(-1px)}
.card .sum{font-weight:550;font-size:13.2px;line-height:1.4}
.card .c-plan{border-radius:7px;background:var(--surface2);border-color:var(--line)}
.card .bar{height:4px;border-radius:4px}
.qa-btn{border-radius:7px;width:24px;height:24px}
.qadd{border-radius:11px;box-shadow:var(--shadow)}
.cbox{border-radius:5px}
.donehead{border-radius:9px}

/* ---------- liste / backlog ---------- */
.sprintbox,.rmwrap,.tswrap,.wl-list,.panel,.projcard,.hero,.daygrid,.untimed{border-radius:14px;border-color:var(--line);box-shadow:var(--shadow-sm)}
.sprintbox.active{border-left:3px solid var(--accent)}
.row{padding:9px 14px}
.row:hover{background:var(--surface2)}
.panel{padding:18px 20px}
.panel h3{font-size:15px;font-weight:650;letter-spacing:-.01em}
.stat div b{font-family:var(--sans);font-weight:700;font-size:24px;letter-spacing:-.03em}
.ts th,.rm th{background:var(--surface2);font-size:10.5px}
.ts.list td{text-align:left;padding:10px 8px}
.ts.list td.who{padding-left:12px}
.projcard{transition:box-shadow .15s,transform .15s}
.projcard:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--line2)}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface) 60%);padding:22px 24px}
.hero h2{font-size:23px;font-weight:700}
.hw i{background:var(--line2)}
.today-box{border-color:var(--accent);box-shadow:var(--ring)}

/* ---------- pencere ---------- */
.scrim{background:rgba(15,23,42,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:36px 20px}
.scrim.on{animation:fadeIn .14s ease-out}
.scrim.on .modal{animation:popIn .16s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.modal{border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.m-h{background:var(--surface);padding:14px 18px}
.m-l{padding:20px 22px}
.m-r{background:var(--surface2)}
.m-l h2{font-size:20px;font-weight:700;letter-spacing:-.025em}
.m-f{background:var(--surface2);padding:12px 18px}
.sec{font-size:10.5px;border-bottom-color:var(--line)}
.tabs button.on,.vtabs button.on{border-bottom-color:var(--accent)}
.watch{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);
  background:var(--done-bg);border:1px solid var(--done-line);border-radius:999px;padding:2px 9px 2px 3px}
.watch .av{width:18px;height:18px;font-size:8px}

/* ---------- bildirim paneli ---------- */
.pop{position:fixed;top:62px;right:20px;width:380px;max-width:calc(100vw - 24px);max-height:min(560px,calc(100vh - 90px));
  display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-lg);z-index:60;overflow:hidden;animation:popIn .14s ease-out}
.pop-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.pop-h b{font-size:14px}
.pop-b{overflow:auto}
.notif{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.notif:hover{background:var(--surface2)}
.notif.unread{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
.notif.unread .nt>span:first-child::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--accent);margin-right:6px;vertical-align:1px}
.nt{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:12.5px;flex:1}
.ni{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx{color:var(--ink3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nw{color:var(--ink3);font-size:11px}

/* ---------- etkinlik ---------- */
.act{display:flex;flex-direction:column}
.act-r{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
.act-w{width:84px;color:var(--ink3);font-size:11.5px;flex-shrink:0}
.act-op{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--todo-bg);color:var(--todo)}
.act-op.del{background:var(--risk-bg);color:var(--risk)}
.act-c{color:var(--ink3)}
.act-t{color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* ---------- kullanıcılar ---------- */
.ustats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ustat{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm)}
.ustat[data-uf]:hover{border-color:var(--line2)}
.ustat.on{border-color:var(--accent);box-shadow:var(--ring)}
.ustat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em}
.ustat span{font-size:11.5px;color:var(--ink3)}
.utable tbody tr.urow{cursor:pointer}
.utable tbody tr.urow:hover td{background:var(--surface2)}
.utable tr.off td{opacity:.6}
.ucell{display:flex;align-items:center;gap:10px}
.ucell b{font-weight:600}
.usub{font-size:11.5px;color:var(--ink3);font-weight:400}
.ucell .usub,.rolecard .usub,.pwshow .usub{display:block}
.chip.role-super{background:var(--risk-bg);color:var(--risk);border-color:var(--risk-line)}
.chip.role-admin{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.role-member{background:var(--done-bg);color:var(--done);border-color:var(--done-line)}
.chip.role-viewer{background:var(--todo-bg);color:var(--todo);border-color:var(--todo-line)}
.perm td.pc,.perm th{text-align:center}
.perm th.who,.perm td.who{text-align:left}
.perm .yes{color:var(--done);font-weight:700}
.perm .no{color:var(--line2)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.sw.on{border-color:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.rolecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rolecard{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.rolecard.on{border-color:var(--accent);box-shadow:var(--ring)}
.rolecard input{margin-top:3px}
.rolecard .usub{margin-top:4px}
.projchecks{display:flex;gap:6px;flex-wrap:wrap}
.projchecks .memchip input{margin:0 2px 0 4px}
.pwopts{display:flex;flex-direction:column;gap:6px;font-size:13px}
.ued-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.ued-actions .btn{justify-content:flex-start}
.pwshow{margin-top:6px;padding:10px;border:1px solid var(--done-line);background:var(--done-bg);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.pwline{display:flex;gap:8px;align-items:center}
.pwline code{font-family:var(--mono);font-size:14px;font-weight:600;background:var(--surface);border:1px solid var(--line);padding:4px 8px;border-radius:7px;user-select:all}
.modal .m-b.ued{grid-template-columns:1fr 300px}
@media (max-width:900px){
  .utable thead{display:none}
  .utable tr.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .utable tr.urow td{border:none;padding:0!important;text-align:left!important}
  .utable tr.urow td.who{grid-column:1/-1}
}

/* ---------- ortam şeridi ve sürümler ---------- */
.envbar{position:fixed;top:0;left:0;right:0;z-index:300;height:28px;display:flex;align-items:center;justify-content:center;gap:12px;
  background:repeating-linear-gradient(135deg,#F59E0B 0 14px,#F7B035 14px 28px);color:#1F1300;font-size:12px;font-weight:600;padding:0 12px;white-space:nowrap;overflow:hidden}
.envbar b{letter-spacing:.08em}
.envbar a{color:#1F1300;text-decoration:underline}
body.env-test .app{height:calc(100vh - 28px);margin-top:28px}
body.env-test #login{top:28px}
body.env-test .pop{top:90px}
.vgrid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin:14px 0}
.varrow{align-self:center;font-size:22px;color:var(--ink3)}
.vcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface2);display:flex;flex-direction:column;gap:6px;min-width:0}
.vcard.test{border-color:#F5C46A}
.vcard.prod{border-color:var(--done-line)}
.vc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vc-h a{margin-left:auto;font-size:12px;color:var(--accent);text-decoration:none}
.vc-dot{width:8px;height:8px;border-radius:50%;background:var(--done)}
.vcard.test .vc-dot{background:#F59E0B}
.vc-sha{display:flex;gap:10px;align-items:baseline;font-size:12px;color:var(--ink3)}
.vc-sha a{color:var(--accent)}
.vc-msg{font-size:13.5px;font-weight:550;overflow-wrap:anywhere}
.vc-f{font-size:11.5px;color:var(--ink3)}
.vnote{padding:9px 12px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);font-size:12.5px}
.vnote.ok{background:var(--done-bg);border-color:var(--done-line);color:var(--done)}
.vact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media (max-width:900px){.vgrid{grid-template-columns:1fr}.varrow{transform:rotate(90deg);justify-self:center}.envbar span{display:none}}

/* ---------- giriş ---------- */
#login{background:
  radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),
  radial-gradient(900px 500px at 110% 110%,color-mix(in srgb,#06B6D4 18%,transparent),transparent 60%),var(--paper)}
.loginbox{border-radius:20px;padding:32px 30px 26px;max-width:380px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.lg-brand{border-bottom:none;margin-bottom:22px;padding-bottom:0;display:flex;align-items:center;gap:12px}
.lg-brand::before{content:"";width:40px;height:40px;border-radius:12px;flex-shrink:0;
  background:conic-gradient(from 200deg,#6366F1,#8B5CF6,#06B6D4,#6366F1);
  -webkit-mask:radial-gradient(circle,transparent 6px,#000 6.5px);mask:radial-gradient(circle,transparent 6px,#000 6.5px)}
.lg-brand b{font-size:22px;font-weight:750}
.lg-brand span{font-size:11px;text-transform:none;letter-spacing:0}
.loginbox .inp{padding:10px 12px}
.loginbox .btn.pri{justify-content:center;padding:10px!important;font-size:14px}
.toast{border-radius:12px;padding:10px 16px;box-shadow:var(--shadow-lg);background:var(--ink);color:var(--paper);font-weight:500}

/* ---------- mobil ---------- */
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .main{min-width:0}
  .topbar{padding:12px 14px 0}
  .topbar h1{font-size:18px}
  .content{padding:14px 14px 48px}
  .vtabs{margin:10px -14px 0;padding:0 14px}
  .tb-online{display:none}
  .iconbtn{width:34px;height:34px}
  .pop{top:56px;right:12px}
  .col{width:84vw}
  .toolrow{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .toolrow::-webkit-scrollbar{display:none}
  .toolrow>*{flex-shrink:0}
  .scrim{padding:0}
  .modal{border-radius:0;min-height:100%;border:none}
  .m-l{padding:16px}
  .m-b{grid-template-columns:minmax(0,1fr)!important}
  .m-l,.m-r{min-width:0;overflow-wrap:anywhere}
  .form-2{grid-template-columns:1fr}
  .act-w{width:auto}
}
@media (prefers-reduced-motion:reduce){.card:hover,.projcard:hover{transform:none}}

/* ==========================================================================
   ÇevikPano tasarım dili v3 — mavi tonlar, lacivert kenar menü
   ========================================================================== */
:root{
  --paper:#F3F6FB; --surface:#FFFFFF; --surface2:#F6F9FD; --surface3:#EBF1F9;
  --line:#E1E8F2; --line2:#CCD7E6;
  --ink:#0B1B33; --ink2:#43546E; --ink3:#7E8CA3;
  --accent:#2563EB; --accent-d:#1D4ED8; --accent-soft:#EAF1FE; --accent-ink:#FFFFFF;
  --brand-grad:linear-gradient(135deg,#38BDF8 0%,#2563EB 52%,#1E3A8A 100%);
  --btn-grad:linear-gradient(180deg,#3B82F6,#2563EB);
  --ring:0 0 0 3px rgba(37,99,235,.20);
  --shadow-sm:0 1px 2px rgba(11,27,51,.05);
  --shadow:0 1px 2px rgba(11,27,51,.04),0 8px 20px -6px rgba(11,27,51,.10);
  --shadow-lg:0 30px 60px -15px rgba(11,27,51,.30),0 2px 6px rgba(11,27,51,.06);
  /* kenar menü */
  --rail-bg:linear-gradient(180deg,#0A1A38 0%,#0E2552 60%,#10306A 100%);
  --rail-ink:#C7D5EE; --rail-ink2:#7F96BF; --rail-line:rgba(255,255,255,.08);
  --rail-hover:rgba(255,255,255,.06); --rail-on:rgba(96,165,250,.18); --rail-on-ink:#FFFFFF;
}
:root[data-theme="dark"]{
  --paper:#060B16; --surface:#0C1424; --surface2:#101A2E; --surface3:#16223A;
  --line:#1B2842; --line2:#273857;
  --ink:#E6EDF8; --ink2:#A3B2CB; --ink3:#6B7C99;
  --accent:#60A5FA; --accent-d:#93C5FD; --accent-soft:rgba(96,165,250,.14); --accent-ink:#06101F;
  --btn-grad:linear-gradient(180deg,#60A5FA,#3B82F6);
  --ring:0 0 0 3px rgba(96,165,250,.28);
  --rail-bg:linear-gradient(180deg,#050A15 0%,#081530 100%);
  --rail-line:rgba(255,255,255,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#060B16; --surface:#0C1424; --surface2:#101A2E; --surface3:#16223A;
    --line:#1B2842; --line2:#273857;
    --ink:#E6EDF8; --ink2:#A3B2CB; --ink3:#6B7C99;
    --accent:#60A5FA; --accent-d:#93C5FD; --accent-soft:rgba(96,165,250,.14); --accent-ink:#06101F;
    --btn-grad:linear-gradient(180deg,#60A5FA,#3B82F6);
    --ring:0 0 0 3px rgba(96,165,250,.28);
    --rail-bg:linear-gradient(180deg,#050A15 0%,#081530 100%);
    --rail-line:rgba(255,255,255,.06);
  }
}

body{background:var(--paper)}
.main{background:
  radial-gradient(900px 420px at 100% -10%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 70%),
  var(--paper)}

/* ---------- kenar menü (lacivert) ---------- */
.rail{background:var(--rail-bg);border-right:none;color:var(--rail-ink)}
.brand{padding:18px 18px 16px}
.brand::before{display:none}
.brand-ic{width:30px;height:30px;border-radius:9px;flex-shrink:0;box-shadow:0 4px 14px rgba(37,99,235,.45)}
.brand-ic.lg{width:44px;height:44px;border-radius:13px}
.brand b{color:#fff;font-size:16px;letter-spacing:-.02em}
.projsel select{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff}
.projsel select option{color:#0B1B33}
.navgroup{color:var(--rail-ink2)}
.nav a{color:var(--rail-ink)}
.nav a .g{opacity:.75}
.nav a:hover{background:var(--rail-hover);color:#fff}
.nav a.on{background:var(--rail-on);color:var(--rail-on-ink);box-shadow:inset 3px 0 0 #60A5FA}
.nav a.on .g{color:#93C5FD}
.whoami{background:rgba(255,255,255,.06);border:1px solid var(--rail-line);color:#fff}
.whoami .nm span{color:var(--rail-ink2)}
.whoami .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;box-shadow:none}
.whoami .btn:hover{background:rgba(255,255,255,.14)}
.whoami .iconbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.fnote{color:var(--rail-ink2)}
.filebar .fnote:first-child{color:var(--rail-ink)}
.online .navgroup{color:var(--rail-ink2)}
.onl::after{box-shadow:0 0 0 2px #0E2552}
.rail .av{box-shadow:0 0 0 2px rgba(255,255,255,.12)}

/* ---------- üst çubuk ---------- */
.topbar{background:color-mix(in srgb,var(--surface) 78%,transparent)}
.topbar h1{font-size:22px;font-weight:750}
.cmdk{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface2);color:var(--ink3);font-size:12.5px;min-width:220px}
.cmdk:hover{border-color:var(--line2);color:var(--ink2)}
.cmdk span{flex:1;text-align:left}
.cmdk kbd{font-family:var(--sans);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink3)}

/* ---------- düğmeler ---------- */
.btn.pri{background:var(--btn-grad);box-shadow:0 1px 2px rgba(11,27,51,.12),0 4px 12px -2px color-mix(in srgb,var(--accent) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover{filter:brightness(1.06);background:var(--btn-grad)}
.seg button.on{color:var(--accent)}

/* ---------- pano ---------- */
.col{background:color-mix(in srgb,var(--surface2) 85%,var(--paper));border-color:var(--line)}
.col-h .nm{display:flex;align-items:center;gap:7px}
.col-h .nm::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--todo)}
.col.c-inprogress .col-h .nm::before{background:var(--prog)}
.col.c-done .col-h .nm::before{background:var(--done)}
.col{border-top:3px solid var(--todo-line)}
.col.c-inprogress{border-top-color:color-mix(in srgb,var(--prog) 55%,transparent)}
.col.c-done{border-top-color:color-mix(in srgb,var(--done) 55%,transparent)}
.card{border-radius:12px}
.card:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}

/* ---------- ana menü karşılama ---------- */
.hero{background:var(--brand-grad);border:none;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 14px 34px -14px rgba(37,99,235,.55)}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero h2{color:#fff}
.hero p{color:rgba(255,255,255,.86)}
.hero p b{color:#fff}
.hero .hw i{background:rgba(255,255,255,.45)}
.hero .hw em{color:rgba(255,255,255,.75)}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.28);color:#fff}

/* ---------- veri araçları ---------- */
.dtools{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.dtool{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.dtool span{font-size:12.5px;color:var(--ink2);flex:1}
.dtool .btn{align-self:flex-start}
.dtool.warn{border-color:var(--risk-line)}
.dt-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:var(--accent-soft);color:var(--accent)}
.dtool.warn .dt-ic{background:var(--risk-bg);color:var(--risk)}

/* ---------- giriş ---------- */
#login{background:var(--paper);padding:0}
.lg-wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);width:100%;min-height:100%}
.lg-hero{background:var(--brand-grad);color:#fff;padding:48px 56px;display:flex;flex-direction:column;gap:26px;
  justify-content:center;position:relative;overflow:hidden}
.lg-hero::before{content:"";position:absolute;inset:auto -120px -160px auto;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 60%)}
.lg-hero::after{content:"";position:absolute;inset:0;background:
  linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/32px 32px;
  mask:linear-gradient(180deg,#000,transparent 85%);-webkit-mask:linear-gradient(180deg,#000,transparent 85%)}
.lg-hero>*{position:relative;z-index:1;max-width:520px}
.lgh-brand{display:flex;align-items:center;gap:12px}
.lgh-brand b{font-size:20px;font-weight:750;letter-spacing:-.02em}
.lgh-brand .brand-ic{box-shadow:0 0 0 2px rgba(255,255,255,.35),0 10px 24px rgba(0,0,0,.25)}
.lg-hero h1{margin:0;font-size:38px;line-height:1.12;letter-spacing:-.035em;font-weight:800}
.lg-hero h1 span{color:#BFDBFE}
.lg-hero ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.lg-hero li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:rgba(255,255,255,.86);line-height:1.45}
.lg-hero li i{font-style:normal;width:32px;height:32px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
.lg-hero li b{color:#fff}
.lgh-foot{font-size:12px;color:rgba(255,255,255,.65)}
.lg-wrap .loginbox{align-self:center;justify-self:center;margin:32px;box-shadow:var(--shadow-lg)}
.lg-brand::before{display:none}
.lg-brand .brand-ic{display:none}
.lg-brand b{font-size:22px}
.lg-help{margin-top:12px;font-size:12px;color:var(--ink3);text-align:center}
#login > .loginbox .lg-brand .brand-ic{display:block}
.rail-foot[hidden]{display:none!important}
.whoami .nm span[style]{color:#FCA5A5!important}
.tb-logo{display:none;width:30px;height:30px;border-radius:9px;margin-right:10px;flex-shrink:0;box-shadow:0 3px 10px rgba(37,99,235,.35)}
@media (max-width:900px){
  .tb-logo{display:block}
  .tb-head{align-items:center}
  .lg-wrap{grid-template-columns:1fr}
  .lg-hero{padding:28px 22px 26px;gap:14px}
  .lg-hero h1{font-size:24px}
  .lg-hero ul,.lgh-foot{display:none}
  .lg-wrap .loginbox{margin:-18px 16px 24px;width:auto;max-width:none;justify-self:stretch}
  .cmdk span,.cmdk kbd{display:none}
  .cmdk{min-width:0;width:34px;height:34px;padding:0;justify-content:center}
}

/* ==========================================================================
   Sol menü v4 — beyaz + mavi vurgu (docs/tasarim/sol-menu, seçenek C)
   ========================================================================== */
:root{
  --rail-bg:#FFFFFF; --rail-ink:#334155; --rail-ink2:#94A3B8; --rail-line:#E5EAF2;
  --rail-hover:#F3F7FD; --rail-on:#EAF2FF; --rail-on-ink:#1D4ED8; --rail-icon:#3B82F6; --rail-bar:#2563EB;
  --rail-field:#F3F7FD;
}
:root[data-theme="dark"]{
  --rail-bg:#0C1424; --rail-ink:#C3CEE0; --rail-ink2:#5F6F8C; --rail-line:#1B2842;
  --rail-hover:#121D33; --rail-on:rgba(96,165,250,.14); --rail-on-ink:#BFDBFE; --rail-icon:#60A5FA; --rail-bar:#60A5FA;
  --rail-field:#101A2E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --rail-bg:#0C1424; --rail-ink:#C3CEE0; --rail-ink2:#5F6F8C; --rail-line:#1B2842;
    --rail-hover:#121D33; --rail-on:rgba(96,165,250,.14); --rail-on-ink:#BFDBFE; --rail-icon:#60A5FA; --rail-bar:#60A5FA;
    --rail-field:#101A2E;
  }
}
.rail{background:var(--rail-bg);color:var(--rail-ink);border-right:1px solid var(--rail-line)}
.brand b{color:var(--ink)}
.projsel select{background:var(--rail-field);border:1px solid var(--rail-line);color:var(--ink)}
.navgroup{color:var(--rail-ink2)}
.nav a{color:var(--rail-ink);gap:11px;padding:8px 10px}
.nav a svg.g{width:18px;height:18px;flex-shrink:0;fill:none;stroke:var(--rail-icon);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;opacity:1}
.nav a:hover{background:var(--rail-hover);color:var(--ink)}
.nav a.on{background:var(--rail-on);color:var(--rail-on-ink);box-shadow:inset 3px 0 0 var(--rail-bar);font-weight:600}
.nav a.on svg.g{stroke:var(--rail-bar)}
.whoami{background:var(--surface2);border:1px solid var(--rail-line);color:var(--ink)}
.whoami .nm span{color:var(--ink3)}
.whoami .nm span[style]{color:var(--risk)!important}
.whoami .btn{background:var(--surface);border-color:var(--line2);color:var(--ink);box-shadow:var(--shadow-sm)}
.whoami .btn:hover{background:var(--surface2)}
.whoami .iconbtn{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.fnote{color:var(--ink3)}
.filebar .fnote:first-child{color:var(--ink2)}
.online .navgroup{color:var(--rail-ink2)}
.onl::after{box-shadow:0 0 0 2px var(--rail-bg)}
.rail .av{box-shadow:none}

/* ==========================================================================
   Kart v5 — modern pano kartı ve 4 seviyeli öncelik (docs/tasarim/kart, issue #8)
   ========================================================================== */
:root{
  --meta:#64748B;
  --late:#B91C1C; --today:#B45309; --ok:#15803D; --over:#B45309;
  --p-acil:#B91C1C;   --p-acil-bg:#FEF2F2;   --p-acil-ln:#FECACA;
  --p-yuksek:#C2410C; --p-yuksek-bg:#FFF7ED; --p-yuksek-ln:#FED7AA;
  --p-orta:#41587A;   --p-orta-bg:#EEF2F7;   --p-orta-ln:#D3DCE8;
  --p-dusuk:#64748B;  --p-dusuk-bg:#F8FAFC;  --p-dusuk-ln:#E5E9F0;
  --c-track:#E6ECF4;
}
:root[data-theme="dark"]{
  --meta:#8494AE; --late:#F87171; --today:#FBBF24; --ok:#34D399; --over:#FBBF24;
  --p-acil:#FCA5A5;   --p-acil-bg:rgba(248,113,113,.14);  --p-acil-ln:rgba(248,113,113,.30);
  --p-yuksek:#FDBA74; --p-yuksek-bg:rgba(251,146,60,.14); --p-yuksek-ln:rgba(251,146,60,.30);
  --p-orta:#B4C2D8;   --p-orta-bg:rgba(148,163,184,.14);  --p-orta-ln:rgba(148,163,184,.28);
  --p-dusuk:#8A97AB;  --p-dusuk-bg:rgba(148,163,184,.06); --p-dusuk-ln:rgba(148,163,184,.18);
  --c-track:#1E2B45;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --meta:#8494AE; --late:#F87171; --today:#FBBF24; --ok:#34D399; --over:#FBBF24;
    --p-acil:#FCA5A5;   --p-acil-bg:rgba(248,113,113,.14);  --p-acil-ln:rgba(248,113,113,.30);
    --p-yuksek:#FDBA74; --p-yuksek-bg:rgba(251,146,60,.14); --p-yuksek-ln:rgba(251,146,60,.30);
    --p-orta:#B4C2D8;   --p-orta-bg:rgba(148,163,184,.14);  --p-orta-ln:rgba(148,163,184,.28);
    --p-dusuk:#8A97AB;  --p-dusuk-bg:rgba(148,163,184,.06); --p-dusuk-ln:rgba(148,163,184,.18);
    --c-track:#1E2B45;
  }
}
svg.i{width:14px;height:14px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- kart ---- */
.card{position:relative;padding:12px 12px 10px;border-radius:12px}
.card .sum{margin:0 0 8px;font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.005em;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-right:4px}
.card.is-done{opacity:1;background:color-mix(in srgb,var(--surface) 70%,var(--surface2))}
.card.is-done .sum{text-decoration:none;color:var(--meta);font-weight:550}
.card .epic-tag{margin-bottom:8px}

.c-tags{display:flex;gap:4px;margin:0 0 8px;flex-wrap:wrap;min-width:0}
.c-tag{font-size:10.5px;font-weight:550;color:var(--ink2);background:var(--surface3);border-radius:6px;padding:2px 7px;
  display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-tag i{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}

.c-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--meta);flex-wrap:wrap;row-gap:4px;min-height:24px;white-space:nowrap}
.c-sep{width:3px;height:3px;border-radius:50%;background:var(--line2);flex-shrink:0}
.c-due{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.c-due.d-late{color:var(--late);font-weight:650}
.c-due.d-today{color:var(--today);font-weight:650}
.c-due.d-ok{color:var(--ok);font-weight:600}
.c-est{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;margin-left:auto}
.c-est .b{width:30px;height:4px;border-radius:4px;background:var(--c-track);overflow:hidden}
.c-est .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.c-est.e-over{color:var(--over)} .c-est.e-over .b i{background:var(--over)}
.c-est.e-full .b i{background:var(--ok)}

/* öncelik rozeti: kartta ikon + metin (tıklanabilir) */
.prio{position:relative;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px 0 5px;border-radius:7px;
  font-size:11px;font-weight:650;border:1px solid transparent;font-family:inherit;flex-shrink:0;line-height:1}
button.prio{cursor:pointer}
button.prio::after{content:"";position:absolute;inset:-7px -3px}
button.prio:hover{filter:brightness(.97)}
.prio svg.i{width:13px;height:13px;stroke-width:2.2}
.prio.acil{color:var(--p-acil);background:var(--p-acil-bg);border-color:var(--p-acil-ln)}
.prio.yuksek{color:var(--p-yuksek);background:var(--p-yuksek-bg);border-color:var(--p-yuksek-ln)}
.prio.orta{color:var(--p-orta);background:var(--p-orta-bg);border-color:var(--p-orta-ln)}
.prio.dusuk{color:var(--p-dusuk);background:var(--p-dusuk-bg);border-color:var(--p-dusuk-ln)}
.prio.open{box-shadow:var(--ring)}
/* dar alanlar: yalnız ikon */
.pr{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;border:1px solid transparent;flex-shrink:0}
.pr svg.i{width:13px;height:13px;stroke-width:2.2}
.pr.acil{color:var(--p-acil);background:var(--p-acil-bg);border-color:var(--p-acil-ln)}
.pr.yuksek{color:var(--p-yuksek);background:var(--p-yuksek-bg);border-color:var(--p-yuksek-ln)}
.pr.orta{color:var(--p-orta);background:var(--p-orta-bg);border-color:var(--p-orta-ln)}
.pr.dusuk{color:var(--p-dusuk);background:var(--p-dusuk-bg);border-color:var(--p-dusuk-ln)}

/* alt satır */
.c-foot{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.c-foot .ti{width:18px;height:18px;border-radius:5px;font-size:10px}
.c-key{font-size:11px;font-weight:500;color:var(--meta)}
.c-sub{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10.5px;color:var(--meta);
  padding:1px 6px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.c-sub svg.i{width:12px;height:12px}
.c-av{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;
  font-size:9.5px;letter-spacing:.02em;flex-shrink:0;border:0;padding:0;font-family:var(--sans);box-shadow:0 0 0 2px var(--surface)}
button.c-av{cursor:pointer}
button.c-av::after{content:"";position:absolute;inset:-6px}
.c-av.none{background:transparent;color:var(--meta);border:1.5px dashed var(--line2);box-shadow:none}
.c-av.none svg.i{width:12px;height:12px}
.c-av.open{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}

/* tamamla: masaüstünde üzerine gelince, dokunmatik/dar ekranda her zaman */
.c-tick{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);
  background:var(--surface);display:grid;place-items:center;color:var(--meta);padding:0;opacity:0;transition:opacity .12s,color .12s,border-color .12s}
.c-tick svg.i{width:12px;height:12px;stroke-width:2.2}
.c-tick:hover{color:var(--ok);border-color:var(--ok)}
.c-tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.card:hover .c-tick,.card:focus-within .c-tick{opacity:1}
.card:hover .sum,.card:focus-within .sum{padding-right:30px}
@media (hover:none),(max-width:900px){
  .c-tick{opacity:1}
  .card .sum{padding-right:30px}
}

/* ---- hızlı menüler ---- */
.qm{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);
  padding:6px;width:220px;max-height:min(440px,calc(100vh - 16px));overflow:auto;color:var(--ink)}
.qm.as{width:260px}
.qm-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--meta);padding:6px 8px}
.qm-opt{display:flex;align-items:center;gap:9px;width:100%;min-height:36px;padding:4px 8px;border-radius:8px;font-size:13px;
  color:var(--ink);text-align:left;background:none;border:0}
.qm-opt:hover,.qm-opt:focus-visible{background:var(--surface3);outline:none}
.qm-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.qm-sub{display:block;font-size:11px;color:var(--meta);font-weight:400}
.qm-chk{color:var(--accent);display:inline-flex}
.qm-chk svg.i{width:16px;height:16px;stroke-width:2.2}
.qm .kbd{font-family:var(--mono);font-size:10.5px;color:var(--meta);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:17px}
.qm-ic.prio{padding:0;width:22px;height:22px;justify-content:center}
.qm .c-av{width:26px;height:26px;font-size:10px;box-shadow:none}
.qm hr{border:0;border-top:1px solid var(--line);margin:6px 2px}
.qm-q{display:flex;align-items:center;gap:8px;margin:2px 2px 6px;height:36px;padding:0 10px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surface);color:var(--meta)}
.qm-q:focus-within{border-color:var(--accent);box-shadow:var(--ring)}
.qm-in{flex:1;min-width:0;border:0;outline:none;background:none;font-size:13px;color:var(--ink);padding:0}
.qm-empty{padding:10px 8px;font-size:12.5px;color:var(--meta)}
.qm-grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:2px auto 10px}
.qm-ttl{font-size:14px;font-weight:700;padding:0 6px 6px}
.qm-ttl small{display:block;font-weight:500;font-size:12px;color:var(--meta);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qm-dim{position:fixed;inset:0;z-index:119;background:rgba(11,27,51,.38)}
:root[data-theme="dark"] .qm-dim{background:rgba(0,0,0,.55)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .qm-dim{background:rgba(0,0,0,.55)} }
.qm-wrap.sheet .qm{left:0;right:0;bottom:0;top:auto;width:auto;max-height:80vh;border-radius:18px 18px 0 0;
  border-bottom:0;padding:8px 12px calc(16px + env(safe-area-inset-bottom))}
.qm-wrap.sheet .qm-opt{min-height:48px;font-size:14px}
.qm-wrap.sheet .kbd{display:none}
@media (max-width:640px){
  .card .sum{font-size:14px}
  .prio{height:26px;font-size:11.5px}
  .c-av{width:28px;height:28px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){.c-tick{transition:none}}
/* ==========================================================================
   Benim işlerim (hm-) ve eylemli bildirim — docs/tasarim/benim-islerim, issue #9
   ========================================================================== */
:root{ --late-bg:#FEF2F2; --today-bg:#FFF7ED; --toast-act:#93C5FD; --toast-ok:#4ADE80; --toast-warn:#FCA5A5; }
:root[data-theme="dark"]{ --late-bg:rgba(248,113,113,.12); --today-bg:rgba(251,191,36,.12);
  --toast-act:#1D4ED8; --toast-ok:#15803D; --toast-warn:#B91C1C; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --late-bg:rgba(248,113,113,.12); --today-bg:rgba(251,191,36,.12);
    --toast-act:#1D4ED8; --toast-ok:#15803D; --toast-warn:#B91C1C; }
}
/* bildirim en alttaki satırı örtmesin */
.main .content{padding-bottom:96px}
.hm-c{container:hm / inline-size}

/* proje süzgeci */
.hm-filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.hm-filter .lbl{font-size:12px;font-weight:600;color:var(--meta);margin-right:4px;background:none}
.hm-pf{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);
  background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:550;max-width:100%;min-width:0}
.hm-pf span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-pf .n{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--meta)}
.hm-pf:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line2))}
.hm-pf.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent-d)}
.hm-pf.on .n{color:var(--accent-d)}

/* üst özet */
.hm-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.hm-stat{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm);min-width:0}
.hm-stat-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.hm-stat-ic svg.i{width:19px;height:19px}
.hm-stat-b{min-width:0;flex:1}
.hm-stat-l{font-size:12px;font-weight:600;color:var(--ink2)}
.hm-stat-l span{font-weight:500;color:var(--meta)}
.hm-stat-v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--ink)}
.hm-stat-v small{font-size:13px;font-weight:600;color:var(--meta);letter-spacing:0}
.hm-stat-s{font-size:11.5px;color:var(--meta);margin-top:1px}
.hm-stat.is-late .hm-stat-ic{background:var(--late-bg);color:var(--late)}
.hm-stat.is-late .hm-stat-v{color:var(--late)}
.hm-stat.is-zero .hm-stat-ic{background:var(--surface3);color:var(--ok)}
.hm-cap{display:flex;align-items:center;gap:8px;margin-top:6px}
.hm-bar{flex:1;height:6px;border-radius:6px;background:var(--c-track);overflow:hidden}
.hm-bar i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.hm-bar.over i{background:var(--over)}
.hm-cap b{font-family:var(--mono);font-size:11.5px;font-weight:650;color:var(--accent-d)}

/* grup */
.hm-grp{margin-top:18px}
.hm-gh{display:flex;align-items:center;gap:8px;margin:0;padding:0 4px 8px;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.005em}
.hm-gh svg.i{width:16px;height:16px;color:var(--meta)}
.hm-gh .n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink2);background:var(--surface3);padding:1px 8px;border-radius:999px}
.hm-gh .d{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--meta)}
.hm-grp.g-late .hm-gh{color:var(--late)}
.hm-grp.g-late .hm-gh svg.i{color:var(--late)}
.hm-grp.g-late .hm-gh .n{background:var(--late-bg);color:var(--late)}
.hm-grp.g-today .hm-gh svg.i{color:var(--today)}
.hm-grp.g-week .hm-gh svg.i,.hm-grp.g-later .hm-gh svg.i{color:var(--accent)}
.hm-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
.hm-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:40px;border:0;border-top:1px solid var(--line);
  background:var(--surface2);color:var(--accent-d);font-size:12.5px;font-weight:600}

/* iş satırı — masaüstü tek sıra; dar kapta 3 kat */
.hm-row{display:grid;grid-template-columns:40px minmax(0,1fr) 78px 120px 116px 276px;align-items:center;column-gap:12px;
  min-height:60px;padding:8px 14px 8px 6px;border-bottom:1px solid var(--line);position:relative}
.hm-row:last-child{border-bottom:0}
.hm-row:hover{background:color-mix(in srgb,var(--surface2) 70%,var(--surface))}
.hm-tick{width:40px;height:40px;border:0;background:none;padding:0;display:grid;place-items:center;border-radius:10px;color:transparent}
.hm-tick::before{content:"";grid-area:1/1;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface)}
.hm-tick svg.i{grid-area:1/1;width:12px;height:12px;stroke-width:2.4;z-index:1}
.hm-tick:hover::before,.hm-tick:focus-visible::before{border-color:var(--ok)} .hm-tick:hover,.hm-tick:focus-visible{color:var(--ok)}
.hm-main{min-width:0}
.hm-t{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;cursor:pointer}
.hm-t:hover{color:var(--accent-d);text-decoration:underline;text-underline-offset:2px}
.hm-sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11.5px;color:var(--meta);white-space:nowrap;min-width:0}
.hm-sub .k{font-family:var(--mono);font-size:11px;font-weight:500}
.hm-sub .pj{display:inline-flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hm-sub .pj svg.i,.hm-sub .rem svg.i,.hm-sub .blk svg.i{width:12px;height:12px}
.hm-sub .rem{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px}
.hm-sub .blk{display:inline-flex;align-items:center;gap:4px;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.hm-sub .blk .k{color:var(--accent-d)}
.hm-sep{width:3px;height:3px;border-radius:50%;background:var(--line2);flex-shrink:0}
.hm-meta{display:contents}
.hm-meta .prio{justify-self:start}
.hm-due{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap}
.hm-due svg.i{width:14px;height:14px;color:var(--meta)}
.hm-due.d-late{color:var(--late);font-weight:650} .hm-due.d-late svg.i{color:var(--late)}
.hm-due.d-today{color:var(--today);font-weight:650} .hm-due.d-today svg.i{color:var(--today)}
.hm-due.d-none{color:var(--meta)}
.hm-st{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  color:var(--ink2);background:var(--surface2);border:1px solid var(--line);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;justify-self:start}
.hm-st i{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--todo)}
.hm-st.s-inprogress i{background:var(--prog)}
.hm-st.s-done i{background:var(--done)}
.hm-act{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0}
.hm-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 11px;border-radius:9px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap;min-width:0}
.hm-btn span{overflow:hidden;text-overflow:ellipsis}
.hm-btn svg.i{width:15px;height:15px;color:var(--accent)}
.hm-btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2));background:var(--accent-soft)}
.hm-adv{max-width:144px}
.hm-adv.to-done svg.i{color:var(--ok)}
.hm-adv.none{visibility:hidden}

/* izleyici */
.hm-ro-note{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:6px;font-size:12px;color:var(--ink2);background:var(--surface2);
