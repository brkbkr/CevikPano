   Bölüm 14: SÜPER YÖNETİCİ • ARŞİV • TAMAMLAMA • ALT İŞ
             SAATLİK EFOR • DÜZENLENEBİLİR RAPOR
   ============================================================ */

/* ---------- roller ---------- */
const isSuper = () => role() === 'super';
const canAdmin = () => role() === 'admin' || isSuper();
/* Kalan tahmine yalnızca yönetici müdahale eder. */
const canRemaining = () => canAdmin();

function ensureSuper() {
  ROLES.super = ['Süper Yönetici', 'Sınırsız yetki; arşivlenmiş ve üye olmadığı her şeyi görür'];
  if (!DB.users.some(u => u.role === 'super')) {
    const salt = uid('s');
    DB.users.unshift({ id: uid('u'), name: 'Süper Yönetici', username: 'root', role: 'super',
      ini: 'SY', color: '#14161A', capacity: 0, active: true,
      salt, pw: pwHash(DEFAULT_PW, salt), mustChange: true, system: true });
  }
}

/* ---------- arşiv ---------- */
function ensureArchive() { DB.projects.forEach(p => { if (p.archived === undefined) p.archived = false; }); }
const liveProjects = () => DB.projects.filter(p => isSuper() || !p.archived);
const canSeeProject = p => isSuper() || (!p.archived && isMember(p));

function toggleArchive(pid) {
  const p = DB.projects.find(x => x.id === pid);
  if (p.archived) { p.archived = false; save(); render(); return toast(p.name + ' yeniden etkinleştirildi'); }
  if (liveProjects().filter(x => !x.archived).length < 2) return toast('Son etkin proje arşivlenemez');
  p.archived = true;
  if (DB.ui.project === pid) DB.ui.project = DB.projects.find(x => !x.archived).id;
  save(); startApp(); toast(p.name + ' arşivlendi');
}

/* ---------- proje kodu (kullanıcıya sorulmaz) ---------- */
function projCode(name, taken) {
  const words = String(name).split(/\s+/).filter(Boolean);
  let base = (words.length > 1 ? words.map(x => slugName(x)[0] || '').join('') : slugName(words[0] || ''))
    .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4) || 'PRJ';
  let c = base, n = 2;
  while (taken.has(c)) c = base.slice(0, 3) + n++;
  return c;
}

/* ---------- alt iş toplaması ---------- */
const kidsOf = id => DB.issues.filter(x => x.parentId === id);
const rollSpent = i => (i.spent || 0) + kidsOf(i.id).reduce((a, k) => a + (k.spent || 0), 0);
const rollEstimate = i => (i.estimate || 0) + kidsOf(i.id).reduce((a, k) => a + (k.estimate || 0), 0);
const rollRemaining = i => remaining(i) + kidsOf(i.id).reduce((a, k) => a + remaining(k), 0);

/* ---------- tamamlama ---------- */
/* İşin kendi projesinin durumları (seçili proje değil): ana ekran tüm projelerin işlerini gösterir. */
const statsOf = pid => DB.statuses.filter(s => s.projectId === pid).sort((a, b) => a.ord - b.ord);
const doneStatus = (pid = DB.ui.project) => statsOf(pid).find(s => s.cat === 'done');
/* undo: ana ekrandan çağrılınca "Geri al" düğmeli bildirim (iş ve tamamlanan alt işleri geri döner). */
function completeIssue(id, undo = false) {
  const i = issue(id); if (!i) return;
  const ds = doneStatus(i.projectId);
  if (!ds) return toast('Bu projede "Bitti" kategorisinde durum yok');
  if (stat(i.statusId).cat === 'done') return;
  const prev = [{ id: i.id, f: 'statusId', was: i.statusId, now: ds.id, df: true }], as0 = i.assignee || null;
  i.doneFrom = i.statusId;
  setStatus(i, ds.id);
  prev[0].now = i.statusId;                               // otomasyon durumu değiştirmiş olabilir
  if ((i.assignee || null) !== as0) prev.push({ id: i.id, f: 'assignee', was: as0, now: i.assignee || null });
  kidsOf(i.id).forEach(k => { if (stat(k.statusId).cat !== 'done') {
    prev.push({ id: k.id, f: 'statusId', was: k.statusId, now: ds.id, df: true }); k.doneFrom = k.statusId; setStatus(k, ds.id); } });
  save(); render();
  if (undo) homeUndo(`${i.key} ${ds.name} olarak işaretlendi.`, prev); else toast(i.key + ' tamamlandı');
}
function reopenIssue(id) {
  const i = issue(id); if (!i) return;
  const first = statsOf(i.projectId)[0];
  const back = i.doneFrom && stat(i.doneFrom) ? i.doneFrom : first?.id;
  if (!back) return;
  delete i.doneFrom;
  setStatus(i, back);
  save(); render(); toast(i.key + ' yeniden açıldı');
}
/* Bir kolonun kartları: tamamlananlar, tamamlandığı kolonun altında kalır. */
const colOf = i => (i.doneFrom && stat(i.doneFrom)) ? i.doneFrom : i.statusId;

      ${edit ? `<button class="btn danger" id="w_del">Sil</button>` : ''}
      <span class="spacer"></span>
      <button class="btn" data-close>Vazgeç</button>
      <button class="btn pri" id="doWork">${edit ? 'Kaydet' : 'Ekle'}</button></div>`, 'narrow');

  const adjEl = $('#w_adj');
  const preview = () => {
    const i = issue($('#w_i').value); if (!i) return;
    const h = parseDur($('#w_h').value);
    const a = adjEl ? adjEl.value : 'auto';
    if (adjEl) $('#w_adjv').style.display = (a === 'set' || a === 'reduce') ? 'block' : 'none';
    const base = edit ? remaining(i) + (edit.issueId === i.id ? 0 : 0) : remaining(i);
    const after = nextRemaining(i, h, a, adjEl ? parseDur($('#w_adjv').value) : 0);
    $('#w_prev').innerHTML = `Tahmin <b class="num">${fmtDur(i.estimate)}</b> ·
      harcanan <b class="num">${fmtDur(i.spent)}</b> → <b class="num">${fmtDur((i.spent || 0) - (edit ? edit.hours : 0) + h)}</b> ·
      kalan <b class="num">${fmtDur(base)}</b> → <b class="num" style="color:var(--accent)">${fmtDur(after)}</b>
      ${canRemaining() ? '' : '<br><span style="color:var(--ink3)">Kalan tahmin otomatik azalır; değiştirme yetkisi yöneticidedir.</span>'}`;
  };
  ['#w_i', '#w_h', '#w_adj', '#w_adjv'].forEach(s => { const e = $(s); if (e) { e.oninput = preview; e.onchange = preview; } });
  preview();

  const del = $('#w_del'); if (del) del.onclick = () => {
    const i = issue(edit.issueId);
    i.spent = Math.max(0, (i.spent || 0) - edit.hours);
    if (!edit.adj || edit.adj === 'auto') i.remainingEst = remaining(i) + edit.hours;
    DB.worklogs = DB.worklogs.filter(x => x.id !== edit.id);
    closeModal(); save(); render(); toast('Kayıt silindi');
  };

  $('#doWork').onclick = () => {
    const h = parseDur($('#w_h').value);
    const note = $('#w_c').value.trim();
    const err = m => $('#w_err').textContent = m;
    if (!h) return err('Geçerli bir süre girin, örn. 3h 30m');
    if ($('#w_d') && !/^\d{4}-\d{2}-\d{2}$/.test($('#w_d').value)) return err('Tarih seçin');
    if (!note) return err('Not zorunludur — yapılan işi kısaca yazın.');
    const i = issue($('#w_i').value);
    if (!i) return err('İş seçilmedi');
    const adj = adjEl ? adjEl.value : 'auto';
    const adjv = adjEl ? parseDur($('#w_adjv').value) : 0;

    if (edit) {
      const old = issue(edit.issueId);
      old.spent = Math.max(0, (old.spent || 0) - edit.hours);
      if (!edit.adj || edit.adj === 'auto') old.remainingEst = remaining(old) + edit.hours;
      Object.assign(edit, { issueId: i.id, date: $('#w_d').value, time: $('#w_t').value || '',
        hours: h, comment: note, adj, userId: $('#w_u') ? $('#w_u').value : edit.userId });
      i.remainingEst = nextRemaining(i, h, adj, adjv);
      i.spent = (i.spent || 0) + h;
      logHist(i, 'Süre kaydı', 'düzenlendi', `${fmtDur(h)} · ${$('#w_d').value}`);
    } else {
      i.remainingEst = nextRemaining(i, h, adj, adjv);
      DB.worklogs.push({ id: uid('w'), issueId: i.id, userId: CU().id, date: $('#w_d').value,
        time: $('#w_t').value || '', hours: h, comment: note, adj });
      i.spent = (i.spent || 0) + h;
    }
    closeModal(); save(); render();
    toast(`${fmtDur(h)} · ${i.key}${i.parentId ? ' (ana işe yansıdı)' : ''}`);
  };
}

/* ============================================================
   ÇİZELGE — SAATLİK GÜN GÖRÜNÜMÜ
   ============================================================ */
const HOUR_FROM = 8, HOUR_TO = 20;
/* Çizelge varsayılan olarak tüm görünür projeleri kapsar; tek projeye
   indirmek isteyen üstteki anahtarı kullanır. */
const tsAllMode = () => DB.ui.tsAll !== false;
const tsScopeOk = w => {
  const i = issue(w.issueId); if (!i) return false;
  if (!tsAllMode()) return i.projectId === DB.ui.project;
  const p = DB.projects.find(x => x.id === i.projectId);
  return !!p && canSeeProject(p);
};
const projName = id => DB.projects.find(p => p.id === id)?.name || '—';
/* Tüm projeler kapsamında herkes, tek proje kapsamında o projenin üyeleri.
   Sistem kullanıcısı (süper yönetici) çizelgede yer almaz. */
const tsUsers = () => (tsAllMode() ? DB.users.filter(u => u.active && !u.system) : projUsers());
function renderDayGrid() {
  const scope = DB.ui.tsSpan || 'week';          // 'day' | 'week'
  const days = scope === 'week' ? weekDays() : [DB.ui.tsDay || TODAY];
  const logs = DB.worklogs.filter(w => days.includes(w.date) && tsScopeOk(w))
    .filter(w => !(DB.ui.tsUser && scope === 'week') || w.userId === DB.ui.tsUser);
  const users = tsUsers();
  /* Haftalık görünümde sütun = gün; günlük görünümde sütun = kişi. */
  const cols = scope === 'week'
    ? days.map((d, k) => ({ id: d, label: DAYS[k], sub: fmtD(d), dim: !isWorkday(d),
        pick: w => w.date === d, color: w => user(w.userId)?.color || 'var(--accent)' }))
    : users.map(u => ({ id: u.id, label: u.name, av: u.id, dim: false,
        pick: w => w.userId === u.id, color: () => u.color }));

  const untimed = logs.filter(w => !w.time);
  const hours = Array.from({ length: HOUR_TO - HOUR_FROM }, (_, k) => HOUR_FROM + k);
  const toMin = t => { const [a, b] = String(t).split(':').map(Number); return a * 60 + (b || 0); };

  /* Aynı saatte çakışan kayıtlar yan yana dizilir. */
  const blocks = c => {
    const items = logs.filter(w => c.pick(w) && w.time)
      .sort((a, b) => toMin(a.time) - toMin(b.time));
    const lanes = [];
    items.forEach(w => {
      const s = toMin(w.time), e = s + w.hours * 60;
      let li = lanes.findIndex(L => L <= s);
      if (li === -1) { lanes.push(e); li = lanes.length - 1; } else lanes[li] = e;
      w.__lane = li; w.__lanes = lanes.length;
    });
    const n = Math.max(1, lanes.length);
    return items.map(w => {
      const top = (toMin(w.time) - HOUR_FROM * 60) / 60 * 34;
      const hgt = Math.max(16, w.hours * 34);
      const i = issue(w.issueId);
      const wd = 100 / n, lf = w.__lane * wd;
      return `<div class="hblk" data-editwl="${w.id}"
        style="top:${top}px;height:${hgt - 2}px;left:calc(${lf}% + 2px);width:calc(${wd}% - 4px);background:${c.color(w)}"
        title="${esc(w.time)} · ${fmtDur(w.hours)} · ${esc(user(w.userId)?.name || '')} · ${esc(projName(i.projectId))} · ${esc(i.key)} — ${esc(w.comment || i.summary)}">
        <b>${esc(w.time)}</b> ${scope === 'week' ? esc((user(w.userId)?.ini) || '') + ' ' : ''}${esc(i.key)}<br>
        <span>${esc(w.comment || i.summary)}</span></div>`;
    }).join('');
  };

  const colTot = c => logs.filter(w => c.pick(w)).reduce((a, w) => a + w.hours, 0);
  const label = scope === 'week'
    ? `${fmtD(days[0])} – ${fmtD(days[6])}`
    : `${fmtD(days[0])} ${DAYS[(new Date(days[0]).getDay() + 6) % 7]}`;

  return `<div class="dayhead">
      <div class="seg" id="tsSpan">
        <button data-s="day" class="${scope === 'day' ? 'on' : ''}">Gün</button>
        <button data-s="week" class="${scope === 'week' ? 'on' : ''}">Hafta</button>
      </div>
      <button class="btn sm" id="dPrev">‹</button>
      <b class="num">${label}</b>
      <button class="btn sm" id="dNext">›</button>
      <button class="btn sm" id="dToday">${scope === 'week' ? 'Bu hafta' : 'Bugün'}</button>
      ${scope === 'week' ? `<select class="inp" id="dUser" style="width:auto">
        <option value="">Herkes</option>
        ${users.map(u => `<option value="${u.id}" ${DB.ui.tsUser === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
      </select>` : ''}
      <span class="spacer"></span>
      <span class="k" style="color:var(--ink3)">${efFmt(logs.reduce((a, w) => a + w.hours, 0))} toplam</span>
    </div>
    ${untimed.length ? `<div class="untimed">
      <span class="k">Saatsiz kayıtlar</span>
      ${untimed.map(w => `<button class="chip lbl" data-editwl="${w.id}">${avat(w.userId)}
        ${esc(issue(w.issueId).key)} · ${scope === 'week' ? fmtD(w.date) + ' · ' : ''}${efFmt(w.hours)}</button>`).join('')}
    </div>` : ''}
    <div class="daygrid" style="grid-template-columns:56px repeat(${cols.length}, 1fr)">
      <div class="dg-corner"></div>
      ${cols.map(c => `<div class="dg-head ${c.dim ? 'dim' : ''}">
        ${c.av ? avat(c.av) : ''}<span>${esc(c.label)}</span>
        ${c.sub ? `<em>${esc(c.sub)}</em>` : ''}
        <b class="num">${colTot(c) ? efFmt(colTot(c)) : ''}</b></div>`).join('')}
      <div class="dg-hours">${hours.map(x => `<div class="dg-h"><span>${String(x).padStart(2, '0')}:00</span></div>`).join('')}</div>
      ${cols.map(c => `<div class="dg-col ${c.dim ? 'dim' : ''}" data-daycol="${c.id}">
        ${hours.map(() => '<div class="dg-slot"></div>').join('')}
        ${blocks(c)}</div>`).join('')}
    </div>
    <p style="color:var(--ink3);font-size:11.5px;margin-top:8px">
      ${scope === 'week'
        ? 'Sütunlar günleri, renkler kişileri gösterir. Boş alana çift tıklayarak o saate kayıt açabilirsiniz.'
        : 'Sütunlar kişileri gösterir.'}
      Bloğa tıklayarak kaydı düzenleyebilirsiniz; saatsiz kayıtlar üstte listelenir.</p>`;
}

function summaryTables() {
  const logs = periodLogs();
  const group = (keyFn, nameFn) => {
    const m = new Map();
    logs.forEach(w => { const k = keyFn(w) || '—';
      const e = m.get(k) || { h: 0, n: 0, bill: 0, nobill: 0, users: new Set() };
      e.h += w.hours; e.n++; e.users.add(w.userId);
      (billOf(issue(w.issueId)) === 'Faturalanmayacak' ? (e.nobill += w.hours) : (e.bill += w.hours));
      m.set(k, e); });
    return [...m.entries()].map(([k, v]) => ({ name: nameFn ? nameFn(k) : k, ...v }))
      .sort((a, b) => b.h - a.h);
  };
  return {
    customer: group(w => customerOf(issue(w.issueId))),
    project:  group(w => issue(w.issueId).projectId, id => DB.projects.find(p => p.id === id)?.name || '—'),
    user:     group(w => w.userId, id => user(id)?.name || '—'),
    total:    logs.reduce((a, w) => a + w.hours, 0),
    count:    logs.length,
  };
}

/* ============================================================
   Bölüm 16: BİRLEŞTİRME
   Üç kişi ayrı kopyalarda çalışıp verileri birleştirebilsin diye,
   "üzerine yaz" yerine kayıt bazlı birleşme. Kurallar:
   • Süre kaydı, yorum, geçmiş, durum geçişi → yalnızca eklenir,
     asla çakışmaz (her birinin benzersiz id'si var).
   • İş, proje, kullanıcı gibi kayıtlar → id eşleşirse son
     değiştirilen kazanır (updatedAt).
   • Silmeler taşınmaz: bir tarafta silinen kayıt, diğer tarafta
     duruyorsa geri gelir. Bu bilinçli — veri kaybetmemek için.
   ============================================================ */

/* Değişiklik damgası: logHist zaten her alan değişiminde çağrılıyor. */
function stampIssue(i) { if (i) i.updatedAt = Date.now(); }

const MERGE_APPEND = ['worklogs', 'comments', 'history', 'transitions', 'links'];
const MERGE_BY_ID  = ['issues', 'projects', 'users', 'statuses', 'sprints', 'fields', 'rules', 'filters'];

function mergePreview(inc) {
  const r = { append: {}, add: {}, update: {}, skip: {}, total: 0 };
  MERGE_APPEND.forEach(k => {
    const have = new Set((DB[k] || []).map(x => x.id));
    const n = (inc[k] || []).filter(x => !have.has(x.id)).length;
    r.append[k] = n; r.total += n;
  });
  MERGE_BY_ID.forEach(k => {
    const mine = new Map((DB[k] || []).map(x => [x.id, x]));
    let add = 0, upd = 0, skip = 0;
    (inc[k] || []).forEach(x => {
      const cur = mine.get(x.id);
      if (!cur) add++;
      else if ((x.updatedAt || 0) > (cur.updatedAt || 0)) upd++;
      else skip++;
    });
    r.add[k] = add; r.update[k] = upd; r.skip[k] = skip; r.total += add + upd;
  });
  return r;
}

function applyMerge(inc) {
  MERGE_APPEND.forEach(k => {
    DB[k] ||= [];
    const have = new Set(DB[k].map(x => x.id));
    (inc[k] || []).forEach(x => { if (!have.has(x.id)) DB[k].push(x); });
  });
  MERGE_BY_ID.forEach(k => {
    DB[k] ||= [];
    const idx = new Map(DB[k].map((x, n) => [x.id, n]));
    (inc[k] || []).forEach(x => {
      const n = idx.get(x.id);
      if (n === undefined) DB[k].push(x);
      else if ((x.updatedAt || 0) > (DB[k][n].updatedAt || 0)) DB[k][n] = x;
    });
  });
  /* İş anahtarı sayaçları: iki tarafta da ilerlemiş olabilir. */
  DB.projects.forEach(p => {
    const used = DB.issues.filter(i => i.projectId === p.id)
      .map(i => parseInt(String(i.key).split('-').pop(), 10)).filter(n => !isNaN(n));
    p.counter = Math.max(p.counter || 0, ...used, 0);
  });
  /* Aynı anahtarı iki kişi birden kullanmışsa çakışanları yeniden numarala. */
  const seen = new Set();
  DB.issues.forEach(i => {
    if (!seen.has(i.key)) { seen.add(i.key); return; }
    const p = DB.projects.find(x => x.id === i.projectId);
    if (!p) return;
    i.key = `${p.code || p.key}-${++p.counter}`;
    seen.add(i.key);
  });
  /* Harcanan süreler süre kayıtlarından yeniden hesaplanır. */
  const spent = new Map();
  DB.worklogs.forEach(w => spent.set(w.issueId, (spent.get(w.issueId) || 0) + w.hours));
  DB.issues.forEach(i => { i.spent = spent.get(i.id) || 0; });
  save();
}

/* Bir dosyadan veri çıkar: .json ya da içine veri gömülmüş .html */
function extractData(text) {
  const t = text.trim();
  if (t.startsWith('{')) { try { return JSON.parse(t); } catch (e) { return null; } }
  const m = t.match(/<script id="pano-data"[^>]*>([\s\S]*?)<\/script>/);
  if (!m) return null;
  try { return JSON.parse(m[1].replace(/\\u003c/g, '<')); } catch (e) { return null; }
}

function mergeDialog(inc, name) {
  const r = mergePreview(inc);
  const line = (l, n, cls) => n ? `<div style="display:flex;gap:10px;padding:3px 0">
    <span class="chip ${cls}" style="width:64px;justify-content:center">${n}</span>
    <span style="font-size:12.5px">${l}</span></div>` : '';
  openModal(`<div class="m-h"><b>Veriyi birleştir</b>
      <span class="chip lbl">${esc(name || 'dosya')}</span>
      <button class="x" data-close>×</button></div>
    <div style="padding:16px 18px;max-height:56vh;overflow:auto">
      ${inc.savedAt ? `<div class="kv" style="margin-bottom:12px">
        <span class="lb">Kaydeden</span><span>${esc(inc.savedBy || '—')}</span>
        <span class="lb">Tarih</span><span>${fmtDT(inc.savedAt)}</span></div>` : ''}
      ${r.total ? `<div class="sec" style="margin-top:0">Eklenecek</div>
        ${line('süre kaydı', r.append.worklogs, 'cat-done')}
        ${line('yorum', r.append.comments, 'cat-done')}
        ${line('durum geçişi', r.append.transitions, 'cat-done')}
        ${line('değişiklik kaydı', r.append.history, 'cat-done')}
        ${line('bağlantı', r.append.links, 'cat-done')}
        ${line('yeni iş', r.add.issues, 'cat-done')}
        ${line('yeni proje', r.add.projects, 'cat-done')}
        ${line('yeni kullanıcı', r.add.users, 'cat-done')}
        ${line('yeni durum', r.add.statuses, 'cat-done')}
        <div class="sec">Güncellenecek</div>
        ${line('iş (karşı taraf daha yeni)', r.update.issues, 'cat-inprogress')}
        ${line('proje', r.update.projects, 'cat-inprogress')}
        ${line('kullanıcı', r.update.users, 'cat-inprogress')}
        ${line('durum', r.update.statuses, 'cat-inprogress')}
        ${r.skip.issues ? `<div class="sec">Dokunulmayacak</div>
          ${line('iş (seninki daha yeni ya da aynı)', r.skip.issues, 'lbl')}` : ''}`
      : '<div class="empty">Bu dosyada yeni bir şey yok — her şey zaten sende var.</div>'}
      <div style="margin-top:14px;padding:9px 11px;background:var(--warn-bg);border:1px solid var(--warn-line);
        border-radius:6px;font-size:11.5px;color:var(--warn-ink);line-height:1.5">
        Birleştirme <b>hiçbir kaydı silmez</b>. Karşı tarafta silinmiş bir iş sende duruyorsa kalır.
        Aynı işi ikiniz de değiştirdiyse <b>son değiştirilen</b> kazanır.
      </div>
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button>
      ${r.total ? '<button class="btn pri" id="doMerge">Birleştir</button>' : ''}</div>`);
  const b = $('#doMerge');
  if (b) b.onclick = () => {
    applyMerge(inc);
    closeModal(); boot();
    toast(r.total + ' kayıt birleştirildi');
  };
}

function setUnread(n) {
  UNREAD = n;
  const b = document.getElementById('bellBadge');
  if (b) { b.hidden = !n; b.textContent = n > 99 ? '99+' : n; }
  document.title = (n ? `(${n}) ` : '') + (VERSION?.env === 'test' ? '[TEST] ' : '') + 'ÇevikPano';
}

function setOnline(list) {
  const others = list.filter(o => o.id !== ME?.id && user(o.id));
  const key = others.map(o => o.id + o.issue).join();
  if (key === setOnline.k) return; setOnline.k = key;
  ONLINE = others;
  const html = others.slice(0, 6).map(o => `<span class="onl" title="${esc(user(o.id).name)} çevrim içi${o.view && VIEWS[o.view] ? ' · ' + VIEWS[o.view].t : ''}">${avat(o.id)}</span>`).join('')
    + (others.length > 6 ? `<span class="onl-more">+${others.length - 6}</span>` : '');
  const t = document.getElementById('tbOnline'); if (t) t.innerHTML = html;
  const r = document.getElementById('online');
  if (r) r.innerHTML = others.length ? `<div class="navgroup">Çevrim içi · ${others.length}</div><div class="onl-row">${html}</div>` : '';
  /* Açık iş penceresinde aynı işe bakanlar */
  const w = document.getElementById('watchers');
  if (w && OPEN_ISSUE) {
    const here = others.filter(o => o.issue === OPEN_ISSUE);
    w.innerHTML = here.length ? `<span class="watch">${here.map(o => avat(o.id)).join('')}
      ${here.map(o => esc(user(o.id).name)).join(', ')} de bu işe bakıyor</span>` : '';
  }
}

const NK = {
  assigned: n => `<b>${esc(n.actor_name || 'Biri')}</b> sana bir iş atadı`,
  comment:  n => `<b>${esc(n.actor_name || 'Biri')}</b> yorum yaptı`,
  mention:  n => `<b>${esc(n.actor_name || 'Biri')}</b> senden bahsetti`,
  status:   n => `<b>${esc(n.actor_name || 'Biri')}</b> durumu <b>${esc(n.meta?.status || '')}</b> yaptı`,
};
function ago(t) {
  const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 60) return 'az önce';
  if (s < 3600) return Math.floor(s / 60) + ' dk önce';
  if (s < 86400) return Math.floor(s / 3600) + ' sa önce';
  if (s < 7 * 86400) return Math.floor(s / 86400) + ' gün önce';
  return new Date(t).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' });
}
async function openNotifications() {
  const pop = document.getElementById('notifPop');
  if (pop) { pop.remove(); return; }
  const el = document.createElement('div');
  el.id = 'notifPop'; el.className = 'pop';
  el.innerHTML = `<div class="pop-h"><b>Bildirimler</b><button class="btn sm" id="nAll">Tümünü okundu say</button></div>
    <div class="pop-b"><div class="empty">Yükleniyor…</div></div>`;
  document.body.appendChild(el);
  const close = e => { if (!el.contains(e.target) && !e.target.closest('#btnBell')) { el.remove(); document.removeEventListener('mousedown', close); } };
  setTimeout(() => document.addEventListener('mousedown', close), 0);
  let data;
  try { data = await API.get('/api/notifications'); } catch (e) { el.querySelector('.pop-b').innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  setUnread(data.unread);
  el.querySelector('.pop-b').innerHTML = data.items.length ? data.items.map(n => `
    <button class="notif ${n.read_at ? '' : 'unread'}" data-nid="${n.id}" data-iss="${esc(n.issue_id || '')}" data-proj="${esc(n.project_id || '')}">
      ${n.actor_id && user(n.actor_id) ? avat(n.actor_id) : '<span class="av" style="background:var(--ink3)">•</span>'}
      <span class="nt"><span>${(NK[n.kind] || NK.comment)(n)}</span>
        ${n.issue_key ? `<span class="ni"><span class="k">${esc(n.issue_key)}</span> ${esc(n.summary || '')}</span>` : '<span class="ni">Silinmiş iş</span>'}
        ${n.meta?.excerpt ? `<span class="nx">“${esc(n.meta.excerpt)}”</span>` : ''}
        <span class="nw">${ago(n.created_at)}</span></span>
    </button>`).join('') : '<div class="empty">Henüz bildirimin yok. Sana iş atandığında, işlerine yorum yapıldığında ya da @kullanıcıadı ile senden bahsedildiğinde burada görünür.</div>';
  el.querySelectorAll('.notif').forEach(b => b.onclick = async () => {
    API.post('/api/notifications/read', { ids: [b.dataset.nid] }).then(r => setUnread(r.unread)).catch(() => {});
    el.remove();
    const pid = b.dataset.proj;
    if (pid && pid !== DB.ui.project && DB.projects.some(p => p.id === pid)) { DB.ui.project = pid; save(); startApp(false); }
    if (b.dataset.iss && issue(b.dataset.iss)) openIssue(b.dataset.iss); else toast('Bu iş artık yok');
  });
  el.querySelector('#nAll').onclick = async () => {
    const r = await API.post('/api/notifications/read', { ids: 'all' }); setUnread(r.unread);
    el.querySelectorAll('.notif.unread').forEach(x => x.classList.remove('unread'));
  };
}

/* ---- tema ---- */
function applyTheme(t) {
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
function cycleTheme() {
  const cur = document.documentElement.dataset.theme
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('pano-theme', next); } catch (e) { }
}
try { applyTheme(localStorage.getItem('pano-theme')); } catch (e) { }

function wireTopbar() {
  const b = document.getElementById('btnBell'); if (b) b.onclick = openNotifications;
  const t = document.getElementById('btnTheme'); if (t) t.onclick = cycleTheme;
  const k = document.getElementById('btnCmd'); if (k) k.onclick = () => palette();
  document.addEventListener('focusout', () => { if (RERENDER) setTimeout(tryRerender, 50); });
}

function forcedPasswordScreen() {
  document.body.classList.add('locked');
  $('#login').style.display = 'flex';
  $('#login').innerHTML = `
    <form class="loginbox" id="fpForm">
      <div class="lg-brand"><div><b>Parolanızı belirleyin</b><span>Merhaba ${esc(ME.name || ME.username)}, ilk girişiniz</span></div></div>
      <p style="margin:0 0 14px;color:var(--ink2);font-size:13px">Devam etmek için size verilen başlangıç parolası yerine
        kendi parolanızı belirleyin. En az 8 karakter.</p>
      <label class="field">Yeni parola</label>
      <input class="inp" id="fp_a" type="password" autocomplete="new-password">
      <label class="field" style="margin-top:10px">Yeni parola (tekrar)</label>
      <input class="inp" id="fp_b" type="password" autocomplete="new-password">
      <div id="fp_err" class="lg-err"></div>
      <button class="btn pri" type="submit" style="width:100%;margin-top:12px;padding:9px">Kaydet ve devam et</button>
      <button class="btn" type="button" id="fp_out" style="width:100%;margin-top:8px;justify-content:center">Çıkış yap</button>
    </form>`;
  $('#fp_a').focus();
  $('#fp_out').onclick = () => logout();
  $('#fpForm').onsubmit = async e => {
    e.preventDefault();
    const a = $('#fp_a').value, b = $('#fp_b').value, err = m => $('#fp_err').textContent = m;
    if (a.length < 8) return err('Parola en az 8 karakter olmalı.');
    if (a !== b) return err('Parolalar eşleşmiyor.');
    try { await API.post('/api/auth/password', { newPassword: a }); }
    catch (x) { return err(x.message); }
    ME.mustChange = false;
    toast('Parolanız kaydedildi');
    enterApp(true, true);
  };
}

let WIRED = false;
async function enterApp(useHash, fromLogin) {
  if (ME.mustChange) return forcedPasswordScreen();
  if (LOST) {
    const L = LOST; LOST = null;
    if (L.user === ME.id) {
      try { await API.post('/api/sync', { changes: L.changes }); toast('Oturum kapanmadan önceki değişiklikleriniz kaydedildi'); }
      catch (e) { toast('Önceki değişiklikler kaydedilemedi: ' + e.message); }
    }
  }
  try { DB = await load(); }
  catch (e) { return showLogin(e.status === 401 ? '' : 'Sunucuya bağlanılamadı: ' + e.message); }
  if (!WIRED) { wire(); wireTopbar(); wireToast(); WIRED = true; }
  SESSION = ME.id;
  ensureSchema(); ensureAccounts();
  $('#login').style.display = 'none';
  document.body.classList.remove('locked');
  if (fromLogin) DB.ui.view = 'home';
  if (useHash && location.hash.slice(1) in VIEWS) DB.ui.view = location.hash.slice(1);
  startApp(false);
  save();
  renderFileBar();
  startPolling(); poll();
}

const ENV_TR = { production: 'Canlı', test: 'Test', development: 'Geliştirme' };
async function loadVersion() {

  if (VERSION?.env === 'test') {
    document.body.classList.add('env-test');
    const fav = document.getElementById('favicon'); if (fav) fav.href = '/img/icon-test.svg';
    document.querySelectorAll('.brand-ic,.tb-logo').forEach(i => { i.src = '/img/icon-test.svg'; });
    document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#F59E0B');
    document.title = '[TEST] ÇevikPano';
    if (!document.getElementById('envBar')) {
      const b = document.createElement('div');
      b.id = 'envBar'; b.className = 'envbar';
      b.innerHTML = `<b>TEST ORTAMI</b><span>Buradaki veriler gerçek değildir; denemek için kullanın.</span>
        ${VERSION.peerUrl ? `<a href="${esc(VERSION.peerUrl)}" target="_blank" rel="noopener">Canlı siteye git →</a>` : ''}`;
      document.body.prepend(b);
    }
  }
}
const shortSha = c => (c || '').slice(0, 7) || '—';
async function renderVersions() {
  const me = VERSION || {};
  let peer = null;
  if (me.peerUrl) {
    try { const r = await fetch(me.peerUrl.replace(/\/$/, '') + '/api/version', { cache: 'no-store' }); if (r.ok) peer = await r.json(); }
    catch (e) { peer = null; }
  }
  const test = me.env === 'test' ? me : peer?.env === 'test' ? peer : null;
  const prod = me.env === 'production' ? me : peer?.env === 'production' ? peer : null;
  const repo = me.repo || peer?.repo || '';
  const gh = repo ? 'https://github.com/' + repo : '';
  const card = (title, v, url, cls) => `<div class="vcard ${cls}">
      <div class="vc-h"><span class="vc-dot"></span><b>${title}</b>${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https?:\/\//, ''))} ↗</a>` : ''}</div>
      ${v ? `<div class="vc-sha">${v.commit && gh ? `<a class="k" href="${gh}/commit/${esc(v.commit)}" target="_blank" rel="noopener">${shortSha(v.commit)}</a>` : `<span class="k">${shortSha(v.commit)}</span>`}
          ${v.commitDate ? `<span>${fmtWhen(v.commitDate)}</span>` : ''}</div>
        <div class="vc-msg">${esc(v.commitMessage || 'Sürüm açıklaması yok')}</div>
        <div class="vc-f">Sunucuda çalışıyor: ${fmtWhen(v.startedAt)}</div>`
      : '<div class="vc-msg">Bu ortama ulaşılamadı.</div>'}
    </div>`;
  const differs = test && prod && test.commit && prod.commit && test.commit !== prod.commit;
  return `<h3>Sürümler</h3>
    <div class="sub">Onaylanan (GitHub'da birleştirilen) her değişiklik birkaç dakika içinde önce <b>test</b> sitesine gelir.
      Testte denedikten sonra <b>Canlıya yayınla</b> ile canlı siteye alınır. Yeni sürüm açılmazsa sunucu kendiliğinden önceki sürüme döner.</div>
    <div class="vgrid">
      ${card('🧪 Test', test, test?.publicUrl || (me.env !== 'test' ? me.peerUrl : me.publicUrl), 'test')}
      <div class="varrow">→</div>
      ${card('🚀 Canlı', prod, prod?.publicUrl || (me.env !== 'production' ? me.peerUrl : me.publicUrl), 'prod')}
    </div>
    ${differs ? `<div class="vnote">Testte, canlıda henüz olmayan yeni bir sürüm var. Denedikten sonra yayınlayabilirsiniz.</div>`
      : test && prod ? '<div class="vnote ok">Test ve canlı aynı sürümde.</div>' : ''}
    ${gh ? `<div class="vact">
      <a class="btn pri" href="${gh}/actions/workflows/yayinla.yml" target="_blank" rel="noopener">🚀 Canlıya yayınla (GitHub)</a>
      <a class="btn" href="${gh}/commits/main" target="_blank" rel="noopener">Testteki değişiklikler</a>
      <a class="btn" href="${gh}/pulls" target="_blank" rel="noopener">Onay bekleyenler (PR)</a></div>
      <div class="sub" style="margin-top:8px">GitHub'da açılan sayfada <b>Run workflow</b> → yeşil <b>Run workflow</b> düğmesine basın.
        Önceki bir sürüme dönmek için aynı sayfada “sürüm” kutusuna o sürümün kodunu (ör. ${shortSha(prod?.commit) || 'abc1234'}) yazın.</div>` : ''}`;
}

(async () => {
  await loadVersion();
  try { ME = await API.get('/api/auth/me'); } catch (e) { ME = null; }
  if (!ME) return showLogin();
  await enterApp(true, false);
})();

</script>
</body>
