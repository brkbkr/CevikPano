        : `<div class="gr-per"><div class="gr-step"><button type="button" data-grm="-1" aria-label="Önceki ay">${ic('back')}</button><b id="grPer" aria-live="polite">${esc(per.label)}</b><button type="button" data-grm="1" aria-label="Sonraki ay">${ic('chevr')}</button></div>
          <button type="button" class="btn ghost gr-now" data-grm="0">Bu ay</button></div>`}
      <button type="button" class="btn gr-fbtn" data-grsheet aria-expanded="${GR.sheet}">${ic('filter')}Süzgeçler <span class="n">${act.length}</span></button>
      <span class="gr-fhint">${ic('lock')}Süzgeçler sana özel hatırlanır</span>
    </div>
    <div class="gr-fgrid">
      ${sel('ws', 'Alan', 'Tümü', wsOpts)}${sel('proj', 'Proje', 'Tümü', pOpts)}${sel('cu', 'Cari', 'Tümü', cOpts)}
      ${sel('user', 'Kişi', 'Herkes', uOpts)}${sel('type', 'İş tipi', 'Tümü', tOpts)}${sel('bill', 'Faturalama', 'Tümü', bOpts)}
    </div>
    ${act.length ? `<div class="gr-chips"><span class="lbl">${act.length} süzgeç etkin:</span>${act.map(k =>
      `<span class="gr-chip"><span class="t"><span>${LBL[k]}:</span> ${esc(nameOf[k](f[k]) || '—')}</span><button type="button" data-grx="${k}" aria-label="${LBL[k]} süzgecini kaldır">${ic('x')}</button></span>`).join('')}
      <button type="button" class="btn ghost gr-clear" data-grclear>Süzgeçleri temizle</button></div>` : ''}
  </section>`;
}
const grKpi = (icn, l, v, s, unit = 'sa') => `<div class="gr-kpi"><span class="ic">${ic(icn)}</span><span class="tx"><span class="l">${l}</span><b>${v}${unit ? `<small>${unit}</small>` : ''}</b>${s ? `<span class="s">${s}</span>` : ''}</span></div>`;
function grEmpty() {
  return `<section class="gr-card hm-empty gr-empty" data-grempty><span class="hm-empty-ic">${ic('clock')}</span><h3>Bu süzgeçlerle süre kaydı yok</h3>
    <p>Dönemi değiştir ya da süzgeçleri kaldır.</p><div class="acts"><button type="button" class="btn" data-grclear>${ic('x')}Süzgeçleri temizle</button>
    <button type="button" class="btn gr-xls" data-grxls>${ic('issues')}Excel'e aktar</button></div></section>`;
}

function renderGr() {
  const t0 = performance.now();
  const R = grCompute(), tab = grTab();
  GR.last = R;
  const tabs = `<div class="gr-tabs" role="tablist" aria-label="Genel raporlar">
    <a href="#raporlar/sure" class="gr-tab" role="tab" id="grtab-sure" aria-selected="${tab === 'sure'}" aria-controls="grPanel" tabindex="${tab === 'sure' ? 0 : -1}">${ic('clock')}Süre</a>
    <a href="#raporlar/fatura" class="gr-tab" role="tab" id="grtab-fatura" aria-selected="${tab === 'fatura'}" aria-controls="grPanel" tabindex="${tab === 'fatura' ? 0 : -1}">${ic('issues')}Faturalanabilir saat</a></div>`;
  const body = !R.logs.length ? grEmpty() : tab === 'fatura' ? grFatura(R) : grSure(R);
  GR.ms = performance.now() - t0;
  return `<div class="gr" data-grms="${GR.ms.toFixed(1)}">${tabs}<div id="grPanel" role="tabpanel" aria-labelledby="grtab-${tab}" class="gr-panel">${grFilterBar(R)}${body}</div></div>`;
}

function grSure(R) {
  const { rD, cD, rows, cols, cells, rT, cT, grand, rowK, colK, D } = R;
  const dims = Object.entries(D);
  let max = 0;
  if (cD) cells.forEach(m => m.forEach(v => { if (v > max) max = v; })); else rT.forEach(v => { if (v > max) max = v; });
  const heat = v => v && max ? `background:color-mix(in srgb,var(--gr-heat) ${(v / max * 12).toFixed(1)}%,transparent)` : '';
  const cs = GR.cell;
  const btn = (r, c, v, cls = '') => {
    const on = !!cs && cs.r === String(r) && cs.c === String(c);
    return `<button type="button" class="gr-c ${v ? '' : 'z'} ${cls}" data-grr="${esc(r)}" data-grc="${esc(c)}" aria-pressed="${on}" ${cls ? '' : `style="${heat(v)}"`}
      aria-label="${esc(r === '*' ? 'Toplam' : rD.n(r))}${c === '*' || !cD ? '' : ' × ' + esc(cD.n(c))}: ${grH(v)} saat" ${v ? '' : 'disabled'}>${v ? grH(v) : '·'}</button>`;
  };
  const opt = (sel, none) => (none ? `<option value="" ${sel === '' ? 'selected' : ''}>Yok</option>` : '')
    + dims.map(([k, o]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${esc(o.l)}</option>`).join('');
  const head = `<tr><th class="rh dimh" scope="col">${esc(rD.l)}${cD ? `<span>/</span>${esc(cD.l)}` : ''}</th>
    ${cols.map(c => `<th scope="col" title="${esc(cD.n(c))}"><span class="ph">${colK === 'user' ? (c === GR_UNK ? '<span class="gr-unk" aria-hidden="true">?</span>' : avat(c)) : ''}${esc(cD.n(c))}${cD.tag ? grTag(cD.tag(c)) : ''}</span></th>`).join('')}
    <th scope="col" class="tot">Toplam</th></tr>`;
  const body = rows.map(r => `<tr><th scope="row" class="rh">${grDimLabel(rD, rowK, r)}</th>
    ${cols.map(c => `<td>${btn(r, c, cells.get(r)?.get(c) || 0)}</td>`).join('')}
    <td class="tot">${btn(r, '*', rT.get(r), 'b')}</td></tr>`).join('');
  const foot = `<tr><th scope="row" class="rh">Toplam</th>${cols.map(c => `<td>${btn('*', c, cT.get(c), 'b')}</td>`).join('')}
    <td class="tot grand">${btn('*', '*', grand, 'b')}</td></tr>`;
  const nP = R.projs.size;
  return `<div class="gr-kpis">${grKpi('clock', 'Toplam süre', `<span data-grtotal="${grR2(grand)}">${grH(grand)}</span>`)}
      ${grKpi('cal', 'Adam-gün', grH(grand / H_PER_DAY), `${H_PER_DAY} saatlik gün`, '')}
      ${grKpi('issues', 'Kayıt', R.logs.length.toLocaleString('tr-TR'), '', '')}
      ${grKpi('tag', 'İş', R.issues.size.toLocaleString('tr-TR'), `${nP} projede`, '')}</div>
    <section class="gr-card" aria-label="Süre tablosu">
      <div class="gr-card-h"><div class="gr-dims">
        <label class="gr-dim">Satır<select class="inp" data-grdim="row">${opt(rowK)}</select></label>
        <button type="button" class="gr-swap" data-grswap aria-label="Satır ve sütunu değiştir" title="Satır ve sütunu değiştir" ${cD ? '' : 'disabled'}>${ic('swap')}</button>
        <label class="gr-dim">Sütun<select class="inp" data-grdim="col">${opt(colK, true)}</select></label></div>
        <span class="meta"><b>${rows.length}</b> ${esc(rD.l.toLocaleLowerCase('tr'))}${cD ? ` × <b>${cols.length}</b> ${esc(cD.l.toLocaleLowerCase('tr'))}` : ''} · ${esc(R.per.label)}</span>
        <span class="spacer"></span>
        <button type="button" class="btn gr-xls" data-grxls>${ic('issues')}Excel'e aktar</button></div>
      <div class="gr-pv-wrap" id="grPvWrap"><table class="gr-pv" id="grPv"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
      <div class="gr-foot">${ic('info')}Bir hücreye tıkla ya da Enter'a bas: o kesitin süre kayıtları altta açılır.</div>
    </section>${grDrill(R)}`;
}

const GR_DRILL_MAX = 500;
function grDrill(R) {
  const cs = GR.cell; if (!cs) return '';
  const { rD, cD } = R;
  const list = R.logs.filter(x => (cs.r === '*' || String(rD.k(x.w, x.i, x.p) ?? GR_NONE) === cs.r)
    && (cs.c === '*' || !cD || String(cD.k(x.w, x.i, x.p) ?? GR_NONE) === cs.c));
  if (!list.length) { GR.cell = null; return ''; }
  list.sort((a, b) => a.w.date.localeCompare(b.w.date) || String(a.i.key).localeCompare(String(b.i.key)));
  const tot = list.reduce((a, x) => a + (+x.w.hours || 0), 0);
  const cellV = cs.r === '*' && cs.c === '*' ? R.grand : cs.c === '*' || !cD ? R.rT.get(cs.r) : cs.r === '*' ? R.cT.get(cs.c) : R.cells.get(cs.r)?.get(cs.c);
  const same = grR2(cellV) === grR2(tot);
  const ttl = [cs.r === '*' ? 'Tüm ' + rD.l.toLocaleLowerCase('tr') : rD.n(cs.r), cD && cs.c !== '*' ? cD.n(cs.c) : ''].filter(Boolean);
  const nI = new Set(list.map(x => x.i.id)).size;
  const shown = list.slice(0, GR_DRILL_MAX);
  return `<section class="gr-card gr-drill" id="grDrill" aria-labelledby="grDrT">
    <div class="gr-card-h"><div class="gr-dt"><b id="grDrT">${ttl.map(esc).join(' <span class="x">×</span> ')}</b>
      <span class="s">${esc(R.per.label)} · ${list.length} kayıt · ${nI} iş</span></div>
      <span class="gr-dsum" data-grdsum="${grR2(tot)}">${grH(tot)}<small>sa</small></span>
      <button type="button" class="iconbtn gr-close" data-grclose aria-label="Kayıt listesini kapat">${ic('x')}</button></div>
    <table class="gr-dl"><thead><tr><th>Tarih</th><th>Kişi</th><th>İş</th><th>Açıklama</th><th class="r">Saat</th></tr></thead>
    <tbody>${shown.map(({ w, i }) => `<tr><td class="d">${trDate(w.date)}</td>
      <td class="p"><span class="who">${R.X.UM.has(w.userId) ? avat(w.userId) : '<span class="gr-unk" aria-hidden="true">?</span>'}${esc(R.X.UM.get(w.userId)?.name || 'Bilinmeyen')}</span></td>
      <td class="i"><span class="gr-is"><button type="button" class="gr-key" data-open="${esc(i.id)}">${esc(i.key)}</button><span>${esc(i.summary)}</span></span></td>
      <td class="a">${esc(w.comment || '')}</td><td class="h r">${grH(w.hours)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="lbl">Toplam</td><td class="sp" colspan="3">${list.length > GR_DRILL_MAX ? `İlk ${GR_DRILL_MAX} kayıt gösteriliyor; tümü Excel'de.` : ''}</td>
      <td class="h r">${same ? `<span class="eq">${ic('check')}hücreyle aynı</span>` : ''}${grH(tot)}</td></tr></tfoot></table></section>`;
}

/* Faturalanabilir saat: cari başına Faturalanacak / Faturalanmayacak / Toplam / Oran; "Cari bağlı değil" en altta. */
function grBillRows(R) {
  const X = R.X;
  return [...R.bill.entries()].map(([id, v]) => ({ id, f: v.f, n: v.n, t: v.f + v.n,
    name: id === GR_NONE ? 'Cari bağlı değil' : (X.CUM.get(id)?.name || '—'), pas: id !== GR_NONE && !cuActive(X.CUM.get(id)),
    projs: [...v.p.entries()].map(([pid, x]) => ({ p: X.PM.get(pid), f: x.f, n: x.n, t: x.f + x.n })).sort((a, b) => b.t - a.t || String(a.p.key).localeCompare(String(b.p.key))) }))
    .sort((a, b) => (a.id === GR_NONE) - (b.id === GR_NONE) || b.t - a.t || a.name.localeCompare(b.name, 'tr'));
}
const grPct = (f, t) => t ? Math.round(f / t * 100) : 0;
const grRate = (f, t) => `<span class="gr-rate"><i aria-hidden="true"><b style="width:${grPct(f, t)}%"></b></i><span>%${grPct(f, t)}</span></span>`;
function grFatura(R) {
  const rows = grBillRows(R);
  const F = rows.reduce((a, r) => a + r.f, 0), N = rows.reduce((a, r) => a + r.n, 0), T = F + N;
  const nm = r => `${r.id === GR_NONE ? ic('link') : ''}<span class="nmw"><span class="nmr"><span class="nm">${esc(r.name)}</span>${r.pas ? grTag('pas') : ''}</span><span class="sub">${r.projs.length} proje</span></span>`;
  const table = rows.map(r => { const open = GR.open.has(r.id), sid = 'grfp-' + esc(r.id);
    return `<tr class="top" data-grcu="${esc(r.id)}"><td><span class="gr-xr"><button type="button" class="gr-tg" data-grtog="${esc(r.id)}" aria-expanded="${open}" aria-controls="${sid}" aria-label="${esc(r.name)}: projeler">${ic('down')}</button>${nm(r)}</span></td>
      <td>${grH(r.f)}</td><td>${grH(r.n)}</td><td class="t">${grH(r.t)}</td><td>${grRate(r.f, r.t)}</td></tr>
      ${open ? r.projs.map((x, k) => `<tr class="sub ${k === r.projs.length - 1 ? 'last' : ''}" data-grsub="${esc(r.id)}"><td><span class="gr-xr"><span class="gr-pk">${esc(x.p.key)}</span><span class="gr-pn">${esc(x.p.name)}</span>${x.p.archived ? grTag('arch') : ''}</span></td>
        <td>${grH(x.f)}</td><td>${grH(x.n)}</td><td class="t">${grH(x.t)}</td><td>${grRate(x.f, x.t)}</td></tr>`).join('') : ''}`; }).join('');
  const cards = rows.map(r => { const open = GR.open.has(r.id);
    return `<article class="gr-fc"><div class="gr-fc-h"><span class="nmw"><span class="nm">${esc(r.name)}</span><span class="tags">${r.pas ? grTag('pas') : ''}${r.projs.length} proje</span></span><span class="pct">%${grPct(r.f, r.t)}</span></div>
      <div class="gr-fc-n"><div><span>Faturalanacak</span><b>${grH(r.f)}</b></div><div><span>Faturalanmayacak</span><b>${grH(r.n)}</b></div><div class="t"><span>Toplam</span><b>${grH(r.t)}</b></div></div>
      <span class="gr-fc-bar" aria-hidden="true"><b style="width:${grPct(r.f, r.t)}%"></b></span>
      <button type="button" class="gr-fc-tg" data-grtog="${esc(r.id)}" aria-expanded="${open}">Projeler (${r.projs.length})${ic('down')}</button>
      ${open ? `<ul class="gr-fc-p">${r.projs.map(x => `<li><span class="r1"><span class="gr-pk">${esc(x.p.key)}</span><span class="gr-pn">${esc(x.p.name)}</span>${x.p.archived ? grTag('arch') : ''}</span>
        <span class="r2"><span>F ${grH(x.f)}</span><span>FY ${grH(x.n)}</span><b>T ${grH(x.t)}</b><span>%${grPct(x.f, x.t)}</span></span></li>`).join('')}</ul>` : ''}</article>`; }).join('');
  return `<div class="gr-kpis">${grKpi('issues', 'Faturalanacak', `<span data-grf-f="${grR2(F)}">${grH(F)}</span>`)}${grKpi('pause', 'Faturalanmayacak', `<span data-grf-n="${grR2(N)}">${grH(N)}</span>`)}
      ${grKpi('clock', 'Toplam', `<span data-grf-t="${grR2(T)}">${grH(T)}</span>`)}${grKpi('reports', 'Faturalanabilir oran', '%' + grPct(F, T), `${rows.filter(r => r.id !== GR_NONE).length} cari · ${R.projs.size} proje`, '')}</div>
    <section class="gr-card" aria-label="Faturalanabilir saat">
      <div class="gr-card-h"><span class="meta"><b>${rows.length}</b> satır · ${esc(R.per.label)} · cari = projenin carisi</span><span class="spacer"></span>
        <button type="button" class="btn gr-xls" data-grxls>${ic('issues')}Excel'e aktar</button></div>
      <div class="gr-ftwrap"><table class="gr-ft" id="grFt"><colgroup><col style="width:38%"><col><col><col><col style="width:150px"></colgroup>
        <thead><tr><th scope="col">Cari</th><th scope="col">Faturalanacak</th><th scope="col">Faturalanmayacak</th><th scope="col">Toplam</th><th scope="col">Oran</th></tr></thead>
        <tbody>${table}</tbody>
        <tfoot><tr><td>Toplam</td><td>${grH(F)}</td><td>${grH(N)}</td><td class="grand">${grH(T)}</td><td>${grRate(F, T)}</td></tr></tfoot></table></div>
      <div class="gr-fc-list">${cards}<article class="gr-fc tot"><div class="gr-fc-n"><div><span>Faturalanacak</span><b>${grH(F)}</b></div><div><span>Faturalanmayacak</span><b>${grH(N)}</b></div><div class="t"><span>Toplam</span><b>${grH(T)}</b></div></div></article></div>
      <div class="gr-foot">${ic('info')}Faturalama işin alanından gelir; alanı boş işler "Faturalanacak" sayılır. Faturalanacak + Faturalanmayacak = Toplam.</div>
    </section>`;
}

/* ---- Excel: "Özet" (ekrandaki tablo + üstte dönem/süzgeçler) ve "Detay" (her kayıt) ---- */
function grExcel() {
  const R = grCompute(), tab = grTab();
  if (!R.logs.length) return toast('Aktarılacak süre kaydı yok: bu süzgeçlerle süre kaydı bulunmuyor', { warn: true });
  const X = R.X, f = R.f;
  const LBL = { ws: 'Alan', proj: 'Proje', cu: 'Cari', user: 'Kişi', type: 'İş tipi', bill: 'Faturalama' };
  const val = { ws: id => wsById(id)?.name, proj: id => X.PM.get(id)?.name, cu: id => id === GR_NONE ? 'Cari bağlı değil' : X.CUM.get(id)?.name,
    user: id => id === GR_UNK ? 'Bilinmeyen' : X.UM.get(id)?.name, type: t => TYPE[t]?.[2], bill: b => b };
  const top = [[tab === 'fatura' ? 'Genel rapor — Faturalanabilir saat' : 'Genel rapor — Süre'], ['Dönem', R.per.label],
    ['Süzgeçler', GR_FKEYS.filter(k => f[k]).map(k => `${LBL[k]}: ${val[k](f[k]) || '—'}`).join(' · ') || 'Yok'], []];
  let sum;
  if (tab === 'fatura') {
    const rows = grBillRows(R), F = rows.reduce((a, r) => a + r.f, 0), N = rows.reduce((a, r) => a + r.n, 0);
    sum = [...top, ['Cari', 'Faturalanacak', 'Faturalanmayacak', 'Toplam', 'Oran %'],
      ...rows.map(r => [r.name + (r.pas ? ' (pasif)' : ''), grR2(r.f), grR2(r.n), grR2(r.t), grPct(r.f, r.t)]),
      ['TOPLAM', grR2(F), grR2(N), grR2(F + N), grPct(F, F + N)], [], ['Proje kırılımı'],
      ['Cari', 'Proje', 'Faturalanacak', 'Faturalanmayacak', 'Toplam', 'Oran %'],
      ...rows.flatMap(r => r.projs.map(x => [r.name, `${x.p.key} — ${x.p.name}${x.p.archived ? ' (arşivli)' : ''}`, grR2(x.f), grR2(x.n), grR2(x.t), grPct(x.f, x.t)]))];
  } else {
    const { rD, cD, rows, cols } = R;
    sum = [...top, [cD ? `${rD.l} / ${cD.l}` : rD.l, ...cols.map(c => cD.n(c)), 'Toplam'],
      ...rows.map(r => [rD.n(r), ...cols.map(c => grR2(R.cells.get(r)?.get(c) || 0)), grR2(R.rT.get(r))]),
      ['TOPLAM', ...cols.map(c => grR2(R.cT.get(c))), grR2(R.grand)]];
  }
  const det = R.logs.slice().sort((a, b) => a.w.date.localeCompare(b.w.date) || String(a.i.key).localeCompare(String(b.i.key)));
  const detail = [['Cari', 'Alan', 'Proje', 'Tarih', 'Kişi', 'İş', 'Açıklama', 'Tür', 'Faturalama', 'Saat'],
    ...det.map(({ w, i, p, cu }) => [cu === GR_NONE ? 'Cari bağlı değil' : (X.CUM.get(cu)?.name || ''), wsById(X.WS.get(p.id))?.name || '',
      p.name, trDate(w.date), X.UM.get(w.userId)?.name || 'Bilinmeyen', `${i.key} — ${i.summary}`, w.comment?.trim() || '',
      btypeOf(i), billOf(i), grR2(w.hours)]),
    ['', '', '', '', '', '', '', '', 'TOPLAM', grR2(R.grand)]];
  const blob = makeXlsx([{ name: 'Özet', rows: sum, widths: [34, 16, 16, 16, 16, 12] },
    { name: 'Detay', rows: detail, widths: [26, 18, 24, 12, 20, 36, 40, 12, 16, 10] }]);
  download(blob, `genel-rapor-${tab}-${R.per.file}.xlsx`);
  toast('Excel dosyası hazırlandı');
}

/* ---- olaylar: #view içinde tek yerden (yeniden çizimde kaybolmaz) ---- */
function grSet(fn) { fn(grF()); save(); render(); }
function wireGr() {
  const v = $('#view');
  v.addEventListener('click', e => {
    if (DB.ui.view !== 'greports') return;
    const t = e.target, q = s => t.closest(s);
    let b;
    if ((b = q('[data-grrange]'))) return grSet(f => { f.range = b.dataset.grrange; if (f.range === 'custom' && !f.from) { const p = grPeriod(); f.from = p.from; f.to = p.to; } });
    if ((b = q('[data-grm]'))) return grSet(f => { const n = +b.dataset.grm; f.month = n ? shiftMonth(grPeriod().month || TODAY.slice(0, 7), n) : TODAY.slice(0, 7); });
    if ((b = q('[data-grx]'))) return grSet(f => { delete f[b.dataset.grx]; });
    if (q('[data-grclear]')) return grSet(f => { GR_FKEYS.forEach(k => delete f[k]); GR.cell = null; });
    if (q('[data-grsheet]')) { GR.sheet = !GR.sheet; return render(); }

    if ((b = q('.gr-c[data-grr]'))) {

/* Basit tuzlu özet. Kriptografik güvenlik iddiası yoktur —
   parolanın düz metin durmasını engeller, o kadar. */
function pwHash(pw, salt) {
  let h = 2166136261 >>> 0;
  const s = salt + '|' + pw;
  for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; }
  let g = h;
  for (let r = 0; r < 512; r++) { g ^= g << 13; g >>>= 0; g ^= g >> 17; g ^= g << 5; g >>>= 0; }
  return (h.toString(36) + g.toString(36)).padStart(12, '0');
}
const slugName = n => n.toLowerCase()
  .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o')
  .replace(/[^a-z0-9]/g, '').slice(0, 12);

/* Kullanıcı adı: önce ad, çakışırsa ad+soyad, sonra sayı eki */
function makeUsername(name, taken) {
  const p = String(name).split(/\s+/).filter(Boolean);
  let base = slugName(p[0] || '') || 'kullanici';
  if (taken.has(base) && p.length > 1) base = slugName(p.join(''));
  let u = base, n = 2;
  while (taken.has(u)) u = base + n++;
  return u;
}

/* ---- hesapları hazırla (eski verilerde de çalışır) ---- */
function ensureAccounts() {
  const taken = new Set(DB.users.map(u => u.username).filter(Boolean));
  DB.users.forEach((u, k) => {
    if (!u.username) { u.username = makeUsername(u.name, taken); taken.add(u.username); }
    if (!u.role) u.role = k === 0 ? 'admin' : (k === DB.users.length - 1 ? 'viewer' : 'member');
    if (u.active === undefined) u.active = true;
  });
  if (!DB.users.some(u => (u.role === 'admin' || u.role === 'super') && u.active) && DB.users[0]) DB.users[0].role = 'admin';
}

    if (!q) return true;

            <span>${roleChip(r)}<span class="usub">${esc(ROLES[r][1])}</span></span></label>`).join('')}
        </div>

        <div class="sec">Çalışma alanları</div>
        <div class="usub" style="margin-bottom:8px">Kişi yalnızca üyesi olduğu çalışma alanlarını ve projelerini görür. Yönetici: projelerin tasarımını yönetir · Üye: iş açar, süre kaydeder · İzleyici: yalnız görür. Sistem yöneticisi her alanda Yöneticidir.</div>
        <div class="wsr-rows" id="ue_ws">
          ${wsRows.map(w => { const c = wsCur(w), nm = esc(w.name);
            return `<div class="wsr-row">${wsBadge(w, 'sm')}<span class="nm">${nm}</span>
              <select class="inp" data-uws="${esc(w.id)}" data-cur="${c}" aria-label="${nm}: rol" ${dis || (c === '__own' ? 'disabled' : '')}>
                ${c === '__own' ? '<option value="__own" selected>Sahip · Yönetici</option>' : ''}
                ${c === '__all' ? '<option value="__all" selected>Herkese açık (genel role göre)</option>' : ''}
                <option value="" ${c === '' ? 'selected' : ''}>Erişim yok</option>
                ${['admin', 'member', 'viewer'].map(k => `<option value="${k}" ${c === k ? 'selected' : ''}>${WS_ROLE_LBL[k]}</option>`).join('')}</select></div>`; }).join('') || '<span class="usub">Henüz çalışma alanı yok.</span>'}
        </div>

        ${isNew ? `<div class="sec">İlk giriş parolası</div>
          <div class="pwopts">
            <label><input type="radio" name="ue_pw" value="gen" checked> <b>Rastgele güçlü parola üret</b> <span class="usub">— önerilen; kaydedince bir kez gösterilir</span></label>
            <label><input type="radio" name="ue_pw" value="set"> <b>Parolayı ben belirleyeyim</b></label>
            <input class="inp" id="ue_pwv" placeholder="En az 8 karakter" style="margin:4px 0 6px 24px;max-width:280px;display:none">
            <label><input type="radio" name="ue_pw" value="def"> <b>Ortak başlangıç parolası</b> <span class="usub">(${esc(DEFAULT_PW || '—')})</span></label>
            <label style="margin-top:6px"><input type="checkbox" id="ue_mc" checked> İlk girişte kendi parolasını belirlemesini iste</label>
          </div>` : ''}
        <div id="ue_err" class="lg-err"></div>
      </div>

      ${u ? `<div class="m-r">
        <div class="sec">Hesap</div>
        <div class="kv">
          <span class="lb">Kullanıcı adı</span><span class="k">@${esc(u.username || '')}</span>
          <span class="lb">Son giriş</span><span>${m?.lastLoginAt ? fmtWhen(m.lastLoginAt) : 'hiç girmedi'}</span>
          <span class="lb">Açık oturum</span><span>${m ? m.sessions : '…'}</span>
          <span class="lb">Oluşturulma</span><span>${m?.createdAt ? fmtWhen(m.createdAt) : '—'}</span>
          <span class="lb">Parola</span><span>${(m?.mustChange ?? u.mustChange) ? '<span class="chip cat-inprogress">geçici, değiştirmesi bekleniyor</span>' : '<span class="chip lbl">kullanıcının kendi parolası</span>'}</span>
        </div>
        <div class="sec">Parola</div>
        <div class="usub" style="margin-bottom:8px">Parolalar şifrelenmiş saklanır; mevcut parola kimse tarafından görülemez. Yeni bir parola verebilirsiniz.</div>
        <div class="ued-actions">
          <button class="btn" id="ue_gen" ${dis}>🔑 Rastgele yeni parola üret</button>
          <button class="btn" id="ue_setpw" ${dis}>Parolayı ben belirleyeyim</button>
          <div id="ue_setbox" style="display:none;gap:6px;flex-direction:column">
            <input class="inp" id="ue_newpw" type="text" placeholder="Yeni parola (en az 8 karakter)" autocomplete="off">
            <label class="usub"><input type="checkbox" id="ue_newmc" checked> İlk girişte değiştirmesini iste</label>
            <button class="btn pri sm" id="ue_setok">Parolayı kaydet</button>
          </div>
          <div id="ue_pwres"></div>
        </div>
        <div class="sec">Oturum ve erişim</div>
        <div class="ued-actions">
          <button class="btn" id="ue_revoke" ${dis}>Tüm açık oturumlarını kapat</button>
          ${self ? '' : `<button class="btn" id="ue_toggle" ${dis}>${u.active ? '⏸ Hesabı pasifleştir' : '▶ Hesabı aktifleştir'}</button>
          <button class="btn danger" id="ue_del" ${dis || (u.system && !isSuper() ? 'disabled' : '')}>Kullanıcıyı sil</button>`}
        </div>
      </div>` : ''}
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button>
      ${locked ? '' : `<button class="btn pri" id="ue_ok">${isNew ? 'Kullanıcıyı oluştur' : 'Değişiklikleri kaydet'}</button>`}</div>`);

  let pickColor = color;
  const err = msg => { $('#ue_err').textContent = msg; };
  $$('[data-col]').forEach(b => b.onclick = () => { pickColor = b.dataset.col; $$('[data-col]').forEach(x => x.classList.toggle('on', x === b)); });
  $$('input[name="ue_r"]').forEach(r => r.onchange = () => $$('.rolecard').forEach(c => c.classList.toggle('on', c.contains(r) && r.checked)));
  const nameEl = $('#ue_n'), unEl = $('#ue_u'), iniEl = $('#ue_i');
  if (isNew) {
    nameEl.oninput = () => {
      if (!unEl.dataset.t) unEl.value = makeUsername(nameEl.value, new Set(DB.users.map(x => x.username)));
      if (!iniEl.dataset.t) iniEl.value = nameEl.value.trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toLocaleUpperCase('tr');
    };
    unEl.oninput = () => unEl.dataset.t = '1';
    iniEl.oninput = () => iniEl.dataset.t = '1';
    $$('input[name="ue_pw"]').forEach(r => r.onchange = () => { $('#ue_pwv').style.display = $('input[name="ue_pw"]:checked').value === 'set' ? '' : 'none'; });
  }

  const ok = $('#ue_ok');
  if (ok) ok.onclick = async () => {
    const n = nameEl.value.trim(), un = unEl.value.trim().toLowerCase(), em = $('#ue_e').value.trim(), ti = $('#ue_t').value.trim();
    const ini = (iniEl.value.trim() || n.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2)).toLocaleUpperCase('tr');
    const cap = parseFloat(String($('#ue_c').value).replace(',', '.'));
    const role = $('input[name="ue_r"]:checked')?.value || curRole;
    if (!n) return err('Ad soyad gerekli.');
    if (!/^[a-z0-9._-]{2,40}$/.test(un)) return err('Kullanıcı adı 2-40 karakter olmalı: küçük harf, rakam, nokta, tire.');
    if (DB.users.some(x => x.id !== u?.id && x.username?.toLowerCase() === un)) return err('Bu kullanıcı adı başka birinde.');
    if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return err('E-posta adresi geçersiz.');
    if (!/^[\p{L}\p{N}]{1,3}$/u.test(ini)) return err('Baş harfler 1-3 harf/rakam olmalı.');
    if (!(cap >= 0 && cap <= 168)) return err('Haftalık kapasite 0-168 saat arası olmalı.');
    let pwMode = 'gen', pwVal = '';
    if (isNew) {
      pwMode = $('input[name="ue_pw"]:checked').value; pwVal = $('#ue_pwv').value;
      if (pwMode === 'set' && pwVal.length < 8) return err('Parola en az 8 karakter olmalı.');
    }
    const target = u || { id: uid('u'), active: true, mustChange: true };
    const prev = { ...target };
    Object.assign(target, { name: n, username: un, ini, color: pickColor, capacity: cap });
    if (em) target.email = em; else delete target.email;
    if (ti) target.title = ti; else delete target.title;
    if (!self) target.role = role;
    if (isNew) DB.users.push(target);
    if (!DB.users.some(x => (x.role === 'admin' || x.role === 'super') && x.active)) {
      Object.assign(target, prev); if (isNew) DB.users.pop(); return err('En az bir aktif yönetici kalmalı.');
    }
    /* alan üyelikleri (22b): değişen satırlar. Herkese açık alan ilk kez kişiye rol verilince, var olan kişiler
       genel rolleriyle listeye alınır (kimsenin erişimi kopmasın). */
    $$('[data-uws]').forEach(sel => {
      const w = (DB.workspaces || []).find(x => x.id === sel.dataset.uws), v = sel.value;
      if (!w || v === sel.dataset.cur || v === '__all' || v === '__own') return;
      let list = wsLegacy(w) ? wsSeed().filter(m => m.userId !== target.id) : w.members.slice();
      list = list.filter(m => m.userId !== target.id);
      if (v) list.push({ userId: target.id, role: v });
      const o = wsOwner(w);
      if (o && !list.some(m => m.userId === o)) list.unshift({ userId: o, role: 'admin' });
      w.members = list;
    });
    /* Yeni kişi: üye listesi dolu eski projelere (herkese açık alanlarda) eskisi gibi eklenir. */
    if (isNew) DB.projects.forEach(p => { if (!p.archived && p.members?.length && wsLegacy(wsById(wsOf(p))) && !p.members.includes(target.id)) p.members.push(target.id); });
    ok.disabled = true;
    save();
    try { await flushAll(); } catch (e) { }
    if (SYNC_STATE !== 'ok') { ok.disabled = false; return err('Kaydedilemedi, bağlantıyı kontrol edip tekrar deneyin.'); }
    if (!isNew) { closeModal(); render(); loadUsersMeta(true); return toast('Kullanıcı güncellendi'); }
    /* yeni kullanıcı: parola */
    const mc = $('#ue_mc').checked;
    let shown = null;
    try {
      if (pwMode === 'gen') shown = (await API.post('/api/users/' + target.id + '/password', { generate: true, requireChange: mc })).password;
      else if (pwMode === 'set') { await API.post('/api/users/' + target.id + '/password', { password: pwVal, requireChange: mc }); shown = pwVal; }
      else if (!mc) await API.post('/api/users/' + target.id + '/password', { requireChange: false });
      else shown = DEFAULT_PW;
    } catch (e) { toast('Kullanıcı oluşturuldu ama parola ayarlanamadı: ' + e.message); }
    closeModal(); render(); loadUsersMeta(true);
    if (shown) showCredentials(target, shown, mc);
    else toast(n + ' eklendi');
  };

  if (!u) return;
  const pwBox = (pw, mc) => {
    $('#ue_pwres').innerHTML = `<div class="pwshow"><div class="usub">Yeni parola — bu pencereyi kapatınca bir daha gösterilmez:</div>
      <div class="pwline"><code id="ue_pwtxt">${esc(pw)}</code><button class="btn sm" id="ue_copy">Kopyala</button></div>
      <div class="usub">${mc ? 'Kullanıcı ilk girişte kendi parolasını belirleyecek.' : 'Kullanıcı bu parolayla giriş yapmaya devam edebilir.'} Açık oturumları kapatıldı.</div></div>`;
    $('#ue_copy').onclick = () => copyText(pw);
  };
  const gen = $('#ue_gen');
  if (gen) gen.onclick = async () => {
    if (!confirm(`${u.name} için yeni bir parola üretilsin mi? Eski parolası artık çalışmaz.`)) return;
    gen.disabled = true;
    try { await flushAll(); const r = await API.post('/api/users/' + u.id + '/password', { generate: true }); u.mustChange = true; SNAP.rec.users?.set(u.id, cj(u)); pwBox(r.password, true); loadUsersMeta(true); }
    catch (e) { toast('Parola üretilemedi: ' + e.message); }
    finally { gen.disabled = false; }
  };
  const sp = $('#ue_setpw'); if (sp) sp.onclick = () => { $('#ue_setbox').style.display = 'flex'; $('#ue_newpw').focus(); };
  const so = $('#ue_setok');
  if (so) so.onclick = async () => {
    const pw = $('#ue_newpw').value, mc = $('#ue_newmc').checked;
    if (pw.length < 8) return toast('Parola en az 8 karakter olmalı');
    try { await flushAll(); await API.post('/api/users/' + u.id + '/password', { password: pw, requireChange: mc });
      u.mustChange = mc; SNAP.rec.users?.set(u.id, cj(u)); $('#ue_setbox').style.display = 'none'; pwBox(pw, mc); loadUsersMeta(true); }
    catch (e) { toast('Parola kaydedilemedi: ' + e.message); }
  };
  const rv = $('#ue_revoke');
  if (rv) rv.onclick = async () => {
    try { const r = await API.post('/api/users/' + u.id + '/sessions/revoke'); toast(r.revoked ? `${r.revoked} oturum kapatıldı` : 'Açık oturum yoktu'); loadUsersMeta(true); }
    catch (e) { toast(e.message); }
  };
  const tg = $('#ue_toggle');
  if (tg) tg.onclick = async () => {
    const was = u.active;
    if (was && !confirm(`${u.name} pasifleştirilsin mi? Giriş yapamaz, açık oturumları kapanır. Verileri silinmez.`)) return;
    u.active = !was;
    if (!DB.users.some(x => (x.role === 'admin' || x.role === 'super') && x.active)) { u.active = was; return toast('En az bir aktif yönetici kalmalı'); }
    save(); await flushAll(); closeModal(); render(); loadUsersMeta(true);
    toast(u.active ? u.name + ' aktifleştirildi' : u.name + ' pasifleştirildi');
  };
  const dl = $('#ue_del');
  if (dl) dl.onclick = async () => {
    const n = DB.issues.filter(i => i.assignee === u.id).length;
    if (!confirm(`${u.name} silinsin mi?\n\n${n ? n + ' işin ataması boşalacak. ' : ''}Süre kayıtları ve yorumları korunur. ` +
      'Gerekirse Sistem › Çöp kutusu’ndan geri yüklenebilir.\n\nSadece erişimini kesmek istiyorsanız “pasifleştir” daha uygundur.')) return;
    DB.users = DB.users.filter(x => x.id !== u.id);
    DB.issues.forEach(i => { if (i.assignee === u.id) histSet(i, 'assignee', null); });
    DB.projects.forEach(p => { if (p.members?.includes(u.id)) p.members = p.members.filter(x => x !== u.id); });
    save(); await flushAll(); closeModal(); render(); loadUsersMeta(true); toast(u.name + ' silindi');
  };
}

function copyText(t) {
  const done = () => toast('Kopyalandı');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Kopyalanamadı, elle seçip kopyalayın'); }
    a.remove();
  }
}

    (mc ? '\nİlk girişte kendi parolanızı belirlemeniz istenecek.' : '');

    <div style="padding:18px">
      <p style="margin:0 0 12px;color:var(--ink2)">Giriş bilgilerini kullanıcıya iletin. <b>Parola bu pencereyi kapatınca bir daha gösterilmez.</b></p>
      <div class="kv" style="margin-bottom:12px">
        <span class="lb">Adres</span><span class="k">${esc(url)}</span>
        <span class="lb">Kullanıcı adı</span><span class="k">${esc(u.username)}</span>

  $('#credCopy').onclick = () => copyText(msg);
}

function newUserForm() {
  openModal(`<div class="m-h"><b>Kullanıcı ekle</b><button class="x" data-close>×</button></div>
    <div style="padding:16px 18px">
      <div class="form-row"><label class="field">Ad soyad</label><input class="inp" id="nu_n" placeholder="Ayşe Korkmaz"></div>
      <div class="form-2">
        <div class="form-row"><label class="field">Kullanıcı adı</label><input class="inp k" id="nu_u"></div>
        <div class="form-row"><label class="field">Rol</label><select class="inp" id="nu_r">
          ${Object.entries(ROLES).filter(([v]) => v !== 'super' || isSuper()).map(([v, [l]]) => `<option value="${v}" ${v === 'member' ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="form-row"><label class="field">Başlangıç parolası</label><input class="inp" id="nu_p" value="${esc(DEFAULT_PW)}"></div>
        <div class="form-row"><label class="field">Haftalık kapasite (saat)</label><input class="inp" id="nu_c" value="30"></div>
      </div>
      <div id="nu_err" class="lg-err"></div>
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="nu_ok">Ekle</button></div>`, 'narrow');
  $('#nu_n').oninput = e => { if (!$('#nu_u').dataset.t)
    $('#nu_u').value = makeUsername(e.target.value, new Set(DB.users.map(u => u.username))); };
  $('#nu_u').oninput = e => e.target.dataset.t = '1';
  $('#nu_ok').onclick = () => {
    const n = $('#nu_n').value.trim(), un = $('#nu_u').value.trim().toLowerCase();
    if (!n || !un) return $('#nu_err').textContent = 'Ad ve kullanıcı adı gerekli.';
    if (DB.users.some(u => u.username?.toLowerCase() === un)) return $('#nu_err').textContent = 'Bu kullanıcı adı kullanılıyor.';
    if (!/^[a-z0-9._-]{2,40}$/.test(un)) return $('#nu_err').textContent = 'Kullanıcı adı: küçük harf, rakam, nokta, tire (2-40).';
    if ($('#nu_p').value && $('#nu_p').value.length < 8) return $('#nu_err').textContent = 'Başlangıç parolası en az 8 karakter olmalı.';
    const colors = ['#1F6F5C', '#6B4FBB', '#C0392B', '#B45309', '#3E7BC4', '#2B7A78', '#8E44AD'];
    const nid = uid('u'), npw = $('#nu_p').value;
    DB.users.push({ id: nid, name: n, username: un, role: $('#nu_r').value,
      ini: n.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase(),
      color: colors[DB.users.length % colors.length], capacity: parseFloat($('#nu_c').value) || 30,
      active: true, mustChange: true });
    closeModal(); save(); render();
    (async () => {
      await flushAll();
      if (npw && npw !== DEFAULT_PW) {
        try { await API.post('/api/users/' + nid + '/password', { password: npw }); }
        catch (e) { return toast('Kullanıcı eklendi ama parola ayarlanamadı: ' + e.message); }
      }
      toast(n + ' eklendi · başlangıç parolası: ' + (npw || DEFAULT_PW));
    })();
  };
}

function wireUsers() {
  $$('[data-uname]').forEach(el => el.onchange = () => {
    const v = el.value.trim().toLowerCase();
    if (!v || DB.users.some(u => u.id !== el.dataset.uname && u.username?.toLowerCase() === v))
      { toast('Kullanıcı adı boş veya kullanılıyor'); return render(); }
    user(el.dataset.uname).username = v; save(); render();
  });
  $$('[data-urole]').forEach(el => el.onchange = () => {
    const u = user(el.dataset.urole), prev = u.role;
    u.role = el.value;
    if (!DB.users.some(x => (x.role === 'admin' || x.role === 'super') && x.active)) { u.role = prev; toast('En az bir aktif yönetici kalmalı'); }
    save(); render();
  });
  $$('[data-uactive]').forEach(c => c.onchange = () => {
    const u = user(c.dataset.uactive); u.active = c.checked;
    if (!DB.users.some(x => (x.role === 'admin' || x.role === 'super') && x.active)) { u.active = true; toast('En az bir aktif yönetici kalmalı'); }
    save(); render();
  });
  $$('[data-pwreset]').forEach(b => b.onclick = () => {
    const u = user(b.dataset.pwreset);
    if (!confirm(`${u.name} kullanıcısının parolası "${DEFAULT_PW}" olarak sıfırlansın mı?`)) return;
    (async () => {
      try { await flushAll(); await API.post('/api/users/' + u.id + '/password', {}); }
      catch (e) { return toast('Parola sıfırlanamadı: ' + e.message); }
      u.mustChange = true; SNAP.rec.users?.set(u.id, cj(u)); render(); toast('Parola sıfırlandı');
    })();
  });
  const my = $('#myPw'); if (my) my.onclick = () => changePwForm(false);
}


/* ============================================================
   Bölüm 10: BENİM İŞLERİM • PROJELER • ÜYELİK
   ============================================================ */

/* Projenin atanabilir (aktif) kişileri. Üyeli alanda alanın Yönetici/Üye rolündeki kişileri (sahip dahil, izleyici
   hariç; proje üye listesi değil — sunucudaki store.js assignable ile aynı). Eski (üyesiz) alanda projenin üye listesi;
   liste tanımsızsa herkes. */
const wsMembersOf = w => DB.users.filter(u => u.active && !u.system
  && (wsOwner(w) === u.id || w.members.some(m => m && m.userId === u.id)));
const memsOf = p => {
  const w = p ? wsById(wsOf(p)) : null;
  if (w && !wsLegacy(w)) return wsMembersOf(w).filter(u => wsAtLeast(wsRole(u, w), 'member'));
  return (p?.members?.length ? DB.users.filter(u => p.members.includes(u.id)) : DB.users).filter(u => u.active && !u.system);
};
const projUsers = () => memsOf(P());
const isMember = (p, id = SESSION) => (id === SESSION && isSuper()) || !p?.members?.length || p.members.includes(id);

function ensureProjects() {
  DB.projects.forEach(p => { if (!p.members?.length) p.members = DB.users.map(u => u.id); });
}

/* ============================ BENİM İŞLERİM (issue #9) ============================
   docs/tasarim/benim-islerim: kişiye atanmış açık işler tarih gruplarında. "Bugün" her çizimde
   yeniden hesaplanır (TODAY sayfa açılışında sabittir); hafta çizelgedeki seçili haftadan bağımsızdır. */
function toolbarHome() {
  /* İş oluşturma proje ekranlarında, yeni proje çalışma alanında, süre kaydı kartlarda ("Süre gir"); kısayollar c / w çalışır. */
  return `<div class="spacer"></div>
    <span style="font-size:12px;color:var(--ink3)">${new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' })}</span>`;
}

const HM_MON = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const hmDay = s => new Date(s + 'T12:00');                // yerel öğlen: saat dilimi kayması olmaz
/* Tarih alanının gün kısmı; geçersizse '' (tarihsiz sayılır, çizim çökmez). */
const day10 = x => { const s = String(x || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(hmDay(s)) ? s : ''; };
const hmDM = s => { const d = hmDay(s); return isNaN(d) ? esc(s) : `${d.getDate()} ${HM_MON[d.getMonth()]}`; };
/* Kısa tarih: "Cum 20 Kas" */
const hmDate = s => { const d = hmDay(s); return isNaN(d) ? esc(s) : `${DAYS[(d.getDay() + 6) % 7]} ${hmDM(s)}`; };
/* Bu takvim haftası Pzt–Pz (weekDays() çizelgenin seçili haftasıdır, ona dokunulmaz). */
const homeWeek = today => { const m = monday(hmDay(today)); return Array.from({ length: 7 }, (_, k) => iso(addD(m, k))); };
/* Gösterim sırası; atama sırası homeBuckets içinde (Beklemede önce kazanır). */
const HM_GROUPS = [
  { id: 'late', t: 'Gecikmiş', ic: 'alert' }, { id: 'today', t: 'Bugün', ic: 'sun' }, { id: 'week', t: 'Bu hafta', ic: 'cal' },
  { id: 'later', t: 'Daha sonra', ic: 'later' }, { id: 'nodate', t: 'Tarihsiz', ic: 'nodate' }, { id: 'wait', t: 'Beklemede', ic: 'pause' },
];
const HM_LIMIT = 50;
const HM_MORE = new Set();                                 // "Tümünü göster" açılan gruplar (oturum boyunca)
/* İşin kendi projesinin durum sırasında sonraki durum; son ya da silinmiş durumda yok. */
const nextStatus = i => { const l = statsOf(i.projectId), k = l.findIndex(s => s.id === i.statusId);
  return k >= 0 && k < l.length - 1 ? l[k + 1] : null; };

/* Saf hesap (DOM yok): kapsam, gruplar, engelleyenler, özet. proj görünmüyorsa '' (Tümü) sayılır.
   ws (#22): seçili çalışma alanı; yoksa/arşivliyse '' (Tümü). proj seçili alanda değilse '' sayılır. */
function homeBuckets(meId, proj, today, ws = '') {
  const week = homeWeek(today), sun = week[6];
  const byId = new Map(DB.issues.map(i => [i.id, i]));
  const sts = new Map(DB.statuses.map(s => [s.id, s]));
  const projs = new Map(DB.projects.map(p => [p.id, p]));
  const cat = i => sts.get(i.statusId)?.cat || 'todo';   // silinmiş durum stat() gibi "todo"
  const visible = p => !!p && !p.archived && canSeeProject(p) && !wsArchived(wsOf(p));
  const all = DB.issues.filter(i => i.assignee === meId && i.type !== 'epic' && cat(i) !== 'done' && visible(projs.get(i.projectId)));
  /* Engelleme: links {from, to, type:'blocks'} — from açıkken to Beklemede. */
  const blocker = new Map();
  for (const l of DB.links || []) {
    if (!l || l.type !== 'blocks' || blocker.has(l.to)) continue;
    const f = byId.get(l.from);
    if (f && f.id !== l.to && cat(f) !== 'done') blocker.set(l.to, f);
  }
  const wsCounts = new Map();
  all.forEach(i => { const w = wsOf(projs.get(i.projectId)); wsCounts.set(w, (wsCounts.get(w) || 0) + 1); });
  ws = ws && wsById(ws) && !wsArchived(ws) ? ws : '';
  const inWs = ws ? all.filter(i => wsOf(projs.get(i.projectId)) === ws) : all;
  proj = proj && visible(projs.get(proj)) && (!ws || wsOf(projs.get(proj)) === ws) ? proj : '';
  const list = proj ? inWs.filter(i => i.projectId === proj) : inWs;
  const groups = Object.fromEntries(HM_GROUPS.map(g => [g.id, []]));
  for (const i of list) {
    const due = day10(i.due), start = day10(i.start);
    groups[blocker.has(i.id) ? 'wait'
      : due && due < today ? 'late'
      : due === today || (start && start <= today && (!due || due >= today)) ? 'today'
      : due && due <= sun ? 'week'
      : due || (start && start > today) ? 'later'
      : 'nodate'].push(i);
  }
  const rk = x => Number.isFinite(+x.rank) ? +x.rank : 0;
  const cmp = (a, b) => lvl(a.priority) - lvl(b.priority)
    || (day10(a.due) || '9999').localeCompare(day10(b.due) || '9999') || rk(a) - rk(b);
  Object.values(groups).forEach(g => g.sort(cmp));
  const days = new Set(week);
  const hours = DB.worklogs.filter(w => w.userId === meId && days.has(day10(w.date))
    && (proj ? byId.get(w.issueId)?.projectId === proj
      : !ws || wsOf(projs.get(byId.get(w.issueId)?.projectId)) === ws)).reduce((a, w) => a + (+w.hours || 0), 0);
  const counts = new Map();
  inWs.forEach(i => counts.set(i.projectId, (counts.get(i.projectId) || 0) + 1));
  const lateMax = groups.late.reduce((m, i) => Math.max(m, workdaysBetween(day10(i.due), today)), 0);
  return { all, inWs, list, proj, ws, wsCounts, groups, blocker, week, hours, counts, lateMax, nProj: new Set(list.map(i => i.projectId)).size };
}

function homeRow(i, c) {
  const st = stat(i.statusId), id = esc(i.id), key = esc(i.key);
  const due = day10(i.due), start = day10(i.start);
  let dc = '', di = 'cal', dt, dtl = 'Bitiş';
  if (due && due < c.today) { dc = 'd-late'; di = 'alert'; dt = `${workdaysBetween(due, c.today)} gün gecikme`; dtl = `Bitiş ${hmDate(due)} · gecikme iş günü olarak`; }
  else if (due && due === c.today) { dc = 'd-today'; di = 'clock'; dt = 'Bugün'; dtl = 'Bitiş bugün'; }
  else if (due) dt = hmDate(due);
  else if (start) { dt = 'Başlangıç ' + hmDM(start); dtl = 'Başlangıç'; }
  else { dc = 'd-none'; di = 'nodate'; dt = 'Tarih yok'; dtl = 'Bitiş tarihi yok'; }
  const sub = [`<span class="k">${key}</span>`, `<span class="pj">${ic('folder')}${esc(projName(i.projectId))}</span>`];
  const rem = +remaining(i) || 0;
  if (rem > 0) sub.push(`<span class="rem" title="Kalan süre">${ic('hour')}${efFmtSafe(rem)} kalan</span>`);
  const bl = c.blocker.get(i.id);
  if (bl) { const p = DB.projects.find(x => x.id === bl.projectId), see = p && canSeeProject(p);
    sub.push(`<span class="blk" title="Engelleyen iş">${ic('link')}Bekliyor: ${see
      ? `<span class="k">${esc(bl.key)}</span> ${esc(bl.summary)}` : 'erişemediğin bir iş'}</span>`); }
  const nx = c.edit ? nextStatus(i) : null;
  const adv = nx
    ? `<button type="button" class="hm-btn hm-adv ${nx.cat === 'done' ? 'to-done' : ''}" data-hmadv="${id}" data-hmto="${esc(nx.id)}"
        title="İlerlet: ${esc(st.name)} → ${esc(nx.name)}" aria-label="İlerlet: ${esc(nx.name)} durumuna geçir">${ic(nx.cat === 'done' ? 'checkc' : 'arrow')}<span>${esc(nx.name)}</span></button>`
    : '<span class="hm-btn hm-adv none" aria-hidden="true"></span>';
  return `<div class="hm-row" data-hmrow="${id}">
    ${c.edit ? `<button type="button" class="hm-tick" data-complete="${id}" title="Tamamla" aria-label="Tamamla: ${key}">${ic('check')}</button>`
      : '<span class="hm-ro-dot"></span>'}
    <div class="hm-main"><button type="button" class="hm-t" data-open="${id}" title="${esc(i.summary)}">${esc(i.summary)}</button>
      <div class="hm-sub">${sub.join('<span class="hm-sep"></span>')}</div></div>
    <div class="hm-meta">${priBadge(i, c.edit)}<span class="hm-due ${dc}" title="${dtl}">${ic(di)}${dt}</span><span class="hm-st s-${esc(st.cat)}"><i></i>${esc(st.name)}</span></div>
    ${c.edit ? `<div class="hm-act">${adv}
      <button type="button" class="hm-btn hm-log" data-hmlog="${id}" title="Süre gir" aria-label="Süre gir: ${key}">${ic('timeplus')}<span>Süre gir</span></button>
      ${cardAv(i, true)}</div>` : ''}
  </div>`;
}

function renderHome() {
  const me = CU(), today = iso(new Date()), edit = canEdit();
  const B = homeBuckets(me.id, DB.ui.homeProj || '', today, DB.ui.homeWs || '');
  /* kayıtlı süzgeç artık görünmüyor (arşiv, üyelik, silme): Tümü'ye kalıcı düş, proje geri gelince kendiliğinden dönmesin */
  if (DB.ui.homeProj && !B.proj) { DB.ui.homeProj = ''; save(); }
  if (DB.ui.homeWs && !B.ws) { DB.ui.homeWs = ''; save(); }
  const c = { today, edit, blocker: B.blocker };
  const pname = id => projName(id);

  const chipIds = DB.projects.filter(p => B.counts.has(p.id) || p.id === B.proj).map(p => p.id);

  /* Alan satırı (#22): yalnız açık işim olan alanlar; tek alan varsa çizilmez (görünüm eskisi gibi). */
  const wsIds = wsAll().filter(w => B.wsCounts.has(w.id) || w.id === B.ws).sort(wsSort);
  const wchip = (w, n) => `<button type="button" class="hm-pf ${w ? 'ws' : ''} ${B.ws === (w?.id || '') ? 'on' : ''}" data-hmws="${esc(w?.id || '')}" aria-pressed="${B.ws === (w?.id || '')}">
      ${w ? wsBadge(w, 'sm') : ''}<span class="t">${w ? esc(w.name) : 'Tümü'}</span><span class="n">${n}</span></button>`;
  const filter = wsIds.length > 1 || B.ws
    ? `<div class="ws-hf"><span class="lbl" id="hf-a">Alan</span>
        <div class="ws-row" role="group" aria-labelledby="hf-a">${wchip(null, B.all.length)}${wsIds.map(w => wchip(w, B.wsCounts.get(w.id) || 0)).join('')}</div>
        ${pChips ? `<span class="lbl" id="hf-p">Proje</span><div class="ws-row r2" role="group" aria-labelledby="hf-p">${pChips}</div>` : ''}</div>`
    : pChips ? `<div class="hm-filter" role="group" aria-label="Proje süzgeci"><span class="lbl">Proje</span>${pChips}</div>` : '';

  const nLate = B.groups.late.length, cap = capOf(me);
  const pct = cap ? Math.round(B.hours / cap * 100) : 0;
  const [w0, w6] = [B.week[0], B.week[6]];
  const range = hmDay(w0).getMonth() === hmDay(w6).getMonth() ? `${hmDay(w0).getDate()}–${hmDM(w6)}` : `${hmDM(w0)}–${hmDM(w6)}`;
  const sum = `<div class="hm-sum">
    <div class="hm-stat"><span class="hm-stat-ic">${ic('layers')}</span><div class="hm-stat-b">
      <div class="hm-stat-l">Açık iş</div><div class="hm-stat-v" data-hmsum="open">${B.list.length}</div>
      <div class="hm-stat-s">${B.nProj ? `${B.nProj} projede` : 'Atanmış açık iş yok'}</div></div></div>
    <div class="hm-stat ${nLate ? 'is-late' : 'is-zero'}"><span class="hm-stat-ic">${ic(nLate ? 'alert' : 'checkc')}</span><div class="hm-stat-b">
      <div class="hm-stat-l">Gecikmiş</div><div class="hm-stat-v" data-hmsum="late">${nLate}</div>
      <div class="hm-stat-s">${nLate ? `en eskisi ${B.lateMax} iş günü` : 'Gecikmiş iş yok'}</div></div></div>
    <div class="hm-stat wk"><span class="hm-stat-ic">${ic('clock')}</span><div class="hm-stat-b">
      <div class="hm-stat-l">Bu hafta girilen süre <span>· ${range}</span></div>
      <div class="hm-stat-v" data-hmsum="week">${efFmtSafe(B.hours)}${cap ? ` <small>/ ${efFmtSafe(cap)}</small>` : ''}</div>
      ${cap ? `<div class="hm-cap"><span class="hm-bar ${pct > 100 ? 'over' : ''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"
        aria-label="Haftalık kapasite"><i style="width:${Math.min(100, pct)}%"></i></span><b data-hmsum="pct">%${pct}</b></div>` : ''}</div></div>
  </div>`;

  const grp = g => {
    const rows = B.groups[g.id]; if (!rows.length) return '';
    const cut = rows.length > HM_LIMIT && !HM_MORE.has(g.id);
    return `<section class="hm-grp g-${g.id}" data-hmgrp="${g.id}" aria-labelledby="hmg-${g.id}">

        ? `<button type="button" class="hm-more" data-hmmore="${g.id}">${ic('down')}Tümünü göster · ${rows.length - HM_LIMIT} iş daha</button>` : ''}</div>
    </section>`;
  };

  let body;
  if (!B.all.length) body = `<div class="hm-empty"><span class="hm-empty-ic">${ic('inbox')}</span>
      <h3>Sana atanmış açık iş yok</h3><p>${edit ? 'Yeni bir iş oluşturabilir ya da projelere göz atıp kendine iş alabilirsin.' : 'Projelere göz atabilirsin.'}</p>

        : `<h3>Bu çalışma alanında sana atanmış açık iş yok</h3><p>Süzgeç: <b>${esc(wsById(B.ws)?.name || '')}</b>. Diğer alanlarda ${B.all.length} açık işin var.</p>`}
      <div class="acts"><button type="button" class="btn" data-hmproj="" data-hmall>Tüm projeleri göster</button></div></div>`;
  else body = HM_GROUPS.map(grp).join('');

  return `<div class="hm-c" id="hmHome">
    ${edit ? '' : `<div class="hm-ro-note">${ic('eye')}İzleyici olarak görüntülüyorsun; işleri değiştiremezsin.</div>`}

}

/* İlerlet: işin projesinin durum sırasında bir sonraki. Sprint/rank ataması yok (panodaki sürüklemeden farkı). */
function homeAdvance(id, to) {
  if (!canEdit()) return;
  const i = issue(id); if (!i) return;
  const nx = nextStatus(i);
  /* bu arada durumlar değişmiş (sonraki durum yok/başka ya da silinmiş): işlem yok, güncel hâli göster */
  if (!nx || nx.id !== to || !DB.statuses.some(s => s.id === to)) {
    toast('Durumlar değişti, yeniden deneyin', { warn: true }); return render(); }
  const was = i.statusId, me = i.assignee || null, near = homeNeighbors(i.id);
  setStatus(i, nx.id); save(); render();
  const now = i.assignee || null, items = [{ id: i.id, f: 'statusId', was, now: i.statusId }];
  /* Otomasyon başkasına atadıysa iş yine listeden düşer: durum önce, atanan sonra geri yazılır. */
  if (now !== me) { items.push({ id: i.id, f: 'assignee', was: me, now });
    const u = user(now);
    homeUndo(`${i.key} ${stat(i.statusId).name} durumuna geçti, ${u ? u.name + ' kişisine atandı' : 'ataması kaldırıldı'}; listenden çıktı.`, items); }
  else if (stat(i.statusId).cat === 'done') homeUndo(`${i.key} ${stat(i.statusId).name} olarak işaretlendi.`, items);
  homeRefocus(i.id, '[data-hmadv]', near);
}
/* Satır listeden düşerken odak BODY'ye kaçmasın: aynı gruptaki sonraki, yoksa önceki satırın id'si (render'dan önce). */
function homeNeighbors(id) {
  const r = $(`[data-hmrow="${CSS.escape(id)}"]`);
  const rows = r ? [...r.parentElement.children].filter(x => x.dataset.hmrow) : [], k = rows.indexOf(r);
  return k < 0 ? [] : [rows[k + 1], rows[k - 1]].filter(Boolean).map(x => x.dataset.hmrow);
}
/* render'dan sonra: satır duruyorsa kendi düğmesi; yoksa komşu satırın aynı türden düğmesi; o da yoksa "Geri al". */
function homeRefocus(id, sel, near) {
  const at = rid => $(`[data-hmrow="${CSS.escape(rid)}"] ${sel}`);
  const el = at(id) || near.map(at).find(Boolean) || $('#toast.on .toast-undo');
  el?.focus({ preventScroll: true });
}
/* Listeden düşen iş için "Geri al". Önceki değer kapanışta tutulur. Denetimden önce bekleyen değişiklikler
   gönderilir ve başkalarınınki çekilir; iş hâlâ varsa ve alan hâlâ bizim yazdığımız değerse geri yazılır
   (setStatus/setAssignee: geçmiş + otomasyon), değilse uyarı. Bu sırada ikinci tıklama yok sayılır. */
function homeUndo(msg, items) {
  let busy = false;
  toast(msg, { label: 'Geri al', fn: async () => {
    if (busy) return; busy = true;
    try { await flushAll(); await poll(); } catch { /* ağ hatası: eldeki en güncel hâlle denetle */ }
    const head = items[0], i0 = issue(head.id);
    if (!canEdit() || !i0 || (i0[head.f] || null) !== (head.now || null))
      return toast(`${i0 ? i0.key : 'İş'} bu arada değişti, geri alınamadı.`, { warn: true });

  }

  const m = $('#navPop'), r = btn.getBoundingClientRect(), side = kind === 'recent' && innerWidth > 900 && !!btn.closest('#rail');
  const left = side ? r.right + 6 : Math.min(r.left, innerWidth - m.offsetWidth - 8);
  const top = side ? r.top : kind === 'more' ? r.top - m.offsetHeight - 6 : r.bottom + 4;
  m.style.left = Math.max(8, left) + 'px';
  m.style.top = Math.max(8, Math.min(top, innerHeight - m.offsetHeight - 8)) + 'px';

/* Sol menü tıklamaları (olay devri): alan aç/kapa, diğer alanlar, menüler, özelleştirme, "Tüm projeler (n)". */
function navClick(e) {
  const t = e.target; if (!(t instanceof Element)) return;
  const b = t.closest('[data-wstog],[data-wsother],[data-navrecent],[data-navws],[data-navmore],[data-navcz],[data-wsall]'); if (!b) return;
  const d = b.dataset;
  /* Alan adı: alan sayfasını açar (ağaçta da açılır); zaten o alanın sayfasındaysa ağacı aç/kapa (22b). */
  if ('wstog' in d) {
    if (DB.ui.view === 'workspace' && DB.ui.workspace === d.wstog) { wsOpenSet(d.wstog, !wsIsOpen(d.wstog)); save(); return renderRail(); }
    return openWsPage(d.wstog);
  }
  if ('wsother' in d) { RAIL.other = !RAIL.other; return renderRail(); }
  if ('navrecent' in d) return b.closest('#navPop') ? undefined : navPopOpen(b, 'recent');
  if ('navws' in d) return navPopOpen(b, 'ws');
  if ('navmore' in d) return navPopOpen(b, 'more');
  if ('navcz' in d) { navDrawer(false); return navCustomize(); }
  if ('wsall' in d) {
    e.preventDefault(); navDrawer(false);
    if (!isAdmin()) return openWsPage(d.wsall);
    DB.ui.view = 'projects'; save(); render();
    const g = document.querySelector(`[data-wsgrp="${CSS.escape(d.wsall)}"]`);
    if (g) { g.tabIndex = -1; g.scrollIntoView({ block: 'start' }); g.focus({ preventScroll: true }); }

}
/* Dar ekranda "Proje ▾": çekmeceyi açar, seçili projeye (alanı kapalıysa açarak) odaklanır. */
function navToProj() {

}

/* ---- "Kenar çubuğunu özelleştir": taslak kopya üzerinde; Kaydet DB.ui.nav'a yazar, Vazgeç / Esc atar ---- */
let CZ = null;
function navCustomize() {
  navPopClose(false);
  const c = navCfg();
  CZ = { order: [...c.order], hidden: new Set(c.hidden), drag: null };
  openModal(`<div class="m-h"><b id="cz_t">Kenar çubuğunu özelleştir</b><button class="x" data-close aria-label="Kapat">×</button></div>
    <div class="nv-czb"><p>Seçili öğeler kenar çubuğunda her zaman görünür; seçmediklerin <b>"Daha fazla"</b> menüsünde. Değişiklikler yalnız seni etkiler.</p>
      <div class="nv-cz-h">Kenar çubuğu öğeleri <span id="cz_n"></span></div>
      <ul class="nv-cz" id="cz_l" aria-label="Kenar çubuğu öğeleri"></ul>
      <div class="ws-sr" id="cz_live" role="status" aria-live="polite"></div></div>
    <div class="m-f"><button type="button" class="btn ghost" id="cz_reset">${ic('reset')}Varsayılana dön</button><span class="spacer"></span>
      <button type="button" class="btn" data-close>Vazgeç</button><button type="button" class="btn pri" id="cz_ok">Değişiklikleri kaydet</button></div>`, 'narrow nv-dlg');
  wsDialog('cz_t');
  czDraw();
  const box = $('#scrim .modal');
  box.addEventListener('click', e => {
    const t = e.target; if (!CZ) return;
    const ch = t.closest('[data-czchk]'); if (ch) return czToggle(ch.dataset.czchk);
    const mv = t.closest('[data-czmv]');
    if (mv) { if (mv.disabled) return; const k = mv.dataset.czk, i = CZ.order.indexOf(k);
      czPopClose(); return czMove(k, mv.dataset.czmv === 'top' ? 0 : i + (mv.dataset.czmv === 'up' ? -1 : 1), `[data-czmore="${k}"]`); }
    const mo = t.closest('[data-czmore]'); if (mo) return czPop(mo);
    if (t.closest('#cz_reset')) {
      CZ.order = NAV_MOVABLE.filter(navAvail); CZ.hidden = new Set(); czDraw('#cz_reset');
      $('#cz_live').textContent = 'Varsayılan sıra yüklendi; kalıcı olması için kaydet'; return;
    }
    if (t.closest('#cz_ok')) { navSave(CZ.order, [...CZ.hidden]); CZ = null; closeModal(); save(); render(); toast('Kenar çubuğu kaydedildi'); }
  });
  box.addEventListener('keydown', e => {
    if (!CZ) return;
    const g = e.target.closest?.('[data-czgrip]');
    if (g && e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault(); const k = g.dataset.czgrip; return czMove(k, CZ.order.indexOf(k) + (e.key === 'ArrowUp' ? -1 : 1));
    }
    const c = e.target.closest?.('[data-czchk]');
    if (c && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); czToggle(c.dataset.czchk); }
  });
  box.addEventListener('mousedown', e => { if ($('#czPop') && !e.target.closest('#czPop, [data-czmore]')) czPopClose(); });
  /* fareyle sürükle-bırak (sabit satırlar sürüklenmez; bırakılan yer sabit satırsa yanına) */
  box.addEventListener('dragstart', e => { const r = e.target.closest?.('[data-czrow][draggable="true"]'); if (!r || !CZ) return;
    CZ.drag = r.dataset.czrow; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', CZ.drag); });
  box.addEventListener('dragover', e => { if (CZ?.drag && e.target.closest?.('[data-czrow]')) e.preventDefault(); });
  box.addEventListener('drop', e => { const r = e.target.closest?.('[data-czrow]'); if (!CZ?.drag || !r) return;
    e.preventDefault(); const k = CZ.drag, tk = r.dataset.czrow; CZ.drag = null;
    czMove(k, tk === 'home' ? 0 : tk === 'ws' ? 1 : CZ.order.indexOf(tk)); });
  box.addEventListener('dragend', () => { if (CZ) CZ.drag = null; });
  box.querySelector('[data-czchk]')?.focus();
}
function czDraw(focus) {
  const full = navFull(CZ.order);
  $('#cz_n').textContent = `${full.length} öğe · ${full.filter(k => !CZ.hidden.has(k)).length} görünür`;
  $('#cz_l').innerHTML = full.map((k, i) => {
    const it = NAV_ITEMS[k], on = !CZ.hidden.has(k);
    if (it.fixed) return `<li class="nv-cz-r fixed" data-czrow="${k}"><span></span>
      <span class="nv-chk" role="checkbox" aria-checked="true" aria-disabled="true" aria-label="${it.t} kenar çubuğunda görünsün (sabit)"><i>${ic('check')}</i></span>
      ${ic(it.ic)}<span class="nm">${it.t}</span><span class="hint lock">${ic('lock')}Sabit</span><span></span></li>`;
    return `<li class="nv-cz-r ${on ? '' : 'off'}" data-czrow="${k}" draggable="true">
      <button type="button" class="nv-grip" data-czgrip="${k}" aria-label="${it.t}: sırayı değiştir (Alt+↑/↓), ${i + 1}. sırada">${ic('grip')}</button>
      <span class="nv-chk" role="checkbox" tabindex="0" data-czchk="${k}" aria-checked="${on}" aria-label="${it.t} kenar çubuğunda görünsün"><i>${ic('check')}</i></span>
      ${ic(it.ic)}<span class="nm">${it.t}</span>
      <span class="hint">${on ? '' : ic('hidden') + 'Daha fazla menüsünde'}</span>
      <button type="button" class="nv-ib" data-czmore="${k}" aria-label="${it.t}: seçenekler" aria-haspopup="menu" aria-expanded="false">${ic('more')}</button></li>`;
  }).join('');
  if (focus) $('#scrim .modal')?.querySelector(focus)?.focus();
}
function czToggle(k) {
  if (!NAV_MOVABLE.includes(k)) return;
  CZ.hidden.has(k) ? CZ.hidden.delete(k) : CZ.hidden.add(k);
  czDraw(`[data-czchk="${k}"]`);
}
function czMove(k, to, focus) {
  const o = CZ.order, i = o.indexOf(k); to = Math.max(0, Math.min(o.length - 1, to));
  if (i < 0 || to === i) return;
  o.splice(i, 1); o.splice(to, 0, k);
  czDraw(focus || `[data-czgrip="${k}"]`);
  $('#cz_live').textContent = `${NAV_ITEMS[k].t} ${navFull(o).indexOf(k) + 1}. sıraya taşındı`;
}
function czPopClose(focus) {
  const m = $('#czPop'); if (!m) return;
  const b = m.parentElement?.querySelector('[data-czmore]'); m.remove();
  b?.setAttribute('aria-expanded', 'false'); if (focus) b?.focus();
}
function czPop(btn) {
  const open = $('#czPop'), same = open && open.parentElement === btn.parentElement;
  czPopClose(); if (same) return btn.focus();
  const k = btn.dataset.czmore, i = CZ.order.indexOf(k), last = CZ.order.length - 1;
  btn.insertAdjacentHTML('afterend', `<div class="nv-pop nv-czpop" id="czPop" role="menu" aria-label="${NAV_ITEMS[k].t}: taşı">
    <button type="button" class="nv-mi" role="menuitem" data-czmv="up" data-czk="${k}" ${i === 0 ? 'disabled' : ''}>${ic('mvup')}Yukarı taşı</button>
    <button type="button" class="nv-mi" role="menuitem" data-czmv="down" data-czk="${k}" ${i === last ? 'disabled' : ''}>${ic('mvdn')}Aşağı taşı</button>
    <button type="button" class="nv-mi" role="menuitem" data-czmv="top" data-czk="${k}" ${i === 0 ? 'disabled' : ''}>${ic('mvtop')}En üste taşı</button></div>`);
  btn.setAttribute('aria-expanded', 'true');
  const m = $('#czPop'); menuKeys(m, f => czPopClose(f));
  m.querySelector('button:not(:disabled)')?.focus();
}

/* ---- açılır menüler: ↑↓ Home End ile gezinme, Esc kapatır ve odağı düğmeye verir, Tab kapatır ---- */
function menuKeys(m, close) {
  m.onkeydown = e => {
    const items = [...m.querySelectorAll('button:not(:disabled)')], k = items.indexOf(document.activeElement);
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); return close(true); }
    if (e.key === 'Tab') return close(false);
    const to = { ArrowDown: k + 1, ArrowUp: k - 1, Home: 0, End: items.length - 1 }[e.key];
    if (to === undefined || !items.length) return;
    e.preventDefault(); items[(to + items.length) % items.length].focus();
  };
}
function wsPopClose(pop, focus) {
  if (!pop || pop.hidden) return;
  pop.hidden = true;
  const b = pop.previousElementSibling; b?.setAttribute('aria-expanded', 'false');
  if (focus) b?.focus();
  if (RERENDER) setTimeout(tryRerender, 0);
}
function wsPopToggle(btn) {
  const pop = btn.nextElementSibling; if (!pop) return;
  if (!pop.hidden) return wsPopClose(pop, true);
  $$('.ws-pop:not([hidden])').forEach(x => wsPopClose(x));
  pop.hidden = false; btn.setAttribute('aria-expanded', 'true');
  menuKeys(pop, f => wsPopClose(pop, f));
  pop.querySelector('button:not(:disabled)')?.focus();
}

function wireWsSwitch() {
  document.addEventListener('mousedown', e => {
    const open = document.querySelector('.ws-pop:not([hidden])');
    if (open && !open.parentElement.contains(e.target)) wsPopClose(open);
  });
  document.addEventListener('click', wsClick);
  document.addEventListener('click', cuClick);
  document.addEventListener('keydown', cuKey);
  document.addEventListener('change', cuChange);
  document.addEventListener('input', cuInput);
}

/* Alan işlemleri tek yerden (olay devri): Projeler ekranı, boş durumlar, sol menü, dar ekran penceresi. */
function wsClick(e) {
  const t = e.target; if (!(t instanceof Element)) return;
  const mi = t.closest('.ws-pop .ws-mi');
  if (mi && !mi.disabled) wsPopClose(mi.closest('.ws-pop'));
  const more = t.closest('[data-wsmore]'); if (more) return wsPopToggle(more);
  const b = t.closest('[data-wsnew],[data-wsnewproj],[data-wsedit],[data-wsarch],[data-wsunarch],[data-wsdel],[data-movproj],[data-ptypedlg],[data-wsarchtog],[data-wspick],[data-wsmanage]');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if ('wspick' in d) return pickWs(d.wspick);
  if ('wsmanage' in d) { navDrawer(false); DB.ui.view = 'projects'; save(); return render(); }
  if ('wsnew' in d) { closeModal(); navDrawer(false); return wsForm(); }
  if ('wsnewproj' in d) return newProjectForm({ workspaceId: d.wsnewproj });
  if ('wsedit' in d) return wsForm(d.wsedit);
  if ('wsarch' in d) return wsSetArchived(d.wsarch, true);
  if ('wsunarch' in d) return wsSetArchived(d.wsunarch, false);
  if ('wsdel' in d) return wsDelete(d.wsdel);
  if ('movproj' in d) return moveProjectForm(d.movproj);
  if ('ptypedlg' in d) return typeDialog(d.ptypedlg);
  if ('wsarchtog' in d) { DB.ui.showArchivedWs = !DB.ui.showArchivedWs; save(); render(); $('[data-wsarchtog]')?.focus(); }
}

const wsDialog = (labelId) => { const m = $('#scrim .modal'); if (!m) return;
  m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-labelledby', labelId); };

/* Yeni çalışma alanı / düzenleme penceresi. Ad: zorunlu, ≤60, etkin alanlar arasında tekil (tr). */
function wsForm(id) {
  const w = id ? (DB.workspaces || []).find(x => x.id === id) : null;
  if (id && !w) return toast('Çalışma alanı bulunamadı');
  if (!w && !isAdmin()) return toast('Çalışma alanını yalnızca yönetici açabilir');
  if (w && !canManageWs(w)) return toast('Bu çalışma alanını yalnızca alan yöneticisi değiştirebilir');
  let color = w ? safeColor(w.color) : WS_COLORS[1][0];
  const tab0 = WS_COLORS.some(([c]) => c === color) ? color : WS_COLORS[0][0];
  openModal(`<div class="m-h"><b id="wsf_t">${w ? 'Çalışma alanını düzenle' : 'Yeni çalışma alanı'}</b><button class="x" data-close aria-label="Kapat">×</button></div>
    <div class="ws-b">
      <div class="ws-prev" id="wsf_prev"></div>
      <div class="ws-fld" id="wsf_nf"><label for="wsf_n">Ad <span class="ws-cnt" id="wsf_nc">0/60</span></label>
        <input class="inp" id="wsf_n" maxlength="60" value="${esc(w?.name || '')}" aria-describedby="wsf_ne" autocomplete="off" placeholder="Örn. Müşteri: Oyak">
        <div class="ws-err" id="wsf_ne" aria-live="polite"></div></div>
      <div class="ws-fld"><div class="lb" id="wsf_cl">Renk</div>
        <div class="ws-colors" role="radiogroup" aria-labelledby="wsf_cl">${WS_COLORS.map(([c, n]) =>
          `<button type="button" class="ws-sw-c" role="radio" aria-checked="${c === color}" tabindex="${c === tab0 ? 0 : -1}" aria-label="${n}" title="${n}"
            data-wsc="${c}" style="--ws-c:${c}">${ic('check')}</button>`).join('')}</div>
        <div class="ws-cname" id="wsf_cn"></div></div>
      <div class="ws-fld"><label for="wsf_d">Açıklama <span class="opt" id="wsf_dc">isteğe bağlı · 0/500</span></label>
        <textarea class="inp" id="wsf_d" rows="2" maxlength="500" placeholder="Bu alanda hangi projeler duracak?">${esc(w?.description || '')}</textarea></div>
      ${wsMembersFld(w)}
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="wsf_ok">${w ? 'Kaydet' : 'Oluştur'}</button></div>`, 'narrow ws-dlg');
  wsDialog('wsf_t');
  const inp = $('#wsf_n'), desc = $('#wsf_d');
  let shown = false;
  const check = () => {
    const n = inp.value, k = wsKey(n);
    if (!k || n.trim().length > 60) return 'Çalışma alanı adı gerekli (en fazla 60 karakter)';
    if (wsAll().some(x => x.id !== id && !x.archived && wsKey(x.name) === k)) return 'Bu adla etkin bir çalışma alanı zaten var';
    return '';
  };
  const setErr = msg => {
    shown = !!msg;
    $('#wsf_ne').innerHTML = msg ? ic('alert') + esc(msg) : '';
    $('#wsf_nf').classList.toggle('has-err', !!msg);
    inp.setAttribute('aria-invalid', msg ? 'true' : 'false');
  };
  const paint = () => {
    const n = inp.value.trim();
    $('#wsf_prev').innerHTML = `${wsBadge({ name: n || '?', color }, 'xl')}<div class="tx"><b>${esc(n || 'Çalışma alanı adı')}</b><span>Önizleme · sol menüde böyle görünür</span></div>`;
    $('#wsf_nc').textContent = `${inp.value.length}/60`;
    $('#wsf_dc').textContent = `isteğe bağlı · ${desc.value.length}/500`;
    $('#wsf_cn').textContent = 'Seçili: ' + (WS_COLORS.find(([c]) => c === color)?.[1] || color);
    $$('[data-wsc]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.wsc === color)));
  };
  inp.oninput = () => { paint(); if (shown) setErr(check()); };
  inp.onblur = () => { if (inp.value.trim() || shown) setErr(check()); };
  desc.oninput = paint;
  const sw = $$('[data-wsc]');
  const pick = (b, focus) => { color = b.dataset.wsc; sw.forEach(x => x.tabIndex = x === b ? 0 : -1); if (focus) b.focus(); paint(); };
  sw.forEach((b, k) => {
    b.onclick = () => pick(b);
    b.onkeydown = e => {
      const to = { ArrowRight: k + 1, ArrowDown: k + 1, ArrowLeft: k - 1, ArrowUp: k - 1, Home: 0, End: sw.length - 1 }[e.key];
      if (to === undefined) return;
      e.preventDefault(); pick(sw[(to + sw.length) % sw.length], true);
    };
  });
  const submit = () => {
    const msg = check(); if (msg) { setErr(msg); return inp.focus(); }
    const name = inp.value.trim().replace(/\s+/g, ' '), description = desc.value.trim();
    if (w) {
      Object.assign(w, { name, color, description });
      WSF.apply(w);
      closeModal(); save(); render(); return toast(`${name} kaydedildi`);
    }
    const nid = uid('ws'); WS_MINE.add(nid);
    const nw = { id: nid, name, color, description, archived: false };
    WSF.apply(nw);
    (DB.workspaces ||= []).push(nw);
    DB.ui.workspace = nid; DB.ui.project = null; DB.board.q = '';
    closeModal(); save(); render(); toast(`${name} oluşturuldu`);
  };
  inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } };
  $('#wsf_ok').onclick = submit;
  paint();
  WSF.wire();
}

function wsSetArchived(id, on) {
  const w = (DB.workspaces || []).find(x => x.id === id);
  if (!w) return toast('Çalışma alanı bulunamadı');
  if (!canManageWs(w)) return toast('Bu çalışma alanını yalnızca alan yöneticisi değiştirebilir');
  if (on) {
    if (id === WS_DEFAULT) return toast('Genel çalışma alanı arşivlenemez');
    if (!wsAll().some(x => x.id !== id && !x.archived)) return toast('Son etkin çalışma alanı arşivlenemez');
    const n = DB.projects.filter(p => wsOf(p) === id && !p.archived).length;
    if (!confirm(`"${w.name}" arşivlensin mi?\n\n${n ? `Alandaki ${n} proje seçicilerden kalkar. ` : ''}Veri silinmez; Projeler ekranındaki "Arşivlenmiş çalışma alanlarını göster" ile geri alınabilir.`)) return;
    w.archived = true; save(); render(); return toast(`${w.name} arşivlendi`);
  }
  if (wsAll().some(x => x.id !== id && !x.archived && wsKey(x.name) === wsKey(w.name))) return toast('Bu adla etkin bir çalışma alanı zaten var');
  w.archived = false; save(); render(); toast(`${w.name} arşivden çıkarıldı`);
}

function wsDelete(id) {
  if (!isAdmin()) return toast('Bu değişiklik için yönetici yetkisi gerekli');
  if (id === WS_DEFAULT) return toast('Genel çalışma alanı silinemez');
  const w = (DB.workspaces || []).find(x => x.id === id);
  if (!w) return toast('Çalışma alanı bulunamadı');
  if (DB.projects.some(p => wsOf(p) === id)) return toast('Önce projeleri taşıyın');
  if (!confirm(`"${w.name}" çalışma alanı silinsin mi?\n\nAlanda proje yok. Gerekirse Sistem › Çöp kutusu'ndan geri yüklenebilir.`)) return;
  DB.workspaces = DB.workspaces.filter(x => x.id !== id);
  if (DB.ui.workspace === id) DB.ui.workspace = null;
  save(); render(); toast(`${w.name} silindi`);
}

/* "Çalışma alanını değiştir": yalnız projenin workspaceId'si değişir; anahtarlar, sprintler, üyeler, süreler aynı. */
function moveProjectForm(pid) {
  const p = DB.projects.find(x => x.id === pid); if (!p) return;
  if (!canMoveProj(p)) return toast('Projeyi yalnızca alan yöneticisi taşıyabilir');
  const from = wsOf(p);
  const act = visibleWs().filter(w => w.id === from || (canNewProj(w.id) && canMoveBetween(from, w.id))), arch = visibleWs(true);
  if (!act.some(w => w.id === from) && !arch.some(w => w.id === from) && wsById(from)) (wsArchived(from) ? arch : act).push(wsById(from));
  let to = from;
  const opt = (w, dis) => { const n = DB.projects.filter(x => wsOf(x) === w.id && !x.archived).length;
    return `<button type="button" class="ws-opt" role="radio" data-mvto="${esc(w.id)}" aria-checked="${w.id === from}" tabindex="${w.id === from ? 0 : -1}" ${dis ? 'aria-disabled="true"' : ''}>
      ${wsBadge(w, dis ? 'is-arch' : '')}<span class="tx"><span class="nm">${esc(w.name)}</span><span class="s">${
        dis ? 'Arşivli · proje taşınamaz' : w.id === from ? 'Şu anki alan' : `${n} proje`}</span></span>
      ${dis ? ic('lock') : w.id === from ? '<span class="ws-chip">şu anki</span>' : ''}<span class="ws-rad"></span></button>`; };
  const key = esc(p.key || p.code || '');
  openModal(`<div class="m-h"><b id="wsm_t">Çalışma alanını değiştir</b><button class="x" data-close aria-label="Kapat">×</button></div>
    <div class="ws-b">
      <div class="ws-sub">Proje: <span class="ws-key">${key}</span><b style="color:var(--ink)">${esc(p.name)}</b></div>
      <div class="ws-opts" role="radiogroup" aria-label="Hedef çalışma alanı">${act.map(w => opt(w, false)).join('')}${arch.map(w => opt(w, true)).join('')}</div>
      <div class="ws-info">${ic('info')}<span>İş numaraları değişmez${p.counter > 0 ? ` (<span class="k">${key}-1 … ${key}-${+p.counter}</span>)` : ''}.
        Sprintler, üyeler, bağlantılar ve süre kayıtları aynen kalır; diğer kullanıcılar birkaç saniye içinde yeni yerinde görür.</span></div>
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button><button class="btn pri" id="wsm_ok" disabled>${ic('move')}Taşı</button></div>`, 'narrow ws-dlg');
  wsDialog('wsm_t');
  const opts = $$('[data-mvto]'), live = opts.filter(b => !b.hasAttribute('aria-disabled'));
  const sel = (b, focus) => {
    if (!b || b.hasAttribute('aria-disabled')) return;
    to = b.dataset.mvto;
    opts.forEach(x => { x.setAttribute('aria-checked', String(x === b)); x.tabIndex = x === b ? 0 : -1; });
    if (focus) b.focus();
    $('#wsm_ok').disabled = to === from;
  };
  opts.forEach(b => {
    b.onclick = () => b.hasAttribute('aria-disabled') ? toast('Arşivlenmiş çalışma alanına proje taşınamaz') : sel(b);
    b.onkeydown = e => {
      const k = live.indexOf(b), to2 = { ArrowDown: k + 1, ArrowRight: k + 1, ArrowUp: k - 1, ArrowLeft: k - 1 }[e.key];
      if (to2 === undefined || !live.length) return;
      e.preventDefault(); sel(live[(to2 + live.length) % live.length], true);
    };
  });
  setTimeout(() => (opts.find(b => b.tabIndex === 0) || live[0])?.focus(), 40);
  $('#wsm_ok').onclick = () => {
    const w = wsById(to);
    if (!w) return toast('Çalışma alanı bulunamadı');
    if (w.archived) return toast('Arşivlenmiş çalışma alanına proje taşınamaz');
    if (to === from) return closeModal();
    p.workspaceId = to;
    closeModal(); save(); render(); toast(`${p.name}, ${w.name} alanına taşındı`);
  };
}

/* ============================ ALAN ÜYELERİ VE ALAN SAYFASI (22b) ============================

const wsPeople = () => DB.users.filter(u => u.active && !u.system);

      <ul class="wsm-list" id="wsf_ml" aria-label="Alan üyeleri"></ul></div>`;
}
WSF.paint = () => {
  const ml = $('#wsf_ml'); if (!ml) return;

  $$('[data-wsfdel]', ml).forEach(b => b.onclick = () => { WSF.mem.delete(b.dataset.wsfdel); WSF.dirty = true; WSF.paint(); WSF.find(); $('#wsf_q')?.focus(); });

WSF.find = () => {

  $$('[data-wsfadd]', res).forEach(b => b.onclick = () => { WSF.mem.set(b.dataset.wsfadd, 'member'); WSF.dirty = true; q.value = ''; res.innerHTML = ''; WSF.paint(); q.focus(); });
};
WSF.wire = () => {

};
/* Kayda yaz: yeni alanda her zaman; var olanda üye bölümü değiştiyse. Sahip listede ilk ve Yönetici. */
WSF.apply = w => {

/* ============================ CARİLER (issue #11) ============================

function openCustomer(id) {

/* Kart özeti: bağlı projeler (arşivliler dahil), açık iş (Arama ekranındaki sonuçla aynı), harcanan süre (efor raporuyla aynı). */
function cuSummary(id) {
  /* İşler iş düzeyi bağla sayılır (görev 11b): işin carisi, yoksa projenin carisi (customerIdOf). */
  const projs = cuProjects(id), mine = new Set(DB.issues.filter(i => customerIdOf(i) === id).map(i => i.id));
  const open = DB.issues.filter(i => mine.has(i.id) && stat(i.statusId).cat !== 'done' && (MOD('epic') || i.type !== 'epic')).length;
  const mon = TODAY.slice(0, 7);
  let total = 0, month = 0;
  for (const w of DB.worklogs) {
    if (!mine.has(w.issueId)) continue;
    const h = +w.hours || 0; total += h;
    if (String(w.date || '').slice(0, 7) === mon) month += h;
  }
  return { projs, open, total, month };
}
function cuSummaryHtml(c) {
  const s = cuSummary(c.id), nA = s.projs.filter(p => p.archived).length;
  const prj = p => { const w = wsById(wsOf(p)), a = !!p.archived;
    const inner = `<span class="ws-key">${esc(p.key)}</span><span class="tx"><span class="nm">${esc(p.name)}</span>
      <span class="ws">${wsBadge(w, 'sm' + (a ? ' is-arch' : ''))}${esc(w?.name || '')}</span></span>${a ? `<span class="ws-chip">${ic('archive')}Arşivli</span>` : `<span class="cu-go">${ic('chevr')}</span>`}`;
    return a ? `<div class="cu-prj is-arch">${inner}</div>` : `<button type="button" class="cu-prj" data-cugoproj="${esc(p.id)}">${inner}</button>`; };
  return `<aside class="cu-sum" aria-label="Özet"><h4>Özet</h4>
    <div class="cu-kpis">
      <button type="button" class="cu-kpi" data-cuissues="${esc(c.id)}" ${s.open ? '' : 'disabled'} aria-label="${s.open} açık iş, iş listesinde aç">
        <span class="l">${ic('circle')}Açık iş</span><span class="v" data-cun="open">${s.open}</span>${s.open ? `<span class="go">İş listesi${ic('arrow')}</span>` : ''}</button>
      <div class="cu-kpi"><span class="l">${ic('folder')}Bağlı proje</span><span class="v" data-cun="proj">${s.projs.length}</span>${nA ? `<span class="l" style="font-weight:500;color:var(--meta)">${nA} arşivli</span>` : ''}</div>
      <div class="cu-kpi time"><span class="l">${ic('hour')}Harcanan süre</span>
        <div class="cu-time"><div><span class="k">Bu ay</span><span class="v" data-cun="month">${efFmt(s.month)}</span></div><div><span class="k">Toplam</span><span class="v" data-cun="total">${efFmt(s.total)}</span></div></div></div>
    </div>
    <h4 style="margin-top:4px">Bağlı projeler</h4>
    <div class="cu-prjs">${s.projs.length ? s.projs.map(prj).join('') : '<div class="none">Bu cariye bağlı proje yok.</div>'}</div></aside>`;
}
