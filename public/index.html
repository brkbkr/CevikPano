/* ============================================================
   1) DURUM GEÇİŞ KAYDI
   Raporların doğru olması için "hangi iş, hangi gün, hangi durumdaydı"
   sorusunun cevaplanabilmesi gerekir. Bunu her geçişi kaydedip
   bugünden geriye oynatarak buluyoruz.
   ============================================================ */
function recordTransition(i, fromId, toId) {
  DB.transitions.push({ id: uid('t'), issueId: i.id, at: Date.now(), date: TODAY, from: fromId, to: toId });
}
function transIndex() {
  const m = new Map();
  DB.transitions.forEach(t => { (m.get(t.issueId) || m.set(t.issueId, []).get(t.issueId)).push(t); });
  m.forEach(list => list.sort((a, b) => a.date.localeCompare(b.date) || a.at - b.at));
  return m;
}
/* Verilen günün sonunda işin durumu (yoksa null = henüz oluşmamış) */
function statusOn(i, date, idx) {
  if (iso(new Date(i.created)) > date) return null;
  const list = idx.get(i.id) || [];
  const after = list.find(t => t.date > date);
  return after ? after.from : i.statusId;
}
/* İlk kez "devam ediyor" kategorisine girdiği gün */
function startedOn(i, idx) {
  const t = (idx.get(i.id) || []).find(t => stat(t.to)?.cat === 'inprogress');
  return t ? t.date : null;
}
function cycleDays(i, idx) {
  const s = startedOn(i, idx), e = i.doneAt || (idx.get(i.id) || []).filter(t => stat(t.to)?.cat === 'done').pop()?.date;
  if (!s || !e) return null;
  return Math.max(0, Math.round((new Date(e) - new Date(s)) / 86400000));
}
const pct = (arr, p) => { if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b); return s[Math.min(s.length - 1, Math.floor(p * s.length))]; };

/* ============================================================
   2) GELİŞMİŞ RAPORLAR
   ============================================================ */
function cfd(days = 30) {
  const idx = transIndex();
  const ss = stats();
  const list = issuesOf().filter(i => i.type !== 'epic');
  const D = Array.from({ length: days }, (_, k) => iso(addD(new Date(), k - days + 1)));
  const series = ss.map(s => D.map(d => list.filter(i => statusOn(i, d, idx) === s.id).length));
  const max = Math.max(1, ...D.map((_, k) => series.reduce((a, s) => a + s[k], 0)));
  const W = 460, H = 200, PL = 26, PB = 20;
  const x = k => PL + k * (W - PL - 6) / (days - 1);
  const y = v => H - PB - (v / max) * (H - PB - 8);

  let acc = D.map(() => 0);
  const bands = ss.map((s, si) => {
    const lower = [...acc];
    acc = acc.map((v, k) => v + series[si][k]);
    const up = D.map((_, k) => `${x(k)},${y(acc[k])}`).join(' ');
    const dn = D.map((_, k) => `${x(days - 1 - k)},${y(lower[days - 1 - k])}`).join(' ');
    const c = s.cat === 'done' ? '#15803D' : s.cat === 'todo' ? '#98A0AC' : '#B45309';
    const op = .30 + .16 * si;
    return `<polygon points="${up} ${dn}" fill="${c}" fill-opacity="${op}" stroke="${c}" stroke-width=".8"/>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kümülatif akış">
      ${[0, .5, 1].map(f => `<line x1="${PL}" x2="${W - 6}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="var(--line)"/>
        <text x="2" y="${y(max * f) + 4}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${Math.round(max * f)}</text>`).join('')}
      ${bands}
      <text x="${PL}" y="${H - 5}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(D[0])}</text>
      <text x="${W - 6}" y="${H - 5}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(D[days - 1])}</text>
    </svg>
    <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:6px">
      ${ss.map(s => `<span class="chip cat-${s.cat}">${esc(s.name)}</span>`).join('')}</div>
    <div style="font-size:11.5px;color:var(--ink3);margin-top:6px">
      Bir bandın kalınlaşması o durumda iş biriktiğini gösterir — darboğaz orada.</div>`;
}

function cycleReport() {
  const idx = transIndex();
  const done = issuesOf().filter(i => i.type !== 'epic' && stat(i.statusId).cat === 'done');
  const pts = done.map(i => ({ i, d: cycleDays(i, idx), end: i.doneAt || (idx.get(i.id) || []).slice(-1)[0]?.date }))
    .filter(p => p.d != null && p.end).sort((a, b) => a.end.localeCompare(b.end));
  if (pts.length < 2) return '<div class="empty">Yeterli tamamlanmış iş yok. Birkaç işi Bitti durumuna taşıyın.</div>';

  const vals = pts.map(p => p.d);
  const med = pct(vals, .5), p85 = pct(vals, .85);
  const W = 460, H = 170, PL = 26, PB = 20;
  const maxD = Math.max(...vals, 1);
  const x = k => PL + k * (W - PL - 10) / Math.max(1, pts.length - 1);
  const y = v => H - PB - (v / maxD) * (H - PB - 10);

  return `<div class="stat">
      <div><b>${med}g</b><span>medyan</span></div>
      <div><b>${p85}g</b><span>%85 dilim</span></div>
      <div><b>${pts.length}</b><span>ölçülen iş</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Döngü süresi">
      <line x1="${PL}" x2="${W - 6}" y1="${y(med)}" y2="${y(med)}" stroke="var(--accent)" stroke-dasharray="4 3"/>
      <line x1="${PL}" x2="${W - 6}" y1="${y(p85)}" y2="${y(p85)}" stroke="#B45309" stroke-dasharray="2 3"/>
      <text x="${W - 6}" y="${y(med) - 4}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--accent)">medyan ${med}g</text>
      <text x="${W - 6}" y="${y(p85) - 4}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="#B45309">%85 ${p85}g</text>
      ${pts.map((p, k) => `<circle cx="${x(k)}" cy="${y(p.d)}" r="3.4"
        fill="${p.d > p85 ? 'var(--risk)' : 'var(--accent)'}" fill-opacity=".75"><title>${esc(p.i.key)} — ${p.d} gün</title></circle>`).join('')}
      <text x="${PL}" y="${H - 5}" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(pts[0].end)}</text>
      <text x="${W - 6}" y="${H - 5}" text-anchor="end" font-size="9" font-family="var(--mono)" fill="var(--ink3)">${fmtD(pts.slice(-1)[0].end)}</text>
    </svg>
    <div style="font-size:11.5px;color:var(--ink3);margin-top:4px">
      İlk kez "devam ediyor" kategorisine girdiği günden bittiği güne kadar geçen takvim günü.
      Kırmızı noktalar %85 diliminin üstünde — tahmin verirken bunları örnek almayın.</div>`;
}

function throughput(weeks = 8) {
  const idx = transIndex();
  const m0 = monday(addD(new Date(), -7 * (weeks - 1)));
  const buckets = Array.from({ length: weeks }, (_, k) => ({ w: iso(addD(m0, k * 7)), n: 0, p: 0 }));
  issuesOf().filter(i => stat(i.statusId).cat === 'done').forEach(i => {
    const e = i.doneAt || (idx.get(i.id) || []).filter(t => stat(t.to)?.cat === 'done').pop()?.date;
    if (!e) return;
    const b = buckets.find(b => e >= b.w && e < iso(addD(new Date(b.w), 7)));
    if (b) { b.n++; b.p += i.points || 0; }
  });
  const max = Math.max(1, ...buckets.map(b => b.n));
  const W = 460, H = 150, bw = (W - 16) / weeks;
  const avg = (buckets.reduce((a, b) => a + b.n, 0) / weeks).toFixed(1);
  return `<div class="stat"><div><b>${avg}</b><span>hafta ort. iş</span></div>
      <div><b>${buckets.slice(-1)[0].n}</b><span>bu hafta</span></div></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Haftalık üretim">
      ${buckets.map((b, k) => { const h = (b.n / max) * (H - 36);
        return `<rect x="${8 + k * bw + bw * .18}" y="${H - 22 - h}" width="${bw * .64}" height="${h}" rx="2" fill="var(--accent)" fill-opacity=".8"/>
          <text x="${8 + k * bw + bw / 2}" y="${H - 26 - h}" text-anchor="middle" font-size="9.5" font-family="var(--mono)" fill="var(--ink2)">${b.n || ''}</text>
          <text x="${8 + k * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="8.5" font-family="var(--mono)" fill="var(--ink3)">${fmtD(b.w)}</text>`; }).join('')}
    </svg>`;
}

/* ---- kapasite ---- */
const capOf = u => u.capacity ?? 30;
function capacityPanel() {
  const s = MOD('sprint') ? activeSprint() : null;
  if (MOD('sprint') && !s) return '<div class="empty">Aktif sprint yok</div>';
  const wk = s ? Math.max(1, Math.round((new Date(s.end) - new Date(s.start)) / 86400000 + 1) / 7) : 1;
  const rows = projUsers().map(u => {
    const mine = s
      ? DB.issues.filter(i => i.sprintId === s.id && i.assignee === u.id)
      : issuesOf().filter(i => i.assignee === u.id && stat(i.statusId).cat !== 'done' && i.type !== 'epic');
    const load = mine.reduce((a, i) => a + remaining(i), 0);
    const cap = capOf(u) * wk;
    return { u, load, cap, n: mine.length, r: cap ? load / cap : 0 };
  }).sort((a, b) => b.r - a.r);
  const maxR = Math.max(1.05, ...rows.map(r => r.r));
  return `<div class="sub" style="margin-bottom:10px">${s ? esc(s.name) + ' · ' + wk.toFixed(1) + ' hafta' : 'Bir haftalık kapasite'} ·
      toplam kapasite <b class="num">${fmtDur(rows.reduce((a, r) => a + r.cap, 0))}</b> ·
      kalan iş <b class="num">${fmtDur(rows.reduce((a, r) => a + r.load, 0))}</b></div>
    ${rows.map(r => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
      ${avat(r.u.id)}<span style="width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.u.name)}</span>
      <span style="flex:1;height:11px;background:var(--track);border-radius:6px;position:relative;overflow:hidden">
        <i style="display:block;height:100%;width:${Math.min(100, r.r / maxR * 100)}%;background:${r.r > 1 ? 'var(--risk)' : r.r > .85 ? '#B45309' : 'var(--accent)'}"></i>
        <i style="position:absolute;top:0;bottom:0;left:${Math.min(100, 1 / maxR * 100)}%;width:1px;background:var(--ink2)"></i>
      </span>
      <b class="num" style="width:96px;text-align:right;font-size:11.5px;${r.r > 1 ? 'color:var(--risk)' : ''}">
        ${fmtDur(r.load)} / ${fmtDur(r.cap)}</b>
      <span class="k" style="width:34px;text-align:right;color:var(--ink3)">${Math.round(r.r * 100)}%</span>
    </div>`).join('')}
    <div style="font-size:11.5px;color:var(--ink3);margin-top:6px">
      Dikey çizgi %100 kapasite. Kalan tahmin baz alınır; kişi kapasiteleri Proje ayarları → Kişiler'den değişir.</div>`;
}

function wireBulk() {

    const ids = $$('[data-sel]').map(c => c.dataset.sel);
    all.checked ? ids.forEach(i => SEL.add(i)) : ids.forEach(i => SEL.delete(i)); render(); };

    if (!confirm(`${SEL.size} iş silinsin mi?`)) return;

    DB.worklogs = DB.worklogs.filter(w => !SEL.has(w.issueId));
    DB.links = DB.links.filter(l => !SEL.has(l.from) && !SEL.has(l.to));

  };

          pr = $('#bk_pr').value, lb = $('#bk_lb').value.trim();
    let n = 0;
    [...SEL].map(issue).filter(Boolean).forEach(i => {
      if (st) setStatus(i, st);
      if (as) setAssignee(i, as === '__none' ? null : as);
      if (sp) { const to = sp === '__none' ? null : sp;
        logHist(i, 'Sprint', i.sprintId ? sprint(i.sprintId).name : 'Backlog', to ? sprint(to).name : 'Backlog');
        i.sprintId = to; }

      if (i.start && i.due && i.start > i.due) i.due = i.start;
      if ($('#bk_bill').value) i.billable = $('#bk_bill').value;
      if ($('#bk_bt').value) i.billType = $('#bk_bt').value;
      if (lb) i.labels = [...new Set([...(i.labels || []), lb])];
      n++;
    });
    SEL.clear(); save(); render(); toast(n + ' iş güncellendi');
  };
}

    ...DB.issues.filter(i => MOD('epic') || i.type !== 'epic').map(i => ({ t: i.key, n: i.summary, run: () => openIssue(i.id) })),
  ];
  openModal(`<div class="m-h" style="padding:8px 12px">
      <input class="inp" id="pl_q" placeholder="İş ara, ekrana git, komut çalıştır…" style="border:none;background:transparent;font-size:15px">
      <span class="k" style="color:var(--ink3)">esc</span></div>
    <div id="pl_r" style="max-height:60vh;overflow:auto"></div>`, 'narrow');
  let cur = 0, shown = [];
  const draw = () => {
    const q = $('#pl_q').value.toLowerCase().trim();
    shown = (q ? items.filter(x => (x.t + ' ' + x.n).toLowerCase().includes(q)) : items).slice(0, 40);
    cur = Math.min(cur, Math.max(0, shown.length - 1));

let GKEY = false;
function wireKeys() {
  addEventListener('keydown', e => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.target.isContentEditable;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return palette(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); flushSync().then(() => toast(SYNC_STATE === 'ok' ? 'Kaydedildi' : 'Kaydedilemedi, tekrar denenecek')); return; }
    if (typing) return;
    const open = $('#scrim').classList.contains('on');
    if (GKEY) { GKEY = false;
      const map = { b: 'board', l: 'backlog', r: 'roadmap', t: 'timesheet', p: 'reports', a: 'search', s: 'admin', e: 'effort', h: 'home', j: 'projects', z: 'plan' };
      if (map[e.key]) { e.preventDefault(); location.hash = map[e.key]; }
      return;
    }
    if (open) return;
    if (e.key === 'g') { GKEY = true; setTimeout(() => GKEY = false, 1200); return; }
    if (e.key === '?') { e.preventDefault(); return shortcutHelp(); }
    if (e.key === 'w' && canEdit()) { e.preventDefault(); return logWorkForm(); }
    if (e.key === '/') { e.preventDefault();
      const b = $('#q') || $('#pql');
      if (b) b.focus(); else { DB.ui.view = 'search'; save(); render(); $('#pql')?.focus(); } }
  });
}

  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };

/* seçili dönemin ilk/son günü */
function period() {
  const u = DB.ui;
  if (u.efRange === 'custom' && u.efFrom && u.efTo) return { from: u.efFrom, to: u.efTo, label: `${fmtD(u.efFrom)} – ${fmtD(u.efTo)}` };
  const m = u.efMonth || TODAY.slice(0, 7);
  const last = new Date(+m.slice(0, 4), +m.slice(5, 7), 0);
  return { from: m + '-01', to: iso(last), label: monthName(m), month: m };
}
/* dönemdeki iş günü sayısı (hafta içi) */
function workdays(from, to) {
  let n = 0;
  for (let d = new Date(from); iso(d) <= to; d.setDate(d.getDate() + 1)) {
    const w = d.getDay(); if (w !== 0 && w !== 6) n++;
  }
  return n;
}
function periodLogs() {
  const p = period();
  return DB.worklogs.filter(w => w.date >= p.from && w.date <= p.to)
    .filter(w => { const i = issue(w.issueId); if (!i) return false;
      if (DB.ui.efProject && i.projectId !== DB.ui.efProject) return false;
      if (DB.ui.efUser && w.userId !== DB.ui.efUser) return false;
      return true; });
}

/* Efor raporunda varsayılan gösterim ondalık saat — aylık toplamlarda
   "3w 6h" okunaksız kalıyor. İstenirse gün/hafta gramerine dönülebilir. */
const efFmt = h => (DB.ui.efUnit === 'wd') ? fmtDur(h)
  : (Math.round(h * 10) / 10).toString().replace('.0', '') + 'h';

function renderEffort() {
  const p = period();
  const logs = periodLogs();
  const rowD = DIMS[DB.ui.efRow || 'user'];
  const colK = DB.ui.efCol ?? 'project';
  const colD = colK ? DIMS[colK] : null;

  /* boyut değerlerini topla — sabit listesi olanlar hep görünür */
  const vals = (D, fromData) => {
    const seen = [...new Set(fromData)];
    const base = D.all ? D.all() : [];
    const out = [...new Set([...base, ...seen])];
    return out.filter(v => v != null);
  };
  const rows = vals(rowD, logs.map(rowD.k)).filter(v => D_hasData(v, rowD, logs) || rowD.all);
  const cols = colD ? vals(colD, logs.map(colD.k)).filter(v => colD.all || logs.some(w => colD.k(w) === v)) : [];

  const cell = (r, c) => logs.filter(w => rowD.k(w) === r && (!colD || colD.k(w) === c))
    .reduce((a, w) => a + w.hours, 0);
  const rowTot = r => logs.filter(w => rowD.k(w) === r).reduce((a, w) => a + w.hours, 0);
  const colTot = c => logs.filter(w => colD.k(w) === c).reduce((a, w) => a + w.hours, 0);
  const grand = logs.reduce((a, w) => a + w.hours, 0);

  const wd = workdays(p.from, p.to);
  const isUser = (DB.ui.efRow || 'user') === 'user';
  const capOfPeriod = u => capOf(u) / 5 * wd;          // haftalık kapasite → dönem kapasitesi

  const visible = rows.filter(r => rowTot(r) > 0 || (isUser && !DB.ui.efUser));
  const maxCell = Math.max(1, ...visible.flatMap(r => cols.length ? cols.map(c => cell(r, c)) : [rowTot(r)]));

  const head = `<tr>
      <th class="who">${rowD.l}</th>
      ${cols.map(c => `<th title="${esc(colD.n(c))}">${esc((colD.short || colD.n)(c))}</th>`).join('')}
      <th class="tot">Toplam</th>
      ${isUser ? '<th class="tot">Kapasite</th><th class="tot">Kullanım</th>' : ''}
    </tr>`;

  const body = visible.map(r => {
    const t = rowTot(r);
    const u = isUser ? user(r) : null;
    const cap = u ? capOfPeriod(u) : 0;
    const ratio = cap ? t / cap : 0;
    return `<tr>
      <td class="who">${isUser ? `<div style="display:flex;align-items:center;gap:8px">${avat(r)}<span>${esc(rowD.n(r))}</span></div>`
        : `<span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rowD.n(r))}</span>`}</td>
      ${cols.map(c => { const v = cell(r, c);
        return `<td><button class="cell ${v ? '' : 'z'}" style="${heat(v / (maxCell / 8))}"
          data-drill="${esc(r)}" data-drillc="${esc(c)}" title="${esc(rowD.n(r))} × ${esc(colD.n(c))}">
          ${v ? v.toFixed(1).replace('.0', '') : '·'}</button></td>`; }).join('')}
      <td class="tot"><button class="cell" data-drill="${esc(r)}" style="font-weight:700">${t ? efFmt(t) : '—'}</button></td>
      ${isUser ? `<td class="tot"><span class="num" style="font-weight:400;color:var(--ink3)">${cap ? efFmt(cap) : '—'}</span></td>
        <td class="tot"><span class="num" style="color:${ratio > 1.05 ? 'var(--risk)' : ratio < .6 ? 'var(--ink3)' : 'var(--done)'}">
          ${cap ? Math.round(ratio * 100) + '%' : '—'}</span></td>` : ''}
    </tr>`;
  }).join('') || `<tr><td colspan="${cols.length + 4}"><div class="empty">Bu dönemde süre kaydı yok</div></td></tr>`;

  const totCap = isUser ? visible.reduce((a, r) => a + capOfPeriod(user(r) || {}), 0) : 0;

  return `
    <div class="stat" style="margin-bottom:12px">
      <div><b class="num">${efFmt(grand)}</b><span>toplam efor</span></div>
      <div><b class="num">${(grand / H_PER_DAY).toFixed(1)}</b><span>adam-gün</span></div>
      <div><b>${logs.length}</b><span>kayıt</span></div>
      <div><b>${new Set(logs.map(w => w.issueId)).size}</b><span>iş</span></div>
      <div><b>${wd}</b><span>iş günü</span></div>
      ${totCap ? `<div><b style="${grand > totCap ? 'color:var(--risk)' : ''}">${Math.round(grand / totCap * 100)}%</b><span>kapasite kullanımı</span></div>` : ''}
    </div>
    <div class="tswrap"><table class="ts">
      <thead>${head}</thead>
      <tbody>${body}</tbody>
      <tfoot><tr>
        <td class="who" style="font-family:var(--mono);font-size:11px">TOPLAM</td>
        ${cols.map(c => `<td>${colTot(c) ? colTot(c).toFixed(1).replace('.0', '') : '—'}</td>`).join('')}
        <td class="tot">${efFmt(grand)}</td>
        ${isUser ? `<td class="tot">${totCap ? efFmt(totCap) : '—'}</td>
          <td class="tot">${totCap ? Math.round(grand / totCap * 100) + '%' : '—'}</td>` : ''}
      </tr></tfoot>
    </table></div>
    <p style="color:var(--ink3);font-size:11.5px;margin-top:8px">
      Hücreye tıklayınca o kesitin tüm süre kayıtları açılır. Kapasite = kişinin haftalık kapasitesi ÷ 5 × dönemdeki iş günü (${wd} gün).
      Adam-gün hesabı ${H_PER_DAY} saatlik gün üzerinden.</p>`;
}
function D_hasData(v, D, logs) { return logs.some(w => D.k(w) === v); }

/* Bir kayıt kümesinin dökümü: önce iş bazında özet, sonra ham kayıtlar. */
function showLogs(title, chip, logs, addCtx) {
  logs = logs.slice().sort((a, b) => a.date.localeCompare(b.date));
  const tot = logs.reduce((a, w) => a + w.hours, 0);
  const byIssue = [...new Set(logs.map(w => w.issueId))].map(id => ({
    i: issue(id), h: logs.filter(w => w.issueId === id).reduce((a, w) => a + w.hours, 0),
  })).filter(x => x.i).sort((a, b) => b.h - a.h);

  openModal(`<div class="m-h">
      <b>${esc(title)}</b>${chip ? `<span class="chip pt">${esc(chip)}</span>` : ''}
      <span class="spacer"></span><b class="num">${efFmt(tot)}</b>
      <button class="x" data-close>×</button></div>
    <div style="padding:14px 18px;max-height:60vh;overflow:auto">
      <div class="sec" style="margin-top:0">İş bazında (${byIssue.length})</div>
      ${byIssue.map(x => `<div class="row" style="padding:6px 0" data-open="${x.i.id}">
        ${tIcon(x.i.type)}<span class="k" style="color:var(--ink3);width:64px">${x.i.key}</span>
        <span class="sum">${esc(x.i.summary)}</span>
        <span class="chip cat-${stat(x.i.statusId).cat}">${esc(stat(x.i.statusId).name)}</span>
        <b class="num" style="width:62px;text-align:right">${efFmt(x.h)}</b>
        <span class="k" style="width:40px;text-align:right;color:var(--ink3)">${tot ? Math.round(x.h / tot * 100) : 0}%</span>
      </div>`).join('') || '<div class="empty">Kayıt yok</div>'}
      <div class="sec">Kayıtlar (${logs.length})</div>
      ${logs.map(w => `<div class="wl" style="padding:6px 0">
        ${avat(w.userId)}<span class="k" style="width:70px">${fmtD(w.date)}</span>
        <span class="k" style="color:var(--ink3);width:64px">${issue(w.issueId)?.key || '—'}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.comment || issue(w.issueId)?.summary || '')}</span>
        <b class="num">${efFmt(w.hours)}</b>
        ${canEdit() && (w.userId === CU().id || isAdmin()) ? `<button class="btn sm danger" data-delwl="${w.id}">Sil</button>` : ''}</div>`).join('')}
    </div>
    ${addCtx && canEdit() ? `<div class="m-f"><button class="btn" data-close>Kapat</button>
      <button class="btn pri" id="dl_add">+ Süre ekle</button></div>` : ''}`);
  const b = $('#dl_add');
  if (b) b.onclick = () => { closeModal(); logWorkForm(addCtx.issueId, addCtx.userId, addCtx.date); };
}

/* ---- efor raporu hücresi ---- */
function drill(rv, cv) {
  const rowD = DIMS[DB.ui.efRow || 'user'], colK = DB.ui.efCol ?? 'project';
  const colD = cv != null && colK ? DIMS[colK] : null;
  const logs = periodLogs().filter(w => String(rowD.k(w)) === String(rv) && (!colD || String(colD.k(w)) === String(cv)));
  showLogs(rowD.n(rv) + (colD ? ' × ' + colD.n(cv) : ''), period().label, logs,
    { userId: (DB.ui.efRow || 'user') === 'user' ? rv : null,
      issueId: (DB.ui.efRow || 'user') === 'issue' ? rv : null,
      date: DIMS[DB.ui.efCol]?.l === 'Gün' ? cv : null });
}

function wireEffort() {
  const rg = $('#efRange'); if (!rg) return;
  rg.onclick = e => { const b = e.target.closest('[data-r]');
    if (!b) return;
    DB.ui.efRange = b.dataset.r;
    if (b.dataset.r === 'custom' && !DB.ui.efFrom) { const p = period(); DB.ui.efFrom = p.from; DB.ui.efTo = p.to; }
    save(); render(); };
  /* select'e onclick bağlamak listeyi açar açmaz yeniden çizip kapatıyordu. */
  const on = (s, fn) => { const e = $(s); if (e) e.onchange = fn; };
  const nav = n => { DB.ui.efMonth = shiftMonth(DB.ui.efMonth || TODAY.slice(0, 7), n); save(); render(); };
  if ($('#mPrev')) $('#mPrev').onclick = () => nav(-1);
  if ($('#mNext')) $('#mNext').onclick = () => nav(1);
  if ($('#mNow')) $('#mNow').onclick = () => { DB.ui.efMonth = TODAY.slice(0, 7); save(); render(); };
  if ($('#efFrom')) $('#efFrom').onchange = e => { DB.ui.efFrom = e.target.value; save(); render(); };
  if ($('#efTo')) $('#efTo').onchange = e => { DB.ui.efTo = e.target.value; save(); render(); };
  on('#efRow', e => { DB.ui.efRow = e.target.value; save(); render(); });
  on('#efCol', e => { DB.ui.efCol = e.target.value; save(); render(); });
  on('#efProject', e => { DB.ui.efProject = e.target.value; save(); render(); });
  on('#efUser', e => { DB.ui.efUser = e.target.value; save(); render(); });

  const eu = $('#efUnit'); if (eu) eu.onclick = e => { const b = e.target.closest('[data-u]');
    if (b) { DB.ui.efUnit = b.dataset.u; save(); render(); } };
  $$('[data-drill]').forEach(b => b.onclick = () => drill(b.dataset.drill, b.dataset.drillc));

  const xl = $('#efXlsx'); if (xl) xl.onclick = () => reportPreview();
  const sm = $('#efSum'); if (sm) sm.onclick = () => monthlySummary();

}

/* Basit tuzlu özet. Kriptografik güvenlik iddiası yoktur —
   parolanın düz metin durmasını engeller, o kadar. */
function pwHash(pw, salt) {
  let h = 2166136261 >>> 0;
  const s = salt + '|' + pw;
  for (let k = 0; k < s.length; k++) { h ^= s.charCodeAt(k); h = Math.imul(h, 16777619) >>> 0; }
  let g = h;
  for (let r = 0; r < 512; r++) { g ^= g << 13; g >>>= 0; g ^= g >> 17; g ^= g << 5; g >>>= 0; }
  return (h.toString(36) + g.toString(36)).padStart(12, '0');
}
const slugName = n => n.toLowerCase()
  .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o')
  .replace(/[^a-z0-9]/g, '').slice(0, 12);

/* Kullanıcı adı: önce ad, çakışırsa ad+soyad, sonra sayı eki */
function makeUsername(name, taken) {
  const p = String(name).split(/\s+/).filter(Boolean);
  let base = slugName(p[0] || '') || 'kullanici';
  if (taken.has(base) && p.length > 1) base = slugName(p.join(''));
  let u = base, n = 2;
  while (taken.has(u)) u = base + n++;
  return u;
}

/* ---- hesapları hazırla (eski verilerde de çalışır) ---- */
function ensureAccounts() {
  const taken = new Set(DB.users.map(u => u.username).filter(Boolean));
  DB.users.forEach((u, k) => {
    if (!u.username) { u.username = makeUsername(u.name, taken); taken.add(u.username); }
    if (!u.role) u.role = k === 0 ? 'admin' : (k === DB.users.length - 1 ? 'viewer' : 'member');
    if (u.active === undefined) u.active = true;
  });
  if (!DB.users.some(u => (u.role === 'admin' || u.role === 'super') && u.active) && DB.users[0]) DB.users[0].role = 'admin';
}

   KULLANICILAR (yönetici) — kişiler, roller, parolalar, projeler
   Parolalar sunucuda tek yönlü özet (bcrypt) olarak saklanır; kimse,
   yönetici dahil, mevcut bir parolayı göremez. Yönetici yeni parola
   belirler ya da rastgele üretir; üretilen parola bir kez gösterilir.
   ============================================================ */
let USERS_META = null, USERS_META_AT = 0;
const UF = { q: '', role: '', status: '' };
const ROLE_KEYS = ['super', 'admin', 'member', 'viewer'];
const USER_COLORS = ['#4F46E5', '#1F6F5C', '#6B4FBB', '#C0392B', '#B45309', '#3E7BC4', '#2B7A78', '#8E44AD', '#0F766E', '#BE185D'];
/* [yetki, süper, yönetici, üye, izleyici] */
const PERMS = [
  ['Atandığı projeleri ve işleri görme', 1, 1, 1, 1],
  ['İş oluşturma, düzenleme, yorum yazma', 1, 1, 1, 0],
  ['Kendi süre kaydını girme', 1, 1, 1, 0],
  ['Başkası adına süre kaydı girme / silme', 1, 1, 0, 0],
  ['Proje oluşturma, düzenleme, arşivleme', 1, 1, 1, 0],
  ['Proje silme', 1, 1, 0, 0],
  ['İş akışı, iş tipleri, özel alanlar, otomasyon', 1, 1, 0, 0],
  ['Kullanıcı ekleme, rol ve parola yönetimi', 1, 1, 0, 0],
  ['Yedekler, çöp kutusu, içe aktarma, etkinlik', 1, 1, 0, 0],
  ['Arşivlenmiş ve üyesi olmadığı projeleri görme', 1, 0, 0, 0],
  ['Süper yöneticileri yönetme', 1, 0, 0, 0],
];

const metaOf = id => USERS_META?.find(m => m.id === id) || null;
const userProjects = id => DB.projects.filter(p => !p.members?.length || p.members.includes(id));
const userStatus = u => !u.active ? ['Pasif', 'lbl']
  : (metaOf(u.id)?.mustChange ?? u.mustChange) ? ['İlk giriş bekleniyor', 'cat-inprogress'] : ['Aktif', 'cat-done'];
const roleChip = r => `<span class="chip role-${esc(r)}">${esc(ROLES[r]?.[0] || r)}</span>`;
const canManage = u => isSuper() || u.role !== 'super';

async function loadUsersMeta(force) {
  if (!force && USERS_META && Date.now() - USERS_META_AT < 20000) return;
  try { USERS_META = await API.get('/api/admin/users'); USERS_META_AT = Date.now(); }
  catch (e) { USERS_META = USERS_META || []; }
  if (DB?.ui?.view === 'users' && !$('#scrim').classList.contains('on')) {
    const v = $('#view'); if (v) { v.innerHTML = renderUsers(true); wireUsersView(); }
  }
}

function filteredUsers() {
  const q = UF.q.trim().toLocaleLowerCase('tr');
  return DB.users.filter(u => {
    if (UF.role && u.role !== UF.role) return false;
    const st = userStatus(u)[0];
    if (UF.status === 'active' && !u.active) return false;
    if (UF.status === 'inactive' && u.active) return false;
    if (UF.status === 'pending' && st !== 'İlk giriş bekleniyor') return false;
    if (!q) return true;
    return [u.name, u.username, u.email, u.title].some(x => String(x || '').toLocaleLowerCase('tr').includes(q));
  }).sort((a, b) => (b.active - a.active) || ROLE_KEYS.indexOf(a.role) - ROLE_KEYS.indexOf(b.role)
    || String(a.name).localeCompare(String(b.name), 'tr'));
}

function toolbarUsers() {
  return `<div class="search"><input class="inp" id="uq" placeholder="İsim, kullanıcı adı, e-posta ara…" value="${esc(UF.q)}"></div>
    <select class="inp" id="ufRole" style="width:auto"><option value="">Tüm roller</option>
      ${ROLE_KEYS.filter(r => ROLES[r]).map(r => `<option value="${r}" ${UF.role === r ? 'selected' : ''}>${esc(ROLES[r][0])}</option>`).join('')}</select>
    <select class="inp" id="ufStatus" style="width:auto">
      ${[['', 'Tüm durumlar'], ['active', 'Aktif'], ['pending', 'İlk giriş bekleniyor'], ['inactive', 'Pasif']].map(([v, l]) =>
        `<option value="${v}" ${UF.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <div class="spacer"></div>
    <button class="btn pri" id="uAdd">+ Kullanıcı ekle</button>`;
}

function renderUsers(fromMeta) {
  if (!isAdmin()) return `<div class="panel"><div class="empty">Bu ekrana yalnızca yöneticiler erişebilir.</div></div>`;
  if (!fromMeta) { setTimeout(() => loadUsersMeta(false), 0); setTimeout(wireUsersView, 0); }
  const all = DB.users, list = filteredUsers();
  const weekAgo = Date.now() - 7 * 86400000;
  const recent = all.filter(u => { const t = metaOf(u.id)?.lastLoginAt; return t && new Date(t).getTime() > weekAgo; }).length;
  const stat = (n, l, f) => `<button class="ustat ${f && UF.status === f ? 'on' : ''}" ${f !== undefined ? `data-uf="${f}"` : ''}><b>${n}</b><span>${l}</span></button>`;
  return `<div class="ustats">
      ${stat(all.length, 'Toplam kullanıcı', '')}
      ${stat(all.filter(u => u.active).length, 'Aktif', 'active')}
      ${stat(all.filter(u => u.active && (u.role === 'admin' || u.role === 'super')).length, 'Yönetici')}
      ${stat(all.filter(u => u.active && userStatus(u)[0] === 'İlk giriş bekleniyor').length, 'İlk giriş bekleniyor', 'pending')}
      ${stat(USERS_META ? recent : '…', 'Son 7 günde giriş yapan')}
    </div>
    <div class="panel" style="padding:0;overflow:hidden">
      <div class="tswrap" style="border:none;border-radius:0;box-shadow:none">
      <table class="ts list utable"><thead><tr>
        <th class="who">Kişi</th><th>Rol</th><th>Durum</th><th>Projeler</th><th>Kapasite</th><th>Son giriş</th><th></th>
      </tr></thead><tbody>
      ${list.map(u => {
        const m = metaOf(u.id), [st, sc] = userStatus(u), pr = userProjects(u.id);
        return `<tr class="urow ${u.active ? '' : 'off'}" data-uedit="${esc(u.id)}">
          <td class="who"><div class="ucell">${avat(u.id, 1)}<div><b>${esc(u.name)}</b>${u.id === CU().id ? ' <span class="chip lbl">siz</span>' : ''}
            ${u.system ? ' <span class="chip lbl">sistem</span>' : ''}
            <span class="usub">@${esc(u.username || '')}${u.email ? ' · ' + esc(u.email) : ''}${u.title ? ' · ' + esc(u.title) : ''}</span></div></div></td>
          <td>${roleChip(u.role)}</td>
          <td><span class="chip ${sc}">${st}</span></td>
          <td title="${esc(pr.map(p => p.name).join(', '))}"><span class="num">${pr.length}</span><span class="usub"> / ${DB.projects.length}</span></td>
          <td class="num">${capOf(u)} sa/hf</td>
          <td>${m ? (m.lastLoginAt ? `<span title="${esc(fmtWhen(m.lastLoginAt))}">${ago(m.lastLoginAt)}</span>` : '<span class="usub">hiç girmedi</span>') : '…'}
            ${m?.sessions ? `<span class="usub"> · ${m.sessions} oturum</span>` : ''}</td>
          <td style="text-align:right"><button class="btn sm" data-uedit="${esc(u.id)}">Düzenle</button></td>
        </tr>`; }).join('') || `<tr><td colspan="7"><div class="empty">Aramaya uyan kullanıcı yok.</div></td></tr>`}
      </tbody></table></div></div>
    <div class="panel" style="margin-top:14px"><h3>Roller ve yetkiler</h3>
      <div class="sub">Bir kullanıcının rolünü değiştirmek için satırına tıklayın. Yetkiler sunucuda da denetlenir.</div>
      <div class="tswrap" style="border:none;box-shadow:none"><table class="ts list perm">
        <thead><tr><th class="who">Yetki</th>${ROLE_KEYS.filter(r => ROLES[r]).map(r => `<th>${roleChip(r)}</th>`).join('')}</tr></thead>
        <tbody>${PERMS.map(([l, ...v]) => `<tr><td class="who">${esc(l)}</td>${ROLE_KEYS.map((r, k) => ROLES[r]
          ? `<td class="pc">${v[k] ? '<span class="yes">✓</span>' : '<span class="no">—</span>'}</td>` : '').join('')}</tr>`).join('')}</tbody>
      </table></div></div>`;
}

function wireUsersView() {
  const q = $('#uq');
  if (q) q.oninput = () => { UF.q = q.value; $('#view').innerHTML = renderUsers(true); wireUsersView(); };
  const r = $('#ufRole'); if (r) r.onchange = () => { UF.role = r.value; render(); };
  const s = $('#ufStatus'); if (s) s.onchange = () => { UF.status = s.value; render(); };
  const a = $('#uAdd'); if (a) a.onclick = () => userEditor(null);
  $$('[data-uf]').forEach(b => b.onclick = () => { UF.status = UF.status === b.dataset.uf ? '' : b.dataset.uf; render(); });
  $$('[data-uedit]').forEach(el => el.onclick = e => { e.stopPropagation(); userEditor(el.dataset.uedit); });
}

/* ---- kullanıcı kartı: ekle / düzenle ---- */
function userEditor(id) {
  const u = id ? user(id) : null;
  if (id && !u) return toast('Kullanıcı bulunamadı');
  const isNew = !u, self = u && u.id === CU().id, locked = u && !canManage(u);
  const m = u ? metaOf(u.id) : null;
  const color = u?.color || USER_COLORS[DB.users.length % USER_COLORS.length];
  const roleOpts = ROLE_KEYS.filter(r => ROLES[r] && (r !== 'super' || isSuper()));
  const curRole = u?.role || 'member';
  const memberOf = new Set(u ? userProjects(u.id).map(p => p.id) : DB.projects.filter(p => !p.archived).map(p => p.id));
  const dis = locked ? 'disabled' : '';

  openModal(`<div class="m-h">${u ? avat(u.id, 1) : ''}<b>${isNew ? 'Yeni kullanıcı' : esc(u.name)}</b>
      ${u ? roleChip(u.role) : ''} ${u ? `<span class="chip ${userStatus(u)[1]}">${userStatus(u)[0]}</span>` : ''}
      <button class="x" data-close>×</button></div>
    <div class="m-b ued">
      <div class="m-l">
        ${locked ? '<div class="vnote" style="margin-bottom:12px">Süper yönetici hesabını yalnızca süper yönetici değiştirebilir.</div>' : ''}
        <div class="sec">Profil</div>
        <div class="form-2">
          <div class="form-row"><label class="field">Ad soyad *</label><input class="inp" id="ue_n" value="${esc(u?.name || '')}" placeholder="Ayşe Korkmaz" ${dis}></div>
          <div class="form-row"><label class="field">Kullanıcı adı *</label><input class="inp k" id="ue_u" value="${esc(u?.username || '')}" placeholder="ayse" ${dis} autocapitalize="off" spellcheck="false"></div>
          <div class="form-row"><label class="field">E-posta</label><input class="inp" id="ue_e" type="email" value="${esc(u?.email || '')}" placeholder="ayse@firma.com" ${dis}></div>
          <div class="form-row"><label class="field">Unvan / departman</label><input class="inp" id="ue_t" value="${esc(u?.title || '')}" placeholder="Satış Uzmanı" ${dis}></div>
          <div class="form-row"><label class="field">Baş harfler</label><input class="inp" id="ue_i" maxlength="3" value="${esc(u?.ini || '')}" placeholder="AK" ${dis}></div>
          <div class="form-row"><label class="field">Haftalık kapasite (saat)</label><input class="inp num" id="ue_c" value="${u ? capOf(u) : 30}" ${dis}></div>
        </div>
        <div class="form-row"><label class="field">Renk</label><div class="swatches">
          ${USER_COLORS.map(c => `<button type="button" class="sw ${c === color ? 'on' : ''}" data-col="${c}" style="background:${c}" ${dis} aria-label="${c}"></button>`).join('')}</div></div>

        <div class="sec">Rol ve yetki</div>
        ${self ? '<div class="usub" style="margin-bottom:8px">Kendi rolünüzü değiştiremezsiniz.</div>' : ''}
        <div class="rolecards">
          ${roleOpts.map(r => `<label class="rolecard ${curRole === r ? 'on' : ''}">
            <input type="radio" name="ue_r" value="${r}" ${curRole === r ? 'checked' : ''} ${self || locked ? 'disabled' : ''}>
            <span>${roleChip(r)}<span class="usub">${esc(ROLES[r][1])}</span></span></label>`).join('')}
        </div>

        <div class="sec">Projeler</div>
        <div class="usub" style="margin-bottom:8px">Kullanıcı yalnızca üyesi olduğu projeleri görür ve onlarda iş alabilir.</div>
        <div class="projchecks">
          ${DB.projects.map(p => `<label class="memchip ${memberOf.has(p.id) ? 'on' : ''}"><input type="checkbox" data-up="${esc(p.id)}" ${memberOf.has(p.id) ? 'checked' : ''} ${dis}>
            ${esc(p.name)}${p.archived ? ' <em>arşiv</em>' : ''}</label>`).join('') || '<span class="usub">Henüz proje yok.</span>'}
        </div>

        ${isNew ? `<div class="sec">İlk giriş parolası</div>
          <div class="pwopts">
            <label><input type="radio" name="ue_pw" value="gen" checked> <b>Rastgele güçlü parola üret</b> <span class="usub">— önerilen; kaydedince bir kez gösterilir</span></label>
            <label><input type="radio" name="ue_pw" value="set"> <b>Parolayı ben belirleyeyim</b></label>
            <input class="inp" id="ue_pwv" placeholder="En az 8 karakter" style="margin:4px 0 6px 24px;max-width:280px;display:none">
            <label><input type="radio" name="ue_pw" value="def"> <b>Ortak başlangıç parolası</b> <span class="usub">(${esc(DEFAULT_PW || '—')})</span></label>
            <label style="margin-top:6px"><input type="checkbox" id="ue_mc" checked> İlk girişte kendi parolasını belirlemesini iste</label>
          </div>` : ''}
        <div id="ue_err" class="lg-err"></div>
      </div>

      ${u ? `<div class="m-r">
        <div class="sec">Hesap</div>
        <div class="kv">
          <span class="lb">Kullanıcı adı</span><span class="k">@${esc(u.username || '')}</span>
          <span class="lb">Son giriş</span><span>${m?.lastLoginAt ? fmtWhen(m.lastLoginAt) : 'hiç girmedi'}</span>
          <span class="lb">Açık oturum</span><span>${m ? m.sessions : '…'}</span>
          <span class="lb">Oluşturulma</span><span>${m?.createdAt ? fmtWhen(m.createdAt) : '—'}</span>
          <span class="lb">Parola</span><span>${(m?.mustChange ?? u.mustChange) ? '<span class="chip cat-inprogress">geçici, değiştirmesi bekleniyor</span>' : '<span class="chip lbl">kullanıcının kendi parolası</span>'}</span>
        </div>
        <div class="sec">Parola</div>
        <div class="usub" style="margin-bottom:8px">Parolalar şifrelenmiş saklanır; mevcut parola kimse tarafından görülemez. Yeni bir parola verebilirsiniz.</div>
        <div class="ued-actions">
          <button class="btn" id="ue_gen" ${dis}>🔑 Rastgele yeni parola üret</button>
          <button class="btn" id="ue_setpw" ${dis}>Parolayı ben belirleyeyim</button>
          <div id="ue_setbox" style="display:none;gap:6px;flex-direction:column">
            <input class="inp" id="ue_newpw" type="text" placeholder="Yeni parola (en az 8 karakter)" autocomplete="off">
            <label class="usub"><input type="checkbox" id="ue_newmc" checked> İlk girişte değiştirmesini iste</label>
            <button class="btn pri sm" id="ue_setok">Parolayı kaydet</button>
          </div>
          <div id="ue_pwres"></div>
        </div>
        <div class="sec">Oturum ve erişim</div>
        <div class="ued-actions">
          <button class="btn" id="ue_revoke" ${dis}>Tüm açık oturumlarını kapat</button>
          ${self ? '' : `<button class="btn" id="ue_toggle" ${dis}>${u.active ? '⏸ Hesabı pasifleştir' : '▶ Hesabı aktifleştir'}</button>
          <button class="btn danger" id="ue_del" ${dis || (u.system && !isSuper() ? 'disabled' : '')}>Kullanıcıyı sil</button>`}
        </div>
      </div>` : ''}
    </div>
    <div class="m-f"><button class="btn" data-close>Vazgeç</button>
      ${locked ? '' : `<button class="btn pri" id="ue_ok">${isNew ? 'Kullanıcıyı oluştur' : 'Değişiklikleri kaydet'}</button>`}</div>`);

  let pickColor = color;
  const err = msg => { $('#ue_err').textContent = msg; };
  $$('[data-col]').forEach(b => b.onclick = () => { pickColor = b.dataset.col; $$('[data-col]').forEach(x => x.classList.toggle('on', x === b)); });
  $$('input[name="ue_r"]').forEach(r => r.onchange = () => $$('.rolecard').forEach(c => c.classList.toggle('on', c.contains(r) && r.checked)));
  $$('[data-up]').forEach(c => c.onchange = () => c.closest('.memchip').classList.toggle('on', c.checked));
  const nameEl = $('#ue_n'), unEl = $('#ue_u'), iniEl = $('#ue_i');
  if (isNew) {
    nameEl.oninput = () => {
      if (!unEl.dataset.t) unEl.value = makeUsername(nameEl.value, new Set(DB.users.map(x => x.username)));
      if (!iniEl.dataset.t) iniEl.value = nameEl.value.trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toLocaleUpperCase('tr');
    };
    unEl.oninput = () => unEl.dataset.t = '1';
    iniEl.oninput = () => iniEl.dataset.t = '1';
    $$('input[name="ue_pw"]').forEach(r => r.onchange = () => { $('#ue_pwv').style.display = $('input[name="ue_pw"]:checked').value === 'set' ? '' : 'none'; });
  }

  const ok = $('#ue_ok');
  if (ok) ok.onclick = async () => {
    const n = nameEl.value.trim(), un = unEl.value.trim().toLowerCase(), em = $('#ue_e').value.trim(), ti = $('#ue_t').value.trim();
    const ini = (iniEl.value.trim() || n.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2)).toLocaleUpperCase('tr');
    const cap = parseFloat(String($('#ue_c').value).replace(',', '.'));
    const role = $('input[name="ue_r"]:checked')?.value || curRole;
    if (!n) return err('Ad soyad gerekli.');
    if (!/^[a-z0-9._-]{2,40}$/.test(un)) return err('Kullanıcı adı 2-40 karakter olmalı: küçük harf, rakam, nokta, tire.');
    if (DB.users.some(x => x.id !== u?.id && x.username?.toLowerCase() === un)) return err('Bu kullanıcı adı başka birinde.');
    if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return err('E-posta adresi geçersiz.');
    if (!/^[\p{L}\p{N}]{1,3}$/u.test(ini)) return err('Baş harfler 1-3 harf/rakam olmalı.');
    if (!(cap >= 0 && cap <= 168)) return err('Haftalık kapasite 0-168 saat arası olmalı.');
    let pwMode = 'gen', pwVal = '';
    if (isNew) {
      pwMode = $('input[name="ue_pw"]:checked').value; pwVal = $('#ue_pwv').value;
      if (pwMode === 'set' && pwVal.length < 8) return err('Parola en az 8 karakter olmalı.');
    }
    const target = u || { id: uid('u'), active: true, mustChange: true };
    const prev = { ...target };
    Object.assign(target, { name: n, username: un, ini, color: pickColor, capacity: cap });
    if (em) target.email = em; else delete target.email;
    if (ti) target.title = ti; else delete target.title;
    if (!self) target.role = role;
    if (isNew) DB.users.push(target);
    if (!DB.users.some(x => (x.role === 'admin' || x.role === 'super') && x.active)) {
      Object.assign(target, prev); if (isNew) DB.users.pop(); return err('En az bir aktif yönetici kalmalı.');
    }
    /* proje üyelikleri */
    $$('[data-up]').forEach(c => {
      const p = DB.projects.find(x => x.id === c.dataset.up); if (!p) return;
      if (!p.members?.length) p.members = DB.users.filter(x => x.id !== target.id).map(x => x.id);
      const has = p.members.includes(target.id);
      if (c.checked && !has) p.members.push(target.id);
      if (!c.checked && has) p.members = p.members.filter(x => x !== target.id);
    });
    ok.disabled = true;
    save();
    try { await flushAll(); } catch (e) { }
    if (SYNC_STATE !== 'ok') { ok.disabled = false; return err('Kaydedilemedi, bağlantıyı kontrol edip tekrar deneyin.'); }
    if (!isNew) { closeModal(); render(); loadUsersMeta(true); return toast('Kullanıcı güncellendi'); }
    /* yeni kullanıcı: parola */
    const mc = $('#ue_mc').checked;
    let shown = null;
    try {
      if (pwMode === 'gen') shown = (await API.post('/api/users/' + target.id + '/password', { generate: true, requireChange: mc })).password;
      else if (pwMode === 'set') { await API.post('/api/users/' + target.id + '/password', { password: pwVal, requireChange: mc }); shown = pwVal; }
      else if (!mc) await API.post('/api/users/' + target.id + '/password', { requireChange: false });
      else shown = DEFAULT_PW;
    } catch (e) { toast('Kullanıcı oluşturuldu ama parola ayarlanamadı: ' + e.message); }
    closeModal(); render(); loadUsersMeta(true);
    if (shown) showCredentials(target, shown, mc);
    else toast(n + ' eklendi');
  };

  if (!u) return;
  const pwBox = (pw, mc) => {
    $('#ue_pwres').innerHTML = `<div class="pwshow"><div class="usub">Yeni parola — bu pencereyi kapatınca bir daha gösterilmez:</div>
      <div class="pwline"><code id="ue_pwtxt">${esc(pw)}</code><button class="btn sm" id="ue_copy">Kopyala</button></div>
      <div class="usub">${mc ? 'Kullanıcı ilk girişte kendi parolasını belirleyecek.' : 'Kullanıcı bu parolayla giriş yapmaya devam edebilir.'} Açık oturumları kapatıldı.</div></div>`;
    $('#ue_copy').onclick = () => copyText(pw);
  };
  const gen = $('#ue_gen');
  if (gen) gen.onclick = async () => {
    if (!confirm(`${u.name} için yeni bir parola üretilsin mi? Eski parolası artık çalışmaz.`)) return;
    gen.disabled = true;
    try { await flushAll(); const r = await API.post('/api/users/' + u.id + '/password', { generate: true }); u.mustChange = true; SNAP.rec.users?.set(u.id, cj(u)); pwBox(r.password, true); loadUsersMeta(true); }
    catch (e) { toast('Parola üretilemedi: ' + e.message); }
    finally { gen.disabled = false; }
  };
  const sp = $('#ue_setpw'); if (sp) sp.onclick = () => { $('#ue_setbox').style.display = 'flex'; $('#ue_newpw').focus(); };
  const so = $('#ue_setok');
  if (so) so.onclick = async () => {
    const pw = $('#ue_newpw').value, mc = $('#ue_newmc').checked;
    if (pw.length < 8) return toast('Parola en az 8 karakter olmalı');

    catch (e) { toast(e.message); }
  };
  const tg = $('#ue_toggle');

    if (was && !confirm(`${u.name} pasifleştirilsin mi? Giriş yapamaz, açık oturumları kapanır. Verileri silinmez.`)) return;

    save(); await flushAll(); closeModal(); render(); loadUsersMeta(true);

  };
  const dl = $('#ue_del');

    const n = DB.issues.filter(i => i.assignee === u.id).length;
    if (!confirm(`${u.name} silinsin mi?\n\n${n ? n + ' işin ataması boşalacak. ' : ''}Süre kayıtları ve yorumları korunur. ` +
      'Gerekirse Sistem › Çöp kutusu’ndan geri yüklenebilir.\n\nSadece erişimini kesmek istiyorsanız “pasifleştir” daha uygundur.')) return;
    DB.users = DB.users.filter(x => x.id !== u.id);
    DB.issues.forEach(i => { if (i.assignee === u.id) i.assignee = null; });
    DB.projects.forEach(p => { if (p.members?.includes(u.id)) p.members = p.members.filter(x => x !== u.id); });
    save(); await flushAll(); closeModal(); render(); loadUsersMeta(true); toast(u.name + ' silindi');
  };
}

function copyText(t) {
  const done = () => toast('Kopyalandı');
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Kopyalanamadı, elle seçip kopyalayın'); }
    a.remove();
  }
}

/* ============================ BENİM İŞLERİM (issue #9) ============================
   docs/tasarim/benim-islerim: kişiye atanmış açık işler tarih gruplarında. "Bugün" her çizimde
   yeniden hesaplanır (TODAY sayfa açılışında sabittir); hafta çizelgedeki seçili haftadan bağımsızdır. */
function toolbarHome() {
  return `${canEdit() ? `<button class="btn pri" id="hNewIssue">+ İş oluştur</button>
    <button class="btn" id="hLogWork">+ Süre kaydet</button>
    <button class="btn" id="hNewProject">+ Yeni proje</button>` : ''}
    <div class="spacer"></div>
    <span style="font-size:12px;color:var(--ink3)">${new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long' })}</span>`;
}

const HM_MON = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const hmDay = s => new Date(s + 'T12:00');                // yerel öğlen: saat dilimi kayması olmaz
/* Tarih alanının gün kısmı; geçersizse '' (tarihsiz sayılır, çizim çökmez). */
const day10 = x => { const s = String(x || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(hmDay(s)) ? s : ''; };
const hmDM = s => { const d = hmDay(s); return isNaN(d) ? esc(s) : `${d.getDate()} ${HM_MON[d.getMonth()]}`; };
/* Kısa tarih: "Cum 20 Kas" */
const hmDate = s => { const d = hmDay(s); return isNaN(d) ? esc(s) : `${DAYS[(d.getDay() + 6) % 7]} ${hmDM(s)}`; };
/* Bu takvim haftası Pzt–Pz (weekDays() çizelgenin seçili haftasıdır, ona dokunulmaz). */
const homeWeek = today => { const m = monday(hmDay(today)); return Array.from({ length: 7 }, (_, k) => iso(addD(m, k))); };
/* Gösterim sırası; atama sırası homeBuckets içinde (Beklemede önce kazanır). */
const HM_GROUPS = [
  { id: 'late', t: 'Gecikmiş', ic: 'alert' }, { id: 'today', t: 'Bugün', ic: 'sun' }, { id: 'week', t: 'Bu hafta', ic: 'cal' },
  { id: 'later', t: 'Daha sonra', ic: 'later' }, { id: 'nodate', t: 'Tarihsiz', ic: 'nodate' }, { id: 'wait', t: 'Beklemede', ic: 'pause' },
];
const HM_LIMIT = 50;
const HM_MORE = new Set();                                 // "Tümünü göster" açılan gruplar (oturum boyunca)
/* İşin kendi projesinin durum sırasında sonraki durum; son ya da silinmiş durumda yok. */
const nextStatus = i => { const l = statsOf(i.projectId), k = l.findIndex(s => s.id === i.statusId);
  return k >= 0 && k < l.length - 1 ? l[k + 1] : null; };

/* Saf hesap (DOM yok): kapsam, gruplar, engelleyenler, özet. proj görünmüyorsa '' (Tümü) sayılır. */
function homeBuckets(meId, proj, today) {
  const week = homeWeek(today), sun = week[6];
  const byId = new Map(DB.issues.map(i => [i.id, i]));
  const sts = new Map(DB.statuses.map(s => [s.id, s]));
  const projs = new Map(DB.projects.map(p => [p.id, p]));
  const cat = i => sts.get(i.statusId)?.cat || 'todo';   // silinmiş durum stat() gibi "todo"
  const visible = p => !!p && !p.archived && canSeeProject(p);
  const all = DB.issues.filter(i => i.assignee === meId && i.type !== 'epic' && cat(i) !== 'done' && visible(projs.get(i.projectId)));
  /* Engelleme: links {from, to, type:'blocks'} — from açıkken to Beklemede. */
  const blocker = new Map();
  for (const l of DB.links || []) {
    if (!l || l.type !== 'blocks' || blocker.has(l.to)) continue;
    const f = byId.get(l.from);
    if (f && f.id !== l.to && cat(f) !== 'done') blocker.set(l.to, f);
  }
  proj = proj && visible(projs.get(proj)) ? proj : '';
  const list = proj ? all.filter(i => i.projectId === proj) : all;
  const groups = Object.fromEntries(HM_GROUPS.map(g => [g.id, []]));
  for (const i of list) {
    const due = day10(i.due), start = day10(i.start);
    groups[blocker.has(i.id) ? 'wait'
      : due && due < today ? 'late'
      : due === today || (start && start <= today && (!due || due >= today)) ? 'today'
      : due && due <= sun ? 'week'
      : due || (start && start > today) ? 'later'
      : 'nodate'].push(i);
  }
  const rk = x => Number.isFinite(+x.rank) ? +x.rank : 0;
  const cmp = (a, b) => lvl(a.priority) - lvl(b.priority)
    || (day10(a.due) || '9999').localeCompare(day10(b.due) || '9999') || rk(a) - rk(b);
  Object.values(groups).forEach(g => g.sort(cmp));
  const days = new Set(week);
  const hours = DB.worklogs.filter(w => w.userId === meId && days.has(day10(w.date))
    && (!proj || byId.get(w.issueId)?.projectId === proj)).reduce((a, w) => a + (+w.hours || 0), 0);
  const counts = new Map();
  all.forEach(i => counts.set(i.projectId, (counts.get(i.projectId) || 0) + 1));
  const lateMax = groups.late.reduce((m, i) => Math.max(m, workdaysBetween(day10(i.due), today)), 0);
  return { all, list, proj, groups, blocker, week, hours, counts, lateMax, nProj: new Set(list.map(i => i.projectId)).size };
}

function homeRow(i, c) {
  const st = stat(i.statusId), id = esc(i.id), key = esc(i.key);
  const due = day10(i.due), start = day10(i.start);
  let dc = '', di = 'cal', dt, dtl = 'Bitiş';
  if (due && due < c.today) { dc = 'd-late'; di = 'alert'; dt = `${workdaysBetween(due, c.today)} gün gecikme`; dtl = `Bitiş ${hmDate(due)} · gecikme iş günü olarak`; }
  else if (due && due === c.today) { dc = 'd-today'; di = 'clock'; dt = 'Bugün'; dtl = 'Bitiş bugün'; }
  else if (due) dt = hmDate(due);
  else if (start) { dt = 'Başlangıç ' + hmDM(start); dtl = 'Başlangıç'; }
  else { dc = 'd-none'; di = 'nodate'; dt = 'Tarih yok'; dtl = 'Bitiş tarihi yok'; }
  const sub = [`<span class="k">${key}</span>`, `<span class="pj">${ic('folder')}${esc(projName(i.projectId))}</span>`];
  const rem = +remaining(i) || 0;
  if (rem > 0) sub.push(`<span class="rem" title="Kalan süre">${ic('hour')}${efFmtSafe(rem)} kalan</span>`);
  const bl = c.blocker.get(i.id);
  if (bl) { const p = DB.projects.find(x => x.id === bl.projectId), see = p && canSeeProject(p);
    sub.push(`<span class="blk" title="Engelleyen iş">${ic('link')}Bekliyor: ${see
      ? `<span class="k">${esc(bl.key)}</span> ${esc(bl.summary)}` : 'erişemediğin bir iş'}</span>`); }
  const nx = c.edit ? nextStatus(i) : null;
  const adv = nx
    ? `<button type="button" class="hm-btn hm-adv ${nx.cat === 'done' ? 'to-done' : ''}" data-hmadv="${id}" data-hmto="${esc(nx.id)}"
        title="İlerlet: ${esc(st.name)} → ${esc(nx.name)}" aria-label="İlerlet: ${esc(nx.name)} durumuna geçir">${ic(nx.cat === 'done' ? 'checkc' : 'arrow')}<span>${esc(nx.name)}</span></button>`
    : '<span class="hm-btn hm-adv none" aria-hidden="true"></span>';
  return `<div class="hm-row" data-hmrow="${id}">
    ${c.edit ? `<button type="button" class="hm-tick" data-complete="${id}" title="Tamamla" aria-label="Tamamla: ${key}">${ic('check')}</button>`
      : '<span class="hm-ro-dot"></span>'}
    <div class="hm-main"><button type="button" class="hm-t" data-open="${id}" title="${esc(i.summary)}">${esc(i.summary)}</button>
      <div class="hm-sub">${sub.join('<span class="hm-sep"></span>')}</div></div>
    <div class="hm-meta">${priBadge(i, c.edit)}<span class="hm-due ${dc}" title="${dtl}">${ic(di)}${dt}</span><span class="hm-st s-${esc(st.cat)}"><i></i>${esc(st.name)}</span></div>
    ${c.edit ? `<div class="hm-act">${adv}
      <button type="button" class="hm-btn hm-log" data-hmlog="${id}" title="Süre gir" aria-label="Süre gir: ${key}">${ic('timeplus')}<span>Süre gir</span></button>
      ${cardAv(i, true)}</div>` : ''}
  </div>`;
}

function renderHome() {
  const me = CU(), today = iso(new Date()), edit = canEdit();
  const B = homeBuckets(me.id, DB.ui.homeProj || '', today);
  const c = { today, edit, blocker: B.blocker };
  const pname = id => projName(id);

  const chipIds = DB.projects.filter(p => B.counts.has(p.id) || p.id === B.proj).map(p => p.id);
  const chip = (pid, label, n) => `<button type="button" class="hm-pf ${B.proj === pid ? 'on' : ''}" data-hmproj="${esc(pid)}" aria-pressed="${B.proj === pid}">
      <span class="t">${label}</span><span class="n">${n}</span></button>`;
  const filter = chipIds.length > 1 || B.proj ? `<div class="hm-filter" role="group" aria-label="Proje süzgeci"><span class="lbl">Proje</span>
      ${chip('', 'Tümü', B.all.length)}${chipIds.map(pid => chip(pid, esc(pname(pid)), B.counts.get(pid) || 0)).join('')}</div>` : '';

  const nLate = B.groups.late.length, cap = capOf(me);
  const pct = cap ? Math.round(B.hours / cap * 100) : 0;
  const [w0, w6] = [B.week[0], B.week[6]];
  const range = hmDay(w0).getMonth() === hmDay(w6).getMonth() ? `${hmDay(w0).getDate()}–${hmDM(w6)}` : `${hmDM(w0)}–${hmDM(w6)}`;

      <div class="hm-stat-v" data-hmsum="week">${efFmtSafe(B.hours)}${cap ? ` <small>/ ${efFmtSafe(cap)}</small>` : ''}</div>
      ${cap ? `<div class="hm-cap"><span class="hm-bar ${pct > 100 ? 'over' : ''}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"
        aria-label="Haftalık kapasite"><i style="width:${Math.min(100, pct)}%"></i></span><b data-hmsum="pct">%${pct}</b></div>` : ''}</div></div>

        ? `<button type="button" class="hm-more" data-hmmore="${g.id}">${ic('down')}Tümünü göster · ${rows.length - HM_LIMIT} iş daha</button>` : ''}</div>
    </section>`;
  };

  let body;
  if (!B.all.length) body = `<div class="hm-empty"><span class="hm-empty-ic">${ic('inbox')}</span>

      <div class="acts"><button type="button" class="btn" data-hmproj="">Tüm projeleri göster</button></div></div>`;
  else body = HM_GROUPS.map(grp).join('');

  return `<div class="hm-c" id="hmHome">
    ${edit ? '' : `<div class="hm-ro-note">${ic('eye')}İzleyici olarak görüntülüyorsun; işleri değiştiremezsin.</div>`}
    ${filter}${sum}${body}</div>`;
}

/* İlerlet: işin projesinin durum sırasında bir sonraki. Sprint/rank ataması yok (panodaki sürüklemeden farkı). */
function homeAdvance(id, to) {
  const i = issue(id); if (!i || !canEdit()) return;
  const nx = nextStatus(i);
  if (!nx || nx.id !== to) return render();             // bu arada değişmiş: güncel hâli göster
  const was = i.statusId, me = i.assignee || null;
  setStatus(i, nx.id); save(); render();
  const now = i.assignee || null, items = [{ id: i.id, f: 'statusId', was, now: i.statusId }];
  /* Otomasyon başkasına atadıysa iş yine listeden düşer: durum önce, atanan sonra geri yazılır. */
  if (now !== me) { items.push({ id: i.id, f: 'assignee', was: me, now });
    const u = user(now);
    return homeUndo(`${i.key} ${stat(i.statusId).name} durumuna geçti, ${u ? u.name + ' kişisine atandı' : 'ataması kaldırıldı'}; listenden çıktı.`, items); }
  if (stat(i.statusId).cat === 'done') return homeUndo(`${i.key} ${stat(i.statusId).name} olarak işaretlendi.`, items);
  $(`[data-hmadv="${CSS.escape(i.id)}"]`)?.focus({ preventScroll: true });
}
/* Listeden düşen iş için "Geri al". Önceki değer kapanışta tutulur; iş hâlâ varsa ve alan hâlâ bizim
   yazdığımız değerse geri yazılır (setStatus/setAssignee: geçmiş + otomasyon), değilse uyarı. */
function homeUndo(msg, items) {
  toast(msg, { label: 'Geri al', fn: () => {
    const head = items[0], i0 = issue(head.id);
    if (!canEdit() || !i0 || (i0[head.f] || null) !== (head.now || null))
      return toast(`${i0 ? i0.key : 'İş'} bu arada değişti, geri alınamadı.`, { warn: true });
    items.forEach(x => { const i = issue(x.id); if (!i || (i[x.f] || null) !== (x.now || null)) return;
      if (x.f === 'statusId') { setStatus(i, x.was); if (x.df) delete i.doneFrom; } else setAssignee(i, x.was); });
    save(); render(); toast(i0.key + ' geri alındı');
  } });
}

    <div class="m-f"><button class="btn" data-close>Vazgeç</button>
      <button class="btn danger" id="dp_ok">Kalıcı olarak sil</button></div>`, 'narrow');

    if ($('#dp_c').value.trim().toLowerCase() !== p.name.toLowerCase())
      return $('#dp_err').textContent = 'Proje adı eşleşmiyor.';
    const ids = new Set(iss.map(i => i.id));
    DB.worklogs = DB.worklogs.filter(w => !ids.has(w.issueId));
    DB.comments = DB.comments.filter(c => !ids.has(c.issueId));
    DB.history = DB.history.filter(x => !ids.has(x.issueId));
    DB.transitions = DB.transitions.filter(t => !ids.has(t.issueId));
    DB.links = DB.links.filter(l => !ids.has(l.from) && !ids.has(l.to));
    DB.issues = DB.issues.filter(i => i.projectId !== pid);
    DB.statuses = DB.statuses.filter(s => s.projectId !== pid);
    DB.sprints = DB.sprints.filter(s => s.projectId !== pid);
    DB.rules = DB.rules.filter(r => r.projectId !== pid);
    DB.fields = DB.fields.filter(f => f.projectId !== pid);
    DB.projects = DB.projects.filter(x => x.id !== pid);
    if (DB.ui.project === pid) DB.ui.project = DB.projects[0].id;
    closeModal(); save(); startApp(); toast(`${p.name} silindi`);
  };
}

  $$('[data-ty]').forEach(el => el.onchange = () => {
    const t = DB.cfg.types.find(x => x.id === el.dataset.ty);

    const other = DB.cfg.types.find(t => t.id !== id);
    if (n && !confirm(`${n} iş "${TYPE[id][2]}" tipinde. Hepsi "${other.name}" tipine taşınsın mı?`)) return;
    DB.issues.forEach(i => { if (i.type === id) i.type = other.id; });
    DB.cfg.types = DB.cfg.types.filter(t => t.id !== id);
    buildTypes(); save(); render();
  });
  const add = $('#ty_add'); if (add) add.onclick = () => {
    const n = $('#ty_new').value.trim(); if (!n) return toast('Tip adı gerekli');
    const base = slugName(n) || 'tip';
    let id = base, k = 2; while (TYPE[id]) id = base + k++;
    const colors = ['#3E7BC4', '#C0392B', '#1F6F5C', '#B45309', '#6B4FBB', '#2B7A78', '#8E44AD'];
    DB.cfg.types.push({ id, name: n, letter: n[0].toUpperCase(), color: colors[DB.cfg.types.length % colors.length] });
    buildTypes(); save(); render(); toast(n + ' eklendi');
  };
}

/* ============================================================
   DURUM AKIŞI DÜZENLEYİCİ
   Hem yeni proje formunda hem de iş akışı ekranında kullanılır.
   ============================================================ */
function statusEditor(rows, host, onChange) {
  const draw = () => {
    $(host).innerHTML = rows.map((r, k) => `<div style="display:flex;gap:6px;margin-bottom:5px;align-items:center">
      <span class="k" style="width:18px;color:var(--ink3)">${k + 1}</span>
      <input class="inp" data-sr="${k}" value="${esc(r[0])}" placeholder="Durum adı" style="flex:1">
      <select class="inp" data-sc="${k}" style="width:auto">
        ${CATS.map(([v, l]) => `<option value="${v}" ${r[1] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <button type="button" class="btn sm" data-sm="${k}" data-d="-1" ${k === 0 ? 'disabled' : ''}>↑</button>
      <button type="button" class="btn sm" data-sm="${k}" data-d="1" ${k === rows.length - 1 ? 'disabled' : ''}>↓</button>
      <button type="button" class="btn sm danger" data-sx="${k}" ${rows.length < 2 ? 'disabled' : ''}>×</button>
    </div>`).join('') +
    `<button type="button" class="btn sm" id="sr_add" style="margin-top:4px">+ Durum ekle</button>`;
    $$('[data-sr]', $(host)).forEach(el => el.oninput = () => { rows[+el.dataset.sr][0] = el.value; onChange?.(); });
    $$('[data-sc]', $(host)).forEach(el => el.onchange = () => { rows[+el.dataset.sc][1] = el.value; onChange?.(); });
    $$('[data-sm]', $(host)).forEach(b => b.onclick = () => {
      const i = +b.dataset.sm, j = i + (+b.dataset.d);
      if (j < 0 || j >= rows.length) return;
      [rows[i], rows[j]] = [rows[j], rows[i]]; draw(); onChange?.();
    });
    $$('[data-sx]', $(host)).forEach(b => b.onclick = () => { rows.splice(+b.dataset.sx, 1); draw(); onChange?.(); });
    $('#sr_add', $(host)).onclick = () => { rows.push(['Yeni durum', 'inprogress']); draw(); onChange?.(); };
  };
  draw();
  return draw;
}

/* ============================================================
   XLSX YAZICI
   Bağımlılık yok: sıkıştırmasız (stored) ZIP + minimal
   SpreadsheetML. Excel, LibreOffice ve Google Sheets açar.
   ============================================================ */
const CRC_T = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF;
  for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0; }

function zipStore(files) {
  const enc = new TextEncoder(), parts = [], cdir = [];
  let off = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30), lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true); lv.setUint16(4, 20, true); lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true); lv.setUint16(10, 0, true); lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true); lv.setUint32(18, data.length, true); lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true); lv.setUint16(28, 0, true);
    parts.push(lh, name, data);

    const cd = new Uint8Array(46), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true); cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true); cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, off, true);
    cdir.push(cd, name);
    off += 30 + name.length + data.length;
  });
  const cdSize = cdir.reduce((a, b) => a + b.length, 0);
  const eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true); ev.setUint16(20, 0, true);
  return new Blob([...parts, ...cdir, eo], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

const xmlEsc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]))
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
const colRef = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };

/* rows: hücre dizisi dizisi. Sayılar sayı, diğerleri metin olarak yazılır. */
/* sheets: [{name, rows, widths}] — tek dizi verilirse tek sayfa sayılır. */
function makeXlsx(sheets, sheetName = 'Rapor', widths) {
  if (Array.isArray(sheets) && Array.isArray(sheets[0])) sheets = [{ name: sheetName, rows: sheets, widths }];
  const sheetXml = s => {
    const body = s.rows.map((r, ri) => `<row r="${ri + 1}">${r.map((c, ci) => {
      const ref = colRef(ci) + (ri + 1);
      if (typeof c === 'number' && isFinite(c)) return `<c r="${ref}"><v>${c}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const cols = s.widths ? `<cols>${s.widths.map((wd, k) =>
      `<col min="${k + 1}" max="${k + 1}" width="${wd}" customWidth="1"/>`).join('')}</cols>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${body}</sheetData></worksheet>`;
  };
  const files = [
    { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_, k) => `<Override PartName="/xl/worksheets/sheet${k + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` },
    { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, k) => `<sheet name="${xmlEsc(s.name || 'Sayfa' + (k + 1)).slice(0, 31)}" sheetId="${k + 1}" r:id="rId${k + 1}"/>`).join('')}</sheets></workbook>` },
    { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, k) => `<Relationship Id="rId${k + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${k + 1}.xml"/>`).join('')}</Relationships>` },
  ];
  sheets.forEach((s, k) => files.push({ name: `xl/worksheets/sheet${k + 1}.xml`, data: sheetXml(s) }));
  return zipStore(files);
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ============================================================
   Bölüm 13: PLANLAMA — başlangıç/bitiş tarihi ve zaman çizelgesi
   ============================================================ */

/* İş günü aritmetiği: hafta sonları planlamaya dahil edilmez. */
const isWorkday = d => { const w = new Date(d).getDay(); return w !== 0 && w !== 6; };
/* n negatif olabilir: geriye doğru iş günü sayar. */
function addWorkdays(from, n) {
  const d = new Date(from);
  const step = n < 0 ? -1 : 1;
  let left = Math.abs(n);
  while (left > 0) { d.setDate(d.getDate() + step); if (isWorkday(d)) left--; }
  return iso(d);
}
function workdaysBetween(a, b) {
  if (!a || !b || a > b) return 0;
  let n = 0;
  for (const d = new Date(a); iso(d) <= b; d.setDate(d.getDate() + 1)) if (isWorkday(d)) n++;
  return n;
}
const planDays = i => (i.start && i.due) ? workdaysBetween(i.start, i.due) : 0;

/* Plana göre iş durumu: bitmediyse ve tarih geçtiyse gecikmiş sayılır. */
function planState(i) {
  const done = stat(i.statusId).cat === 'done';
  if (!i.due) return done ? 'done' : 'none';
  if (done) return 'done';
  if (i.due < TODAY) return 'late';
  if (i.start && i.start > TODAY) return 'future';
  return 'active';
}
const PLAN_COLOR = { done: 'var(--done)', late: 'var(--risk)', active: 'var(--accent)', future: '#98A0AC', none: '#C7CBD1' };

function ensurePlanning() {
  DB.issues.forEach(i => { if (i.start === undefined) i.start = ''; });
}

/* ---- iş detayı: tarih satırı ---- */
function planRow(i) {
  const n = planDays(i);
  const bad = i.start && i.due && i.start > i.due;
  return `<span class="lb">Başlangıç</span><input class="inp" type="date" data-f="start" value="${i.start || ''}" max="${i.due || ''}">
    <span class="lb">Bitiş</span><input class="inp" type="date" data-f="due" value="${i.due || ''}" min="${i.start || ''}">
    <span class="lb">Planlanan</span><span style="font-size:12px">
      ${bad ? '<span style="color:var(--risk)">Bitiş, başlangıçtan önce olamaz</span>'
        : n ? `<b class="num">${n}</b> iş günü ${planState(i) === 'late' ? '<span class="chip" style="background:var(--risk-bg);color:var(--risk)">gecikmiş</span>' : ''}`
        : '<span style="color:var(--ink3)">tarih girilmedi</span>'}</span>`;
}

/* ============================================================
   ZAMAN ÇİZELGESİ (proje planı)
   ============================================================ */
function toolbarPlan() {
  const z = DB.ui.planZoom || 'week';
  return `<div class="seg" id="planZoom">
      ${[['day', 'Gün'], ['week', 'Hafta'], ['month', 'Ay']].map(([v, l]) =>
        `<button data-z="${v}" class="${z === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    <button class="btn sm" id="planPrev">‹</button>
    <button class="btn sm" id="planNow">Bugün</button>
    <button class="btn sm" id="planNext">›</button>
    <select class="inp" id="planGroup" style="width:auto">
      ${[['none', 'Gruplama yok'], ['assignee', 'Kişiye göre'], ['status', 'Duruma göre']].map(([v, l]) =>
        `<option value="${v}" ${(DB.ui.planGroup || 'none') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)">
      <input type="checkbox" id="planUnset" ${DB.ui.planUnset ? 'checked' : ''}> Tarihsizleri de göster</label>
    <div class="spacer"></div>
    ${canEdit() ? '<button class="btn pri" id="planNew">+ İş oluştur</button>' : ''}`;
}

/* Görünen zaman aralığı ve sütunlar */
function planScale() {
  const z = DB.ui.planZoom || 'week';
  const off = DB.ui.planOff || 0;
  if (z === 'day') {
    const from = monday(addD(new Date(), off * 7));
    const cols = Array.from({ length: 14 }, (_, k) => iso(addD(from, k)));
    return { from: cols[0], to: cols[13], cols, label: c => fmtD(c), sub: c => DAYS[(new Date(c).getDay() + 6) % 7],
             isEnd: c => c, dim: c => !isWorkday(c) };
  }
  if (z === 'month') {
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + off);
    const cols = Array.from({ length: 8 }, (_, k) => {
      const d = new Date(base.getFullYear(), base.getMonth() + k, 1); return iso(d); });
    const end = new Date(new Date(cols[7]).getFullYear(), new Date(cols[7]).getMonth() + 1, 0);
    return { from: cols[0], to: iso(end), cols,
             label: c => MONTHS[new Date(c).getMonth()].slice(0, 3), sub: c => c.slice(0, 4),
             isEnd: c => iso(new Date(new Date(c).getFullYear(), new Date(c).getMonth() + 1, 0)), dim: () => false };
  }
  const from = monday(addD(new Date(), off * 7 - 14));
  const cols = Array.from({ length: 12 }, (_, k) => iso(addD(from, k * 7)));
  return { from: cols[0], to: iso(addD(new Date(cols[11]), 6)), cols,
           label: c => fmtD(c), sub: () => 'hafta', isEnd: c => iso(addD(new Date(c), 6)), dim: () => false };
}

function renderPlan() {
  const sc = planScale();
  const span = (new Date(sc.to) - new Date(sc.from)) / 86400000 + 1;
  const pos = d => Math.max(0, Math.min(100, ((new Date(d) - new Date(sc.from)) / 86400000) / span * 100));
  const list = issuesOf().filter(i => i.type !== 'epic' && matches(i))
    .filter(i => DB.ui.planUnset ? true : (i.start || i.due))
    .filter(i => !(i.start || i.due) || !(i.due && i.due < sc.from) && !(i.start && i.start > sc.to))
    .sort((a, b) => (a.start || a.due || '9999').localeCompare(b.start || b.due || '9999') || a.rank - b.rank);

  const bar = i => {
    if (!i.start && !i.due) return `<span class="pl-none">tarih yok</span>`;
    const s = i.start || i.due, e = i.due || i.start;
    const L = pos(s), R = pos(addD(new Date(e), 1));
    const st = planState(i);
    const prog = i.estimate ? Math.min(100, i.spent / i.estimate * 100) : (stat(i.statusId).cat === 'done' ? 100 : 0);
    return `<div class="pl-bar" style="left:${L}%;width:${Math.max(R - L, 1.2)}%;background:${PLAN_COLOR[st]}"
        title="${esc(i.key)} · ${fmtD(s)} → ${fmtD(e)}${planDays(i) ? ' · ' + planDays(i) + ' iş günü' : ''}">
        <i style="width:${prog}%"></i>
        <span>${planDays(i) > 2 ? esc(i.summary) : ''}</span></div>`;
  };

  const row = i => `<tr data-open="${i.id}" style="cursor:pointer">
      <td class="lead">
        <div style="display:flex;align-items:center;gap:7px">
          ${tIcon(i.type)}<span class="k" style="color:var(--ink3)">${i.key}</span>
          <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.summary)}</span>
          ${avat(i.assignee)}
        </div>
      </td>
      <td class="pl-dates"><span class="k">${i.start ? fmtD(i.start) : '—'} → ${i.due ? fmtD(i.due) : '—'}</span>
        ${canEdit() && i.type !== 'sub' ? `<button class="btn sm" data-plansub="${i.id}" title="Bu işin altına alt iş ekle">+</button>` : ''}</td>
      <td colspan="${sc.cols.length}"><div class="pl-track">
        <div class="today" style="left:${pos(TODAY)}%"></div>
        ${sc.cols.map(c => sc.dim(c) ? `<div class="pl-dim" style="left:${pos(c)}%;width:${100 / span}%"></div>` : '').join('')}
        ${bar(i)}</div></td>
    </tr>`;

  let body;
  const g = DB.ui.planGroup || 'none';
  if (g === 'none') body = list.map(row).join('');
  else {
    const groups = g === 'assignee'
      ? [...projUsers().map(u => [u.name, list.filter(i => i.assignee === u.id), u.id]),
         ['Atanmamış', list.filter(i => !i.assignee), null]]
      : stats().map(s => [s.name, list.filter(i => i.statusId === s.id), null]);
    body = groups.filter(x => x[1].length).map(([name, items, uid2]) =>
      `<tr class="pl-group"><td class="lead" colspan="${2 + sc.cols.length}">
        <div style="display:flex;align-items:center;gap:8px">${uid2 ? avat(uid2) : ''}
          <b>${esc(name)}</b><span class="k" style="color:var(--ink3)">${items.length} iş</span>
          <span class="k" style="color:var(--ink3)">${efFmt(items.reduce((a, i) => a + remaining(i), 0))} kalan</span></div>
      </td></tr>` + items.map(row).join('')).join('');
  }

  const late = list.filter(i => planState(i) === 'late').length;
  const noDate = issuesOf().filter(i => i.type !== 'epic' && !i.start && !i.due && stat(i.statusId).cat !== 'done').length;

  return `
    <div class="stat" style="margin-bottom:10px">
      <div><b>${list.length}</b><span>görünen iş</span></div>
      <div><b style="${late ? 'color:var(--risk)' : ''}">${late}</b><span>gecikmiş</span></div>
      <div><b>${noDate}</b><span>tarihsiz açık iş</span></div>
    </div>
    <div class="rmwrap"><table class="rm pl">
      <thead><tr>
        <th class="lead">İş</th><th class="lead" style="min-width:118px">Plan</th>
        ${sc.cols.map(c => `<th>${sc.label(c)}<br><span style="font-weight:400;opacity:.7">${sc.sub(c)}</span></th>`).join('')}
      </tr></thead>
      <tbody>${body || `<tr><td colspan="${2 + sc.cols.length}"><div class="empty">
        Bu aralıkta tarihli iş yok. İş detayından başlangıç ve bitiş girin
        ya da “Tarihsizleri de göster” kutusunu işaretleyin.</div></td></tr>`}</tbody>
    </table></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-top:8px">
      ${[['active', 'planlanan'], ['future', 'başlamamış'], ['late', 'gecikmiş'], ['done', 'tamamlanan']]
        .map(([k, l]) => `<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${PLAN_COLOR[k]};vertical-align:-1px"></i> ${l}</span>`).join('')}
      <span>Çubuğun içindeki açık alan harcanan sürenin tahmine oranıdır; kırmızı dikey çizgi bugün.</span>
    </div>`;
}

function wirePlan() {
  const z = $('#planZoom'); if (!z) return;
  z.onclick = e => { const b = e.target.closest('[data-z]');
    if (b) { DB.ui.planZoom = b.dataset.z; DB.ui.planOff = 0; save(); render(); } };
  const step = () => (DB.ui.planZoom === 'month' ? 1 : DB.ui.planZoom === 'day' ? 2 : 4);
  $('#planPrev').onclick = () => { DB.ui.planOff = (DB.ui.planOff || 0) - step(); save(); render(); };
  $('#planNext').onclick = () => { DB.ui.planOff = (DB.ui.planOff || 0) + step(); save(); render(); };
  $('#planNow').onclick = () => { DB.ui.planOff = 0; save(); render(); };
  $('#planGroup').onchange = e => { DB.ui.planGroup = e.target.value; save(); render(); };
  $('#planUnset').onchange = e => { DB.ui.planUnset = e.target.checked; save(); render(); };
  const nn = $('#planNew'); if (nn) nn.onclick = () => newIssueForm();
  $$('[data-plansub]').forEach(b => b.onclick = e => { e.stopPropagation();
    const p = issue(b.dataset.plansub);
    subTaskForm(p.id, { start: p.start, due: p.due }); });
}
